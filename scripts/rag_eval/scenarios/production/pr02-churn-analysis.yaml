      Why subscribers leave: lessons from five streaming services
      Across the five services we studied, involuntary churn - failed payments, expired cards - accounted for 20 to 40 percent of all cancellations, a share most teams underestimate because it never shows up in exit surveys. Among voluntary cancellations, the most cited reason was price increases, followed by "nothing new to watch" in the month before cancelling. Customers who contacted support twice or more within a month were 3.1 times as likely to cancel, but the effect disappeared when the issue was resolved on the first contact. Annual plans cut churn by roughly half compared with monthly plans, though part of the effect is selection: committed customers choose annual plans. Win-back campaigns recovered 8 to 12 percent of churned users within six months, with personalized content recommendations outperforming discounts. The authors recommend separating involuntary and voluntary churn in every model and dashboard, and treating first-contact resolution as a retention metric.
