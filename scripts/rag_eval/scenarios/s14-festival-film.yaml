  - {id: q3, type: exact, turn: 16, ask: "Cine e criticul de film din juriu?"}
  - {id: q4, type: decision, turn: 9, outdated: [8], ask: "Cât de lung poate fi un film înscris?", note: "outdated doar dacă 8 recomandă 15 minute"}
  - {id: q5, type: paraphrase, turn: 19, ask: "Despre ce e sesiunea practică din a doua zi?"}
  - {id: q6, type: ambiguous, turn: 20, ask: "Mai arată-mi o dată poezia aia."}
  - {id: q7, type: semantic, turn: 1, ask: "Ce alte nume propuseseși pentru festival, la început?"}
  - {id: q8, type: semantic, turn: 11, ask: "Ce le oferim sponsorilor în schimb?"}
