    type: exact
    prompt: |
      How long did the payments outage last?
    gold:
      - {turn: 3, quote: "The outage lasted 47 minutes."}
  - id: q2
    type: multi-hop
    prompt: |
      Why did it take so long before anyone noticed payments were failing?
    gold:
      - {turn: 3, quote: "it was routed to #ops-legacy"}
  - id: q3
    type: decision
    prompt: |
      When are we migrating to Postgres 16 now?
    gold:
      - {turn: 6, quote: "the Postgres 16 migration is postponed to January"}
    outdated:
      - {turn: 1, quote: "complete the migration by end of October"}
  - id: q4
    type: exact
    prompt: |
      What was wrong with the Lindqvist Logistics invoices?
    gold:
      - {turn: 9, quote: "missing the VAT number"}
  - id: q5
    type: paraphrase
    prompt: |
      Are we allowed to bring new people onto the team next quarter?
    gold:
      - {turn: 6, quote: "the company announced a hiring freeze for Q4"}
  - id: q8
    type: exact
    prompt: |
      Which internal gateway had the expired certificate?
    gold:
      - {turn: 3, quote: "the TLS certificate on the internal payments gateway pay-gw-02 expired"}
