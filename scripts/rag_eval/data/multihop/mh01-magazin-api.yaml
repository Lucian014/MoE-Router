    ```js
    // utils/requestContext.js
    const { AsyncLocalStorage } = require('async_hooks');
    const als = new AsyncLocalStorage();

    const runWithRequestContext = als.run.bind(als);
    const getRequestId = () => als.getStore()?.requestId;

    module.exports = { runWithRequestContext, getRequestId };
    ```

    Middleware-ul devine:

    ```js
    function requestId(req, res, next) {
      const incoming = req.get('X-Request-Id');
      const id = incoming || crypto.randomUUID();
      req.id = id;
      res.set('X-Request-Id', id);
      next();
    }

    // în app.js, combini:
    app.use((req, res, next) => {
      runWithRequestContext({ requestId: req.id }, next);
    });
    ```

    Și oriunde în cod, fără să primești `req`:

