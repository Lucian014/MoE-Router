    console.log(JSON.stringify({ requestId: getRequestId(), msg: 'SMS trimis', orderId }));
    ```

    **Câteva observații:**

    - **`crypto.randomUUID()`** e built-in în Node 20, nu ai nevoie de `uuid`
    - **Acceptarea `X-Request-Id` de la proxy** e utilă: nginx poate genera `$request_id` și îl poți trimite mai departe, astfel ai același id și în access logurile nginx, și în logurile Node
    - **Loguri JSON pe un singur rând** — sunt parsabile de `docker logs` / Loki / CloudWatch. Când volumul crește, treci pe `pino` (mult mai rapid decât `console`) — structura rămâne identică, deci migrarea e doar de transport
    - **Header-ul în răspuns** e mai util decât pare: când Tehnoplast (sau orice client) raportează o problemă, ceri request id-ul din răspuns și găsești instant tot lanțul de loguri

