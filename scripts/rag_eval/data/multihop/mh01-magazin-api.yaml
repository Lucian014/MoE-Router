    Pentru clienți doar din România, un provider local e de obicei alegerea practică.

    **2. Sender ID.** Poți trimite de la un nume (ex: `MagazinulTau`) sau un număr de telefon. Sender ID alfanumeric trebuie înregistrat la provider și aprobat pe rețele — durează zile, fă cererea din timp. Avantajul numelui: clientul recunoaște expeditorul.

    **3. Costul și abuzul.** Spre deosebire de email, SMS-ul costă bani reali per mesaj. Deci:
    - **Trimite doar la comenzi confirmate/plătite**, nu la coșuri abandonate sau comenzi în lucru
    - **Validează numărul de telefon** la checkout — un număr greșit scris costă bani și creează confuzie. Normalizare la format E.164 (`+40722123456`) cu o librărie gen `libphonenumber-js`
    - **Nu trimite de mai multe ori** pentru aceeași comandă — salvează statusul SMS-ului pe comandă (`sms_sent_at`), altfel un retry de cron dublează costul

    **4. Conținutul.** SMS-ul are 160 de caractere (peste asta, se împarte și plătești dublu/triplu). Ține mesajul minimal:

    ```
    MagazinulTau: Comanda #55120 confirmata. Total: 340 lei. Detalii: https://magazin.ro/c/55120
    ```

    Fără diacritice — unele rețele le transformă prost sau le plătesc ca Unicode (70 caractere/mesaj).

    **5. GDPR și consimțământ.** SMS-ul de confirmare a comenzii e comunicare tranzacțională, nu marketing — e ok să-l trimiți fără opt-in separat, fiindcă e necesar executării contractului. Dar **nu adăuga mesaje promoționale** în el, altfel devine marketing și ai nevoie de consimțământ explicit. Numărul de telefon nu trebuie folosit apoi pentru campanii fără acord separat.

    **6. Livrarea e fire-and-forget, cu status.** Nu bloca răspunsul checkout-ului pe trimiterea SMS-ului:

    ```js
    // după confirmarea comenzii — async, nu așteaptă
    order.$queue?.add('send-sms', { orderId }) // dacă ai queue
    // sau, simplu:
    sendOrderSms(order).catch(err =>
      console.error(`[sms] FAILED order ${order.id}:`, err.message)
    );
    ```

    Dacă SMS-ul eșuează, comanda nu trebuie afectată — emailul rămâne canalul principal, SMS-ul e complementar. Loghează statusul de livrare (providerii dau callback-uri de delivery report) ca să vezi rata reală.

    **7. Teste.** Toți providerii au sandbox sau numere de test. Verifică în staging că mesajul ajunge formatat corect pe mai multe rețele (Orange, Digi, Vodafone) — tăierea URL-urilor sau a textului diferă.

    **Ordinea practică de implementare:** cont la provider → sender ID înregistrat → integrare API (același pattern ca la mailer: un singur client configurat, retry pe erori temporare, status salvat în DB) → validare E.164 la checkout → monitorizare costuri.

