- user: |
    Cum fac paginare cu cursor în loc de offset?
  assistant: |
    Offset-ul (`skip` în Prisma) are două probleme la un magazin: devine lent la pagini mari (DB trebuie să sara peste 10.000 de rânduri ca să dea pagina 501) și, dacă între două pagini se adaugă un produs, utilizatorul vede același produs de două ori. Cursorul rezolvă ambele.

    **Varianta 1: cursor nativ Prisma** — cea mai simplă, merge când sortezi după un câmp unic:

    ```js
    // GET /api/products?limit=20&cursor=123
    async function listProducts(cursor, limit = 20) {
      const products = await prisma.product.findMany({
        take: limit + 1,               // +1 ca să știi dacă mai există pagină următoare
        orderBy: { id: 'desc' },
        ...(cursor && { cursor: { id: cursor }, skip: 1 }), // skip=1 sare peste cursorul însuși
      });

      const hasMore = products.length > limit;
      const items = hasMore ? products.slice(0, limit) : products;

      return {
        items,
        nextCursor: hasMore ? items[items.length - 1].id : null,
      };
    }
    ```

    Răspunsul API:

    ```json
    {
      "items": [...],
      "nextCursor": 123
    }
    ```

    Clientul trimite înapoi `nextCursor` ca `cursor` pentru pagina următoare. Când e `null`, nu mai există pagini.

    **Limitare:** sortarea trebuie să fie pe câmpul unic folosit ca cursor. Dacă vrei sortare pe `price` sau `createdAt`, două produse pot avea aceeași valoare și paginația sare sau duplică rânduri.

    **Varianta 2: keyset cu sortare pe câmp non-unic** — soluția robustă: sortezi după câmpul dorit + `id` ca tiebreaker, iar cursorul e o pereche:

    ```js
    // GET /api/products?limit=20&sort=price&cursor=eyJwcmljZSI6MTI5LjksImlkIjo0NTZ9
    // cursorul e base64 din {"price":129.9,"id":456}

    async function listProducts({ cursor, limit = 20, sort = 'price' }) {
      let where = {};
      if (cursor) {
        const { price, id } = JSON.parse(Buffer.from(cursor, 'base64').toString());
        // rândurile STRICT după poziția cursorului în ordonarea (price, id)
        where = {
          OR: [
            { price: { gt: price } },
            { price: price, id: { gt: id } },
          ],
        };
      }

      const products = await prisma.product.findMany({
        where,
        orderBy: [{ price: 'asc' }, { id: 'asc' }],
        take: limit + 1,
      });

      const hasMore = products.length > limit;
      const items = hasMore ? products.slice(0, limit) : products;

      const nextCursor = hasMore
        ? Buffer.from(JSON.stringify({
            price: items[items.length - 1].price,
            id: items[items.length - 1].id,
          })).toString('base64')
        : null;

      return { items, nextCursor };
    }
    ```

    Pentru asta ai nevoie de index compus, altfel sortarea face scan:

    ```sql
    CREATE INDEX "Product_price_id_idx" ON "Product" (price, id);
    ```

    **Ce pierzi cu cursorul și merită să știi:**

    - **Nu poți sări la pagina N** — doar next/prev. Pentru listarea de produse cu infinite scroll sau buton „următoarea", e perfect; pentru pagini numerotate în admin, offset-ul rămâne ok (acolo volumele sunt mici).
    - **Sortare descrescătoare** — condiția `OR` se inversează (`lt` în loc de `gt`). Parametrizează direcția în cod.
    - **Cursorul nu e secret** — e base64, nu criptare. Oricine îl poate decoda; nu pune acolo date sensibile.

    **Recomandare pentru cazul tău:** catalogul public (unde ai și căutarea de la începutul conversației) → varianta 2 cu sortare pe relevanță/preț + index compus. Admin-ul și listele interne → offset-ul e suficient și mai comod.

    Un detaliu care se leagă de căutarea cu trigram: dacă combini căutare + paginare cu cursor, condiția `WHERE name ILIKE ...` se pune în `where` alături de condiția de cursor — indexul GIN se folosește pentru filtru, iar `ORDER BY` pe câmpul sortat are nevoie de indexul lui. La 50k produse, ambele merg rapid dacă indexurile sunt la locul lor.

    Vrei și varianta cu `prevCursor` (paginare bidirecțională), sau exemplu de integrare cu endpoint-ul de căutare?
