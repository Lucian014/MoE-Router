    ```js
    // middlewares/requestId.js
    const crypto = require('crypto');

    function requestId(req, res, next) {
      // Acceptă un id venit de la proxy/load balancer (ex: nginx $request_id),
      // altfel generează unul
      const incoming = req.get('X-Request-Id');
      const id = incoming || crypto.randomUUID();

      req.id = id;
      res.set('X-Request-Id', id); // clientul îl vede în răspuns, util pentru suport

      next();
    }

    module.exports = { requestId };
    ```

    ```js
    // middlewares/logger.js
    function logger(req, res, next) {
      const start = process.hrtime.bigint();

      res.on('finish', () => {
        const durationMs = Number(process.hrtime.bigint() - start) / 1e6;
        const log = {
          requestId: req.id,
          method: req.method,
          path: req.originalUrl,
          status: res.statusCode,
          durationMs: Math.round(durationMs),
          ip: req.ip,
          userId: req.user?.id ?? null, // dacă ai auth înainte de logger
        };

        // Erorile 5xx mai vizibile decât restul
        if (res.statusCode >= 500) {
          console.error(JSON.stringify(log));
        } else {
          console.log(JSON.stringify(log));
        }
      });

      next();
    }

    module.exports = { logger };
    ```

    Montare în `app.js` — **ordinea contează**, requestId înainte de toate:

    ```js
    const { requestId } = require('./middlewares/requestId');
    const { logger } = require('./middlewares/logger');

    app.set('trust proxy', 1);
    app.use(requestId);   // primul — toate celelalte văd req.id
    app.use(logger);
    app.use(routes);
    ```

    **Propagarea în logurile de eroare.** Ca să aibă sens, request id-ul trebuie să apară și în mesajele de eroare. În error handler:

    ```js
    // middlewares/errorHandler.js
    function errorHandler(err, req, res, next) {
      console.error(JSON.stringify({
        requestId: req.id,
        err: err.message,
        stack: err.stack,
      }));

      res.status(err.status || 500).json({
        error: 'Eroare internă',
        requestId: req.id, // clientul îl poate trimite în tichet de suport
      });
    }
    ```

