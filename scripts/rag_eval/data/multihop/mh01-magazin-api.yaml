  assistant: |
    Codul e scurt, dar ascunde câteva capcane de lizibilitate și posibil două bug-uri de business. Iată ce aș îmbunătăți:

    **Problemele:**

    1. **`if (c.stackable === false) break;`** — break-ul vine *după* aplicarea cuponului. E intenționat (cuponul non-stackable se aplică, apoi se oprește) sau ar trebui să se oprească *înainte* să-l aplice? Nu se poate spune din cod — exact genul de decizie care merită un comentariu sau o clarificare de la Radu.
    2. **Ordinea cupoanelor contează** — `percent` după `fixed` dă alt rezultat decât invers, dar nimic în cod nu spune asta.
    3. **Lanțul de `if` pe `c.type`** — la fiecare cupon nou (ex: `free_shipping`), trebuie modificată funcția.
    4. **Bani în float** — `total * 100 / 100` cu `Math.round` mască problemele, dar nu le rezolvă. La un e-commerce, ideal lucrezi în cenți întregi sau `Decimal` (Prisma îl suportă nativ).
    5. **Total negativ posibil** — un cupon `fixed` de 500 RON pe o comandă de 200 RON dă total negativ.

    **Variantă refactorizată:**

    ```js
    const DISCOUNT_STRATEGIES = {
      percent: (total, value) => total * (1 - value / 100),
      fixed: (total, value) => total - value,
    };

    const roundToCents = (amount) => Math.round(amount * 100) / 100;

    function applyCoupon(total, coupon) {
      const strategy = DISCOUNT_STRATEGIES[coupon.type];
      if (!strategy) {
        throw new Error(`Tip de cupon necunoscut: ${coupon.type}`);
      }
      return strategy(total, coupon.value);
    }

    function applyCoupons(order, coupons) {
      let total = order.items.reduce((sum, item) => sum + item.price * item.qty, 0);

      for (const coupon of coupons) {
        total = applyCoupon(total, coupon);
        // Un cupon non-stackable se aplică, apoi blochează restul din listă
        if (!coupon.stackable) break;
      }

      return roundToCents(Math.max(total, 0));
    }
    ```

    Ce s-a câștigat:

