    Ultima: vreau un endpoint de export CSV cu toate comenzile dintr-o lună, poate fi și 200.000 de rânduri.
  assistant: |
    La 200.000 de rânduri, problema principală nu e CSV-ul, ci **memoria**: dacă faci `findMany` cu totul și concatenezi string-uri, Node va consuma sute de MB sau va cădea. Soluția e **streaming**: scrii în răspuns pe măsură ce citești din DB, cu loturi mici.

    **Varianta 1: Prisma cu loturi (simplă, suficientă)**

    ```js
    // controllers/orders.controller.js
    const { stringify } = require('csv-stringify');
    const { Readable } = require('stream');

    async function exportOrdersCsv(req, res, next) {
      try {
        const { month } = req.query; // ex: "2026-01"
        const start = new Date(`${month}-01T00:00:00Z`);
        const end = new Date(start);
        end.setUTCMonth(end.getUTCMonth() + 1);

        res.setHeader('Content-Type', 'text/csv; charset=utf-8');
        res.setHeader(
          'Content-Disposition',
          `attachment; filename="comenzi-${month}.csv"`
        );

        // BOM ca Excel să recunoască UTF-8 (diacriticele românești)
        res.write('\uFEFF');

        const csvStream = stringify({
          header: true,
          columns: {
            id: 'order_id',
            createdAt: 'created_at',
            customerEmail: 'email',
            itemsTotal: 'items_total',
            paidTotal: 'paid_total',
            status: 'status',
          },
        });
        csvStream.pipe(res);

        // keyset pagination pe id — fără skip, rapid la orice volum
        const BATCH = 5000;
        let lastId = 0;
        let batch;

        do {
          batch = await prisma.order.findMany({
            where: { createdAt: { gte: start, lt: end }, id: { gt: lastId } },
            orderBy: { id: 'asc' },
            take: BATCH,
            select: {
              id: true,
              createdAt: true,
              customerEmail: true,
              itemsTotal: true,
              paidTotal: true,
              status: true,
            },
          });

          for (const order of batch) {
            csvStream.write(order);
          }
          if (batch.length > 0) lastId = batch[batch.length - 1].id;
        } while (batch.length === BATCH);

        csvStream.end();
      } catch (err) {
        next(err);
      }
    }
    ```

    ```bash
    npm install csv-stringify
    ```

    De ce keyset pe `id` și nu `skip`: `skip: 150000, take: 5000` forțează Postgres să numere 150.000 de rânduri la fiecare lot — total O(n²). Cu `id > lastId`, fiecare lot e instant, indiferent de poziție.

    **Varianta 2: cursor la nivel de Postgres (pg-cursor)** — mai eficientă, o singură interogare pe server:

    ```js
    const { Cursor } = require('pg-cursor');
    const { Pool } = require('pg');

    const pool = new Pool({ connectionString: process.env.DATABASE_URL });

    async function exportOrdersCsv(req, res, next) {
      const { month } = req.query;
      const start = `${month}-01`;

      res.setHeader('Content-Type', 'text/csv; charset=utf-8');
      res.setHeader('Content-Disposition', `attachment; filename="comenzi-${month}.csv"`);
      res.write('\uFEFF');

      const client = await pool.connect();
      try {
        const cursor = client.query(new Cursor(
          `SELECT id, created_at, customer_email, items_total, paid_total, status
           FROM "Order"
           WHERE created_at >= $1 AND created_at < $1::date + interval '1 month'`,
          [start]
        ));

        const BATCH = 5000;
        let rows;
        do {
          rows = await promisifyCursorRead(cursor, BATCH);
          for (const row of rows) res.write(toCsvLine(row));
        } while (rows.length === BATCH);

        cursor.close(() => client.release());
        res.end();
      } catch (err) {
        client.release();
        next(err);
      }
    }
    ```

    **Aspecte importante indiferent de variantă:**

    **1. Autentificare și autorizare** — exportul de comenzi (cu emailuri de clienți!) e date cu caracter personal. Doar admin, cu logare a accesului:

    ```js
    router.get('/admin/orders/export', requireAdmin, auditLog('orders.export'), ctrl.exportOrdersCsv);
    ```

    **2. Timeout-uri.** Un export de 200k rânduri poate dura minute. Verifică că:
    - nginx nu are `proxy_read_timeout` prea scurt (implicit 60s — crește-l pentru ruta asta sau lasă-l, vezi mai jos)
    - nu e în spatele unui CDN cu timeout de 30s (Cloudflare are 100s pe planul gratuit)

    **3. Ruta de export nu trebuie să blocheze API-ul.** Streaming-ul Node e pe event loop, iar loturile DB sunt async, deci nu blochează — dar un export masiv consumă conexiuni din pool-ul Prisma. Dacă exporturile sunt rare și admin-only, e ok; dacă devin frecvente, mută-le pe o replică de citire sau pe un job asincron care generează fișierul și dă un link de download.

    **4. Compresie.** CSV-ul de 200k rânduri comprimă foarte bine (10-20x). Fie lasă nginx să facă gzip, fie scrii direct `.csv.gz`:

    ```js
    const zlib = require('zlib');
    res.setHeader('Content-Type', 'application/gzip');
    res.setHeader('Content-Disposition', `attachment; filename="comenzi-${month}.csv.gz"`);
    const gzip = zlib.createGzip();
    // pipe spre gzip, gzip spre res
    ```

    **5. Escaparea CSV** — `csv-stringify` o face automat (virgule, ghilimele, newline-uri în câmpuri). Dacă scrii manual, un email cu virgulă sau un nume cu `"` corupe fișierul. Și atenție la **CSV injection**: valori care încep cu `=`, `+`, `-` pot executa formule în Excel — prefixează-le cu `'` dacă datele pot veni de la utilizatori (nume, adrese).

    **6. Validarea lunii** — validează formatul cu zod (`/^\d{4}-\d{2}$/`) și limitează la ultimele N luni, ca nimeni să nu declanșeze exporturi arbitrare.

    **Recomandare:** începe cu varianta 1 (Prisma + keyset) — e mai puțin cod, folosește infrastructura existentă, iar la 200k rânduri cu loturi de 5000 va dura vreo 10-30 de secunde, acceptabil pentru un export admin. Dacă ajungi la milioane sau la exporturi frecvente, treci pe job asincron + fișier în S3 (care se leagă frumos cu discuția de la poze).
