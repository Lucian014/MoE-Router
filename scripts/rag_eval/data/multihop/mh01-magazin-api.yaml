    - **Comentariul** documentează regula non-stackable, care era partea cea mai ambiguă
    - **`Math.max(total, 0)`** — apără de total negativ (confirmă cu Radu dacă asta e regula dorită!)
    - **Nume explicite** — `roundToCents`, `applyCoupon` spun ce fac fără să citești implementarea

