id: mh01-magazin-api
category: coding
lang: ro
turns:
- user: |
    Am un API în Express pentru un magazin online (Node 20, PostgreSQL 16, Prisma 5). Îți descriu câteva probleme pe rând. Prima: căutarea de produse merge greu, cam 3 secunde la 50.000 de produse. Uite codul:

    ```js
    const results = await prisma.product.findMany({
      where: {
        OR: [
          { name: { contains: q, mode: 'insensitive' } },
          { description: { contains: q, mode: 'insensitive' } },
        ],
      },
      take: 20,
    });
    ```
  assistant: |
    Problema e clasică: `contains` cu `mode: 'insensitive'` se traduce în SQL ca `ILIKE '%q%'`, iar un pattern cu `%` la început **nu poate folosi un index B-tree normal**. PostgreSQL face sequential scan pe toate cele 50.000 de rânduri, de aici cele ~3 secunde.

    Ai câteva soluții, în ordinea efortului:

    ## 1. Index trigram (pg_trgm) — cea mai simplă schimbare reală

    Extensia `pg_trgm` permite indexare GIN pe căutări de tip substring:

    ```sql
    CREATE EXTENSION IF NOT EXISTS pg_trgm;

    CREATE INDEX products_name_trgm ON products USING GIN (name gin_trgm_ops);
    CREATE INDEX products_description_trgm ON products USING GIN (description gin_trgm_ops);
    ```

    Problema: Prisma nu știe să folosească `ILIKE ... gin_trgm_ops` prin `findMany` în mod fiabil, deci scrii query-ul raw:

    ```js
    const results = await prisma.$queryRaw`
      SELECT id, name, description, price
      FROM products
      WHERE name ILIKE ${'%' + q + '%'}
         OR description ILIKE ${'%' + q + '%'}
      LIMIT 20
    `;
    ```

    Cu indexul GIN, asta coboară de la secunde la zeci de milisecunde. Atenție: cuvinte foarte scurte (< 3 caractere) nu beneficiază de trigram — pentru ele fallback-ul e scan normal, dar pe 50k rânduri e tolerabil.

    ## 2. Full-text search nativ PostgreSQL — mai potrivit pentru descrieri

    Dacă utilizatorii caută cuvinte întregi (nu substring-uri), FTS e mai corect semantic și mai rapid:

    ```sql
    ALTER TABLE products ADD COLUMN search_vector tsvector
      GENERATED ALWAYS AS (
        setweight(to_tsvector('simple', coalesce(name, '')), 'A') ||
        setweight(to_tsvector('simple', coalesce(description, '')), 'B')
      ) STORED;

    CREATE INDEX products_fts ON products USING GIN (search_vector);
    ```

    ```js
    const results = await prisma.$queryRaw`
      SELECT id, name, description, price,
             ts_rank(search_vector, websearch_to_tsquery('simple', ${q})) AS rank
      FROM products
      WHERE search_vector @@ websearch_to_tsquery('simple', ${q})
      ORDER BY rank DESC
      LIMIT 20
    `;
    ```

    Bonus: ai și ranking (relevanță), ceea ce `ILIKE` nu îți dă. Folosește `simple` sau configurare pentru română (`romanian`) dacă vrei stemming diacritice.

    ## 3. Motor de căutare dedicat (Meilisearch / Typesense)

    Dacă vrei typo-tolerance, fuzzy matching și facete (filtre pe categorie, preț), mută indexarea într-un motor dedicat și sincronizezi din Prisma la create/update. E mai multă infrastructură, dar e standardul pentru e-commerce serios.

    **Recomandarea mea:** începe cu varianta 1 (rezolvă imediat problema de performanță), iar dacă utilizatorii se plâng că nu găsesc produse din cauza greșelilor de tastare, treci la 2 sau 3.

    Spune-mi și ce alte probleme ai pe listă.
- user: |
    Am pus un index B-tree pe name, cum mi-ai zis, dar timpul e același. Uite planul:

    ```
    Limit  (cost=0.00..4127.31 rows=20 width=412) (actual time=2894.113..2894.120 rows=20 loops=1)
      ->  Seq Scan on "Product"  (cost=0.00..10318.27 rows=50 width=412) (actual time=2894.110..2894.115 rows=20 loops=1)
            Filter: ((name ~~* '%bormasina%'::text) OR (description ~~* '%bormasina%'::text))
            Rows Removed by Filter: 49877
    Planning Time: 0.211 ms
    Execution Time: 2894.160 ms
    ```
  assistant: |
    Planul confirmă exact ce spuneam: **Seq Scan** — indexul B-tree nu e folosit deloc. Și e important de clarificat: nu ți-am recomandat B-tree, tocmai pentru că **un index B-tree nu poate servi un pattern `%bormasina%`**. B-tree funcționează doar pentru prefixe de tip `bormasina%` (operator `~~` cu wildcard doar la final). Cu `%` la început, PostgreSQL nu are cum să navigheze arborele, deci face scan complet — indiferent dacă ai sau nu index B-tree pe `name`.

    Indexul de care ai nevoie e **GIN cu trigram**, pe tabela corectă (Prisma o numește `"Product"`, cu majusculă, conform planului tău):

    ```sql
    -- 1. Extensia (o dată pe bază de date)
    CREATE EXTENSION IF NOT EXISTS pg_trgm;

    -- 2. Indexurile GIN, pe tabela "Product", nu "products"
    CREATE INDEX "Product_name_trgm_idx"
      ON "Product" USING GIN (name gin_trgm_ops);

    CREATE INDEX "Product_description_trgm_idx"
      ON "Product" USING GIN (description gin_trgm_ops);
    ```

    Verifică apoi că e folosit:

    ```sql
    EXPLAIN ANALYZE
    SELECT id FROM "Product"
    WHERE name ILIKE '%bormasina%'
       OR description ILIKE '%bormasina%'
    LIMIT 20;
    ```

    Ar trebui să vezi `Bitmap Index Scan` pe `Product_name_trgm_idx` în loc de `Seq Scan`, cu execution time de ordinul milisecundelor.

    Două capcane de verificat dacă tot face Seq Scan după ce ai creat indexurile:

    1. **Extensia nu e creată** — `gin_trgm_ops` dă eroare la `CREATE INDEX` dacă lipsește `pg_trgm`, deci dacă indexul s-a creat, extensia există. Verifică totuși cu `\dx` sau `SELECT * FROM pg_extension WHERE extname = 'pg_trgm';`
    2. **Indexul e pe tabela greșită** — dacă ai rulat scriptul meu inițial cu `products` (numele pe care l-am presupus eu), dar tabela reală e `"Product"`, ai creat index pe o tabelă inexistentă sau, mai rău, Prisma a creat ambele și query-ul lovește pe cea fără index. Verifică cu:

    ```sql
    SELECT indexname, indexdef FROM pg_indexes
    WHERE tablename = 'Product' AND indexdef LIKE '%gin%';
    ```

    De asemenea, ține cont că Prisma `findMany` cu `mode: 'insensitive'` va continua să facă Seq Scan chiar și cu indexul prezent în unele versiuni — dacă după crearea indexurilor query-ul Prisma tot e lent, treci pe varianta `$queryRaw` pe care ți-am dat-o, care e garantat compatibilă cu planul de execuție bazat pe index.
- user: |
    Cum îmi organizez folderele proiectului? Acum am totul în routes/.
  assistant: |
    Pentru un API Express de dimensiunea unui magazin online, o structură pe straturi (layered) e alegerea cea mai practică. Iată ce aș recomanda:

    ```
    src/
    ├── routes/            # definiția rutelor, subțiri — doar wiring
    │   ├── products.routes.js
    │   └── orders.routes.js
    ├── controllers/       # primesc request-ul, validează, apelează serviciul, răspund
    │   ├── products.controller.js
    │   └── orders.controller.js
    ├── services/          # logica de business
    │   ├── products.service.js
    │   └── orders.service.js
    ├── repositories/      # acces la date (Prisma) — singurul loc unde e prisma
    │   ├── products.repository.js
    │   └── orders.repository.js
    ├── validators/        # scheme de validare (zod / express-validator)
    │   └── products.schema.js
    ├── middlewares/
    │   ├── auth.js
    │   ├── errorHandler.js
    │   └── validate.js
    ├── config/
    │   ├── env.js         # parsarea variabilelor de mediu, o singură dată
    │   └── prisma.js      # instanța PrismaClient, exportată o singură dată
    ├── utils/
    └── app.js             # construiește app-ul Express, montează rutele
    server.js               # punct de intrare: ascultă pe port
    prisma/
    ├── schema.prisma
    └── migrations/
    ```

    Câteva principii care contează mai mult decât structura în sine:

    **1. Direcția dependențelor:** `routes → controllers → services → repositories → Prisma`. Controllerul nu trebuie să importe `prisma` direct, iar serviciul nu trebuie să știe de Express (`req`/`res`). Asta face logica testabilă fără HTTP.

    **2. Un singur `PrismaClient`:** instanțiază-l în `config/prisma.js` și importă-l de acolo peste tot. Instanțe multiple duc la warning-uri de connection pool.

    **3. Rutele subțiri:** dacă acum ai logica direct în `routes/`, mut-o treptat. Un route ar trebui să arate așa:

    ```js
    // routes/products.routes.js
    const router = require('express').Router();
    const ctrl = require('../controllers/products.controller');
    const { searchSchema } = require('../validators/products.schema');
    const validate = require('../middlewares/validate');

    router.get('/search', validate(searchSchema), ctrl.searchProducts);

    module.exports = router;
    ```

    **4. Nu exagera:** dacă ai doar 3-4 resurse, poți sări peste `repositories/` și să apelezi Prisma direct din `services/`. Adaugă stratul când simți duplicare. Structura trebuie să crească odată cu proiectul, nu în avans.

    **5. Teste lângă cod sau în `tests/`** — ambele variante sunt ok, dar fii consecvent. Pentru început: `tests/` cu aceeași ierarhie (`tests/services/products.service.test.js`).

    Dacă vrei, dă-mi un exemplu dintr-un fișier actual din `routes/` și îți arăt concret cum îl împarți în controller + service.
- user: |
    Altă treabă: cel mai mare client B2B al nostru, firma Tehnoplast din Cluj, se plânge că nu primește emailurile cu facturile. Le trimitem dintr-un cron care pornește la 2 noaptea și trimite toate facturile din ziua precedentă, vreo 900.
  assistant: |
    Problema asta e aproape sigur de deliverability, nu de cod — 900 de emailuri trimise în rafală de la un cron la 2 noaptea e un pattern clasic care declanșează filtrele antispam. Iată de unde să cauți, în ordinea probabilității:

    **1. Cum trimiteți efectiv emailurile?** Dacă e prin SMTP direct de pe serverul aplicației (sendmail / nodemailer cu SMTP propriu), asta e cauza principală. IP-urile de server fără reputație de trimitere ajung în spam sau sunt blocate direct. Soluția pe termen lung: un provider tranzacțional (Amazon SES, Postmark, SendGrid, Mailgun). Postmark e deosebit de bun pentru facturi/documente, SES e cel mai ieftin la ~900 emailuri/zi.

    **2. Autentificare DNS.** Verifică pentru domeniul din care trimiteți:
    - **SPF** — include providerul de email
    - **DKIM** — semnare cryptographică, obligatorie practic din 2024 (Google și Yahoo cer DKIM + SPF + DMARC pentru expeditori de volum)
    - **DMARC** — policy minim `p:none` de start

    Poți testa rapid cu [mail-tester.com](https://www.mail-tester.com) — trimite un email de test la adresa generată și îți dă scor cu explicații.

    **3. Atașamentele.** Dacă factura e un PDF atașat, filtrele sunt mai suspicioase, iar PDF-urile mari (>2-3 MB) agravează. Alternativa mai robustă: trimite link securizat către factura din platformă, nu atașament.

    **4. Rafala.** Chiar și cu provider, nu trimite 900 deodată. Adaugă throttling — de exemplu 50-100 pe minut, cu `p-limit` sau un simplu interval:

    ```js
    const pLimit = require('p-limit');
    const limit = pLimit(5); // max 5 concurente

    const results = await Promise.allSettled(
      invoices.map(inv => limit(() => sendInvoiceEmail(inv)))
    );
    ```

    **5. Logare și bounce handling.** Momentan probabil nu știi *ce* se întâmplă cu emailurile — nu ai cum să distingi „trimis" de „livrat" sau „rejectat". Providerii tranzacționali dau webhook-uri pentru `delivered`, `bounced`, `spam_complaint`. Asta e esențial: dacă un email la Tehnoplast a dat bounce, trebuie să știți.

    **Pas imediat, practic:** sună la Tehnoplast și întreabă-i să verifice folderul Spam și, dacă e acolo, să marcheze emailurile ca „Not spam" și să vă adauge la whitelist. Apoi verifică bounce-urile și treci pe provider tranzacțional cu DKIM/DMARC configurate.

    Ce folosiți acum pentru trimitere — SMTP propriu sau vreun serviciu? Și emailurile ajung în spam sau nu ajung deloc?
- user: |
    Am scos logurile de la ora aia:

    ```
    02:00:03 [invoices] batch started, 912 invoices
    02:00:04 [mailer] sent INV-2026-18211 ok
    02:00:04 [mailer] sent INV-2026-18212 ok
    02:00:05 [mailer] ERROR 421 4.7.0 Too many concurrent SMTP connections from this IP
    02:00:05 [mailer] ERROR 421 4.7.0 Too many concurrent SMTP connections from this IP
    02:00:06 [mailer] ERROR Greeting never received
    02:01:40 [invoices] batch finished: 287 sent, 625 failed
    ```

    Codul de trimitere e un Promise.all peste toate facturile, fiecare cu nodemailer.createTransport(...).sendMail(...).
  assistant: |
    Logurile confirmă diagnosticul: **912 conexiuni SMTP simultane**. Serverul de mail (al vostru sau al providerului) respinge conexiunile peste limită cu `421 4.7.0`, iar celelalte erori (`Greeting never received`) sunt consecința acelorași conexiuni care se blochează la handshake. De aici 287 trimise / 625 eșuate.

    Sunt două probleme în cod:

    **1. `Promise.all` fără limită** — pornește toate cele 912 trimiteri deodată.

    **2. `createTransport` per email** — creezi un pool nou de conexiuni pentru fiecare factură. Transporterul trebuie creat **o singură dată** și refolosit; nodemailer îl folosește intern pentru toată aplicatia.

    Iată varianta corectată:

    ```js
    const nodemailer = require('nodemailer');
    const pLimit = require('p-limit');

    // O SINGURĂ instanță, la nivel de modul
    const transporter = nodemailer.createTransport({
      host: process.env.SMTP_HOST,
      port: 587,
      secure: false,
      auth: { user: process.env.SMTP_USER, pass: process.env.SMTP_PASS },
      pool: true,          // refolosește conexiunile în loc să deschidă altele noi
      maxConnections: 3,   // max 3 conexiuni simultane către server
      maxMessages: 100,    // max 100 emailuri pe conexiune înainte de reconnect
    });

    // Retry cu backoff pentru erori temporare (4xx)
    async function sendWithRetry(mailOptions, maxRetries = 3) {
      for (let attempt = 1; attempt <= maxRetries; attempt++) {
        try {
          return await transporter.sendMail(mailOptions);
        } catch (err) {
          const isTemporary = err.responseCode && err.responseCode >= 400 && err.responseCode < 500;
          if (!isTemporary || attempt === maxRetries) throw err;
          await new Promise(r => setTimeout(r, attempt * 5000)); // 5s, 10s, 15s
        }
      }
    }

    async function sendInvoices(invoices) {
      const limit = pLimit(10); // max 10 trimiteri "în zbor" simultan

      const results = await Promise.allSettled(
        invoices.map(inv => limit(() =>
          sendWithRetry({
            from: 'facturi@domeniul-vostru.ro',
            to: inv.clientEmail,
            subject: `Factura ${inv.number}`,
            html: renderInvoiceHtml(inv),
            attachments: inv.pdfPath ? [{ path: inv.pdfPath }] : [],
          })
        ))
      );

      const sent = results.filter(r => r.status === 'fulfilled').length;
      const failed = results.filter(r => r.status === 'rejected');

      // Loghează eșuatele cu motivul, ca să le poți retrimite
      failed.forEach((r, i) =>
        console.error(`[mailer] FAILED ${invoices[i].number}:`, r.reason?.response || r.reason?.message)
      );

      return { sent, failed: failed.length };
    }
    ```

    Ce se schimbă, pe scurt:

    - **`pool: true` + `maxConnections: 3`** — nodemailer deschide maximum 3 conexiuni și trimite pe ele în serie. Serverul nu mai vede 912 conexiuni.
    - **`pLimit(10)`** — chiar și cu pool, nu construi 912 promise-uri active deodată; limita controlează backpressure-ul.
    - **Retry pe 4xx** — `421` e o eroare temporară ("try again later"), nu definitivă. Acum eșuează definitiv la prima încercare.
    - **`Promise.allSettled`** — un eșec nu aruncă tot batch-ul; păstrezi lista celor eșuate ca să le retrimi într-un al doilea pass.

    Un detaliu important: **cele 625 eșuate de aseară nu s-au trimis deloc** — verifică dacă aveți un mecanism de retrimitere, altfel clienții (inclusiv Tehnoplast) au pierdut facturi. Cel mai simplu: marchezi în DB statusul emailului per factură (`pending/sent/failed`) și cron-ul reîncearcă automat ce e `failed` sau `pending` la fiecare rulare, nu doar facturile din ziua precedentă.

    Dacă după fix conexiunile merg dar emailurile tot ajung în spam la Tehnoplast, atunci revenim la subiectul deliverability de dinainte (DKIM/DMARC/provider tranzacțional) — dar rezolvă întâi asta, pentru că acum nici măcar ajung la filtre.
- user: |
    Cum adaug rate limiting pe endpointul de login?
  assistant: |
    Pentru Express, standardul e pachetul `express-rate-limit`. Pentru login vrei o limită **mai strictă decât restul API-ului**, pentru că e ținta principală a atacurilor brute-force.

    ```bash
    npm install express-rate-limit
    ```

    ```js
    // middlewares/rateLimit.js
    const rateLimit = require('express-rate-limit');

    // Limiter strict pentru login
    const loginLimiter = rateLimit({
      windowMs: 15 * 60 * 1000, // fereastră de 15 minute
      limit: 5,                 // max 5 încercări per IP per fereastră
      standardHeaders: 'draft-7', // header-e RateLimit-* standard
      legacyHeaders: false,
      message: { error: 'Prea multe încercări de autentificare. Reîncearcă în 15 minute.' },
      // contează și emailul, nu doar IP-ul — altfel un atacator
      // blochează loginul întregii firme prin IP-ul de birou (NAT)
      keyGenerator: (req) => {
        const email = (req.body?.email || '').toLowerCase().trim();
        return `${req.ip}:${email}`;
      },
    });

    module.exports = { loginLimiter };
    ```

    ```js
    // routes/auth.routes.js
    const router = require('express').Router();
    const { loginLimiter } = require('../middlewares/rateLimit');
    const ctrl = require('../controllers/auth.controller');

    router.post('/login', loginLimiter, ctrl.login);

    module.exports = router;
    ```

    Câteva detalii importante:

    **1. `trust proxy`** — dacă API-ul e în spatele unui reverse proxy (nginx, load balancer, Heroku, Vercel), `req.ip` va fi IP-ul proxy-ului și toți clienții vor părea unul singur. Setează în `app.js`, înainte de rute:

    ```js
    app.set('trust proxy', 1); // 1 hop până la clientul real
    ```

    **2. Nu bloca doar pe IP** — de asta e `keyGenerator`-ul cu email. Un atacator distribuit (botnet) rotește IP-urile, iar un birou întreg iese printr-un singur IP NAT. Combinatul `IP + email` e echilibrul potrivit: cineva poate încerca 5 parole pentru un cont, dar nu poate bloca loginul colegilor.

    **3. Răspunsul la login eșuat trebuie să fie identic** pentru „utilizator inexistent" și „parolă greșită" (`401 Invalid credentials`), altfel rate limiting-ul nu ajută la mare lucru — atacatorul enumeratează conturi valide.

    **4. Opțional: delay progresiv sau CAPTCHA** după N eșecuri. O variantă simplă fără dependențe suplimentare: la fiecare eșec, adaugă o întârziere crescătoare per cont în service-ul de login. Pentru CAPTCHA, `express-rate-limit` se combină bine cu un middleware care cere token reCAPTCHA/Turnstile după 3 eșecuri.

    **5. Store în producție** — implicit contorul ține minte în memorie, ceea ce nu merge dacă ai mai multe instanțe Node (fiecare are contorul ei). Pentru deploy multi-instanță, folosește store Redis:

    ```js
    const RedisStore = require('rate-limit-redis');
    const { Redis } = require('ioredis');

    const loginLimiter = rateLimit({
      // ...restul opțiunilor
      store: new RedisStore({
        sendCommand: (...args) => new Redis(process.env.REDIS_URL).call(...args),
      }),
    });
    ```

    Dacă ai o singură instanță, varianta cu memorie e suficientă deocamdată. Vrei să-ți arăt și cum să loghezi încercările eșuate ca să vezi dacă ești deja țintă de atacuri?
- user: |
    Pentru teste, Jest sau Vitest în 2026?
  assistant: |
    Răspuns scurt: **Vitest**, cu o excepție.

    **De ce Vitest în 2026:**
    - Viteză superioară — transpile prin esbuild/Vite, watch mode aproape instant, iar pe suite mari diferența e vizibilă
    - API compatibil Jest (`describe`, `it`, `expect`, `vi.mock` în loc de `jest.mock`) — migrarea e de obicei mecanică
    - ESM-first, fără lupta cu `transformIgnorePatterns` și babel-jest când aduci un pachet ESM-only
    - Configurație în `vite.config.ts`/`vitest.config.ts`, TypeScript fără setup suplimentar
    - Ecosistemul a migrat masiv: proiecte noi din 2024+ aleg implicit Vitest, deci tutoriale, integrări și răspunsuri StackOverflow sunt actuale

    **Excepția:** dacă codebase-ul existent e CommonJS (iar după fragmentele pe care le-ai arătat, pare că da — `require`), Jest rămâne alegerea pragmatică pe termen scurt. Vitest funcționează și cu CJS, dar e clar optimizat pentru ESM, iar dacă nu ai planul de migrare la ESM, nu merită fricțiunea.

    Pentru proiectul tău concret, aș decide așa:

    - **Proiect nou sau refactor mare în curs** → Vitest din start
    - **API existent în CJS, teste puține sau inexistente** → tot Vitest, pentru că poți porni direct cu ESM (`"type": "module"`) — la un API Express de dimensiunea ta, migrarea e o după-amiază, nu un proiect
    - **Codebase CJS mare, teste multe care merg deja pe Jest** → nu migra doar de dragul migrării; costul nu se justifică

    Un detaliu relevant pentru stack-ul tău: indiferent de runner, pentru teste cu Prisma folosește o bază de date dedicată de test (sau Testcontainers cu PostgreSQL real) și `prisma migrate reset` între suite — mock-uirea Prisma (`vi.mock` pe client) te ajută la teste de unit pe services, dar pentru repositories și rute, testele pe DB real sunt singurele care prind probleme reale de SQL, exact genul cu care te-ai lovit la căutare.

    Configurație minimă Vitest pentru proiectul tău:

    ```js
    // vitest.config.js
    import { defineConfig } from 'vitest/config';

    export default defineConfig({
      test: {
        environment: 'node',
        include: ['tests/**/*.test.js'],
        setupFiles: ['tests/setup.js'],
        testTimeout: 15000, // pentru teste care ating DB
      },
    });
    ```

    Vrei să-ți arăt structura de teste pentru un service + un route, cu DB de test?
- user: |
    Colegul meu Radu a făcut un PR care adaugă cupoane de reducere. Mie mi se pare greu de citit, cum l-aș putea face mai lizibil?

    ```js
    function applyCoupons(order, coupons) {
      let total = order.items.reduce((s, i) => s + i.price * i.qty, 0);
      for (const c of coupons) {
        if (c.type === 'percent') total = total - total * c.value / 100;
