    Ce verificări de securitate să fac înainte de lansare?
  assistant: |
    Iată o listă practică, adaptată la ce știu despre proiectul tău (Express + Prisma + Postgres, sesiuni, plăți, upload-uri, nginx + Docker pe VPS):

    ## Autentificare și sesiuni

    - **Parole hash-uite cu bcrypt/argon2** — nu SHA256 simplu, nu plaintext. Verifică și conturile vechi migrate
    - **Regenerarea sesiunii la login** — o aveți deja (fixul recent), bine
    - **Cookie-uri de sesiune:** `httpOnly: true`, `secure: true`, `sameSite: 'lax'`
    - **Expirarea sesiunilor** — TTL rezonabil (ex: 24h), nu sesiuni veșnice
    - **Rate limiting pe login** — l-ai pus, verifică și că e activ pe `/forgot-password` și `/register`
    - **Blocare după N eșecuri per cont**, nu doar per IP

    ## Autorizare (unde se găsesc cele mai grave găuri)

    - **IDOR pe fiecare endpoint cu id:** `/api/orders/55120` — un utilizator autentificat poate vedea comanda altcuiva? Testează manual cu două conturi. La e-commerce, istoricul comenzilor, adresele și facturile sunt ținte
    - **Verificare de rol pe endpoint-urile admin** — nu doar ascunse din frontend; un request direct cu curl trebuie respins
    - **Cupoanele validate server-side** — după incidentul BLACK50, verifică explicit: clientul nu poate trimite listă de cupoane, doar coduri care se validează din DB

    ## Plăți

    - **Totalul se recalculează pe server** la creare comandă și la plată — niciodată preț trimis de client
    - **Webhook-urile de la procesatorul de plăți verifică semnătura** (ex: signature header de la Stripe/Euplatesc) și sunt idempotente
    - **Comanda nu se marchează plătită decât pe baza confirmării de la procesator**, nu a unui redirect al clientului

    ## Input și injecții

    - **Validare pe toate endpoint-urile** cu zod/express-validator — body, query, params
    - **Prisma te protejează la SQL injection**, dar oriunde ai `$queryRaw` (căutarea cu trigram!), parametrii trebuie să fie template literals cu `${}`, nu concatenare — verifică fiecare apel
    - **Upload-uri:** validare de tip real (magic bytes, nu doar extensia), limită de mărime, nume de fișier generate de voi (nu de client), servite din altă origine sau cel puțin fără execuție. Un `.webp` care e de fapt HTML poate face XSS dacă e servit inline

    ## Headers și transport

    - **helmet** în Express: `app.use(helmet())` — CSP, HSTS, X-Content-Type-Options etc.
    - **HTTPS forțat** în nginx (redirect 301 de pe 80) + HSTS
    - **CORS** restrictat la domeniile reale, nu `*`, mai ales dacă ai cookie-based auth

    ## Infrastructură

    - **Secreturile nu în git** — verifică istoricul: `git log -p | grep -i "password\|secret\|key"`. Dacă au fost comise vreodată, rotește-le
    - **Postgres fără port public** (l-am pus deja în compose) + parolă forte
    - **SSH pe VPS doar cu chei**, parola dezactivată; fail2ban
    - **Backup-uri testate** — un backup nerestaurat niciodată nu e backup. Fă o restaurare de probă pe un container de test
    - **`npm audit`** și actualizarea dependințelor cu vulnerabilități high/critical

    ## Observabilitate pentru incidente

    - **Loguri fără date sensibile** — nu loga parole, tokenuri, numere complete de card (nu ar trebui să le ai deloc — plățile prin procesator, niciodată pe serverul tău)
    - **Error handler care nu expune stack trace-uri** către client în producție
    - **Alerte pe anomalii** — gen comenzi cu total 0, pe care le-ai descoperit manual; ar fi trebuit să vină ca alertă

    ## Teste rapide, înainte de lansare

    1. Două conturi, încearcă să accesezi datele unuia cu celălalt (IDOR)
    2. Trimite un preț modificat la creare comandă — trebuie ignorat
    3. Trimite același cupon de două ori — trebuie respins
    4. Un request admin fără sesiune admin — trebuie 403
    5. Upload un fișier `.html` redenumit `.webp` — vezi cum e servit

    Dacă vrei o verificare externă, un scan cu [OWASP ZAP](https://www.zaproxy.org) pe staging prinde o parte din astea automat, iar pentru lansarea propriu-zisă merită măcar o zi de bug bounty informal cu colegi care nu au scris codul.

    Prioritatea mea pentru proiectul tău, dacă timpul e limitat: **IDOR pe comenzi, validarea totalurilor de plată, și secreturile din git** — astea trei sunt cele cu impact financiar direct. Vrei să detaliez testarea IDOR cu exemple concrete pe rutele voastre?
