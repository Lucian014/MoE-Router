    Simptomul clasic: **coșul e legat de sesiune, iar la login sesiunea se schimbă** — și codul de login nu transferă coșul vechi pe utilizator, ci începe cu unul gol. Sau mai rău: îl suprascrie.

    Iată mecanismele posibile, în ordinea probabilității:

    **1. Coșul e pe `sessionId`, iar la login se face `session.regenerate()`.** Dacă folosești `express-session`, e practică de securitate să regenerezi sesiunea la login (anti session fixation). Dar dacă coșul e stocat în sesiune (`req.session.cart`), regenerarea îl pierde. Verifică în controllerul de login:

    ```js
    // dacă ai ceva de genul ăsta, coșul din sesiune moare aici
    req.session.regenerate(err => { ... });
    // sau passport care face regenerate intern
    ```

    **2. Coșul e în DB pe `userId`, iar guest-ul are coș pe `sessionId`.** La login, utilizatorul primește coșul lui (gol sau vechi), iar coșul de guest se pierde. Asta e de fapt comportamentul „corect" incomplet — lipsește **merge-ul**.

    **3. Un cod recent a introus regresia.** Ai zis „de vreo săptămână" — ce s-a deployat acum o săptămână? PR-ul lui Radu cu cupoane? Schimbări la auth? `git log --since="2 weeks ago" --oneline` și caută atingiri la cart/session/login. Dacă înainte mergea, e regresie, nu bug vechi.

    **Diagnostic rapid:**

    ```sql
    -- coșurile sunt în DB sau în sesiune?
    -- dacă în DB, uită-te la structura:
    SELECT * FROM "Cart" ORDER BY "updatedAt" DESC LIMIT 10;
    ```

    și în cod, caută unde se scrie/șterge coșul la login:

    ```bash
    grep -rn "cart" src/controllers/auth* src/services/auth*
    grep -rn "session.regenerate\|session.destroy" src/
    ```

    **Fixul corect: merge la login.** Indiferent de arhitectură, la login trebuie să combini coșul de guest cu coșul de utilizator:

    ```js
    // services/cart.service.js
    async function mergeGuestCartIntoUser(guestCartId, userId) {
      if (!guestCartId) return;

      const guestCart = await prisma.cart.findUnique({
        where: { id: guestCartId },
        include: { items: true },
      });
      if (!guestCart || guestCart.items.length === 0) return;

      const userCart = await prisma.cart.upsert({
        where: { userId },
        create: { userId },
        update: {},
      });

      for (const item of guestCart.items) {
        await prisma.cartItem.upsert({
          where: {
            cartId_productId: { cartId: userCart.id, productId: item.productId },
          },
          create: {
            cartId: userCart.id,
            productId: item.productId,
            qty: item.qty,
          },
          update: {
            // produsul există în ambele coșuri -> adună cantitățile
            qty: { increment: item.qty },
          },
        });
      }

      await prisma.cart.delete({ where: { id: guestCartId } });
    }
    ```

    Și în controllerul de login, cu atenție la ordine — **merge-ul înainte de regenerarea sesiunii**:

    ```js
    async function login(req, res, next) {
      // ...validare credențiale...

      // 1. Salvează id-ul coșului de guest din sesiunea veche
      const guestCartId = req.session.cartId;

      // 2. Regenerează sesiunea (securitate)
      req.session.regenerate(err => {
        if (err) return next(err);

        // 3. Reconstruiește sesiunea autentificată
        req.session.userId = user.id;
        req.session.cartId = null;

        // 4. Mută coșul de guest pe utilizator
        mergeGuestCartIntoUser(guestCartId, user.id)
          .then(() => res.json({ user: { id: user.id, name: user.name } }))
          .catch(next);
      });
    }
    ```

    **Detalii de luat în calcul la merge:**

    - **Stocul** — dacă produsul din coșul de guest nu mai e pe stoc sau prețul s-a schimbat, validează la merge, nu copia orbește
    - **Cupoanele** — dacă guest-ul aplicase un cupon, nu-l transfera automat; recalculează pe coșul final (mai ales după incidentul cu BLACK50 dublat)
    - **Idempotență** — dacă request-ul de login se retry-uiește, merge-ul nu trebuie să dubleze cantitățile; de asta șterg coșul de guest la final
    - **Coșul vechi al utilizatorului** — decizie de business: aduni cantitățile (varianta de mai sus) sau păstrezi cantitatea mai mare? Adunarea e standardul.

    Dacă coșul e ținut integral în sesiune (fără DB), fixul e să copiezi `req.session.cart` în variabilă **înainte** de `regenerate()` și să-l pui înapoi după — dar recomandarea mea pe termen lung e coș în DB legat de user, cu sesiunea doar ca pointer, pentru că supraviețuiește logout/login și poți face remarketing pe coșuri abandonate.

    Începe cu `git log` — dacă găsești commit-ul care a stricat, înțelegi mecanismul exact în cinci minute. Ce găsești?
