    What does a typical monthly budget look like for two people in Eindhoven?
  assistant: |
    Here's a realistic monthly budget for two people in Eindhoven, based on your situation (renting in Strijp-S, one income for now):

    **Fixed costs**

    | Item | Monthly (EUR) |
    |---|---|
    | Rent (2-bed, Strijp-S) | 1,650 |
    | Utilities (electricity, gas, water) | 200–280 |
    | Internet + two mobile plans | 80–100 |
    | Health insurance (2 × ~€150) | 300 |
    | Municipal taxes (afvalstoffenheffing, sewer, water board) | 50–70 |
    | TV/streaming, subscriptions | 30–50 |
    | **Subtotal** | **~2,310–2,450** |

    **Living costs**

    | Item | Monthly (EUR) |
    |---|---|
    | Groceries (2 people, mostly supermarkets) | 500–650 |
    | Transport | 100–250 |
    | Going out, restaurants, entertainment | 250–400 |
    | Clothing, household, personal | 100–200 |
    | Sports/gym | 50–100 |
    | Buffer for the €385 health deductible, repairs, etc. | 100–150 |
    | **Subtotal** | **~1,100–1,750** |

    **Total: roughly €3,400–4,200/month**

    **Notes on the numbers**

    - **Utilities are volatile** — energy prices fluctuate and Dutch homes vary in efficiency. Ask for the *energielabel* (energy label) of any apartment; A–B labels keep you at the low end, old buildings with D–E can push €300+ in winter.
    - **Transport:** Eindhoven is compact and bike-friendly — many people spend almost nothing on transport. If you cycle (buy second-hand bikes, ~€100–200 each) and only occasionally use the train, €100 covers it. A car would add €250–400+ (parking in Strijp-S isn't free).
    - **Groceries:** Albert Heijn is the priciest mainstream chain; Jumbo, Lidl, and Dirk are noticeably cheaper. Cooking at home, €500–550 is comfortable.
    - **Health insurance:** remember the €385/year deductible per person on top — that's why I put a buffer line in.
    - **One-off first-year costs** to budget separately: deposit (2 months = €3,300), furniture (furnished places aside, €1,500–3,000), bikes, Dutch course for Ana (€500–2,000 depending on format).

    **Against your income**

    At €58,000 gross (even without the 30% ruling), net is roughly **€3,300–3,400/month** (box 1 tax with general tax credit). That means the budget above is **tight to slightly over** on one salary — normal for the Netherlands in year one, and a common reason newcomers dip into savings initially. It improves materially if:

    - The 30% ruling comes through (adds roughly €700–900 net/month), or
    - Ana starts earning (even a part-time industry role at €2,500–3,000 gross changes the picture completely)

    So the honest summary: on one salary you'll manage but save little; the plan only gets comfortable once the ruling is sorted or Ana's income starts. Worth factoring into how hard you push HR on that salary threshold.
- user: |
    Do I need to exchange my Romanian driving licence?
  assistant: |
    Good news: **no, you don't need to exchange it right away.**

    **The rules for EU licences**

    Since Romania is in the EU, your Romanian driving licence remains valid in the Netherlands **until its normal expiry date** — you can keep driving on it as a resident, no action needed. This is different from non-EU licence holders, who must exchange within 185 days of registering.

    **When you *will* need to deal with it**

    1. **When it expires.** You can't renew a Romanian licence as a Dutch resident — renewal happens in the country of residence. So when the expiry approaches, you exchange it for a Dutch one at the gemeente Eindhoven. This is a straightforward administrative swap (no driving test for EU licences), requiring:
       - Your valid Romanian licence
       - BSN and a proof of registration (uittreksel BRP)
       - A photo (you can often have one taken at the gemeente)
       - A **gezondheidsverklaring** (self-declaration of medical fitness) from CBR — a short form, ~€40
       - Fee: roughly €50–60
       - Turnaround: about 2–4 weeks; you may get a temporary licence in the meantime
    2. **If you want to drive professionally** or need categories your Romanian licence doesn't cover — not relevant for you two, most likely.

    **Practical notes**

    - **Check the expiry date now.** If it expires within the next year or so, you might as well exchange soon after registering rather than doing it mid-move chaos later. If it's valid for years, forget about it.
    - **Ana's licence:** same rules apply to her.
    - **While it's valid, it's fully accepted** — car rental, insurance, police checks. No international driving permit needed.
    - One small thing: Dutch insurers and rental companies sometimes prefer a Dutch licence for administrative reasons, but it's not a legal requirement.

