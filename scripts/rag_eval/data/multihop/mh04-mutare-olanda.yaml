- user: |
    Our cat Mițu is coming with us. What do we need for her?
  assistant: |
    Good news: moving a cat within the EU is straightforward — no quarantine, no import permit. Here's what Mițu needs:

    **Legal requirements (EU pet travel rules)**

    1. **Microchip** — ISO 11784/11785 standard. If she doesn't have one yet, it must be implanted **before** the rabies vaccination (or the same day), otherwise the vaccination doesn't count.
    2. **Valid rabies vaccination** — given after the microchip, at least **21 days before travel**. If her rabies shot is current but predates the chip, it must be redone after chipping.
    3. **EU pet passport** — issued by your Romanian vet once the chip and vaccination are in order. This is her travel document; the vet records the chip number, vaccination, and validity dates in it.

    That's it for the legal side. Since you're travelling with her (or within 5 days of her arrival) and it's a non-commercial move of up to 5 pets, no health certificate is needed — the pet passport suffices.

    **The journey itself**

    - **How are you travelling?** If flying, book her into the cabin if possible (most airlines allow pets under ~8 kg including carrier in-cabin — book early, pet spots per flight are limited). She'll need an **IATA-compliant soft carrier**, and you'll pay a pet fee (~€50–150 per flight). If driving, it's easy — just a harness/carrier and regular stops.
    - **Don't sedate her** unless a vet strongly advises — it's generally discouraged for travel.
    - Get her used to the carrier weeks in advance (leave it open at home with treats inside).

    **After arrival**

    - **Register with a Dutch vet** (dierenarts) once you're settled — Eindhoven has plenty of practices; do it before you need one urgently.
    - **Update the chip registration** — her chip should be registered in a database (EuroPetNet/Chipdis or similar) with your Dutch address once you have it.
    - **No new vaccinations required** — the Dutch schedule matches Romania's for the basics. Your Dutch vet may suggest adjustments (e.g., different parasite prevention norms).
    - **Litter and food:** her usual brands (Whiskas, Purina, Royal Canin) are all available in Dutch pet shops and supermarkets, so no need to stockpile. Transition gradually anyway if you switch.
    - One cultural note: Dutch cats are typically kept **indoors** (buitenkat is a deliberate choice), partly due to busy roads and wildlife protection. In an apartment in Strijp-S, indoor life with a window perch (cat proofing the balcony is a thing — *kattenrasnet*) is the norm.

    **Timing checklist**

    - Microchip + rabies vaccine: **at least 4–5 weeks before travel** (to clear the 21-day window with margin)
    - Pet passport: same vet visit
    - Airline booking: as early as possible

    So the vet visit in Bucharest is the only real to-do — one appointment covers chip, vaccine, and passport.
