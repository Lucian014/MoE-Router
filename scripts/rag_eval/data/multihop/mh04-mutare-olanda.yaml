    Holders of an EU pharmacy diploma listed in Annex V of Directive 2005/36/EC are recognised automatically. Registration in the BIG register is required before practising. Applicants must demonstrate Dutch language proficiency at level B2 for professions with patient contact; the BIG register may ask for a language certificate.
