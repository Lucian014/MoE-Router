  assistant: |
    Iată rezumatul condițiilor băncii:

    **Credit pentru asociația de proprietari – condiții orientative**

    | Element | Condiție |
    |---|---|
    | **Valoare maximă** | 600.000 lei |
    | **Dobândă** | IRCC + 2,9% (variabilă) |
    | **Perioadă** | max. 10 ani |
