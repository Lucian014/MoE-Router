    Dacă doriți, pot adăuga locul ședinței (hol/scara bloc, sala de ședințe etc.) sau un rând despre eșalonarea pentru pensionari, dacă subiectul va fi discutat.
- user: |
    Dna. Marinescu a revenit, zice că sunt 9 apartamente cu pensionari care nu pot plăti cota deodată.
  assistant: |
    Situația celor 9 apartamente (≈20% din bloc) e relevantă și merită tratată înainte de ședința de pe 9 aprilie. Iată opțiunile concrete:

    **1. Eșalonare internă (cea mai simplă)**
    - Asociația acceptă plata în **rate lunare** direct la administrator (ex. 13.450 lei ÷ 12 luni ≈ 1.120 lei/lună, sau pe suprafață)
    - Nu implică bănci, fără dobânzi; necesită doar aprobarea în AGA și contracte/addendumuri scrise cu fiecare proprietar
    - Risc: dacă cineva nu plătește, asociația rămâne cu datoria – de aceea e bine să existe **angajament scris + termen limită**

    **2. Credit de consum / linie de credit prin bancă**
    - Se discută cu banca (cum s-a notat deja în procesul-verbal) – unele bănci oferă **credite de reabilitare energetică** cu dobânzi mici, inclusiv pentru pensionari, garantate cu fondul de reparații sau cu încasările programului
    - Dezavantaj: dobândă + comisioane, demers mai lent

    **3. Verificați facilitățile programului județean**
    - Multe programe permit **plata cotei proprietarilor în tranșe**, sincronizată cu avansurile lucrării – nu toți banii de la început
    - Merită un telefon la primărie/consiliu județean înainte de ședință

    **4. Soluție combinată (practică)**
    - Cota se plătește în **3 tranșe**: la semnarea contractului, la jumătatea lucrării, la recepție
    - Pensionarii cu venituri mici pot cere eșalonare suplimentară individuală

    **Recomandarea mea:** introduceți în ordinea de zi a ședinței de pe 9 aprilie un punct dedicat: *„Stabilirea modalității de plată a cotelor – eșalonare pentru pensionari"*, cu propunerea concretă de eșalonare internă în rate. Așa subiectul se decide cu vot, nu rămâne suspendat.

    Vă pot pregăti textul punctului pentru ordinea de zi sau un model de angajament de plată în rate pentru cei 9 apartamente.
