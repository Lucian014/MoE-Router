    - Rata estimată: **~145 lei/lună/apartament**, pe 10 ani

    **Observații importante:**
    1. **Dobânda e variabilă** (IRCC + marjă) – rata poate crește dacă IRCC urcă. Merită întrebată banca dacă există variantă cu dobândă fixă.
    2. **Garanția prin cesiunea cotelor de întreținere** înseamnă că banca se plătește prioritar din încasările asociației – dacă proprietarii întârzie la întreținere, banca tot încasează. E un risc administrativ pentru asociație, dar și o siguranță pentru bancă (de aici condiții mai blânde).
