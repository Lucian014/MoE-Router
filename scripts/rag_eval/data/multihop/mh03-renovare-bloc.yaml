    4. **Eșalonare pentru pensionari** (cerere dna. Marinescu, ap. 7) – în discuție cu banca.

    **Decizia:** Oferta ProTerm a fost aprobată cu **27 voturi pentru, 3 împotrivă, 1 abținere**, cu condiția obținerii unei **a doua oferte comparative**.

    **De reținut pentru următorii pași:**
    - Solicitarea unei oferte de la o a doua firmă (condiție obligatorie pentru validare);
    - Consultarea băncii privind eșalonarea pentru pensionari;
