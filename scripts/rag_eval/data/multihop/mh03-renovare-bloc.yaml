- user: |
    Dl. Costache insistă că problema lui e urgentă și nu poate aștepta lucrarea mare.
  assistant: |
    Situația dl. Costache e de înțeles – infiltrațiile de 2 ani pot agrava structura plăcii de la etajul 10. Iată opțiunile practice:

    **1. Reparație locală de urgență (recomandat)**
    - Se poate face o **hidroizolație provizorie/localizată** pe zona afectată (chituri, membrane aplicate local), cost redus (câteva mii de lei)
    - Nu înlocuiește hidroizolația completă, dar oprește agravarea până la începerea lucrării mari
    - Atenție: dacă firma care va face reabilitarea e deja aprobată (ProTerm), se poate negocia ca **avans de lucrări** – suma se scade apoi din contract

    **2. Consultați firma selectată**
    - Întrebați ProTerm dacă pot executa **hidroizolația terasei ca etapă separată, anticipat** – tehnic e posibil, mai ales că oricum face 20 cm de termoizolație pe terasă
    - Dacă acceptă, problema dl. Costache se rezolvă în câteva săptămâni, nu în 7-9 luni

    **3. Ce NU se recomandă**
    - Reparații făcute de o terță firmă fără coordonare – pot fi tăiate/refăcute la lucrarea mare = bani aruncați
    - Amânarea totală – infiltrațiile active iarna (îngheț-dezgheț) pot produce degradări structurale scumpe

    **Pași concreți:**
    1. Documentați starea actuală (poze, eventual un raport scurt) – util și pentru eventuale despăgubiri/asigurare
    2. Contactați ProTerm cu întrebarea despre execuție anticipată a hidroizolației
    3. Dacă răspunsul e negativ, convocați rapid o adunare (sau adunați semnături) pentru o mică alocare de urgență din fondul de reparații

    Vreți să vă redactez o adresă către ProTerm cu această solicitare?
