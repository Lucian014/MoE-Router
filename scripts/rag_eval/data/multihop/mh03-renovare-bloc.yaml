    5. Vot: 27 pentru, 3 împotrivă, 1 abținere – oferta ProTerm se aprobă cu condiția unei a doua oferte comparative.
    ```
  assistant: |
    Iată rezumatul procesului-verbal:

    **Ședința Adunării Generale – 12 martie**
    - **Prezență:** 31 din 44 de proprietari (cvorum asigurat).

    **Subiecte discutate:**
    1. **Oferta de reabilitare** (ProTerm Construct, ing. Dorin Vlase): 1.480.000 lei cu TVA, durată 7 luni; izolație de 10 cm vată bazaltică pe fațade și 20 cm pe terasă.
