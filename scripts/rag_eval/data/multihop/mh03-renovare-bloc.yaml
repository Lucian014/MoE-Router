    5. **Avantajul creditului:** banca îi avansează pe toți, asociația plătește firma la timp, iar cei 9 proprietari rambursează treptat – elimină riscul ca asociația să rămână cu datoria dacă cineva nu plătește.

    **Recomandare:** cereți băncii oferta oficială completă (cu DAE și comisioane) înainte de ședința de pe 9 aprilie, ca să o puteți compara corect cu eșalonarea internă și să supuneți ambele variante la vot.
- user: |
    Ce documente ne trebuie pentru dosarul de finanțare județeană?
  assistant: |
    Documentele cerute variază ușor de la un județ la altul, dar un dosar standard de finanțare pentru reabilitare termică prin programe județene conține de regulă următoarele:

    **1. Documente ale asociației**
    - Certificat de înregistrare al asociației (CUI, de la Registrul Asociațiilor de Proprietari)
    - Actul de identitate al administratorului + desemnarea lui (hotărâre AGA)
    - Statutul asociației
    - Procesele-verbale ale Adunărilor Generale relevante: **aprobarea lucrării, a finanțării, a cotelor de participare** (cu cvorum și voturi – de aceea ședința de pe 9 aprilie e importantă)

    **2. Documente ale clădirii**
    - Cartea funciară a clădirii (extras)
    - Certificat de atestare a dreptului de proprietate / HCL de predare a blocului către asociație
    - Certificat de urbanism (se solicită de la primărie)
    - Autorizație de construire (se obține după aprobarea finanțării, dar unele programe cer documentația depusă)

    **3. Documente tehnice**
    - **Audit energetic** – realizat de auditor energetic autorizat (obligatoriu, e baza programului)
    - Expertiză tehnică a clădirii (starea construcției – raportul expertului pe terasă e un plus aici)
    - **Documentația de autorizare a executării lucrărilor** (D.A.E.) – proiect tehnic + caiet de sarcini, întocmit de un proiectant autorizat
    - Ofertele comparative ale firmelor (aveți deja ProTerm și Izomax – păstrați-le ambele, dovedesc concurență)

    **4. Documente financiare**
    - Deviz general estimativ
    - Planul de finanțare: 60% județ / 40% proprietari, cu dovada sursei pentru cota proprie (decizia AGA privind eșalonarea/creditul)
    - Dovada existenței fondului de reparații / contului asociației (extras de cont)

    **5. Declarații**
    - Declarație pe proprie răspundere a administratorului
    - Eventual declarații ale proprietarilor privind acordul de participare cu cota proprie

    **Recomandări practice:**
    1. **Solicitați imediat metodologia oficială a programului județean** (consiliul județean sau primărie) – lista exactă și formularele diferă, iar unele programe au termene limită stricte și ordine de depunere
    2. **Auditul energetic și D.A.E. sunt cele mai lungi de obținut** (câteva săptămâni până la 1-2 luni) – demarați-le cât mai devreme, chiar dacă costă înainte de aprobarea finanțării
    3. Verificați dacă programul cere ca lucrarea să fie **la licitație publică** (Legea 98/2016) sau acceptă alegerea directă de către AGA – asta poate schimba modul în care ați selectat firma

    Vă pot pregăti o listă de verificare (checklist) cu coloană „obținut / în lucru / de obținut" pentru avizier sau pentru urmărirea dosarului.
