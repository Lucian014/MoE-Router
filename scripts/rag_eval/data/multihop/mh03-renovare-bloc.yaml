- user: |
    Cum se calculează cota fiecărui apartament, după suprafață sau egal?
  assistant: |
    Conform legislației românești în vigoare (Legea 196/2018 privind reabilitarea energetică a clădirilor de locuit), cheltuielile pentru lucrări de reabilitare termică se repartizează **proporțional cu suprafața utilă a fiecărui apartament**, nu egal.

    **Cum se calculează:**

    1. Se însumează suprafețele utile ale tuturor apartamentelor (ex. total 3.200 mp)
    2. Se calculează cota-parte a fiecărui apartament: suprafața apartamentului ÷ suprafața totală
    3. Cota-parte × suma de plată (40% din 1.480.000 = 592.000 lei)

    **Exemplu:**
    - Apartament de 60 mp: 60 ÷ 3.200 = 1,875% → 1,875% × 592.000 = **11.100 lei**
    - Apartament de 85 mp: 85 ÷ 3.200 = 2,656% → **15.723 lei**

    **De reținut:**
    - Se folosește **suprafața utilă** (din cartea funciară / actul de proprietate), nu cea construită
    - Spațiile comerciale sau alte unități ne locuibile (dacă există) intră în calcul cu suprafața lor
    - Estimarea de 13.450 lei/apartament din procesul-verbal era o **medie** (592.000 ÷ 44) – sumele reale vor fi mai mici la apartamentele mici și mai mari la cele mari
    - Repartizarea trebuie **aprobată în Adunarea Generală** și trecută în procesul-verbal, cu lista cotelor

    Vă pot pregăti un model de tabel cu coloane pentru suprafață, cotă-parte și sumă de plată, completabil cu datele din cartea funciară.
