- user: |
    Ce diferență e între vată bazaltică și polistiren grafitat, pe scurt?
  assistant: |
    Pe scurt:

    **Vată bazaltică (lână minerală bazaltică)**
    - **Rezistență la foc:** incombustibilă (clasa A1) – mare avantaj la blocuri înalte
    - **Permeabilă la vapori** – peretele „respiră", risc mai mic de condens și mucegai
    - **Dezavantaje:** mai scumpă, se poate umezi dacă e expusă la apă fără hidroizolație corectă

    **Polistiren grafitat (EPS)**
    - **Conductivitate termică mai bună** – izolează cu câțiva cm mai puțini (de aici 12 cm EPS ≈ eficiența a ~10 cm vată)
    - **Mai ieftin** și mai ușor de montat
    - **Dezavantaje:** combustibil (clasa E, cu întârziatori de flacără), nu e permeabil la vapori – necesită atenție la ventilația peretelui

    **Pe scurt:** vata e superioară la siguranță la incendiu și „respirația" clădirii; polistirenul grafitat e mai ieftin și izolează puțin mai eficient pe cm. Pentru un bloc P+10, mulți aleg vata bazaltică tocmai din motive de securitate la foc, deși costă mai mult.
