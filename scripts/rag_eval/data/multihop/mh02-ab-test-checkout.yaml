id: mh02-ab-test-checkout
category: math
lang: en
turns:
- user: |
    I'm analysing A/B tests for an e-commerce company. First one: we tested a one-page checkout ("Variant B") against the current three-step checkout. Here are the numbers after 14 days:

    ```
    variant   visitors   orders
    A         48,210     1,687
    B         47,955     1,822
    ```

    Is the difference in conversion rate significant?
  assistant: |
    Yes — the difference is statistically significant at the conventional 5% level.

    **The numbers**

    - A: 1,687 / 48,210 = **3.50%** conversion
    - B: 1,822 / 47,955 = **3.80%** conversion
    - Relative lift: **+8.6%** (+0.30 percentage points)

    **Two-proportion z-test**

    - Pooled conversion rate: p̂ = 3,509 / 96,165 = 3.649%
    - Standard error: √(p̂(1−p̂)(1/n_A + 1/n_B)) ≈ 0.00121
    - z = 0.0030 / 0.00121 ≈ **2.48**
    - Two-tailed p-value ≈ **0.013**

    So there's about a 1.3% chance of seeing a lift this large (or larger) if the checkouts actually performed identically. The 95% confidence interval for the difference is roughly **+0.06 to +0.54 pp**, which excludes zero.

    **Caveats worth checking before you ship it**

    1. **Peeking / test duration**: If you checked significance daily and stopped the moment it crossed 0.05, the effective error rate is inflated. If this was a fixed 14-day run, you're fine.
    2. **Segment the results**: One-page checkouts often help mobile users much more than desktop. If the lift is concentrated on mobile, that's a useful (and more robust) finding.
    3. **Guardrail metrics**: Check average order value, refund/cancellation rates, and payment errors. A faster checkout can sometimes pull in lower-intent orders.
    4. **Novelty effects** are less of a concern here since checkout is a one-time funnel, but a week or two of post-launch monitoring is still cheap insurance.

    Bottom line: B looks like a genuine winner, pending the guardrail checks.
- user: |
    My manager says we should have stopped it on day 4, when B was already ahead by 12%. Here's what the dashboard showed every day:

    ```
    day  A_conv  B_conv  p_value
    1    3.31%   3.92%   0.21
    2    3.40%   3.88%   0.09
    3    3.37%   3.81%   0.06
    4    3.36%   3.77%   0.04
    5    3.45%   3.71%   0.11
    6    3.49%   3.79%   0.07
    ```

    Was he right?
  assistant: |
    No — stopping on day 4 would have been a textbook case of **peeking**, and the dashboard itself shows why.

    **The problem with stopping at day 4**

    The p-value on day 4 (0.04) crossed the 0.05 threshold, so it *looks* significant. But look at what happens next: it bounces back to 0.11 on day 5 and 0.07 on day 6. That's exactly the pattern that makes peeking dangerous — if you stop the moment p < 0.05, you're systematically harvesting random early fluctuations, and your real false-positive rate balloons. With daily checks, the effective error rate can climb from 5% to 20–30% or more, depending on traffic and how long you're willing to wait.

    Intuition: over 14 days you get 14 chances to cross the threshold. Each crossing event is likely to happen during a random upward wiggle of B's conversion rate, so "first time p < 0.05" is a biased estimator of the true effect.

    **Does it matter here?**

    Practically, no — the test ran the full 14 days and ended at p ≈ 0.013, so the conclusion is valid. Your manager's *instinct* (B is winning) was right, but his *method* (stop when the dashboard says so) would have been wrong. If you'd stopped on day 4, you'd be reporting a result you couldn't trust, and it might have been a mirage — the day 5–6 bounce suggests the early lift was partly noise.

    **What to do going forward**

    1. **Fix the sample size / duration in advance** and don't look at significance until then (or look, but agree not to act).
    2. If you need the flexibility to stop early, use a proper **sequential testing** method: group-sequential boundaries (O'Brien-Fleming), an alpha-spending approach, or always-valid inference (e.g., mSPRT — tools like GrowthBook support this natively).
    3. Hide the p-value column from the daily dashboard, or replace it with a sequential-test statistic that's valid to monitor continuously.

    So: right conclusion, wrong reason. Worth a friendly conversation about process before the next test.
- user: |
    What's the difference between a one-sided and a two-sided test, and which one should we use?
  assistant: |
    **The difference**

    - **Two-sided test**: asks "is there *any* difference between A and B?" The alternative hypothesis is that B is either better or worse. You split your significance level (α = 5%) across both tails — 2.5% for "B is better" and 2.5% for "B is worse."
    - **One-sided test**: asks only "is B *better* than A?" All 5% of α goes into one tail, so it's easier to reach significance — but only in the direction you pre-committed to.

    For your checkout test, the two-sided p-value was 0.013. The one-sided p-value is exactly half: **0.0065**. Same data, different question.

    **Which should you use?**

    For A/B testing, use **two-sided**, for three reasons:

    1. **You rarely have a genuine directional prior strong enough to justify it.** A one-sided test is only legitimate if you'd have ignored a result in the opposite direction — and you wouldn't. If the one-page checkout had *hurt* conversion by 12%, you'd absolutely want to know and report that. A test that can't detect harm in the direction you care about is the wrong tool.

    2. **It's the industry and statistical software default.** Most A/B testing platforms (Optimizely, VWO, GrowthBook, Statsig) report two-sided p-values. Using one-sided numbers on a dashboard that others read as two-sided silently halves your p-values and inflates your false-positive rate.

    3. **Stakeholder trust.** "We used a one-sided test" sounds like we changed the rules to get significance — even when it's justified. Two-sided results are harder to argue with.

    **When one-sided *is* appropriate**

    - You genuinely only care about one direction and would ship nothing / ignore the result otherwise (e.g., a non-inferiority check: "is the cheaper vendor at least as good?").
    - It's declared *before* the test runs, not chosen after seeing the data.

    **Practical note**: the choice matters much less than the peeking issue we discussed. A one-sided vs. two-sided decision shifts your p-value by a factor of 2; peeking can inflate your false-positive rate by 5x. If you fix only one process issue, fix the peeking — and default to two-sided for everything else.
- user: |
    Second test, owned by Ioana from the growth team: free shipping threshold lowered from 200 to 150 lei. She reports that average order value went DOWN, from 231 to 219 lei, and wants to roll it back.
  assistant: |
    Hold on — a drop in AOV is *expected* here, and by itself it's not a reason to roll back. The question isn't "did AOV go down?" but "did **profit per visitor** go up or down?"

    **Why AOV almost had to fall**

    Lowering the threshold changes two behaviors at once:

    1. **More people qualify for free shipping** → conversion goes up, and the *new* orders are disproportionately small ones (people who were at 120–199 lei and previously paid shipping). Small orders dilute the average.
    2. **Some people stop padding their cart** → customers who used to add an extra item to cross 200 lei now stop at 155 lei.

    Both effects push AOV down *mechanically*. A stable-or-lower AOV is the predicted outcome of this test, not a red flag. Judging it on AOV alone is like judging the checkout test on time-to-purchase and ignoring conversion.

    **What to actually measure**

    The metric that captures the full trade-off is **revenue per visitor** (or better, **contribution margin per visitor**):

    - RPV = conversion rate × AOV
    - Old: suppose CR was 3.5% → 0.035 × 231 = **8.09 lei/visitor**
    - New: if conversion rose to, say, 4.0% → 0.040 × 219 = **8.76 lei/visitor** — a win despite the AOV drop

    Ask Ioana for the conversion rates from both arms. If conversion rose enough to offset the AOV decline, the test is positive. If RPV fell, *then* rollback is on the table.

    **Also check, before deciding:**

    1. **Margin, not just revenue.** Free shipping on a 155 lei order costs you the same as on a 155 lei order that used to pay shipping — but you've lost the shipping fee revenue. Compute profit per visitor including shipping costs and product margin. Thin-margin orders that only exist because of the threshold can be unprofitable.
    2. **Statistical significance of the AOV drop.** AOV distributions are heavy-tailed; a 12 lei difference may or may not be significant. Use a t-test or bootstrap — and note the peeking rules apply here too.
    3. **Segment by order size.** Did big-basket shoppers change behavior, or is the whole effect from small orders joining? That tells you whether you could tune the threshold (e.g., 175 lei) to keep the conversion lift while limiting margin erosion.
    4. **Test duration and seasonality** — same standards as the checkout test: pre-registered duration, no peeking.

    **Bottom line**: don't roll back yet. Get conversion rates and margin data from Ioana, compute profit per visitor, and make the call on that. If the growth team's goal was more orders and the economics hold, this may be a win wearing an AOV decline as a disguise.
- user: |
    I split her data by customer type:

    ```
    segment      variant  orders  avg_order_value
    new          control  1,240   176
    new          test     2,010   171
    returning    control  2,860   255
    returning    test     2,190   259
    ```

    What's going on here?
  assistant: |
    Now the picture changes completely — two separate things are going on, and one of them is a genuine red flag.

    **1. The AOV drop is a mix effect, not a behavior change (Simpson's paradox in action)**

    Within each segment, AOV barely moved:

    - New: 176 → 171 (−5 lei)
    - Returning: 255 → 259 (+4 lei)

    But the *composition* shifted: new customers (low AOV) went from 30% of orders to 48%. Since the overall average blends the two, overall AOV fell from 231 to ~219 even though almost no individual customer spent less per order. Ioana's rollback argument mostly evaporates — the AOV "decline" is arithmetic, not behavior.

    **2. The real problem: returning customers' orders dropped 23%**

    - New: 1,240 → 2,010 (**+62%**) — the lower threshold clearly unlocked first-time buyers with smaller baskets. Great.
    - Returning: 2,860 → 2,190 (**−23%**) — this is hard to explain behaviorally. Lowering a threshold from 200 to 150 makes free shipping *easier* to reach; there's no good reason existing customers would order less.

    Before interpreting this as a real effect, check for **Sample Ratio Mismatch (SRM)**:

    1. **Visitor counts by segment × variant.** You've shown orders, but if the test arm happened to receive fewer *returning visitors* (bad randomization, redirect lag, a targeting rule that skewed allocation), the order drop is mechanical, not behavioral. Compute orders-per-visitor per cell.
    2. **Instrumentation.** Did returning customers in the test arm get tracked correctly? A 23% drop is the size of a bug, not a nudge.
    3. **Experience differences.** Did test-arm returning customers lose something — e.g., the test replaced an existing loyalty perk, or promo codes stopped stacking with the new threshold?

    **If the data is clean**, the story is: the new threshold is a strong acquisition lever (new customers +62%) but somehow suppresses returning-customer purchases — perhaps they now place smaller, more frequent orders instead of consolidating (check order frequency, not just order counts), or margin per returning order changed.

    **What to bring to Ioana:**

    - The rollback decision should be based on **profit per visitor, per segment**, not overall AOV.
    - The new-customer lift has long-term value (LTV of acquired customers) that a 14-day window doesn't capture — a slight revenue dip on returning customers could still be net-positive if acquisition is the goal.
    - But first: verify the returning-customer drop is real. If SRM checks fail, the test results are invalid and you may need to re-run.

    The headline finding: her AOV metric was hiding that this test is a big win with new customers and a possible problem with returning ones — two different decisions, not one.
- user: |
    How do I compute a confidence interval for a difference in means when the data is very skewed?
  assistant: |
    Good question — and it's exactly the right worry for AOV data, which is typically right-skewed with a heavy tail (a few 5,000-lei baskets drag the mean around).

    **First: the plain t-interval is more robust than people think**

    The Welch t-interval for the difference in means relies on the CLT, not normality of the data. With your sample sizes (thousands of orders per arm), it's usually fine even for quite skewed data. The failure mode is small samples + heavy tails, not large samples + skew. A quick sanity check: compute the t-interval and a bootstrap interval; if they roughly agree, stop worrying.

    **Option 1: Bootstrap (my default recommendation)**

    Resample each group independently with replacement, compute the difference in means each time, take percentiles:

    ```python
    import numpy as np

    rng = np.random.default_rng(42)

    def boot_ci_diff_means(x, y, n_boot=10_000, alpha=0.05):
        diffs = np.empty(n_boot)
        for i in range(n_boot):
            rx = rng.choice(x, size=len(x), replace=True)
            ry = rng.choice(y, size=len(y), replace=True)
            diffs[i] = ry.mean() - rx.mean()
        lo, hi = np.percentile(diffs, [100*alpha/2, 100*(1-alpha/2)])
        return lo, hi
    ```

    For better small-sample accuracy, use the **BCa** interval (`scipy.stats.bootstrap` with `method='BCa'`, or the `arch` / `bootstrap` packages) rather than the plain percentile method.

    One caveat: bootstrapping the *mean* of heavy-tailed data inherits the mean's instability — with extreme outliers (e.g., one 50,000-lei order), bootstrap intervals can be erratic. Check max values and consider whether outliers are even real (fraud, B2B bulk orders, data errors).

    **Option 2: Trimmed means / Yuen's test**

    Compare means of the middle 80–90% of the distribution (trim the tails). This is much more robust to outliers and heavy tails, and `scipy.stats.ttest_ind(..., trim=...)` implements Yuen's test directly. The trade-off: you're no longer estimating the difference in true means, but in trimmed means — fine for decisions, but be precise about what you report.

    **Option 3: Transform, test, back-transform**

    Log-transform AOV, compute the CI for the difference in log-means, and exponentiate. You then get a CI for the *ratio of geometric means*, not the difference in arithmetic means — a different (and often more decision-relevant) quantity, but don't present it as a difference in means.

    **Option 4: If n is small, go nonparametric**

    Mann-Whitney U on the raw data tests stochastic dominance, not the difference in means — useful as a robustness check, but it answers a different question.

    **Practical recipe for your AOV comparisons**

    1. Plot the distributions first (histograms + a few quantiles per arm).
    2. Compute Welch's t-interval as the baseline.
    3. Confirm with a BCa bootstrap.
    4. If they disagree, or outliers dominate, switch to trimmed means (Yuen) and say so explicitly in the writeup.

    One last note: for the *decision* (roll back the shipping threshold or not), what matters is profit per visitor — which is per-*visitor*, not per-*order*, and is often much better behaved than AOV because averaging over visitors smooths the heavy tail. That's another reason to prefer RPV as the primary metric.
- user: |
    What sample size do I need to detect a 0.3 percentage point lift on a 3.5% baseline, with 80% power?
  assistant: |
    **Short answer: about 61,000–62,000 visitors per arm, so ~123,000 total.**

    **The calculation**

    For a two-sided test at α = 0.05, power = 80%, baseline p₁ = 0.035, expected p₂ = 0.038 (Δ = 0.003):

    $$n_{\text{per arm}} = \frac{\left(z_{\alpha/2}\sqrt{2\bar{p}\bar{q}} + z_\beta\sqrt{p_1q_1 + p_2q_2}\right)^2}{\Delta^2}$$

    with p̄ = 0.0365, z_{α/2} = 1.96, z_β = 0.8416. Plugging in:

    - Numerator: (1.96 × 0.2652 + 0.8416 × 0.2652)² = (0.743)² ≈ 0.552
    - n = 0.552 / 0.003² ≈ **61,300 per arm**

    **In Python:**

    ```python
    from statsmodels.stats.power import NormalIndPower
    from statsmodels.stats.proportion import proportion_effectsize

    effect = proportion_effectsize(0.038, 0.035)   # Cohen's h
    n = NormalIndPower().solve_power(
        effect_size=effect, alpha=0.05, power=0.80,
        ratio=1, alternative='two-sided'
    )
    # ≈ 61,900 per arm
    ```

    **The uncomfortable implication for your checkout test**

    You had ~48,000 per arm. At that sample size, the power to detect a 0.3 pp lift is only about **40–45%**. In other words, even if the one-page checkout really does give +0.3 pp, a test this size misses it more often than not. Your p = 0.013 result is valid, but it's worth knowing the test was underpowered for the effect size you cared about — that's partly why it took the full 14 days and why the daily p-values were so jumpy.

    **Practical notes**

    1. **Pick the MDE before the test, not after.** The 0.3 pp should be the smallest lift that's *worth implementing* — powering for anything smaller wastes traffic; anything larger risks shipping on noise.
    2. **If you use sequential testing** (which we discussed re: peeking), inflate the sample size ~10–20% to compensate for the spending of alpha over interim looks.
    3. **Runtime**: at your traffic rate (~3,400 visitors/arm/day per the first test), 62k per arm means roughly **18 days**. If that's too slow, your options are: accept a larger MDE, use a one-sided test (if genuinely justified), or reduce variance with a better metric (e.g., RPV with pre-test covariates — CUPED — which can cut required sample size by 20–40%).
    4. **Unequal allocation is fine** if needed: `ratio` in the code above handles it, though equal arms maximize power for a fixed total.

    Rule of thumb to sanity-check: near small conversion rates, required n per arm ≈ 16 × p̄(1−p̄) / Δ² — here 16 × 0.0365 × 0.9635 / 0.000009 ≈ 62,600. Close enough for back-of-envelope planning.
- user: |
    The third test is about product recommendations on the cart page. The PM, Mihai, says the new algorithm increased clicks on recommendations by 40%.
  assistant: |
    Mihai's metric is a **proxy metric**, and the 40% number by itself doesn't tell you whether the test won. Clicks on recommendations measure engagement with the feature, not value to the business. The chain you actually care about is:

    **click → add-to-cart from recommendation → purchase → revenue/profit**

    A 40% click lift could mean anything from "genuinely better recommendations" to "we made the widget bigger and shinier."

    **Questions to ask Mihai, in order:**

    1. **What happened downstream?** Did revenue per visitor, AOV, or attach rate (share of orders containing a recommended item) move? If clicks went up 40% and RPV didn't move, users are clicking and bouncing — the algorithm is generating curiosity, not sales. If RPV moved, *that's* the headline number, not clicks.
    2. **Was the change purely the algorithm, or also the UI?** If the new version also changed layout, size, position, or number of recommendations shown, the click lift is confounded. You'd be shipping "more prominent widget," not "better algorithm." Check the test design.
    3. **Is 40% even significant?** Clicks-per-visitor is a ratio metric (clicks / visitors), often overdispersed. Ask for the per-visitor analysis with a proper test — and whether the peeking rules were followed. A 40% lift on a low-base metric can still be noise if traffic was small.
    4. **Novelty effect.** Anything new on a page gets clicked more for the first week or two. If the test ran <2–3 weeks, part of that 40% is "it's new," not "it's better." Check whether the lift is decaying day over day.
    5. **Cannibalization.** Recommendations can shift *which* products people buy (toward popular items the algorithm favors) without changing *how much* they buy. Check whether overall conversion and category mix changed, not just recommendation clicks.

    **The structural issue**

    This is the same pattern as Ioana's test: a team reporting the metric that flatters their work. Clicks are the metric the recommendations team directly controls; RPV is the metric the company cares about. Neither Mihai nor Ioana is necessarily gaming it — people gravitate to the metric nearest their lever — but your job as the analyst is to insist on the **primary metric being a business outcome** (RPV or profit per visitor), with clicks as a secondary/diagnostic metric.

    **Practical suggestion**: ask Mihai for the full funnel table — visitors, recommendation clickers, recommendation-driven add-to-carts, recommendation-attributed orders, and RPV, per arm. If clicks rose 40% but the click→purchase rate collapsed, you'll see it immediately, and you'll have a much more interesting conversation than "40% more clicks."
- user: |
    I looked at the event logs and something is off:

    ```
    variant   sessions  rec_impressions  rec_clicks  sessions_with_click  orders
    control   61,420    184,260          5,527       4,912               2,149
    test      60,980    365,880          7,742       4,958               2,131
    ```

    The test variant shows 6 recommendations instead of 3.
  assistant: |
    This table dismantles the 40% claim. Look at the numbers carefully:

    **1. The click lift is purely mechanical — more slots, more clicks**

    The test shows **6 recommendations instead of 3**, so impressions doubled (184k → 366k). Clicks went up 40% (5,527 → 7,742) — *less than* proportionally. Click-through **per impression** actually fell:

    - Control: 5,527 / 184,260 = **3.00%**
    - Test: 7,742 / 365,880 = **2.12%**

    The new setup is *worse* at generating clicks per item shown. The total went up only because there were twice as many items to click. This is the classic "more slots = more engagement" illusion.

    **2. The human-level metric is flat**

    Sessions with at least one click: 4,912 → 4,958 (**+0.9%**, almost certainly not significant). The same ~8% of sessions engage with recommendations in both arms. No individual user is more interested in recommendations than before — the widget just offers more things to click per person.

    **3. Downstream: nothing**

    Orders: 2,149 → 2,131 (**−0.8%**). Conversion per session: 3.50% → 3.49%. Whatever the new algorithm is doing, it isn't producing more purchases. If anything, doubling the recommendation real estate on the cart page slightly *hurt* — possibly distracting users from checkout.

    **What this means**

    - Mihai's 40% was **impressions × slots**, not algorithm quality. The test is confounded by design: algorithm + layout changed together, and the layout change alone explains the entire click lift.
    - The honest summary: "We doubled the number of recommendations shown, got the same number of engaged users, a lower click-through rate per item, and no change in orders."
    - There may still be a real algorithm improvement hiding in here — but this test can't detect it. To measure the algorithm fairly, you'd need to hold the number of slots constant (3 vs. 3, or 6 vs. 6) and change only the ranking.

    **Recommendation to bring to Mihai:**

    1. Don't ship on this result — there's no evidence of benefit, and a hint of conversion dilution.
    2. Re-run with slots held constant so the algorithm is the only variable.
    3. Pre-register the primary metric as **orders per session** or **RPV** (recommendation-attributed revenue as secondary), with clicks-per-*engaged-session* as a diagnostic — not total clicks, which any UI change can inflate for free.

    One more diagnostic worth pulling: revenue *per recommendation click* in each arm. If the test arm's clicks convert worse (people clicking through a longer list of less relevant items), that's direct evidence the ranking quality dropped when the algorithm had to fill six slots instead of three.
- user: |
    Explain the difference between Bayesian and frequentist A/B testing in simple words.
  assistant: |
    **The core difference in one sentence**: frequentists ask "how surprising is this data if there's no real difference?" while Bayesians ask "given this data, what's the probability B is better?"

    **Frequentist (what you've been doing)**

    - You compute a **p-value**: the probability of seeing a lift this big or bigger *if A and B were actually identical*.
    - The conclusion is framed around the data: "the data would be unlikely under no difference."
    - You can **never** say "there's a 95% chance B is better" — that sentence is meaningless in this framework, even though stakeholders say it constantly.
    - Decisions are controlled by pre-set rules: α = 5%, fixed sample size, no peeking (as we saw with the day-4 stop).

    **Bayesian**

    - You start with a **prior** (what you believed before the test — e.g., "most checkout changes do nothing, some help a little") and update it with the data to get a **posterior** distribution.
    - From the posterior you can say directly: "**There's a 96% probability B is better than A**, and there's a 90% chance the lift is at least 0.1 pp."
    - You can also compute **expected loss**: "if we ship B and it's actually worse, we expect to lose 0.05 pp." That's often the most decision-useful number of all.
    - No fixed sample size required — you can check the results every day and stop whenever the probability of B being better is high enough. **Peeking is not a sin** in Bayesian testing; the framework handles it naturally.

    **Simple analogy**

    Frequentist: a courtroom — "innocent until proven guilty beyond reasonable doubt." The p-value is the strength of evidence against innocence. You can't convict on 90% certainty; you need the pre-agreed threshold.

    Bayesian: a doctor — "based on the test results and everything else I know, I'm 96% sure it's X, so let's treat for X." Beliefs get updated continuously; there's no sacred threshold, just a decision about whether you're confident enough to act.

    **Practical trade-offs for your team**

    | | Frequentist | Bayesian |
    |---|---|---|
    | What you report | p-value, CI | P(B better), credible interval, expected loss |
    | Stopping rule | Fixed (or sequential corrections) | Flexible — monitor anytime |
    | Misunderstanding risk | High (p-values are misread constantly — even by your manager on day 4) | Lower ("96% chance B wins" is intuitive) |
    | Prior needed | No | Yes (can be weak/neutral) |
    | Tooling | statsmodels, any platform | GrowthBook, VWO, Statsig, PyMC |

    **My take for your situation**: the biggest problem in your team isn't the statistical philosophy — it's that p-values get misinterpreted (stopping at p < 0.05 on day 4, celebrating proxy metrics). Bayesian outputs are harder to misuse because "96% chance B is better" means what people think it means. If your organization would benefit from plain-language, decision-oriented numbers and the freedom to monitor tests continuously, Bayesian is worth adopting. If you keep frequentist, the discipline (pre-registered duration, fixed α) has to come from process instead.

    Either way, the metrics matter more than the math: no framework rescues a test whose primary metric is clicks or AOV.
- user: |
    How should I correct for testing several metrics at once?
  assistant: |
    **The short answer for A/B testing**: don't blanket-correct everything — instead, designate **one primary metric** before the test, and treat the rest as secondary or guardrail metrics with different rules. Full-blown corrections across all metrics are usually the wrong tool here.

    **Why it matters**

    If you test 10 metrics at α = 0.05 and they're all truly null, there's a ~40% chance at least one shows "significance" by luck. That's the multiple comparisons problem. But correcting all 10 to α = 0.005 throws away most of your power and punishes you for measuring things — which is exactly what a good test should do.

    **The standard A/B testing hierarchy**

    1. **One primary metric** (decided *before* the test): the single number that determines ship/no-ship. Test at α = 0.05, no correction — because there's only one decision.
    2. **Guardrail metrics** (a small, fixed set — 3 to 5): things that must not get worse (latency, error rate, refund rate, AOV for Ioana's test). Test each at a stricter level, e.g., α = 0.01, or use a simple correction across just these.
    3. **Diagnostic/secondary metrics** (everything else): used to build the story and generate hypotheses, but explicitly *not* for ship decisions. No formal thresholds — you expect some noise among them and that's fine.

    The discipline that replaces the math is the **pre-registration**: write down which metric is which before looking at results. Then "we found a significant lift in clicks" can't quietly become the headline when the primary metric was flat (Mihai's test, exactly).

    **If you do want formal corrections**

    - **Bonferroni**: divide α by the number of tests (α = 0.05/10 = 0.005 each). Simple, valid, conservative — fine for a handful of guardrails, wasteful for many metrics.
    - **Holm–Bonferroni**: step-down version — sort p-values, compare the smallest to α/k, next to α/(k−1), etc. Strictly more powerful than Bonferroni, still controls family-wise error. Good default for guardrail sets.
    - **Benjamini–Hochberg**: controls the *false discovery rate* instead — among the metrics you call significant, expect ~5% to be false. Much more powerful when testing many metrics (dozens+), standard in exploratory work. Too loose for a single ship decision.

    ```python
    from statsmodels.stats.multitest import multipletests

    # p-values from your 5 guardrail metrics
    reject, p_adj, _, _ = multipletests(pvals, alpha=0.05, method='holm')
    ```

    **Two subtleties**

    1. **Metrics are correlated.** Conversion, orders, and RPV move together, so they're not 10 independent chances to fool you — Bonferroni is extra conservative on correlated metrics. Another reason the primary-metric approach beats mechanical correction.
    2. **The same problem exists across tests, not just metrics.** Your team is running multiple *tests* (checkout, shipping threshold, recommendations). If each ships at α = 0.05, some wins will be false across the portfolio. This is an argument for Bayesian expected-loss framing or for tracking long-term win rates — not for making every individual test harder to pass.

    **Bottom line**: pre-register one primary metric per test, protect a few guardrails with Holm, and let diagnostics be diagnostics. The correction problem is mostly a symptom of deciding after the fact which metric to believe — fix that, and the statistics become simple.
