- user: |
    What is a sample ratio mismatch and how do I check for it?
  assistant: |
    **What it is**

    A Sample Ratio Mismatch is when your experiment's actual traffic split deviates from the intended split, beyond what random chance allows. If you assigned 50/50 and ended up with 48,210 vs. 47,955, that's fine. If you ended up with 48,210 vs. 41,000, something is broken — and worse, **the whole experiment is invalid**, even if the p-value looks great.

    **Why it's so dangerous**

    Randomization is the foundation of A/B testing: it guarantees (in expectation) that both arms are comparable on everything — user type, device, intent, seasonality. SRM means randomization failed somewhere, so the arms may differ systematically in ways that bias your metric. A 60/40 split can easily produce a fake "significant" lift. And SRM is insidious because the results still *look* normal — the p-value machinery doesn't know anything is wrong.

    **How to check: a chi-square goodness-of-fit test**

    Compare observed counts against expected counts under the planned ratio:

    ```python
    from scipy.stats import chisquare

    # intended 50/50, observed visitors
    observed = [45110, 45005]
    expected_ratio = [0.5, 0.5]

    total = sum(observed)
    expected = [total * r for r in expected_ratio]

    chi2, p = chisquare(observed, f_exp=expected)
    # p ≈ 0.72 → no mismatch
    ```

    - **p < 0.001** (not 0.05!) → declare SRM. Use a very strict threshold because with ~100k visitors you have high power, and you'd rather investigate a few false alarms than miss a real one.
    - **p ≥ 0.001** → pass, proceed with analysis.

    For your checkout test: 45,110 vs. 45,005 against a 50/50 plan gives p ≈ 0.72 — healthy. For Ioana's test, the segment table hinted at a possible issue: new customers went 1,240 vs. 2,010 orders. That's not itself SRM (orders ≠ visitors), but it's exactly the kind of asymmetry that made me say "check visitor counts by segment × variant" — if *returning visitors* were split 55/45 when they should be 50/50, her returning-customer order drop could be an artifact.

    **Common causes (what to look for when the check fails)**

    1. **Bots / crawler filtering applied differently** — e.g., a filter that removes traffic from one arm only.
    2. **Redirect latency** — if one arm loads via a slow redirect, users (and bots) abandon before being counted.
    3. **Instrumentation bugs** — one arm's tracking pixel blocked, an ad blocker pattern hitting one variant's URL, duplicate event firing.
    4. **Assignment bugs** — hashing errors, sticky sessions re-randomized, cache serving one variant more.
    5. **Uneven ramp-out** — one arm throttled for capacity or safety reasons.
    6. **Triggering/eligibility differences** — users qualify for the experiment at different rates by arm (e.g., the feature itself changes who reaches the analysis point). This is the subtle one: check SRM on *triggered* users, and make sure the trigger event isn't affected by the treatment.

    **Practical rules for your team**

    1. **Run the SRM check before looking at any metric** — make it the first line of every test report. Many platforms (GrowthBook, Statsig, Eppo) do it automatically and flag it.
    2. **Check it at every level you'll analyze**: overall, and by segment, device, and day. A test can pass overall and fail within a segment (that's the Ioana scenario).
    3. **If SRM fires, don't just re-randomize and move on** — find the root cause. The bias that caused the mismatch usually also biases the metrics.
    4. **Never "fix" SRM by reweighting** the arms to the planned ratio — that doesn't restore randomization; it just hides the symptom.

    One-line summary: SRM is when the arms didn't get the traffic split you designed, it invalidates the experiment regardless of how good the results look, and it's caught with a trivial chi-square test that should be step one of every analysis.
- user: |
    In one of our tests the split came out like this: 50,812 in control, 48,394 in test, with a 50/50 configuration. Is that a problem?
  assistant: |
    **Yes — that's a clear SRM. Do not trust this test's results until you find the cause.**

    **The check**

    - Total: 50,812 + 48,394 = 99,206
    - Expected under 50/50: 49,603 per arm
    - Observed split: **51.2% / 48.8%** (a gap of 1,209 visitors)

    ```python
    from scipy.stats import chisquare

    chi2, p = chisquare([50812, 48394], f_exp=[49603, 49603])
    # chi2 ≈ 58.9, p ≈ 2e-14
    ```

    p ≈ 2×10⁻¹⁴ — astronomically below the 0.001 threshold. With ~99k visitors, a 51.2/48.8 split should happen by chance roughly once in a quadrillion experiments. This is not bad luck; something is systematically diverting traffic.

    **Why it matters even though the split "looks" close**

    1.2% might seem trivial, but the size of the mismatch isn't the issue — the *cause* is. Whatever mechanism removed or redirected ~1,200 visitors from the test arm almost certainly didn't remove them at random. If, say, a redirect lag or a tracking bug disproportionately dropped slow devices or a specific browser from the test arm, your comparison is biased in ways that can easily swamp a small true effect. The mismatch is a symptom; the bias is the disease.

    **How to investigate**

    1. **Break the counts down** — by day, device, browser, country, logged-in status. The dimension where the imbalance concentrates points at the cause:
       - Imbalance appears on day 1 only → deployment/ramp issue.
       - Concentrated in one browser → redirect or rendering bug in that browser.
       - Concentrated in bots/crawlers → differential bot filtering.
       - Grows steadily over time → cache or cookie-related assignment drift.
    2. **Check the assignment mechanism**: hashing function, bucketing logic, sticky sessions, any server-side throttling or kill switches that fired mid-test.
    3. **Check for redirect latency** on the test arm — the classic cause of test-arm undercounting.
    4. **Check event loss**: compare pageview counts vs. assignment counts per arm; if the test arm loses more events between assignment and measurement, it's instrumentation.

    **What to do with the test**

    - **Don't ship based on it**, even if the result was significant and favorable. A biased experiment can "prove" anything.
    - **Don't reweight** the arms to 50/50 and recompute — that fixes the counts, not the randomization.
    - If the root cause turns out to be *benign and random* (rare, but it happens — e.g., a one-time crash that dropped a random subset of sessions), you can sometimes salvage the test with a documented justification. That call should be explicit and written down, not implicit.
    - Most likely outcome: **fix the bug and re-run.** Annoying, but far cheaper than shipping on a false positive — or killing a genuinely good idea because the broken test showed a false negative.

    **Process fix**: make the SRM chi-square the *first* row of every test report, before any metric is shown. It takes one line of code and would have caught this before anyone spent time interpreting the results.
- user: |
    The engineers say the redirect to the test page fails on old Android browsers, those users silently land back on control.
  assistant: |
    That's the worst-case version of SRM — not just missing traffic, but **misassigned traffic**. Here's why this is more serious than users simply dropping out:

    **The bias mechanism**

    The failed redirect doesn't remove old-Android users from the experiment — it **moves them into control**. So:

    - **Test arm**: undercounts old-Android users → test results reflect only modern browsers.
    - **Control arm**: overcounts old-Android users → control's conversion rate is dragged by a device mix that test no longer has.

    If old-Android users convert differently (they almost always convert *worse* — older devices, slower pages, lower income demographics in many markets), control's conversion is artificially deflated. That means the test **looks better than it is**: any measured lift is inflated by a device-mix difference, not by the treatment.

    Direction of bias: if old-Android users convert below average, your measured lift is **overstated**. If they convert above average, it's understated. Either way, the comparison is invalid — you're no longer comparing treatment vs. control, you're comparing "modern browsers + treatment" vs. "everything."

    **How to quantify the damage**

    1. Get the old-Android share of traffic (check analytics: often 5–15% in e-commerce, higher in some markets).
    2. Compute conversion by device class. If old-Android converts at, say, 2% vs. 4% overall, and they're ~8% of traffic, control's blended rate is depressed by roughly 0.16 pp — which is on the same order as the lifts you've been detecting (0.3 pp). This bias can manufacture or destroy a "significant" result entirely.
    3. Sanity check: does the measured lift shrink when you restrict the analysis to modern browsers only?

    **Can you salvage the test?**

    Only if you can cleanly identify and exclude the affected population:

    - **Restrict the analysis to non-old-Android browsers** in both arms. This is valid *only if* the redirect failure is strictly determined by browser version (deterministic, observable, and identical in both arms' eligibility). Then both arms are comparable within the restricted population — it's effectively a redefined experiment.
    - You must also confirm the exclusion rule is precise: which exact browser versions failed? Was it consistent across the whole test period? Any users on the boundary?
    - Document this as a post-hoc analysis decision — it was driven by a discovered bug, so it should be labeled as such in the writeup, ideally with a pre-registered-style justification of the exclusion criteria *before* looking at the treatment effect in the restricted set.

    If the failure was flaky (partial, time-varying, or entangled with network conditions), you **cannot** cleanly separate affected from unaffected users — re-run the test.

    **The re-run checklist**

    1. Fix the redirect — ideally eliminate it: serve the test experience server-side or via same-page rendering instead of a redirect. Redirects cost you conversions *and* create exactly this failure mode.
    2. Add an SRM check per device/browser segment as a daily guardrail, not just overall.
    3. Add a **redirect-success monitor**: log redirect attempts vs. completions per browser, alert on any gap.
    4. Re-run the full test duration on the fixed setup. Don't reuse the old data.

    **One more thing**: this bug also means your *current* production experience may be losing conversions — if the redirect fails for old-Android users today, some intended-test users are getting a broken journey. Worth checking whether the failure mode has any user-visible cost (extra load time, flicker) even when it "succeeds," since redirect-based testing infrastructure silently taxes the test arm in every experiment you run with it.

    Bottom line: the engineers found the root cause, but the test's results are untrustworthy — the bias runs in the direction of inflating the test arm's apparent performance. Salvage only via a documented, browser-restricted analysis if the failure was strictly deterministic; otherwise fix and re-run.
- user: |
    Write a short checklist for the analysts on what to check before reporting any test result.
  assistant: |
    **Pre-Reporting Checklist for A/B Test Results**

    **1. Test design (before looking at any metric)**
    - [ ] Primary metric pre-registered (one metric decides ship/no-ship)
    - [ ] Guardrail metrics defined (3–5, e.g., AOV, refund rate, latency)
    - [ ] Planned sample size / duration met — no early stopping on a dashboard glance
    - [ ] Randomization unit and analysis unit match (user vs. session vs. order)

    **2. Data validity**
    - [ ] **SRM check passed** — chi-square on visitor counts vs. planned split, threshold p < 0.001 (overall *and* by device, browser, segment, day)
    - [ ] Bot filtering applied consistently to both arms; bot rate balanced across arms
    - [ ] No instrumentation gaps: assignment events vs. pageviews vs. orders reconcile per arm
    - [ ] Test period free of known incidents (deploys, outages, sales, tracking bugs)

    **3. Statistical checks**
    - [ ] Correct test for the metric (proportions z-test, Welch t / bootstrap for means, sequential method if interim looks were made)
    - [ ] Two-sided by default; one-sided only if pre-declared and justified
    - [ ] Multiple metrics: primary at α = 0.05, guardrails corrected (Holm); diagnostics labeled as such
    - [ ] Segment analyses: check for Simpson's paradox — overall effect consistent with segments
    - [ ] Effect size reported with CI, not just p-value

    **4. Interpretation**
    - [ ] Metric is a business outcome (RPV, profit per visitor), not a proxy (clicks, impressions)
    - [ ] Mechanical effects accounted for (more slots, lower thresholds, mix shifts)
    - [ ] Novelty effect considered (lift stable over time, not decaying?)
    - [ ] Guardrails not violated (no significant harm on any guardrail metric)
    - [ ] Absolute numbers updated for data corrections (bots removed, etc.)

    **5. Reporting**
    - [ ] SRM result stated first, before any metric
    - [ ] Report: lift with CI, p-value (or P(B better)), sample sizes, test duration, cleaned conversion rates
    - [ ] Caveats disclosed: underpowered? confounded changes (algorithm + UI)? post-hoc exclusions documented?
    - [ ] Recommendation is explicit: ship / don't ship / re-run — with the reason

    **Rule of thumb**: if you can't tick the SRM box and the primary-metric box, the result doesn't get reported — it gets investigated.
