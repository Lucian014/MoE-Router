    3. **Cât de ușor ați găsit informațiile de care aveți nevoie înainte și în timpul festivalului?** (1–5) – măsoară comunicarea, nu evenimentul
    4. **Cât de bine organizat v-a părut festivalul (cozi, semnalizare, orar)?** (1–5)

    ## Întrebări despre comportament (cele mai valoroase)

    5. **Ați reveni la ediția de anul viitor?** (Da / Nu / Nu știu)
    6. **Cât timp ați stat la festival?** (sub 1 oră / 1–2 ore / 2–4 ore / aproape toată ziua) – îți spune ce a funcționat: dacă toată lumea pleacă după o oră, programul are găuri
    7. **Ați cumpărat cărți la târg?** (Da / Nu) – util și pentru raportul către Cărturia și edituri

    ## Întrebări deschise (maximum 2–3)

    8. **Ce a plăcut cel mai mult copilului dumneavoastră?** – aici afli ce să repeti anul viitor; răspunsurile sunt de aur pentru promovare („mama Mariei spune...")
    9. **Ce ar trebui îmbunătățit?**
    10. **Ce activități noi ați dori la ediția viitoare?**

    ## Întrebări de profil (opționale, la final)

    11. **Câți copii aveați cu dumneavoastră și ce vârste aveau?** – te ajută să calibrezi grupele de vârstă la ediția următoare
    12. **De unde ați aflat de festival?** (Facebook / grupul școlii / afiș / de la cunoștințe / altceva) – îți spune unde să investești efort de promovare data viitoare

    ## Sfaturi practice

    - **Google Forms gratuit**, cu un cod QR printat și afișat la ieșire și la punctul de informații
    - **Momentul contează:** voluntarul de la ieșire invită activ („Aveți 2 minute? Ne ajutați cu un feedback scurt") – rata de completare crește de 3–4 ori față de un cod QR lăsat singur
    - **Incentiv mic:** „Completați chestionarul și participați la tragere la sorți pentru un set de cărți" – premiile le ai deja în natură de la parteneri
    - **Trimite-l și după festival** în grupurile de părinți, cu termen limită („până duminică") – prinzi și pe cei care nu au completat la ieșire
    - **Nu pune întrebări despre sponsori sau detalii interne** – părinții nu le pot evalua și abandonează chestionarul

    Un detaliu: întrebarea 12 (de unde au aflat) pare minoră, dar e cea care îți va economisi cel mai mult efort la ediția următoare – vezi exact ce canal aduce publicul.

    Vrei să-ți scriu și varianta scurtă pentru copii (3–4 întrebări simple, cu fețe zâmbitoare, pe hârtie)?
