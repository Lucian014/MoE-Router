    tenure_months has stuff like "12 months", "1 yr", blanks. give me the full cleaning function
  assistant: |
    Here's a robust function that handles all those cases:

    ```python
    import re
    import numpy as np
    import pandas as pd

    def clean_tenure(val):
        """Convert tenure values ('12 months', '1 yr', 24, '2 years', '', None) to months (float)."""
        # Handle blanks / NaN
        if pd.isna(val):
            return np.nan
        if isinstance(val, str) and val.strip() in ('', '-', 'na', 'n/a', 'none', 'null'):
            return np.nan

        s = str(val).strip().lower()

        # Extract the numeric part
        match = re.search(r'(\d+(?:\.\d+)?)', s)
        if not match:
            return np.nan
        num = float(match.group(1))

        # Detect the unit
        if re.search(r'\b(yr|yrs|year|years|y)\b', s):
            return num * 12
        if re.search(r'\b(mo|mos|month|months|m)\b', s):
            return num
        # No unit found — assume it's already in months
        return num

    df['tenure_months'] = df['tenure_months'].apply(clean_tenure)
    ```

    Then verify nothing weird slipped through:

    ```python
    print(df['tenure_months'].isna().sum())          # how many couldn't be parsed
    print(df['tenure_months'].describe())            # check range is sensible
    print(df.loc[df['tenure_months'] > 600, 'tenure_months'])  # implausible values (50+ yrs)
    ```

    A few notes on the design choices:

    - **Regex-based unit detection** is safer than `str.endswith('yr')` — it catches `"1 yr"`, `"2 years"`, `"1yr"` (no space), and won't misfire on `"12 months"`.
    - **Unadorned numbers are assumed to be months**, since that's the column name. If your data has bare numbers that are actually years, you'd see it in the describe check (values like 1, 2, 3 mixed with 12, 24, 36).
    - **Anything unparseable becomes NaN** rather than raising, so one bad row doesn't kill the whole run — then you can decide whether to impute (median + missing flag) or drop.

    If you want, I can wrap this into a full pipeline function that also cleans `plan`, fixes negative `MonthlyCharges`, and handles the `last_login_days` missingness in one pass.
- user: |
    MonthlyCharges has negative values, about 40 rows. drop them?
  assistant: |
    With only 40 rows out of 61,840 (0.06%), dropping won't hurt your model either way — but I'd suggest **flipping the sign instead**, because negatives are almost certainly data-entry errors (a missing minus or a stray keystroke), not real refunds:

    ```python
    neg_mask = df['MonthlyCharges'] < 0
    print(df.loc[neg_mask, ['plan', 'MonthlyCharges', 'tenure_months']])

    df['charge_was_negative'] = neg_mask.astype(int)  # optional flag
    df.loc[neg_mask, 'MonthlyCharges'] = df.loc[neg_mask, 'MonthlyCharges'].abs()
    ```

    Why abs over drop:

    - **The magnitude is probably correct.** A `-9.99` basic-plan customer is very likely a real $9.99 basic customer. Dropping them throws away 40 customers whose features (tenure, tickets, logins) are still valid.
    - **Check before deciding.** Look at those 40 rows first — if the negatives cluster on one plan with charges matching that plan's normal price, it's clearly a sign error. If they look random or have weird magnitudes (e.g., `-200.00` when nothing else costs $200), the error might be in the value itself, and dropping is safer.
    - **The flag costs nothing.** If the sign error correlates with some upstream system quirk, the flag lets the model pick up on it; if not, it's harmless.

    If you just want the simplest defensible choice: dropping 40 rows is statistically negligible and totally fine. But abs() + flag is slightly better practice. Either way, don't leave them negative — a negative charge will silently distort any model that treats charges linearly.
