    the top SHAP feature is support_tickets_90d. the product team asks if that means support is causing churn
  assistant: |
    Short answer: **no — and it's important they understand why, because acting on that misreading could waste a quarter.**

    **What SHAP actually says**

    `support_tickets_90d` being the top feature means: *customers who file more tickets are more likely to churn, and the model uses that to predict.* That's a correlation the model found in the data. It says nothing about whether tickets **cause** churn.

    **Why the causal reading is probably wrong (or at least incomplete)**

    The most likely story is a **confounder**: something else makes customers both file tickets and churn. Examples:

    - A buggy feature or billing problem makes the product frustrating → customers file tickets *and* churn because the product is broken. The ticket didn't cause the churn; the underlying problem did.
    - Unhappy customers in general are more engaged with support *and* more likely to leave — tickets are a *symptom* of dissatisfaction, not its cause.
    - Even the reverse direction is possible: customers who were already mentally checked out file a ticket as a last resort, get a mediocre answer, and leave.

    If product "fixes" support (faster responses, fewer tickets) without fixing the underlying issues, churn won't move — and you'll have spent the effort proving SHAP isn't causal.

    **There's also a useful signal hiding in the direction**

    Check the SHAP dependence plot: does risk rise with *every* ticket, or is there a threshold? Often you'll see 0–1 tickets is neutral or even protective (engaged customers getting help), while 3+ is strongly predictive. That pattern suggests "unresolved problems piling up" — which points at *resolution quality*, not ticket volume. Support might be fine; the product issues generating tickets might be the real target.

    **How to actually answer the causal question**

    1. **Segment the tickets.** Join ticket categories/resolution data if you have it. If churn concentrates in billing complaints vs. how-do-I questions, that tells you where the product problem lives.
    2. **Look at resolution.** Tickets resolved quickly and satisfactorily vs. reopened/escalated — if only the bad-resolution tickets predict churn, support is part of the solution, not the problem.
    3. **The real test: an experiment.** Randomize a proactive intervention (e.g., personal outreach after a customer's 2nd ticket) and measure churn vs. control. That's the only thing that converts correlation into a causal claim — same logic as the save-rate A/B test you're already planning for the retention offers.
    4. **Check timing.** If you have ticket timestamps, see whether churn risk rises *after* unresolved tickets or whether tickets are just an early marker of customers who were leaving anyway.

    **How I'd frame it to product:**

    > "Support tickets are the model's strongest *early warning signal* — customers with 3+ tickets in 90 days are at much higher risk. That makes tickets a great trigger for intervention, but it doesn't mean support is causing churn. More likely, both tickets and churn are symptoms of product problems. If we fix the issues generating the tickets, both should improve — and we can test that directly."

    The reframe that lands well with PMs: **SHAP found you a smoke detector, not an arsonist.** The detector is valuable — but you still need to find the fire.
