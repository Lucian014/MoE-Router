    Two good options, depending on how much friction you want:

    **Option 1 (fastest): swap to scikit-learn's HistGradientBoostingClassifier**

    It's XGBoost-quality performance (same histogram-based algorithm), already installed with sklearn, and needs no extra system libraries:

    ```python
    from sklearn.ensemble import HistGradientBoostingClassifier

    xgb = Pipeline([
        ('prep', preprocessor),
        ('clf', HistGradientBoostingClassifier(
            max_iter=400,
            learning_rate=0.05,
            max_depth=4,
            l2_regularization=1.0,
            class_weight='balanced',   # supported since sklearn 1.2
            random_state=42,
        )),
    ])
    ```

    Two small differences from the XGBoost version:

    - It handles NaNs natively, so the imputers are optional (harmless to keep).
    - If your sklearn is older than 1.2, `class_weight` isn't supported — use `sample_weight` in `fit`, or just drop it and rely on the PR-AUC metric (histogram boosting is often robust enough without it).

    **Option 2 (if you specifically want XGBoost): install it via conda in your user space**

    The pip wheel of XGBoost expects the OS to provide the OpenMP runtime; the conda-forge build **bundles it**, so no system install or admin rights needed:

    ```bash
    # Miniforge installs entirely in your home directory, no sudo
    curl -L -O https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-MacOSX-arm64.sh
    bash Miniforge3-MacOSX-arm64.sh -b -p $HOME/miniforge3

    $HOME/miniforge3/bin/conda create -n churn python=3.11 xgboost scikit-learn pandas -c conda-forge
    conda activate churn
    ```

    (Use `Miniforge3-MacOSX-x86_64.sh` instead if your laptop is Intel.)

    **My recommendation:** go with Option 1. For a 60k-row tabular problem, `HistGradientBoostingClassifier` will land within noise of XGBoost, and it keeps your environment simple — which matters when IT is restrictive. If you later need XGBoost-specific features (custom objectives, very large data), set up the conda env then.
