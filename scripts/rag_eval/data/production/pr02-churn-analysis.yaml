    Here's the recomputation with the €25 offer, both accounting treatments since it matters which one finance uses:

    **Case A: €25 paid per call made (flat cost, conservative)**

    ```
    Program cost:      500 × €25 = €12,500/month
    Gross savings:     500 × P × s × €180
    Net:               500 × P × s × 180 − 12,500
    ```

    | Save rate s | P = 30% | P = 35% | P = 40% |
    |---|---|---|---|
    | 20% | **−€1,700** | **−€175** | **+€1,900** |
    | 33% | **+€5,300** | **+€7,950** | **+€11,300** |
    | 50% | **+€14,500** | **+€18,250** | **+€23,500** |

    Break-even: `s = 25 / (180 × P)` → 46% at P=30%, 40% at P=35%, 35% at P=40%. That's a high bar — the offer needs to save roughly 2 in 5 contacted churners.

    **Case B: €25 discount only granted to customers who accept and stay**

    The discount cost applies only to saves, so:

    ```
    Cost:      500 × P × s × €25
    Value:     500 × P × s × €180
    Net:       500 × P × s × (180 − 25) = 500 × P × s × €155
    ```

    Every save is worth a flat **€155 net**, so the program is profitable for *any* save rate above zero:

    | Save rate s | P = 30% | P = 35% | P = 40% |
    |---|---|---|---|
    | 20% | **+€4,650** | **+€5,425** | **+€6,200** |
    | 33% | **+€7,673** | **+€8,951** | **+€10,230** |
    | 50% | **+€11,625** | **+€13,563** | **+€15,500** |

    Break-even: any s > 0. The only risk is wasted agent time, not the discount.

    **Which case applies?** This is now the single most important question for the program's economics:

    - If the discount is applied to the *next billing cycle* and customers who churn before it never receive it → **Case B**, and the richer offer is almost strictly better than the €15 one.
    - If it's a code/credit granted at call time regardless of subsequent behavior → **Case A**, and the offer change made the program riskier.

    **My recommendation for the CEO number:** quote Case A as the conservative bound ("net between −€5k and +€23.5k/month, break-even at saving ~2 in 5") and note that if the discount only lands on stayers, the program is profitable at any save rate. Then let the pilot's holdout measure `s` — and log *when* the discount is granted, so you'll know empirically which case you're in after month one.
