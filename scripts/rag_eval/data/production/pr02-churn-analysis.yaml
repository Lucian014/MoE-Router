    write the full training script: logistic regression baseline + XGBoost, stratified 5-fold CV, report PR-AUC
  assistant: |
    Here's a complete script. It assumes `df` is the raw dataframe; cleaning is included so it runs end-to-end:

    ```python
    import re
    import numpy as np
    import pandas as pd
    from sklearn.model_selection import StratifiedKFold, cross_validate, train_test_split
    from sklearn.pipeline import Pipeline
    from sklearn.compose import ColumnTransformer
    from sklearn.preprocessing import StandardScaler, OneHotEncoder
    from sklearn.impute import SimpleImputer
    from sklearn.linear_model import LogisticRegression
    from xgboost import XGBClassifier
    from sklearn.metrics import average_precision_score, make_scorer

    # ------------------------------------------------------------------
    # 1. Cleaning (from earlier)
    # ------------------------------------------------------------------
    def clean_tenure(val):
        if pd.isna(val):
            return np.nan
        if isinstance(val, str) and val.strip().lower() in ('', '-', 'na', 'n/a', 'none', 'null'):
            return np.nan
        s = str(val).strip().lower()
        match = re.search(r'(\d+(?:\.\d+)?)', s)
        if not match:
            return np.nan
        num = float(match.group(1))
        if re.search(r'\b(yr|yrs|year|years|y)\b', s):
            return num * 12
        return num

    def clean_df(df):
        df = df.copy()
        df['tenure_months'] = df['tenure_months'].apply(clean_tenure)
        df['tenure_was_missing'] = df['tenure_months'].isna().astype(int)
        df['tenure_months'] = df['tenure_months'].fillna(df['tenure_months'].median())
        df['plan'] = df['plan'].str.strip().str.lower()
        df['is_refund'] = (df['MonthlyCharges'] < 0).astype(int)
        df['charge_abs'] = df['MonthlyCharges'].abs()
        df['login_was_missing'] = df['last_login_days'].isna().astype(int)
        df['last_login_days'] = df['last_login_days'].fillna(df['last_login_days'].max() + 1)
        return df

    df = clean_df(df)

    # ------------------------------------------------------------------
    # 2. Features / target
    # ------------------------------------------------------------------
    TARGET = 'churned'
    DROP = ['customer_id', 'MonthlyCharges', TARGET]   # use charge_abs + is_refund instead
    y = df[TARGET]
    X = df.drop(columns=DROP)

    numeric_features = ['tenure_months', 'charge_abs', 'support_tickets_90d', 'last_login_days']
    binary_features = ['is_refund', 'tenure_was_missing', 'login_was_missing']
    categorical_features = ['plan']

    # ------------------------------------------------------------------
    # 3. Preprocessing
    # ------------------------------------------------------------------
    numeric_pipeline = Pipeline([
        ('imputer', SimpleImputer(strategy='median')),
        ('scaler', StandardScaler()),
    ])

    categorical_pipeline = Pipeline([
        ('imputer', SimpleImputer(strategy='most_frequent')),
        ('onehot', OneHotEncoder(handle_unknown='ignore')),
    ])

    preprocessor = ColumnTransformer([
        ('num', numeric_pipeline, numeric_features),
        ('bin', 'passthrough', binary_features),
        ('cat', categorical_pipeline, categorical_features),
    ])

    # ------------------------------------------------------------------
    # 4. Models
    # ------------------------------------------------------------------
    pos_weight = (y == 0).sum() / (y == 1).sum()  # ~13.8 for 6.8% churn

    logreg = Pipeline([
        ('prep', preprocessor),
        ('clf', LogisticRegression(max_iter=1000, class_weight='balanced', random_state=42)),
    ])

    xgb = Pipeline([
        ('prep', preprocessor),
        ('clf', XGBClassifier(
            n_estimators=400,
            learning_rate=0.05,
            max_depth=4,
            subsample=0.8,
            colsample_bytree=0.8,
            scale_pos_weight=pos_weight,
            eval_metric='aucpr',
            tree_method='hist',
            random_state=42,
            n_jobs=-1,
        )),
    ])

    # ------------------------------------------------------------------
    # 5. Stratified 5-fold CV, PR-AUC
    # ------------------------------------------------------------------
    cv = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)
    scoring = {
        'pr_auc': make_scorer(average_precision_score, needs_proba=True),
        'roc_auc': 'roc_auc',
    }

    for name, model in [('Logistic Regression', logreg), ('XGBoost', xgb)]:
        results = cross_validate(model, X, y, cv=cv, scoring=scoring, n_jobs=-1)
        print(f"\n{name}")
        print(f"  PR-AUC : {results['test_pr_auc'].mean():.4f} ± {results['test_pr_auc'].std():.4f}")
        print(f"  ROC-AUC: {results['test_roc_auc'].mean():.4f} ± {results['test_roc_auc'].std():.4f}")

    print(f"\nBaseline (random) PR-AUC ≈ churn rate = {y.mean():.4f}")
    ```

    Notes on the choices:

    - **`scale_pos_weight` for XGBoost** and `class_weight='balanced'` for logistic regression both compensate for the 6.8% imbalance — without them, the models will under-predict churn. This trades precision for recall, which is usually what you want for retention.
    - **`eval_metric='aucpr'`** aligns XGBoost's internal evaluation with your primary metric.
    - **`charge_abs` + `is_refund`** replace raw `MonthlyCharges` per the refund discussion; `MonthlyCharges` is dropped.
    - **`handle_unknown='ignore'`** in the one-hot encoder means an unseen plan value in production won't crash the pipeline.
    - **PR-AUC baseline** is the churn rate (~0.068) — compare against that, not 0.5.

    If XGBoost clearly beats the baseline, next steps would be hyperparameter tuning (Optuna or `GridSearchCV` on `max_depth`, `learning_rate`, `n_estimators`) and a held-out test set for the final threshold/capture-rate analysis. Want me to add the holdout evaluation and top-decile capture rate?
