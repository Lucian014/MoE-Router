    how do I pick a threshold? a retention offer costs us 15 EUR per customer, a churned customer costs about 180 EUR on average
  assistant: |
    This is a nice setup because the math gives you a direct answer. The logic: contact a customer if the expected savings exceed the offer cost.

    **The basic threshold**

    If you contact a customer with churn probability `p`:
    - Expected loss if you do nothing: `p × 180 EUR`
    - Cost of the offer: `15 EUR`

    Contact when `p × 180 > 15`, i.e. **p > 15/180 ≈ 0.083**.

    So the threshold is ~8.3% predicted churn probability — notably *below* the base rate of 6.8%... wait, actually just above it. That tells you something important: **at these economics, you should contact almost everyone at or above average risk.** The offer is cheap relative to churn (12:1), so the model's job is mostly ranking, not thresholding.

    **The refinement that matters: the offer isn't 100% effective**

    The calculation above assumes the offer always prevents churn, which it won't. If the offer saves a fraction `s` of would-be churners, expected savings per contacted customer are `p × 180 × s`, so:

    ```
    threshold = 15 / (180 × s)
    ```

    - Save rate 50% → threshold ≈ 0.167
    - Save rate 25% → threshold ≈ 0.333
    - Save rate 10% → threshold ≈ 0.833

    You probably don't know `s` yet — that's the number to estimate, either from past retention campaigns or a small A/B test. If you can't estimate it, run the threshold as a function of `s` and show stakeholders the table; it makes the "we need to measure offer effectiveness" conversation concrete.

    **Code**

    ```python
    from sklearn.model_selection import cross_val_predict

    OFFER_COST = 15
    CHURN_COST = 180

    proba = cross_val_predict(lgbm, X, y, cv=cv, method='predict_proba')[:, 1]

    def expected_value(p, save_rate):
        # EV of contacting vs not contacting
        return p * CHURN_COST * save_rate - OFFER_COST

    for save_rate in [0.10, 0.25, 0.50, 1.00]:
        thr = OFFER_COST / (CHURN_COST * save_rate)
        contacted = proba >= thr
        n = contacted.sum()
        ev = expected_value(proba[contacted], save_rate).sum()
        print(f"save_rate={save_rate:.0%}: threshold={thr:.3f}, "
              f"contact {n:,} customers ({n/len(proba):.1%}), "
              f"expected net value €{ev:,.0f}")
    ```

    **One critical prerequisite: calibration**

    This whole approach treats the model's output as a real probability, so check calibration before trusting it — `scale_pos_weight` distorts predicted probabilities (they'll be inflated):

    ```python
    from sklearn.calibration import calibration_curve
    import matplotlib.pyplot as plt

    frac_pos, mean_pred = calibration_curve(y, proba, n_bins=10, strategy='quantile')
    plt.plot(mean_pred, frac_pos, marker='o')
    plt.plot([0, 1], [0, 1], '--')  # perfect calibration
    plt.xlabel('Predicted churn probability'); plt.ylabel('Actual churn rate')
    ```

    If the curve is off the diagonal, wrap the model: `CalibratedClassifierCV(lgbm, method='isotonic', cv=5)` — fit it on training data only, then re-derive the threshold from calibrated probabilities. Isotonic works well with your ~4,200 positives.

    **Bottom line:** threshold ≈ 0.083 if offers always work, higher if they don't. Get the save rate estimated, calibrate the probabilities, and the threshold falls out of the arithmetic rather than being a judgment call.
