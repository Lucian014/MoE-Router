    # Churn Scoring Pipeline

    Monthly churn-risk scoring for the subscription app. Scores all active customers, exports the top-500 retention call list, and tracks model health over time.

    ## What it does

    1. **Cleans** raw customer data (mixed-format tenure, refund charges, missing plans from mid-month upgrades)
    2. **Scores** every customer with a calibrated LightGBM model (isotonic calibration — predicted probabilities are real probabilities)
    3. **Exports** the top 500 highest-risk customers for the retention team's monthly calls, plus full scores for all customers
    4. **Validates** the output (row counts, no NaN probabilities) before anyone acts on it

    ## Repo layout

    ```
    ├── pipeline.py        # cleaning, training, calibration, scoring functions
    ├── scoring.py         # entrypoint: pull data, score, export (used by Docker)
    ├── Dockerfile
    ├── requirements.txt
    ├── dags/
    │   └── churn_monthly_scoring.py   # Airflow DAG (monthly, 1st at 06:00)
    └── output/            # exported CSVs (mounted volume in production)
    ```

    ## Outputs

    | File | Contents | Consumer |
    |---|---|---|
    | `churn_call_list_YYYY-MM-DD.csv` | Top 500 customers with risk score, plan, tenure, tickets, login recency | Retention team |
    | `churn_scores_all_YYYY-MM-DD.csv` | All customers, ranked | Backtesting, mid-risk email tier |

    ## Key numbers & decisions

    - **Churn rate:** 6.8% monthly → accuracy is useless; we optimize **PR-AUC** and **precision@500**
    - **Offer economics:** €25 offer vs. €180 lost customer → break-even at saving ~1 in 7 contacted churners
    - **Capacity:** 500 calls/month is the binding constraint — the model ranks, the cutoff is the 500th customer
    - **Calibration:** `scale_pos_weight` inflates raw probabilities; isotonic calibration on a held-out 25% fixes it. **Never use raw LightGBM probabilities for financial estimates.**
    - **Refunds:** negative `MonthlyCharges` are real refunds (per finance) — kept and flagged via `is_refund`, never dropped or sign-flipped
    - **Missing plan = mid-month upgrade** (known March-style bug) — flagged via `plan_was_missing`, filled with `unknown_upgrade`

    ## Running locally

    ```bash
    docker build -t churn-scorer .

    docker run --rm \
      -e DB_URL="postgresql+psycopg2://user:pass@host:5432/mydb" \
      -v $(pwd)/output:/app/output \
      churn-scorer
    ```

    Or without Docker:

    ```bash
    pip install -r requirements.txt
    export DB_URL="postgresql+psycopg2://..."
    python scoring.py
    ```

    ## Production (Airflow)

    The DAG `churn_monthly_scoring` runs on the 1st of each month:

    1. **Data-quality gate** — row count, duplicate IDs, schema, missing rates; fails loudly before scoring
    2. **Scoring** — `DockerOperator` running the same image
    3. **Output validation** — call list exists, ≥450 rows, no NaN probabilities
    4. **Failure alert** — email + on-call channel

    Requires the Docker socket on Airflow workers and `apache-airflow-providers-docker`. `DB_URL` comes from Airflow Variables/secrets — never commit credentials.

    ## Model health & monitoring

    Tracked monthly (see `evaluate_cv()` and the monitoring plan):

    - **PSI per feature** vs. training baseline (>0.25 = investigate; check for data bugs before assuming real drift)
    - **Predicted churn rate** month over month (alert outside ±30% of baseline)
    - **PR-AUC on matured cohorts** (alert on drop >0.03)
    - **Calibration by decile** — recalibrate when predicted vs. actual diverges by more than a few points
    - **Precision@500** — the business metric

    **Retraining trigger:** sustained PR-AUC decline or persistent PSI >0.25 on top features — not a calendar schedule. Validate any new model against the old one on the same matured cohorts before swapping.

    ## Pilot & measurement

    The 3-month pilot runs 500 calls/month against a randomized holdout of 500 equally-high-risk customers (no calls). Primary metric: churn rate treated vs. holdout after 60 days. Credible readout at ~4 months. **Do not peek monthly and stop at the first significant result** — pre-committed single analysis.

    After each month, join actual churn outcomes back onto the call list to measure precision@500 and the save rate. This feedback loop is what turns model output into a measured savings number for finance.

    ## Known issues / TODO

    - [ ] Plan-history table needed upstream to repair the upgrade data gap properly (currently handled by flag)
    - [ ] DQ gate branch in `scoring.py` (`DQ_CHECK_ONLY=1`) — implement checks
    - [ ] Wire `notify_failure` to Slack instead of echo
    - [ ] Mid-risk email tier using the full-scores export (blocked on pilot results)

    ## Contacts

    - Model/pipeline: data team
    - Call list operations: retention team
    - Churn label definition: whoever owns it — **confirm before any change**, it silently breaks outcome metrics
