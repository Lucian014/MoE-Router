    Here's the derivation, written so it can go straight into a slide or doc:

    ---

    ## Churn Model Threshold: Expected Value Analysis

    ### Setup

    | Symbol | Meaning | Value |
    |---|---|---|
    | `C_offer` | Cost of retention offer per contacted customer | €15 |
    | `C_churn` | Average cost of losing a customer | €180 |
    | `p` | Model-predicted churn probability for a customer | 0 to 1 |
    | `s` | Effectiveness of the offer (fraction of would-be churners who stay because of it) | unknown, 0–1 |

    ### Step 1: Cost of doing nothing

    For a customer with churn probability `p`, if we take no action, the expected cost is:

    ```
    E[do nothing] = p × C_churn
    ```

    *Example: a customer with p = 0.20 has an expected loss of 0.20 × €180 = €36.*

    ### Step 2: Cost of making the offer

    If we make the offer, two things can happen:

    - The customer would have churned (probability `p`), but the offer saves them with probability `s`. This happens with probability `p × s`, and we pay the offer cost.
    - Otherwise, the offer changes nothing, and we pay the offer cost regardless.

    The offer costs €15 in **every** case — it's a fixed spend. The benefit is the churn we prevent:

    ```
    E[offer] = C_offer  +  p × (1 − s) × C_churn
    ```

    *(Expected cost = the €15 we always spend, plus the churn cost we still incur when the offer fails to save them.)*

    ### Step 3: Compare the two options

    Making the offer is worthwhile when its expected cost is lower than doing nothing:

    ```
    C_offer + p × (1 − s) × C_churn  <  p × C_churn
    ```

    Subtract `p × (1 − s) × C_churn` from both sides:

    ```
    C_offer  <  p × C_churn − p × (1 − s) × C_churn
    C_offer  <  p × C_churn × [1 − (1 − s)]
    C_offer  <  p × C_churn × s
    ```

    ### Step 4: Solve for the threshold

    ```
    p  >  C_offer / (C_churn × s)
    ```

    **The decision rule: contact every customer whose predicted churn probability exceeds `C_offer / (C_churn × s)`.**

    ### Step 5: Plug in the numbers

    **Best case (offer always works, s = 1):**

    ```
    p > 15 / (180 × 1) = 0.083  →  contact everyone above 8.3% risk
    ```

    **With realistic offer effectiveness:**

    | Offer save rate `s` | Threshold | Interpretation |
    |---|---|---|
    | 100% | 8.3% | Contact everyone at/above average risk |
    | 50% | 16.7% | Contact top ~25–30% riskiest |
    | 25% | 33.3% | Contact top ~10% riskiest |
    | 10% | 83.3% | Only contact near-certain churners |

    ### Key takeaway

    The offer-to-churn cost ratio is 12:1 (€15 vs €180), so retention outreach is almost always worth it — **even a weak offer that saves only 1 in 12 targeted customers breaks even.** The main open question is the offer's actual save rate `s`, which determines how wide we cast the net. We recommend a pilot A/B test (offer vs. no offer on a random subset of high-risk customers) to measure `s` directly.

    ---

    Two notes for you (not the manager):

    1. **Step 2's framing** — "offer cost is paid regardless, benefit is prevented churn" — is the version least likely to get challenged. An alternative framing (expected savings minus cost) gives the identical threshold, so if your manager prefers "expected benefit = p × s × €180 vs. cost €15," it's the same math.
    2. **The pilot test recommendation at the end is the real ask.** Without measuring `s`, the threshold is a range, not a number — and the A/B test also validates that the model's high-risk group actually churns more, which closes the loop on the whole project.
