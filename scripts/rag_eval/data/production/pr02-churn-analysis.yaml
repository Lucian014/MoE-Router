    for monitoring in production which drift metrics should I track?
  assistant: |
    For a churn model with monthly scoring and delayed labels, you need three layers of monitoring — feature drift, prediction drift, and outcome drift. Here's what to track and why:

    **1. Feature drift: PSI per feature (primary metric)**

    Population Stability Index compares each feature's distribution this month vs. a training baseline:

    ```python
    def psi(expected, actual, bins=10):
        """PSI between training distribution and current distribution."""
        breakpoints = np.quantile(expected, np.linspace(0, 1, bins + 1))
        breakpoints[0], breakpoints[-1] = -np.inf, np.inf
        e_pct = np.histogram(expected, breakpoints)[0] / len(expected)
        a_pct = np.histogram(actual, breakpoints)[0] / len(actual)
        e_pct, a_pct = np.clip(e_pct, 1e-6, None), np.clip(a_pct, 1e-6, None)
        return np.sum((a_pct - e_pct) * np.log(a_pct / e_pct))
    ```

    Thresholds: **< 0.1 stable, 0.1–0.25 investigate, > 0.25 act.** Track it for every model feature — especially `support_tickets_90d`, `last_login_days`, and `plan` (a new plan tier or the March-style bug will show up here immediately). Also track the **missing-value rate** per column — a spike is often a pipeline bug, not real drift, and it's the cheapest early-warning signal you have.

    **2. Prediction drift: score distribution**

    Track the mean/median/deciles of `churn_probability` month over month, plus the **predicted churn rate** (mean probability). If the average predicted risk jumps from 7% to 12%, either your customer base changed or something upstream broke — both need attention. Also monitor the **top-500 cutoff value**: if the 500th-highest probability drops sharply, the model is finding fewer risky customers, which changes what the call list means.

    Prediction drift without feature drift is a red flag for concept drift; feature drift without prediction drift usually means the change doesn't affect the model much.

    **3. Outcome drift: the real test, once labels arrive**

    Churn labels mature with a lag, so evaluate on cohorts whose outcomes are known:

    - **PR-AUC on each matured monthly cohort** — this is your headline metric. A slow decline is normal model aging; a sudden drop means something broke or the world changed.
    - **Calibration by decile** — predicted vs. actual churn rate per bin. Your model already had one calibration failure; this is how you catch the next one. Recalibrate when the gap exceeds a few points.
    - **Precision@500** — the business metric. If it degrades, the call list is losing value even if aggregate PR-AUC looks fine.

    **4. Data quality gates (run before scoring, fail loudly)**

    Not drift exactly, but the most common production failure mode: row count vs. expected, no duplicate `customer_id`, `churned` in {0, 1}, charge values in a plausible range, categorical values within known sets (or count of new ones). A schema change upstream will kill your pipeline before drift ever gets a chance to.

    **Practical setup**

    - Baseline = training data distributions; compare each monthly batch against it.
    - Alert on: PSI > 0.25 on any feature, missing-rate > 2× baseline, predicted rate outside ±30% of baseline, PR-AUC drop > 0.03 on a matured cohort.
    - Plot monthly PR-AUC and precision@500 as a run chart — trends matter more than single points.
    - Retraining trigger: sustained PR-AUC decline or persistent PSI > 0.25 on top features — not a calendar schedule. With your data volume, retraining is cheap; the discipline is in checking that the new model actually beats the old one on the same matured cohorts before swapping it in.

    One churn-specific note: watch for **label definition drift** too. If the business changes how `churned` is defined (e.g., starts counting failed-payment cancellations differently), your outcome metrics will shift for reasons that have nothing to do with the model. That change won't show up in PSI — it shows up as a sudden calibration jump, so keep the line of communication open with whoever owns the churn definition.
