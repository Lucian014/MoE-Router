    Here's a DAG for Airflow 2.x using the Docker setup we built:

    ```python
    """
    Monthly churn scoring DAG.
    Runs the dockerized scoring job on the 1st of each month,
    with a data-quality gate before scoring and an alert on failure.
    """
    from datetime import datetime, timedelta

    from airflow import DAG
    from airflow.providers.docker.operators.docker import DockerOperator
    from airflow.operators.bash import BashOperator
    from airflow.utils.trigger_rule import TriggerRule

    DB_URL = "{{ var.churn.db_url }}"          # store in Airflow Variables/Connections, not code
    OUTPUT_DIR = "/data/churn/output"          # shared volume mounted on the Airflow worker

    default_args = {
        "owner": "data-team",
        "retries": 2,
        "retry_delay": timedelta(minutes=30),
        "email_on_failure": True,
        "email": ["data-team@yourcompany.com"],
        "execution_timeout": timedelta(hours=2),
    }

    with DAG(
        dag_id="churn_monthly_scoring",
        description="Score customers, export top-500 retention call list",
        schedule="0 6 1 * *",              # 06:00 on the 1st of each month
        start_date=datetime(2025, 1, 1),
        catchup=False,
        default_args=default_args,
        tags=["churn", "retention", "monthly"],
    ) as dag:

        # 1. Data-quality gate: fail loudly before wasting a run on bad data
        dq_check = BashOperator(
            task_id="data_quality_gate",
            bash_command=f"""
            docker run --rm \
              -e DB_URL="{DB_URL}" \
              -e DQ_CHECK_ONLY=1 \
              churn-scorer:latest
            """,
        )

        # 2. Scoring job
        score = DockerOperator(
            task_id="score_customers",
            image="churn-scorer:latest",
            api_version="auto",
            auto_remove=True,
            environment={
                "DB_URL": DB_URL,
                "OUTPUT_DIR": "/app/output",
            },
            volumes=[f"{OUTPUT_DIR}:/app/output"],
            command=["python", "scoring.py"],
            docker_url="unix://var/run/docker.sock",
            network_mode="bridge",
        )

        # 3. Post-run check: call list exists and has the expected row count
        validate_output = BashOperator(
            task_id="validate_output",
            bash_command=f"""
            python - <<'EOF'
            import pandas as pd, glob, sys
            files = sorted(glob.glob("{OUTPUT_DIR}/churn_call_list_*.csv"))
            if not files:
                sys.exit("No call list produced!")
            df = pd.read_csv(files[-1])
            if len(df) < 450:
                sys.exit(f"Call list too small: {{len(df)}} rows (expected ~500)")
            if df["churn_probability"].isna().any():
                sys.exit("NaN probabilities in call list")
            print(f"OK: {{len(df)}} customers, "
                  f"prob range {{df.churn_probability.min():.3f}}-{{df.churn_probability.max():.3f}}")
            EOF
            """,
            trigger_rule=TriggerRule.ALL_SUCCESS,
        )

        # 4. Notification on failure (in addition to email)
        alert = BashOperator(
            task_id="notify_failure",
            bash_command='echo "Churn scoring failed - check Airflow logs" | tee /dev/stderr',
            trigger_rule=TriggerRule.ONE_FAILED,
        )

        dq_check >> score >> validate_output >> alert
    ```

    Notes on the design:

    - **`schedule="0 6 1 * *"`** — 6 AM on the 1st, after month-end data lands. Adjust to whenever your feature snapshot is actually ready; scoring on stale features is the classic silent failure here.
    - **`catchup=False`** — if Airflow is down for two weeks, you don't want it backfilling three months of call lists on restart.
    - **The DQ gate runs the same image** with a check-only flag — add that branch to `scoring.py` (row count, duplicate IDs, schema, missing-rate checks from the monitoring plan, `sys.exit(1)` on failure). One image, two modes, no drift between gate and job.
    - **`validate_output` catches the failure mode the job itself won't**: the run "succeeds" but the call list is empty or tiny because of an upstream change. The 450-row floor gives slack for exclusions of recently-contacted customers.
    - **`DB_URL` via Airflow Variable** — better yet, use a Connection or a secrets backend; don't put credentials in the DAG file or `docker run` command line.
    - **`DockerOperator` needs the Docker socket** mounted on your Airflow workers (`docker_url` line) and the `apache-airflow-providers-docker` package installed. If your Airflow runs on Kubernetes, tell me — the idiomatic version there is a `KubernetesPodOperator` instead, and I'd rewrite it.
    - **The `alert` task** is a stub — wire it to Slack via `SlackWebhookOperator` or your on-call tool; email alone gets ignored.

    One scheduling consideration: if the pilot's holdout measurement needs outcomes joined back monthly, that's a second task (or second DAG) downstream of scoring — same cadence, and it keeps the feedback loop from depending on someone remembering to run a notebook.
