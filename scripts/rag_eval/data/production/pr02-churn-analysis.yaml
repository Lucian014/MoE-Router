    # Churn Prediction & Retention Program — Executive Summary

    ## The problem
    We lose about 6.8% of our 60,000 active subscribers each month — roughly 4,200 customers, or an estimated €750k+ in annualized value at €180 per lost customer. Until now, retention outreach was not targeted: we had no way to know *which* customers were about to leave.

    ## What we built
    A machine learning model that scores every customer monthly on their likelihood to cancel, using data we already have: tenure, plan, support tickets, and login activity. The retention team contacts the 500 highest-risk customers each month by phone, at a cost of €15 per call.

    ## How well it works
    - The model's top-10% riskiest customers contain roughly **4 in 10 of everyone who actually churns** — about 6× better than random selection.
    - On a held-out test the model reliably ranks risk, and its probability estimates have been calibrated so financial projections use real numbers, not inflated ones.
    - The strongest early warning sign is support tickets: customers with repeated unresolved tickets are far more likely to cancel. This gives us an actionable trigger — and points to product issues worth fixing at the source.

    ## The economics
    Each call costs €15; a saved customer is worth ~€180. Even if our offers only convince 1 in 12 contacted churners to stay, the program breaks even. At plausible save rates, the top-500 program is expected to return several euros for every euro spent. **The single biggest unknown is the actual save rate, which we can only learn by running the program and measuring it.**

    ## What we need
    1. **Run the pilot:** 500 calls/month for 3 months, with a small randomized holdout group so we can measure the true save rate.
    2. **A feedback loop:** churn outcomes joined back to the call list monthly, so we can report savings with confidence.
    3. **Data fix upstream:** a plan-history table to repair a known data gap affecting customers who upgrade mid-month.

    ## Risks and honest caveats
    - The model finds correlation, not cause. Support tickets predict churn; they don't prove support causes it. We are investigating ticket categories before recommending product changes.
    - Predictions will degrade over time as customer behavior shifts. We have monitoring in place and will retrain when — not before — the data says so.
    - Calling 500 of 60,000 customers is a rescue program, not broad retention. If the pilot proves out, cheaper channels (email, in-app offers) can extend coverage to the mid-risk tier using the same model.

    ## Bottom line
    The model is built, validated, and ready. The economics strongly favor acting. What we need now is a measured pilot to convert model output into proven saved revenue — and a decision on expanding to lower-cost channels if it works.
