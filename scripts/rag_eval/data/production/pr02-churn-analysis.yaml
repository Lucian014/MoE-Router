    0.31 is above the 0.25 action threshold, so it warrants investigation — but "bad" depends on *why* it drifted, and for `tenure_months` there's a very common benign explanation. Here's how to tell which case you're in:

    **First: look at the direction and shape of the shift**

    ```python
    import matplotlib.pyplot as plt

    plt.hist(train_tenure, bins=np.arange(0, 72, 6), alpha=0.5, density=True, label='training')
    plt.hist(current_tenure, bins=np.arange(0, 72, 6), alpha=0.5, density=True, label='last month')
    plt.legend(); plt.xlabel('tenure_months'); plt.ylabel('density')
    ```

    Two patterns to distinguish:

    1. **Mass shifted toward low tenure** (more 0–6 month customers than training). This is the classic *growth signature*: if your subscriber base is growing, new customers dilute the tenure distribution every month. It's real drift, but it's the business doing well, not a problem. A model trained on a mature base will slightly overestimate risk for a younger base — new customers do churn more, so this direction usually makes predictions *more* conservative, not wrong.
    2. **Mass shifted toward high tenure, or a spike in one bin.** More suspicious — could mean a stalled acquisition month, or a data bug (e.g., the tenure parser misreading a format, "1 yr" suddenly landing as 1 month instead of 12, or missing values getting imputed differently). A single-bin spike is almost always a pipeline bug, not customer behavior.

    **Second: rule out a data bug before accepting the drift**

    Given your tenure column's history (free text, mixed units, blanks), check the raw values first:

    ```python
    print(df['tenure_was_missing'].mean())   # missing rate vs. training baseline
    print(df.loc[df['tenure_months'] < 1, 'tenure_months'].value_counts())
    ```

    A missing-rate jump or a pile-up at exactly 1 or 12 months means the parser, not the customers, changed. This is exactly the failure mode PSI is good at catching — and it's the one where the fix is upstream, not a retrain.

    **Third: check whether it actually matters**

    PSI on a feature only matters if it moved the model's outputs or hurt its performance:

    - Did the **predicted churn rate** move beyond its normal range last month?
    - Did **PR-AUC on the most recent matured cohort** drop?
    - Did the **top-500 cutoff** shift?

    If all three are stable, the tenure drift is real but harmless — log it, keep watching. If predictions shifted, the drift is biting.

    **What to do in each case**

    - **Growth-driven shift + stable performance:** nothing. But consider whether the training baseline should be a rolling window (e.g., last 3–6 months) instead of the original training set — for a growing subscription business, a fixed baseline will drift upward on PSI forever even with a perfectly healthy model.
    - **Data bug:** fix the parser/pipeline, rescore the month. Don't retrain on corrupted features.
    - **Real shift + degraded performance:** that's your retraining trigger — add recent months to training and recalibrate.

    One more note: check the other features' PSIs from the same run. If *only* tenure moved, the growth/bug explanations above are likely. If several features moved together in ways consistent with "the base got younger" (shorter tenure, lower charge_abs, fewer support tickets), that's coherent cohort change. If features moved in *incoherent* directions, suspect the pipeline before the business.
