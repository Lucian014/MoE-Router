        proba = model.predict_proba(data.drop(columns=DROP))[:, 1]

        scores = pd.DataFrame({
            'customer_id': data['customer_id'],
            'plan': data['plan'],
            'tenure_months': data['tenure_months'],
            'charge_abs': data['charge_abs'],
