    calibration check: the group the model says has 20% churn probability actually churns at 9%. how do I fix that?
  assistant: |
    That's the classic signature of `scale_pos_weight` doing its job too well — it inflates the predicted probabilities to push the model toward catching churners, so the outputs are no longer real probabilities. Predicted 20% / actual 9% means the model is overestimating risk by roughly 2× in that region.

    **The fix: recalibrate on held-out data.** You need a mapping from "what the model says" to "what actually happens," learned on data the model didn't train on:

    ```python
    from sklearn.calibration import CalibratedClassifierCV
    from sklearn.model_selection import train_test_split

    # hold out a calibration set the base model never sees
    X_train, X_calib, y_train, y_calib = train_test_split(
        X, y, test_size=0.25, stratify=y, random_state=42
    )

    lgbm.fit(X_train, y_train)

    # isotonic learns a flexible step-function correction
    calibrated = CalibratedClassifierCV(lgbm, method='isotonic', cv='prefit')
    calibrated.fit(X_calib, y_calib)
    ```

    Key points:

    - **`cv='prefit'`** calibrates the already-trained model on the held-out set. This is important — calibrating on the training data (or with cross-fitting on all data) under-corrects, because the model has already seen those labels.
    - **Isotonic vs. sigmoid:** isotonic is more flexible and better with your ~4,200 positives; sigmoid (Platt scaling) is safer if the calibration set is small. With ~15k calibration rows and ~1,000 positives, isotonic is fine.
    - **Verify after:** bin the calibrated probabilities and check predicted vs. actual per bin:

    ```python
    from sklearn.calibration import calibration_curve

    proba_cal = calibrated.predict_proba(X_calib)[:, 1]
    frac_pos, mean_pred = calibration_curve(y_calib, proba_cal, n_bins=10, strategy='quantile')
    # mean_pred should now track frac_pos closely
    ```

    **Two things to check before you blame calibration:**

    1. **Was the 20%/9% measured on training data?** If you binned predictions on the same rows the model fit, some gap is expected from overfitting. The number that matters is on held-out data.
    2. **Is the gap uniform or region-specific?** If 20%→9% but 5%→4.8% and 40%→38%, only the upper region is off, which isotonic handles well. If everything is inflated ~2×, that's the `scale_pos_weight` scaling and even a simple correction would do.

    **One strategic note:** recalibrating will *lower* everyone's predicted probabilities, which means fewer customers clear any fixed threshold — but the *ranking* doesn't change, so your top-500 call list is unaffected. What changes is the EV math you show finance: expected saves were overstated by the same 2× factor. Better to find that out now than after the first monthly report.

    Also worth deciding: since ranking is what drives the call list, an alternative is to drop `scale_pos_weight` entirely and accept a lower-recall model — its probabilities will be nearly calibrated out of the box. But given your capacity-constrained top-500 setup, keeping the weighting plus calibration is the better combination: same ranking, honest numbers.
- user: |
    isotonic or Platt for 60k rows?
  assistant: |
    **Isotonic.** With 60k rows and ~4,200 positives, you have more than enough data for it, and it will fit the correction better than Platt.

    The tradeoff in one line: Platt fits a single sigmoid (one shape for the whole curve), isotonic fits an arbitrary monotonic step function. Platt is more robust when data is scarce because it can't overfit; isotonic is more accurate when data is plentiful because it can learn any monotone distortion — including the non-uniform kind, where your 20% region is off by 2× but the 5% region is nearly fine.

    Rules of thumb:

    - **< ~1,000 positives** → Platt (isotonic gets jagged and overfits)
    - **> ~1,000–2,000 positives** → isotonic (you're here, comfortably)
    - **In between or unsure** → fit both, plot the calibration curves, and check whether they disagree in the regions that matter (your top-500 probability range)

    One caveat specific to your setup: isotonic is a step function, so it can produce **ties** — many customers mapped to the exact same calibrated probability. That's harmless for your top-500 selection (the underlying ranking is preserved within ties, and LightGBM scores rarely collide anyway), but if you ever sort strictly by calibrated probability, add a secondary sort key like the raw score.

    Also: isotonic extrapolates flat outside the range of calibration data. If your calibration set has few customers above ~40% predicted risk, probabilities up there get clipped to the edge of what it saw — fine for your use case, just don't quote calibrated numbers for extreme-risk customers beyond the data's support.
