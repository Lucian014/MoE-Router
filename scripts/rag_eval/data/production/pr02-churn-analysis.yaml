    A fixed capacity constraint actually **simplifies** the decision: the threshold becomes irrelevant. You're not choosing "who's above a probability cutoff" — you're choosing **the 500 highest-risk customers, full stop.** The model's only job is ranking quality at the very top.

    **What changes conceptually**

    - The threshold is now *derived*, not chosen: it's whatever the predicted probability of the 500th-ranked customer happens to be. If that's 35%, you call everyone ≥35%; if it's 12%, same logic.
    - Metrics like PR-AUC across the whole dataset matter less. What matters is **precision@500** — of your top 500, how many actually churn. That's the number to optimize and report.
    - The earlier threshold table (contact everyone above 8.3%) is moot — you couldn't afford that many calls anyway. In a sense, marketing's constraint resolves the "save rate unknown" problem: at 12:1 economics, calling the top 500 is almost certainly positive-EV for any plausible save rate.

    **The math for your manager**

    With 500 calls/month at precision `P` (fraction of called customers who would have churned) and save rate `s`:

    ```
    Expected churners among called:   500 × P
    Expected saves:                   500 × P × s
    Monthly benefit:                  500 × P × s × €180
    Monthly cost:                     500 × €15 = €7,500
    Net monthly value:                500 × P × s × 180 − 7,500
    ```

    Break-even: `P × s > 0.083`. So if your top-500 precision is even 25% and the offer saves 1 in 3, that's `0.25 × 0.33 = 0.083` — right at break-even, and anything better is pure gain. Realistically top-500 precision with your model should be well above 25%.

    **Measure it directly:**

    ```python
    from sklearn.model_selection import cross_val_predict

    proba = cross_val_predict(lgbm, X, y, cv=cv, method='predict_proba')[:, 1]
    top500 = np.argsort(proba)[-500:]          # or sort descending, take first 500

    precision_at_500 = y.iloc[top500].mean()
    print(f"Precision@500: {precision_at_500:.1%}")
    print(f"Churners captured: {y.iloc[top500].sum()} of {y.sum()} "
          f"({y.iloc[top500].sum() / y.sum():.1%} of all churn)")
    ```

    **Two things to flag:**

    1. **Check the churn window.** If 6.8% is *annual* churn, that's ~340 churners/month across the base — meaning your 500 calls could potentially touch every churner. If it's *monthly*, ~4,200 churners/month and 500 calls covers ~12%. The interpretation of precision@500 changes accordingly, so confirm with whoever owns the churn definition.
    2. **Calibration matters less now, ranking matters more.** Since you're taking the top 500 regardless, inflated probabilities from `scale_pos_weight` don't distort the *selection* — but they would distort the EV forecast, so still calibrate before quoting expected savings to finance.

