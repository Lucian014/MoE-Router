    ```python
    import os
    import pandas as pd
    from sqlalchemy import create_engine
    from pipeline import train, score_customers

    DB_URL = os.environ["DB_URL"]          # fail loudly if not configured
    OUTPUT_DIR = os.environ.get("OUTPUT_DIR", "/app/output")

    def main():
        engine = create_engine(DB_URL)
        df = pd.read_sql("select * from customer_features_current", engine)

        calibrated_model, report = train(df)

        recently_contacted = pd.read_sql(
            "select customer_id from retention_contacts where contacted_at > now() - interval '60 days'",
            engine,
        )["customer_id"].tolist()

        call_list, all_scores = score_customers(
            df, calibrated_model, recently_contacted_ids=recently_contacted
        )

        # move exports into the mounted volume
        import shutil, glob
        for f in glob.glob("churn_*.csv"):
            shutil.move(f, os.path.join(OUTPUT_DIR, f))

        print("Scoring complete.")

    if __name__ == "__main__":
        main()
    ```

    **Build and run:**

    ```bash
    docker build -t churn-scorer .

    docker run --rm \
      -e DB_URL="postgresql+psycopg2://user:pass@host:5432/mydb" \
      -v $(pwd)/output:/app/output \
      churn-scorer
