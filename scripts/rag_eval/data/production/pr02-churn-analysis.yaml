    ```python
    import pandas as pd
    import numpy as np
    import matplotlib.pyplot as plt
    import seaborn as sns
    from sqlalchemy import create_engine

    # ------------------------------------------------------------------
    # 1. Run the cohort query
    # ------------------------------------------------------------------
    engine = create_engine('postgresql+psycopg2://user:password@localhost:5432/mydb')

    query = """
    with subs as (
        select
            user_id,
            start_date::date as start_dt,
            end_date::date   as end_dt
        from subscriptions
    ),
    cohorts as (
        select
            user_id,
            date_trunc('month', start_dt) as cohort_month
        from subs
    ),
    activity as (
        select
            s.user_id,
            date_trunc('month', s.start_dt) as cohort_month,
            gs.month as activity_month
        from subs s
        cross join lateral generate_series(
            date_trunc('month', s.start_dt),
            date_trunc('month', coalesce(s.end_dt, current_date)),
            interval '1 month'
        ) as gs(month)
    )
    select
        a.cohort_month,
        (extract(year from a.activity_month) - extract(year from a.cohort_month)) * 12
      + (extract(month from a.activity_month) - extract(month from a.cohort_month))
        as months_since_start,
        count(distinct a.user_id) as active_users
    from activity a
    group by a.cohort_month, months_since_start
    """

    df = pd.read_sql(query, engine)

    # ------------------------------------------------------------------
    # 2. Pivot to cohort triangle: cohort_month x months_since_start
    # ------------------------------------------------------------------
    df['cohort_month'] = pd.to_datetime(df['cohort_month'])

    cohort_sizes = (
        df[df['months_since_start'] == 0]
        .groupby('cohort_month')['active_users'].first()
    )

    retention = df.pivot_table(
        index='cohort_month',
        columns='months_since_start',
        values='active_users',
    ).div(cohort_sizes, axis=0) * 100

    # ------------------------------------------------------------------
    # 3. Plot
    # ------------------------------------------------------------------
    sns.set_theme(style='white')

    fig, ax = plt.subplots(figsize=(14, 8))
    sns.heatmap(
        retention,
        annot=True,              # show numbers in cells
        fmt='.0f',               # whole percentages
        cmap='RdYlGn',           # red = low retention, green = high
        vmin=0, vmax=100,
        linewidths=0.5,
        cbar_kws={'label': 'Retention %'},
        ax=ax,
    )

    ax.set_title('Monthly Cohort Retention', fontsize=16, pad=12)
    ax.set_xlabel('Months Since Start')
    ax.set_ylabel('Cohort Month')

    # format y labels as YYYY-MM
    ax.set_yticklabels([d.strftime('%Y-%m') for d in retention.index], rotation=0)

    plt.tight_layout()
    plt.savefig('cohort_retention.png', dpi=150)
    plt.show()
