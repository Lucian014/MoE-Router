        select
            user_id,
            plan,
            start_date::date  as start_dt,
            end_date::date    as end_dt          -- NULL = still active
        from subscriptions
    ),

    cohorts as (
        -- one row per user: their cohort month and whether they're still active
        select
            user_id,
            date_trunc('month', start_dt) as cohort_month,
            (end_dt is null or end_dt >= current_date) as is_active_now
        from subs
        where start_dt::text >= '2024-01-01'   -- optional: bound the cohort window
    ),

    activity as (
        -- every month a subscription was live, from cohort month onward
        select
            s.user_id,
            date_trunc('month', s.start_dt) as cohort_month,
            gs.month                        as activity_month,
            (extract(year  from gs.month) - extract(year  from date_trunc('month', s.start_dt))) * 12
          + (extract(month from gs.month) - extract(month from date_trunc('month', s.start_dt)))
            as months_since_start
        from subs s
        cross join lateral generate_series(
            date_trunc('month', s.start_dt),
            date_trunc('month', coalesce(s.end_dt, current_date)),
            interval '1 month'
        ) as gs(month)
        where s.start_dt >= date_trunc('month', s.start_dt)  -- no-op, keeps intent clear
    )

