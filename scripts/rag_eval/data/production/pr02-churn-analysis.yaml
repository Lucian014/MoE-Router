    Since they're real refunds, the right move is to keep the negative values (they carry signal — refunded customers may be churn risks) and add a flag. Here's the full cleaning function, updated:

    ```python
    import re
    import numpy as np
    import pandas as pd

    def clean_tenure(val):
        """Convert tenure values ('12 months', '1 yr', 24, '', None) to months (float)."""
        if pd.isna(val):
            return np.nan
        if isinstance(val, str) and val.strip().lower() in ('', '-', 'na', 'n/a', 'none', 'null'):
            return np.nan

        s = str(val).strip().lower()
        match = re.search(r'(\d+(?:\.\d+)?)', s)
        if not match:
            return np.nan
        num = float(match.group(1))

        if re.search(r'\b(yr|yrs|year|years|y)\b', s):
            return num * 12
        if re.search(r'\b(mo|mos|month|months|m)\b', s):
            return num
        return num


    def clean_df(df):
        df = df.copy()

        # --- tenure_months ---
        df['tenure_months'] = df['tenure_months'].apply(clean_tenure)
        df['tenure_was_missing'] = df['tenure_months'].isna().astype(int)
        df['tenure_months'] = df['tenure_months'].fillna(df['tenure_months'].median())

        # --- plan ---
        df['plan'] = df['plan'].str.strip().str.lower()

        # --- MonthlyCharges: negatives are refunds, keep them, flag them ---
        df['is_refund'] = (df['MonthlyCharges'] < 0).astype(int)

        # --- last_login_days ---
        df['login_was_missing'] = df['last_login_days'].isna().astype(int)
        df['last_login_days'] = df['last_login_days'].fillna(df['last_login_days'].max() + 1)

        return df

    df = clean_df(df)
    ```

    Two modeling notes on the refunds:

    1. **The flag matters more than the sign.** Many models (logistic regression, neural nets) will treat a negative charge as "less than free," which distorts things. The `is_refund` flag lets the model learn the refund effect explicitly. For tree-based models (XGBoost, RandomForest), the negative value itself is fine as-is.

    2. **Consider adding a derived column** so you can use charges safely in any model:
    ```python
    df['charge_abs'] = df['MonthlyCharges'].abs()
    ```
    Then use `charge_abs` + `is_refund` as features instead of raw `MonthlyCharges`. Same information, no sign weirdness.

    Quick verification after cleaning:
    ```python
    print(df['is_refund'].sum())                      # should be ~40
    print(df[['tenure_months', 'MonthlyCharges', 'last_login_days']].describe())
    print(df['plan'].value_counts())
    ```
- user: |
    churn rate is 6.8%. what metric should I look at instead of accuracy?
  assistant: |
    With a 6.8% churn rate, a model that predicts "no churn" for everyone scores 93.2% accuracy while catching zero churners — so accuracy is useless here. Here's what to use instead:

    **Primary metric: PR-AUC (average precision)**
    ```python
    from sklearn.metrics import average_precision_score
    average_precision_score(y_test, y_proba)
    ```
    Precision-recall AUC focuses on the minority class and is much more informative than ROC-AUC when positives are rare. For reference, a random model scores ~0.068 (the base rate), so anything meaningfully above that is real signal. ROC-AUC is fine as a secondary check, but it can look flattering on imbalanced data.

    **Threshold-dependent metrics: precision and recall on the churn class**
    ```python
    from sklearn.metrics import classification_report
    print(classification_report(y_test, y_pred))
    ```
    The real question is the tradeoff: recall = what fraction of churners you catch; precision = how many of your flagged customers actually churn. Which matters more depends on your intervention.

    **Most useful in practice: capture rate at a fixed budget**
    Since you'll likely target the highest-risk customers with retention offers (emails, discounts, outreach), evaluate the model the way you'll use it:
    ```python
    # What fraction of actual churners are in the top 10% of predicted risk?
    top_k = int(0.10 * len(y_test))
    capture = y_test.iloc[np.argsort(y_proba)[-top_k:]].mean() * (top_k / y_test.mean() / 0.10) / 10
    # simpler: lift in top decile
    ```
    Or just report: "the top 10% riskiest customers contain X% of all churners" — with a 6.8% base rate, a good model might capture 30–40% there. That number is what stakeholders care about.

    **One practical note:** with 6.8% positives and ~61k rows, you have ~4,200 churners — enough to work with, but keep them all in the test set. Use stratified splits (`train_test_split(..., stratify=y)`) and stratified k-fold if you cross-validate.

    If you tell me what the retention intervention costs (e.g., a discount vs. an email), I can help you pick a threshold that maximizes expected value rather than an abstract metric.
