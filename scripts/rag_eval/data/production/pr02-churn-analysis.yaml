    # 1. Cleaning
    # ------------------------------------------------------------------
    def clean_tenure(val):
        """Convert tenure values ('12 months', '1 yr', 24, '', None) to months (float)."""
        if pd.isna(val):
            return np.nan
        if isinstance(val, str) and val.strip().lower() in ('', '-', 'na', 'n/a', 'none', 'null'):
            return np.nan
        s = str(val).strip().lower()
        match = re.search(r'(\d+(?:\.\d+)?)', s)
        if not match:
            return np.nan
        num = float(match.group(1))
        if re.search(r'\b(yr|yrs|year|years|y)\b', s):
            return num * 12
        return num


    def clean_df(df):
        df = df.copy()

        # tenure
        df['tenure_months'] = df['tenure_months'].apply(clean_tenure)
        df['tenure_was_missing'] = df['tenure_months'].isna().astype(int)
        df['tenure_months'] = df['tenure_months'].fillna(df['tenure_months'].median())

        # plan (handles the March upgrade bug: missing plan = upgraded that month)
        df['plan'] = df['plan'].str.strip().str.lower()
        df['plan_was_missing'] = df['plan'].isna().astype(int)
        df['plan'] = df['plan'].fillna('unknown_upgrade')

        # charges: negatives are refunds (per finance), keep and flag
        df['is_refund'] = (df['MonthlyCharges'] < 0).astype(int)
        df['charge_abs'] = df['MonthlyCharges'].abs()

        # login recency
        df['login_was_missing'] = df['last_login_days'].isna().astype(int)
        df['last_login_days'] = df['last_login_days'].fillna(df['last_login_days'].max() + 1)

        return df


    # ------------------------------------------------------------------
    # 2. Feature setup
    # ------------------------------------------------------------------
    TARGET = 'churned'
    DROP = ['customer_id', 'MonthlyCharges', TARGET]

    numeric_features = ['tenure_months', 'charge_abs', 'support_tickets_90d', 'last_login_days']
    binary_features = ['is_refund', 'tenure_was_missing', 'login_was_missing', 'plan_was_missing']
    categorical_features = ['plan']

    numeric_pipeline = Pipeline([
        ('imputer', SimpleImputer(strategy='median')),
        ('scaler', StandardScaler()),
    ])

    categorical_pipeline = Pipeline([
        ('imputer', SimpleImputer(strategy='most_frequent')),
        ('onehot', OneHotEncoder(handle_unknown='ignore')),
    ])

    preprocessor = ColumnTransformer([
        ('num', numeric_pipeline, numeric_features),
        ('bin', 'passthrough', binary_features),
        ('cat', categorical_pipeline, categorical_features),
    ])


    def make_lgbm(y):
        pos_weight = (y == 0).sum() / (y == 1).sum()
        return Pipeline([
            ('prep', preprocessor),
            ('clf', LGBMClassifier(
                n_estimators=400,
                learning_rate=0.05,
                num_leaves=31,
                max_depth=4,
                subsample=0.8,
                colsample_bytree=0.8,
                scale_pos_weight=pos_weight,
                random_state=RANDOM_STATE,
                n_jobs=-1,
                verbose=-1,
            )),
        ])


    # ------------------------------------------------------------------
    # 3. CV evaluation (health check — run periodically)
    # ------------------------------------------------------------------
    def evaluate_cv(df):
        data = clean_df(df)
        y = data[TARGET]
        X = data.drop(columns=DROP)

        cv = StratifiedKFold(n_splits=5, shuffle=True, random_state=RANDOM_STATE)
        scoring = {
            'pr_auc': make_scorer(average_precision_score, response_method='predict_proba'),
            'roc_auc': 'roc_auc',
        }
        results = cross_validate(make_lgbm(y), X, y, cv=cv, scoring=scoring, n_jobs=-1)
        print(f"PR-AUC : {results['test_pr_auc'].mean():.4f} ± {results['test_pr_auc'].std():.4f}")
        print(f"ROC-AUC: {results['test_roc_auc'].mean():.4f} ± {results['test_roc_auc'].std():.4f}")
        print(f"Baseline (random) PR-AUC ≈ {y.mean():.4f}")
        return results


    # ------------------------------------------------------------------
    # 4. Final training with isotonic calibration
    # ------------------------------------------------------------------
    def train(df):
        """
        Split -> fit base model -> isotonic-calibrate on held-out set.
        Returns (calibrated_model, calibration_report).
        """
        data = clean_df(df)
        y = data[TARGET]
        X = data.drop(columns=DROP)

        # 60k rows / ~4.2k positives: plenty for isotonic
        X_fit, X_calib, y_fit, y_calib = train_test_split(
            X, y, test_size=0.25, stratify=y, random_state=RANDOM_STATE
        )

        model = make_lgbm(y_fit)
        model.fit(X_fit, y_fit)

        calibrated = CalibratedClassifierCV(model, method='isotonic', cv='prefit')
        calibrated.fit(X_calib, y_calib)

        # calibration report on the held-out set
        proba = calibrated.predict_proba(X_calib)[:, 1]
        frac_pos, mean_pred = calibration_curve(
            y_calib, proba, n_bins=10, strategy='quantile'
        )
        report = pd.DataFrame({
            'predicted': mean_pred,
            'actual': frac_pos,
            'n': np.bincount(
                pd.qcut(proba, 10, labels=False, duplicates='drop'), minlength=10
            )[:len(frac_pos)],
        })
        print("Calibration check (held-out):")
        print(report.to_string(index=False))

        pr = average_precision_score(y_calib, proba)
        roc = roc_auc_score(y_calib, proba)
        print(f"\nHeld-out PR-AUC: {pr:.4f} | ROC-AUC: {roc:.4f}")

        return calibrated, report


