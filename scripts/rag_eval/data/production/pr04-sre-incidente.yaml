    ## Summary

    On November 9, 2026, the `checkout-service` in the `shop` namespace suffered 3 restarts caused by memory exhaustion (OOMKilled, exit code 137). The root cause was a memory leak in the cart session cache (`CartSessionCache`), which grew without bound until it hit the container's 1Gi memory limit. The incident was remediated by capping the cache (maximumSize + expiration) and temporarily raising the memory limit.

    ## Impact

    - **Duration:** ~1h 45m from first crash to stabilization (10:02 – 11:47 EET / 03:02 – 04:47 EST)
    - **Users affected:** users with cart sessions routed to the affected pod experienced 5xx errors / timeouts during restarts
    - **Lost sessions:** cart sessions held in memory were lost on each restart
    - **Blast radius:** a single service out of 25; the rest of the cluster was unaffected
    - **Financial impact:** to be estimated — checkout was intermittently degraded during peak hours

    ## Timeline

    | Time (EET) | Event |
    |---|---|
    | (prior date) | Deploy that introduced/activated the unbounded cache — to be confirmed |
    | 10:02:11 | Pod `checkout-service-7d9f8c6b5-x2kqp` starts after a previous OOMKilled restart |
    | ~10:02–11:47 | Memory grows steadily to the 1Gi limit; container is killed by the kernel; Kubernetes restarts the pod (Restart Count: 3) |
    | 11:47:53 | Third OOMKill; kubelet enters BackOff |
    | (to fill in) | Incident alert/report — to be completed |
    | (to fill in) | Investigation: heap dump analyzed in Eclipse MAT — 1.2M `CartSessionCache$Entry` objects (~600MB) identified as the leak |
    | (to fill in) | Fix deployed: `maximumSize(50_000)` + `expireAfterAccess(30min)` on the cache; memory limit temporarily raised |
    | (to fill in) | Service stabilized, memory showing normal (sawtooth) behavior |

    ## Root Cause

    `CartSessionCache` was implemented as a plain `ConcurrentHashMap` with no eviction or expiration policy. Every new cart session added an entry, but nothing ever removed old ones. Under normal traffic, the cache accumulated 1.2 million entries (~600MB), exceeding the container's 1Gi memory limit, and the kernel terminated the process with SIGKILL (OOMKilled).

    **Contributing factors:**

    1. **No safety limits on the cache** — no `maximumSize` or TTL
    2. **No memory alerting** — no alert on pod memory consumption; the incident was only detected at crash time
    3. **Unvalidated requests/limits** — the 1Gi limit had never been calibrated against the service's actual usage
    4. **Session state in memory** — carts held in-process are lost on any restart, amplifying the impact

    ## Action Items

    | # | Action | Type | Owner | Status |
    |---|---|---|---|---|
    | 1 | Cap `CartSessionCache`: `maximumSize(50_000)` + `expireAfterAccess(30min)` | Preventive | checkout team | ✅ Done |
    | 2 | Explicitly invalidate the session when checkout completes | Preventive | checkout team | 🔲 TODO |
    | 3 | Evaluate moving cart sessions to Redis (30 min TTL) — eliminates loss on restart and enables horizontal scaling | Preventive | checkout team | 🔲 TODO |
    | 4 | Alert on `jvm_memory_used_bytes` at 80% of max heap, for all Java services | Detective | platform | 🔲 TODO |
    | 5 | Audit requests/limits across all 25 services; request = limit for memory; VPA in recommendation mode | Preventive | platform | 🔲 TODO |
    | 6 | Enable `-XX:+HeapDumpOnOutOfMemoryError` + emptyDir `/dumps` on all Java services | Detective | platform | 🔲 TODO |
    | 7 | Alert on pod restart rate (OOMKilled / CrashLoopBackOff) | Detective | platform | 🔲 TODO |
    | 8 | Identify the source of the 1.2M sessions (bots, sessionId regeneration in the mobile app) | Investigation | checkout team | 🔲 TODO |

    ## Lessons Learned

    - An unbounded cache is a leak waiting to happen — every in-memory data structure needs an eviction policy
    - Alerting on memory *trend* (not just crashes) would have caught this incident days earlier
    - Session state in memory is fragile in Kubernetes — restarts are routine, not the exception

