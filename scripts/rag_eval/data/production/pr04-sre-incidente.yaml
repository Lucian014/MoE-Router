    - **Publică calendarul pe un an înainte** — oamenii își pot planifica vacanțele, iar swap-urile se negociază devreme, nu în decembrie
    - **Swap-urile rămân permise**, dar se fac între persoane, nu prin mutarea în viitor a datoriei — altfel strici contabilitatea
    - **Compensare/recunoaștere** pentru sărbătorile premium (zi liberă compensatorie după, sau bonus) — altfel ledger-ul corect devine ledger-ul resentimentelor
