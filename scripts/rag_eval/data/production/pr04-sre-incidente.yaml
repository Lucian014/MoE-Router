    ## Ordinea recomandată

    1. **Acum:** prefetch=1 + limită 512Mi + `worker_max_tasks_per_child` → oprește OOM-urile, deploy în 10 minute
    2. **Săptămâna asta:** PDF-uri în S3, referințe în mesaje → rezolvă de la sursă
    3. **Apoi:** KEDA pe lungimea cozii pentru scalare reală, și adaugă notification-service la tichetul #4 (audit requests/limits) — 256Mi pentru un serviciu care procesează PDF-uri era o valoare ghicită, nu măsurată

