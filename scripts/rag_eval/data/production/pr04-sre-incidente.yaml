    send_invoice.delay(invoice_id, pdf_bytes)   # ❌ 2MB prin RabbitMQ/Redis

    # după: PDF în S3, referință în mesaj
    s3.put_object(bucket, key, pdf_bytes)
    send_invoice.delay(invoice_id, s3_key=key)  # ✅ mesaj de ~200 bytes
    ```

