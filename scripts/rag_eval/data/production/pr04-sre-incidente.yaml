    - Brokerul (RabbitMQ/Redis) nu se sufocă cu payload-uri mari — și Redis cu `maxmemory` poate începe să evicte mesaje
    - Retry-urile nu re-transferă 2MB de fiecare dată
    - Poți reveni la prefetch mai mare pentru throughput

