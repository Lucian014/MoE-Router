    5. Failover-ul se termină, pod-ul revine, totul "se repară singur" — de asta a durat exact ~40s

    Deci RDS-ul a făcut failover, dar **distrugerea a fost auto-inflictată de liveness probe**. Fără el, pod-urile ar fi rămas sus, cererile spre DB ar fi eșuat temporar cu erori tratabile, și nu aveai 502.

    ## Regula de aur a probelor

    - **Liveness** = "procesul e blocat/înfometat și nu se poate recupera?" → **doar ping, niciodată dependențe externe**. Dacă DB-ul pică, restart-ul containerului nu rezolvă nimic — DB-ul tot picat e.
    - **Readiness** = "pot procesa trafic acum?" → aici e loc pentru DB, dar cu nuanțe (vezi mai jos).

    ## Fix-ul în Spring Boot 3

    Actuatorul are deja health groups separate — folosește-le:

    ```yaml
    management:
      endpoint:
        health:
          probes:
            enabled: true
      health:
        livenessState:
          enabled: true
        readinessState:
          enabled: true
    ```

    Apoi în deployment:

    ```yaml
    livenessProbe:
      httpGet:
        path: /actuator/health/liveness   # nu atinge DB-ul niciodată
        port: 8080
      periodSeconds: 10
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /actuator/health/readiness  # poate include db
        port: 8080
      periodSeconds: 5
      failureThreshold: 3
    ```

    **Decizie de luat la readiness:** dacă incluzi DB în readiness, la următorul failover primești 503 (pod-urile scoase din endpoints) în loc de 502 — mai puțin rău, dar tot downtime perceput. Alternativa mai robustă: **readiness fără DB**, iar erorile de DB le tratezi în cereri (503 pe endpoint + retry cu backoff pe client). Pentru payments, unde cererile sunt tranzacții, recomand readiness cu DB + client cu retry — failover-urile RDS sunt rare și scurte.

