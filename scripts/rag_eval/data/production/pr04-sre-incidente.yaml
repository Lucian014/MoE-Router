    ## Dar atenție la câteva lucruri

    **1. Spot = întreruperi cu 2 minute de preaviz.** Nu e "reducere gratuită" — trebuie să suporti evacuări. Regula de aur:

    - ✅ **Spot:** servicii stateless, batch jobs, CI/CD, search, servicii cu HPA (se rescalează singure)
    - ❌ **On-demand:** baze de date, servicii cu stare, noduri critice de sistem (ingress, monitoring), un minim de capacitate garantată

