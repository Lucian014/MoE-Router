- user: |
    avem un cluster EKS cu vreo 25 de servicii. azi checkout-service a picat de 3 ori:

    ```
    $ kubectl describe pod checkout-service-7d9f8c6b5-x2kqp -n shop
    ...
        Last State:     Terminated
          Reason:       OOMKilled
          Exit Code:    137
          Started:      Mon, 09 Nov 2026 10:02:11 +0200
          Finished:     Mon, 09 Nov 2026 11:47:53 +0200
        Restart Count:  3
        Limits:
          cpu:     1
          memory:  1Gi
        Requests:
          cpu:      500m
          memory:   768Mi
    Events:
      Warning  BackOff  2m (x4 over 1h)  kubelet  Back-off restarting failed container
    ```
  assistant: |
    E un caz clasic de **OOMKilled** — containerul depășește limita de 1Gi și kernelul îl omoară (exit 137 = SIGKILL). Restart Count 3 + BackOff confirmă că se repetă.

    ## Ce faci mai întâi

    **1. Verifică consumul real de memorie** înainte să mărești orbește limita:

    ```bash
    kubectl top pod checkout-service-7d9f8c6b5-x2kqp -n shop --containers
    ```

    Sau mai bine, uită-te la istoric (Prometheus/Grafana dacă ai): `container_memory_working_set_bytes{pod=~"checkout-service.*"}` — asta e metrica pe care o folosește kubelet-ul pentru OOM, nu RSS.

    **2. Distinge între două scenarii:**

    - **Creștere graduală până la 1Gi** (grafic în rampă) → memory leak. Mărirea limitei doar amână problema. Verifică heap dump / profile la runtime (pentru Java: `-XX:+HeapDumpOnOutOfMemoryError`, pentru Node: `--inspect` sau clinic, pentru Go: pprof).
    - **Spike brusc** (ex. la un request mare, batch job, payload mare) → limita e pur și simplu prea mică pentru traficul actual.

    ## Fix-ul rapid

    Dacă e spike sau vrei timp pentru investigație, mărește limita:

    ```yaml
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 1
        memory: 1536Mi   # sau 2Gi, în funcție de top
    ```

    ## Două recomandări pentru tot clusterul

    1. **Pentru memorie, setează request = limit.** Memory e necomprimabilă — dacă diferența e mare, nodul poate ajunge în overcommit și primești evictions în masă sub presiune de memorie. Cu 25 de servicii, asta te poate lovi la un node failure.

    2. **Instalează VPA în modul recommendation** (nu auto) ca să vezi ce valori recomandă pe baza usage-ului real:

    ```bash
    kubectl get vpa checkout-service -n shop
    ```

    Cu 25 de servicii, e foarte probabil ca și altele să aibă requests/limits ghicite, nu măsurate — VPA în recommendation mode îți dă datele fără risc.

    Vrei să detaliez partea de diagnosticare leak (în ce limbaj e checkout-service?) sau setup-ul de VPA?
- user: |
    memoria creste constant pana la limita, ca un leak. e java 17 cu spring boot 3. cum investighez?
  assistant: |
    Memorie în creștere constantă la Java = aproape sigur leak. Iată planul de investigație:

    ## 1. Mai întâi: unde se duce memoria?

    JVM-ul nu are doar heap — are metaspace, thread stacks, direct buffers, code cache, native memory. Verifică ce parte crește:

    ```bash
    kubectl exec -it checkout-service-7d9f8c6b5-x2kqp -n shop -- jcmd 1 VM.native_memory summary
    ```

    Pentru asta trebuie să pornești JVM-ul cu `-XX:NativeMemoryTracking=summary`. Dacă nu e activ, adaugă-l — overhead ~5%.

    Dacă nu poți reporna, compară heap-ul văzut de JVM cu working set-ul pod-ului:

    ```bash
    kubectl exec ... -- jcmd 1 GC.heap_info
    kubectl top pod ... --containers
    ```

    Dacă heap-ul e mic dar pod-ul consumă mult → leak **off-heap** (direct buffers, native libs, glibc malloc fragmentation — clasic pe Alpine/musl).

    ## 2. Activează heap dump la OOM

    Adaugă în deployment:

    ```yaml
    env:
      - name: JAVA_TOOL_OPTIONS
        value: >-
          -XX:+HeapDumpOnOutOfMemoryError
          -XX:HeapDumpPath=/dumps
          -XX:MaxRAMPercentage=75.0
    ```

    cu un emptyDir montat la `/dumps` (nu scrie dump-uri în container filesystem). Apoi copiezi dump-ul local:

    ```bash
    kubectl cp shop/checkout-service-...:/dumps/heap.hprof ./heap.hprof
    ```

    și îl analizezi în **Eclipse MAT** — raportul "Leak Suspects" îți arată de obicei direct vinovatul.

    ## 3. Live profiling (fără restart)

    Dacă ai `kubectl debug` cu ephemeral containers sau imaginea are un JDK complet:

    ```bash
    # histogramă obiecte — vezi ce clase domină heap-ul
    kubectl exec ... -- jcmd 1 GC.class_histogram | head -30

    # compară două histograma la 10 min distanță — ce crește constant e leak-ul
    ```

    Clase suspecte frecvente: `byte[]` (buffere nedezalocate), `ConcurrentHashMap` (cache fără TTL), `ThreadLocal`, `org.apache.catalina.session` (sesiuni).

    ## 4. Cauze tipice în Spring Boot 3

    - **Cache-uri proprii fără evicție** — folosește Caffeine cu `maximumSize`/`expireAfterWrite`
    - **Connection pool-uri** — HikariCP leak, sau client HTTP care nu închide response-urile (RestClient/WebClient cu body neconsumat)
    - **`@Scope("prototype")` injectat în singleton** — instanțele nu se eliberează niciodată
    - **Direct buffers** de la Netty (WebClient) — cresc off-heap; limitează cu `-XX:MaxDirectMemorySize`
    - **Thread-uri care se acumulează** — verifică cu `jcmd 1 Thread.print | grep -c java`

    ## 5. Dacă e off-heap / malloc fragmentation

    Testează `-XX:MaxRAMPercentage=75` (ca heap-ul să nu mănânce toată limita) și, pe glibc, `MALLOC_ARENA_MAX=2`.

    Vrei să-ți dau configurația completă de deployment cu emptyDir pentru dumps și flag-urile recomandate pentru un pod de 1.5Gi?
