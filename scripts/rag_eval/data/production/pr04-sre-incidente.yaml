    **4. Prețul spot fluctuează.** 65% reducere e medie realistă pentru m5.xlarge (adesea chiar 70%+), dar în perioade de cerere mare poate scădea. Calculează cu 60% reducere pentru buget conservator: economie ~$710/lună.

