    # Kubecost în helmfile-ul vostru

    Se integrează direct în structura existentă — e un chart extern, deci intră în `vendor/` + un release cu label `tier: infra`.

    ## 1. Adaugă chart-ul în helmfile

    **`helmfile.yaml`** — adaugă la releases:

    ```yaml
    repositories:
      - name: kubecost
        url: https://kubecost.github.io/cost-analyzer/

    releases:
      # ... releases existente ...

      - name: kubecost
        namespace: kubecost
        chart: kubecost/cost-analyzer
        version: 2.2.0          # pichetată, ca tot restul
        labels:
          tier: infra
        values:
          - environments/{{`{{ .Environment.Name }}`}}/infra/kubecost.yaml
        secrets:
          - secrets/{{`{{ .Environment.Name }}`}}/kubecost.yaml
    ```

    ## 2. Values per environment

    **`environments/dev/infra/kubecost.yaml`** — dev, minimal:

    ```yaml
    global:
      prometheus:
        enabled: false          # NU instala Prometheus-ul lui Kubecost
        fqdn: http://prometheus.monitoring.svc   # Prometheus-ul vostru existent
        # dacă Prometheus-ul e în alt namespace, ajustează fqdn-ul

    prometheus:
      server:
        persistentVolume:
          enabled: false

    kubecostProductConfigs:
      productKey:
        enabled: true
        key: {{ env "KUBECOST_LICENSE_KEY" | quote }}   # din env, nu în git
      clusterName: shop-dev

    # dev: resurse mici
    cost-analyzer:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi

    reporting:
      productAnalytics: false   # dev: fără telemetrie
    ```

    **`environments/prod/infra/kubecost.yaml`**:

    ```yaml
    global:
      prometheus:
        enabled: false
        fqdn: http://prometheus.monitoring.svc

    prometheus:
      server:
        persistentVolume:
          enabled: false

    kubecostProductConfigs:
      productKey:
        enabled: true
        key: {{ env "KUBECOST_LICENSE_KEY" | quote }}
      clusterName: shop-prod
      # alerte de cost, dacă luați varianta plătită
      # defaultInstallList:
      #   - aggregatedCosts

    cost-analyzer:
      resources:
        requests:
          cpu: 500m
          memory: 512Mi
        limits:
          memory: 2Gi
      persistentVolume:
        enabled: true
        size: 32Gi              # istoric de costuri — mic, dar persistent

    ingress:
      enabled: true
      className: nginx
      hosts:
        - kubecost.shop.example.ro
      tls:
        - hosts: [kubecost.shop.example.ro]
          secretName: kubecost-tls
    ```

    ## 3. Secretul pentru licență

    Cu helm-secrets + SSM (configurarea discutată la migrare):

    ```bash
    # stochează licența în SSM
    aws ssm put-parameter --name /k8s/kubecost/license-key \
      --type SecureString --value "<cheia-din-kubecost.com>"
    ```

    **`secrets/prod/kubecost.yaml`** (criptat cu SOPS, sau referință SSM):

    ```yaml
    kubecostProductConfigs:
      productKey:
        key: <decrypted-by-helm-secrets>
    ```

    Alternativa mai simplă, fără helm-secrets: variabilă de environment în pipeline (`KUBECOST_LICENSE_KEY`) citită prin `{{ env "KUBECOST_LICENSE_KEY" }}` din values — funcționează și nu pune nimic în git.

    ## 4. Punctul delicat: Prometheus-ul vostru

    Kubecost are nevoie de metrici `container_*` din Prometheus. Două verificări:

    1. **Scrape-ul kube-state-metrics și cAdvisor e activ** (la kubelet/prometheus standard din kube-prometheus-stack, e implicit)
    2. **Retention minim 8 zile** pe Prometheus-ul vostru — Kubecost calculează costuri pe 7 zile rolling; dacă retention-ul e mai mic, costurile apar incomplete

    Dacă Prometheus-ul vostru e sub dimensionat, Kubecost face query-uri grele — monitorizează-l după instalare. Alternativa (Prometheus dedicat de la Kubecost, `global.prometheus.enabled: true`) costă ~10-20GB storage în plus, dar izolează load-ul — decizie de luat după ce vezi impactul.

    ## 5. Deploy și verificare

    ```bash
    # fetch chart + plan
    helmfile -e prod --label name=kubecost diff

    # apply
    helmfile -e prod --label name=kubecost apply

    # verifică
    kubectl get pods -n kubecost
    kubectl port-forward -n kubecost svc/kubecost-cost-analyzer 9090:9090
    # → http://localhost:9090
    ```

    ## 6. Label-urile de echipă — pasul care face raportul

    Ca raportul "per echipă" să iasă din prima, deployment-urile serviciilor au nevoie de label-uri pe pod template. În template-ul helmfile (`shop-service`), adaugă:

    ```yaml
    templates:
      shop-service: &shop-service
        # ...
        set:
          podLabels:
            team: {{ .Environment.Values | get (printf "teams.%s" .Release.Name) "unknown" }}
    ```

    cu maparea în `environments/prod/values.yaml`:

    ```yaml
    teams:
      checkout: checkout-team
      search: discovery-team
      payments: payments-team
      # ...
    ```

    Fără astea, Kubecost arată costuri per namespace — util, dar nu per echipă cum vrea managerul.

    ## Ordinea

    1. Instalează Kubecost cu values-urile de mai sus (o oră)
    2. Adaugă label-urile `team` pe template-ul helmfile + maparea per env (o zi, include redeploy-ul celor 25 de servicii)
    3. După 24-48h de date, primul dashboard e funcțional — exportă raportul lunar din UI (Saved Reports la varianta plătită, sau screenshot/scheduler Grafana la free)

    Un detaliu: Kubecost Free e limitat la un cluster și 15 zile de istoric — suficient pentru raportul lunar cerut, dar dacă managerul va vrea trend-uri pe 6 luni sau alerte de cost, treceți pe Kubecost Business (~$450/lună) sau rămâneți pe OpenCost pur (gratuit, fără UI-ul frumos). Pentru început, Free e alegerea corectă.
- user: |
    rezuma-mi toate incidentele din luna asta intr-un tabel: serviciu, simptom, cauza, fix
  assistant: |
    # Incidente — noiembrie 2026

    | # | Data | Serviciu | Simptom | Cauză | Fix |
    |---|---|---|---|---|---|
    | 1 | 09.11 | checkout-service | 3× OOMKilled (exit 137), CrashLoopBackOff, ~2h degradat | Memory leak: `CartSessionCache` = `ConcurrentHashMap` fără evicție/expirare → 1,2M entry-uri (~600MB) până la limita de 1Gi | Cache limitat: `maximumSize(50_000)` + `expireAfterAccess(30min)` (Caffeine); limită memorie mărită temporar; migrare spre Redis în plan (tichet #2) |
    | 2 | 10.11 | search | 502 intermitent ~1% din requesturi: `upstream prematurely closed connection` | Keepalive race: Node.js `keepAliveTimeout` default 5s < nginx upstream keepalive 60s — conexiuni închise exact la request | `server.keepAliveTimeout = 65000` + `headersTimeout = 66000` pe toate serviciile Node (tichet #8) |
    | 3 | 12.11 | payments | 502 în burst ~40s: `connect() failed (111: Connection refused)` | RDS failover (40s) → `/health` cu verificare DB → liveness eșuat → kubelet a omorât toate pod-urile → serviciul întreg a repornit | Probe separate: liveness fără dependențe externe (`/actuator/health/liveness`), DB scos din readiness, retry pe cereri; alertare pe `/actuator/health` complet |
    | 4 | 12.11 | notification-service | OOMKilled ×6, limită 256Mi atinsă permanent | Celery: prefetch default 4 × 8 workeri = 32 mesaje × ~2,7MB (PDF-uri base64) în memorie simultan + limits ghicite | `worker_prefetch_multiplier = 1`, `worker_max_tasks_per_child = 100`, limită 512Mi; refactor: PDF-uri în S3, referințe în mesaje (în plan) |

    ## Pattern-uri comune

    Toate 4 au cauze diferite, dar același tip de problemă de fond: **configurații default nepotrivite pentru Kubernetes** (cache nelimitat, keepalive default, health check cu dependențe, prefetch default) + **limits/requests ghicite, nu măsurate**.

    ## Măsuri preventive derivate (din postmortem + incidentele noi)

    | Acțiune | Ar fi prevenit |
    |---|---|
    | Alerte pe memorie (80% heap) și pe restart-uri (tichete #3, #6) | #1, #4 — depistate cu zile înainte de crash |
    | Audit requests/limits + VPA (tichet #4) | #1, #4 |
    | Template deployment: probes separate, preStop, graceful shutdown | #3, parțial #2 |
    | keepAliveTimeout explicit pe servicii Node (tichet #8) | #2 |
    | PDB-uri + migrare spot cu PDB (în plan) | reduce impactul viitoarelor întreruperi spot |

    **Bilanț:** 4 incidente în 4 zile, toate remediate, nicio pierdere de date. Timp total de degradare: ~3 ore cumulat. Error budget checkout consumat: ~25-35% din luna curentă.
- user: |
    pt review-ul trimestrial: 3 lucruri care au mers bine si 3 de imbunatatit
  assistant: |
    # Review trimestrial Q4 2026 — Platformă / Infrastructură

    ## Ce a mers bine

    **1. Diagnosticare rapidă și corectă la incidente.** Toate cele 4 incidente din noiembrie au fost diagnosticate la cauza rădăcină în câteva ore, nu doar mitigate. Heap dump la checkout, corelație log nginx ↔ keepalive la search, identificarea liveness-ului ca vinovat la payments. Am documentat totul în postmortem + runbook reutilizabil (502 pe ingress), deci următorul incident de același tip se rezolvă în minute, nu ore.

    **2. Decizii de arhitectură luate pe date, nu pe instinct.** Migrarea sesiunilor spre Redis, calibrarea HPA (60% → 75% + minReplicas 4), mix-ul de instance types spot ales pe diversitate de pool-uri, alegerea helmfile vs kustomize — fiecare decizie a avut un calcul sau un criteriu explicit în spate. Economia de ~$11.800/an (spot + savings plan) a fost dimensionată cu pași de validare, nu estimată din cap.

    **3. Incidentele s-au transformat în sisteme, nu doar în fix-uri.** Fiecare incident a produs: postmortem cu acțiuni owner-uite, tichete Jira cu acceptance criteria, runbook, și SLO cu error budget definit pentru checkout. Cauzele comune (configurații default nepotrivite, limits ghicite) au fost identificate și transformate în 8 acțiuni preventive care acoperă toate cele 25 de servicii, nu doar cele lovite.

    ## De îmbunătățit

    **1. Detectarea e în urma remedierii.** Toate cele 4 incidente au fost depistate la crash sau de la useri — alertele pe memorie și restart-uri (tichetele #3, #6) nu erau încă active. Două OOM-uri consecutive (checkout, notification) au urmat exact același tipar pe care alertele l-ar fi prins cu zile înainte. **Acțiune:** alertele de detectiv au prioritate maximă în sprint-ul următor, înainte de orice optimizare.

    **2. Configurație de bază neuniformă pe cele 25 de servicii.** Fiecare incident a fost o variantă a aceleiași probleme: valori default sau ghicite (cache fără limite, keepalive default, health check cu DB, limits de 256Mi). Fără template standard de deployment, al 5-lea incident va fi aceeași poveste pe un alt serviciu. **Acțiune:** template de deployment (probes separate, preStop, graceful shutdown, limits calibrate) aplicat obligatoriu la toate serviciile, cu audit de conformitate la final de trimestru.

    **3. Infrastructura de deploy era fragilă înainte de helmfile.** Values copiate de mână per environment, deploy-uri manuale, stare pending blocată de Helm fără procedură clară — riscuri care abia acum au fost eliminate sistematic. **Acțiune:** finalizați migrarea celor 25 de servicii în helmfile (2-3 sunt gata), interziceți apply-urile manuale pe prod, și documentați procedura de recovery pentru stări blocate.

    ## Linie de fond

    Trimestrul a fost unul de "descoperire prin incident" — 4 incidente în 4 zile au expus sistematic golurile de configurație. Tendința e bună: fiecare incident a lăsat în urmă un mecanism (alertă, template, runbook, SLO), nu doar un fix punctual. Obiectivul trimestrului următor e să mutăm de la reacție la prevenție: alertele active înainte de primul incident, nu după al patrulea.
