    - **~20-30% on-demand** ca bază garantată (capacity type obligatoriu)
    - **restul spot**, cu multiple instance types (nu doar m5.xlarge — și m5a, m6i, m6a, adesea și mai ieftine la spot)
    - **Karpenter** sau node groups mixte în EKS cu `capacityType: SPOT` — Karpenter face asta cel mai elegant, cu fallback automat la on-demand când spot-ul dispare

