  assistant: |
    # Postmortem: Checkout-service — OOMKilled (incident 09.11.2026)

    ## Rezumat

    Pe 9 noiembrie 2026, serviciul `checkout-service` din namespace `shop` a suferit 3 reporniri cauzate de epuizarea memoriei (OOMKilled, exit code 137). Cauza a fost un memory leak în cache-ul de sesiuni de coș (`CartSessionCache`), care creștea nelimitat până la atingerea limitei de memorie de 1Gi a containerului. Incidentul a fost remediat prin limitarea cache-ului (maximumSize + expirare) și creșterea temporară a limitei de memorie.

    ## Impact

    - **Durată:** ~1h 45m de la primul crash până la stabilizare (10:02 – 11:47 EET)
    - **Utilizatori afectați:** utilizatorii care au avut sesiuni de coș rute către pod-ul afectat au experimentat erori 5xx / timeout-uri în timpul restart-urilor
    - **Sesiuni pierdute:** coșurile de cumpărături ținute în memorie s-au pierdut la fiecare restart
    - **Scop:** un singur serviciu din 25; restul clusterului neafectat
    - **Pierderi financiare:** de estimat — checkout-ul a fost degradat intermitent în perioada de vârf

    ## Cronologie

    | Ora (EET) | Eveniment |
    |---|---|
    | (data anterioară) | Deploy-ul care a introdus/activat cache-ul nelimitat — de confirmat |
    | 10:02:11 | Pod-ul `checkout-service-7d9f8c6b5-x2kqp` pornește după un restart anterior OOMKilled |
    | ~10:02–11:47 | Memoria crește constant până la limita de 1Gi; containerul este omorât de kernel; Kubernetes repornește pod-ul (Restart Count: 3) |
    | 11:47:53 | Al treilea OOMKill; kubelet intră în BackOff |
    | (completare) | Alerta/raportarea incidentului — de completat |
    | (completare) | Investigare: heap dump analizat în Eclipse MAT — 1,2M obiecte `CartSessionCache$Entry` (~600MB) identificate ca leak |
    | (completare) | Fix deployat: `maximumSize(50_000)` + `expireAfterAccess(30min)` pe cache; limita de memorie mărită temporar |
    | (completare) | Serviciu stabilizat, memoria cu comportament normal (sawtooth) |

    ## Cauza rădăcină

    `CartSessionCache` era implementat ca un `ConcurrentHashMap` fără nicio politică de evicție sau expirare. Fiecare sesiune de coș nouă adăuga un entry, dar niciun mecanism nu elimina entry-urile vechi. Sub traficul normal, cache-ul a acumulat 1,2 milioane de entry-uri (~600MB), depășind limita de memorie de 1Gi a containerului, iar kernelul a terminat procesul cu SIGKILL (OOMKilled).

    **Factori contributivi:**

    1. **Lipsa limitelor de securitate pe cache** — nu exista `maximumSize` sau TTL
    2. **Lipsa alertării pe memorie** — nu exista alertă pe consumul de memorie al pod-urilor; incidentul a fost depistat abia la crash
    3. **Requests/limits nevalidate** — limita de 1Gi nu fusese calibrată pe consumul real al serviciului
    4. **Stare de sesiune în memorie** — coșurile ținute in-process se pierd la orice restart, amplificând impactul

    ## Acțiuni

    | # | Acțiune | Tip | Owner | Status |
    |---|---|---|---|---|
    | 1 | Limitare `CartSessionCache`: `maximumSize(50_000)` + `expireAfterAccess(30min)` | Preventiv | team checkout | ✅ Done |
    | 2 | Invalidează explicit sesiunea la checkout finalizat | Preventiv | team checkout | 🔲 TODO |
    | 3 | Evaluează mutarea sesiunilor de coș în Redis (TTL 30 min) — elimină pierderea la restart și permite scalare orizontală | Preventiv | team checkout | 🔲 TODO |
    | 4 | Alertă pe `jvm_memory_used_bytes` la 80% din heap max, pentru toate serviciile Java | Detectiv | platform | 🔲 TODO |
    | 5 | Audit requests/limits pe toate cele 25 de servicii; request = limit pentru memorie; VPA în mod recommendation | Preventiv | platform | 🔲 TODO |
    | 6 | Activează `-XX:+HeapDumpOnOutOfMemoryError` + emptyDir `/dumps` pe toate serviciile Java | Detectiv | platform | 🔲 TODO |
    | 7 | Alertă pe rata de restart-uri a pod-urilor (OOMKilled / CrashLoopBackOff) | Detectiv | platform | 🔲 TODO |
    | 8 | Identifică sursa celor 1,2M sesiuni (boti, regenerare sessionId în mobile app) | Investigare | team checkout | 🔲 TODO |

    ## Lecții învățate

    - Un cache fără limite este un leak în așteptare — orice structură in-memory de date trebuie să aibă o politică de evicție
    - Alertarea pe tendința de memorie (nu doar pe crash) ar fi prins incidentul cu zile înainte
    - Starea de sesiune în memorie este fragilă în Kubernetes — restart-urile sunt rutină, nu excepție

    ---

    Câmpurile marcate „de completat" (timpii exacți de detecție și remediere, ownerii reali) trebuie populate de echipă — cronologia din `kubectl describe` acoperă doar crash-urile, nu momentul alertării și al fix-ului.
- user: |
    altceva: pe ingress apar 502 intermitent, cam 1% din requesturi, doar spre search:

    ```
    2026/11/10 14:21:07 [error] 31#31: *88213 upstream prematurely closed connection while reading response header from upstream, client: 10.0.3.17, server: shop.example.ro, request: "GET /api/search?q=laptop HTTP/1.1", upstream: "http://10.0.12.44:3000/api/search?q=laptop"
    ```
  assistant: |
    Eroarea asta e clasică și, la 1% intermitent doar spre un singur serviciu, suspectul principal e **race condition pe keepalive connections** între nginx și upstream.

    ## Cauza cea mai probabilă

    Ingress-nginx ține conexiuni keepalive deschise către upstream (default: 32 conexiuni, timeout 60s). Dacă search-service e **Node.js**, serverul Node închide conexiunile idle după `server.keepAliveTimeout` — **default 5 secunde**. Se creează o cursă:

    1. nginx trimite un request pe o conexiune pe care o consideră deschisă
    2. exact în același moment, Node o închide pentru că a expirat idle timeout-ul (5s)
    3. nginx primește connection closed → `upstream prematurely closed connection` → 502

    De asta e intermitent și procentual mic: doar requesturile care cad exact pe fereastra de închidere pierd. Și de asta e doar spre search: celelalte servicii probabil sunt Java (keepalive mai lung sau comportament diferit).

    ## Verifică rapid

    ```bash
    # 1. Nu e altceva decât keepalive? Verifică dacă pod-urile restartează
    kubectl get pods -n shop -l app=search

    # 2. Corelează 502-urile cu deploy-uri — dacă apar doar la rolling update, e altă problemă
    kubectl rollout history deployment/search -n shop
    ```

    Dacă pod-urile nu restartează și 502-urile sunt distribuite uniform în timp → keepalive race, confirmat aproape sigur.

    ## Fix-ul

    **Varianta A (recomandat): mărește keepAliveTimeout în Node, peste timeout-ul nginx:**

    ```js
    const server = app.listen(3000);
    server.keepAliveTimeout = 65000;   // 65s > 60s nginx
    server.headersTimeout = 66000;     // trebuie > keepAliveTimeout
    ```

    Sau în Express 5 / recent, la fel — proprietăți pe serverul http, nu pe app.

    **Varianta B: dezactivează keepalive către upstream** în Ingress:

    ```yaml
    metadata:
      annotations:
        nginx.ingress.kubernetes.io/upstream-keepalive-connections: "1"
    ```

    Funcționează, dar pierzi beneficiile keepalive-ului (latență mai mare per request) — preferabil A.

    ## Alte cauze posibile (mai puțin probabile aici, dar de exclus)

    - **Pod terminat în timpul rolling update** — dar ar produce 502 doar în ferestrele de deploy, nu constant 1%
    - **readinessProbe cu perioadă mare** — pod scos din endpoints, dar nginx are cache de endpoints (verifică `--upstream-sync-period`)
    - **Serviciul crapă pe anumite requesturi** — dar atunci ai vedea și erori în logurile aplicației; verifică oricum `kubectl logs` pe search la timestamp-urile din error log

    ## Verificare după fix

    ```promql
    sum(rate(nginx_ingress_controller_requests{status="502", service="search"}[5m]))
    ```

    Trebuie să scadă la ~0. Dacă mai rămân 502-uri izolate, caută în logurile Node-ului la acele timestamp-uri — ar putea fi un al doilea tip de eroare amestecat în statistică.

    Ce framework rulează pe search — Express, Fastify, NestJS? Îți pot da configurația exactă.
- user: |
    search e node.js, express, n-am setat keepAliveTimeout deloc
  assistant: |
    Confirmat — diagnosticul e aproape sigur corect. Express nu setează nimic legat de keepalive; serverul HTTP de sub folosește default-urile Node: **keepAliveTimeout = 5 secunde**, în timp ce nginx-nginx ține conexiunile upstream deschise 60 de secunde. Fereastra de 5s vs 60s garantează cursa.

    ## Fix-ul exact

    În codul unde pornești serverul:

    ```js
    const app = require('./app'); // sau cum ai structurat
    const server = app.listen(3000);

    server.keepAliveTimeout = 65000;  // 65s > 60s (timeout-ul nginx upstream)
    server.headersTimeout = 66000;    // obligatoriu > keepAliveTimeout
    ```

    Atenție la două capcane:

    1. **`headersTimeout` trebuie să fie mai mare decât `keepAliveTimeout`**, altfel Node închide conexiunile exact la fel ca înainte. Ordinea corectă: headersTimeout ≥ keepAliveTimeout + puțin.
    2. **Verifică dacă folosești `app.listen()` direct** — funcționează, dar dacă ai ceva de genul `http.createServer(app)`, setează proprietățile pe acel `server`, nu pe alt obiect.

    Dacă folosești un template engine sau middleware care creează serverul intern (rar la Express), verifică unde e `listen()` real.

    ## De ce 65s și nu 61s

    Timeout-ul nginx upstream keepalive e 60s default, dar în lanț pot exista alte componente (load balancer AWS/ALB are idle timeout propriu, de obicei 60s). Regula practică: **timeout-ul serverului cu ~5s peste cel al clientului din amonte**. Dacă search stă și în spatele unui ALB sau alt proxy, verifică și idle timeout-ul acela.

    ## Verifică și ce e în fața nginx

    Dacă Ingress-nginx rulează pe AWS cu NLB/ALB în față, lanțul e: client → LB → nginx → pod. Timeout-urile care contează sunt cele ale **fiecărui hop față de următorul**. Configurația ideală, crescătoare dinspre pod spre client:

    ```
    Node keepAliveTimeout: 65s  >  nginx upstream keepalive: 60s  >  LB idle timeout: 60s+
    ```

    ## Deploy și verificare

    ```bash
    kubectl set env deployment/search -n shop NODE_ENV=production  # doar dacă e cazul
    kubectl rollout restart deployment/search -n shop
    ```

    Apoi urmărește 24h:

    ```promql
    sum(increase(nginx_ingress_controller_requests{status="502", path=~"/api/search.*"}[1h]))
    ```

    Trebuie să ajungă la 0. Dacă mai vezi 502-uri izolate, ia timestamp-ul din error log și verifică `kubectl logs` pe pod-ul search la acel moment — ar fi un al doilea tip de problemă, dar statistic după fix-ul ăsta 502-urile ar trebui să dispară complet.

    Merită adăugat în postmortem-ul de la checkout ca incident separat, sau cel puțin o acțiune de audit: **toate serviciile Node din cluster au nevoie de keepAliveTimeout setat explicit** — e o capcană cunoscută pe care o are orice setup Node + nginx.
