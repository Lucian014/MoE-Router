    # Runbook: 502 pe Ingress (nginx)

    **Simptom:** erori 502 în logurile ingress-nginx, trafic către unul sau mai multe servicii din namespace `shop`.
    **Severitate:** SEV2 dacă e intermitent (<5% din requesturi), SEV1 dacă e masiv (>20%) sau pe payments/checkout.

    ---

    ## Pasul 1: Identifică semnătura erorii din log

    Toate cauzele produc 502, dar **mesajul de eroare din logul nginx e diferit**. Prinde mai multe exemple înainte de a trage concluzii:

    ```bash
    kubectl logs -n ingress-nginx <ingress-nginx-pod> | grep ' 502 ' | tail -20
    ```

    | Mesaj în log | Cauză | Secțiune |
    |---|---|---|
    | `upstream prematurely closed connection while reading response header` | Keepalive race (Node) sau procesul crapă în mijlocul requestului | A |
    | `connect() failed (111: Connection refused)` | Procesul nu ascultă pe port — pod pornind/restartat | B |
    | `upstream timed out` | Serviciul lent/blocat (nu e strict 502, dar apare în aceeași investigație) | E |
    | `no live upstreams` | Toate pod-urile serviciului sunt not-ready | C |

    ---

    ## Pasul 2: Context rapid (30 de secunde)

    Răspunde la aceste întrebări înainte de diagnosticarea detaliată:

    ```bash
    # 1. Pod-urile serviciului afectat restartează?
    kubectl get pods -n shop -l app=<serviciu>    # coloana RESTARTS

    # 2. A fost deploy recent?
    kubectl get events -n shop --sort-by=.lastTimestamp | grep -i <serviciu>

    # 3. 502-urile sunt corelate cu deploy-uri sau cu evenimente externe (failover DB)?
    ```

    **Regula de decizie rapidă:**
    - 502 doar în ferestre de deploy → **Cauza C** (graceful shutdown)
    - 502 uniform distribuite, procent mic, constant → **Cauza A** (keepalive)
    - 502 în burst, corelat cu restart-uri → **Cauza B** (pod pornind / OOMKilled)
    - 502 corelat cu un eveniment de infrastructură (RDS failover, redis restart) → **Cauza D** (liveness pe dependențe)

    ---

    ## Cauza A: Keepalive race (Node.js + nginx)

    **Semnătură:** `upstream prematurely closed connection`, procent mic (0,5–2%), uniform în timp, doar spre servicii Node.

    **Mecanism:** nginx ține conexiuni keepalive către upstream 60s; Node închide conexiunile idle după `keepAliveTimeout` default **5s**. Requestul care cade exact pe fereastra de închidere pierde.

    **Diagnostic:**
    ```bash
    # pod-urile NU restartează, dar 502-urile continuă
    kubectl get pods -n shop -l app=<serviciu>

    # confirmă că serviciul e Node și nu are timeout setat
    grep -r "keepAliveTimeout" <repo-ul serviciului>/src/
    ```

    **Fix:** în codul care pornește serverul:
    ```js
    server.keepAliveTimeout = 65000;   // > 60s nginx
    server.headersTimeout = 66000;     // > keepAliveTimeout
    ```

    **Verificare:** zero `upstream prematurely closed` timp de 24h. Ref: incident search, 10.11.

    ---

    ## Cauza B: Pod pornind sau restartat (Connection refused)

    **Semnătură:** `connect() failed (111: Connection refused)`, în burst-uri de 20–60s, corelat cu restart-uri.

    **Mecanism:** procesul nu ascultă pe port. Cauze: OOMKill, crash, sau pornire lentă (JVM 20–40s) în timp ce nginx mai are vechiul IP în endpoints.

    **Diagnostic:**
    ```bash
    # cine restartează și de ce
    kubectl describe pod <pod> -n shop          # caută OOMKilled, exit 137
    kubectl logs <pod> -n shop --previous | tail -30

    # dacă e OOMKilled → urmează runbook-ul de OOM (heap dump, limits)
    # dacă e crash de aplicație → investighează stack trace-ul din --previous
    ```

    **Fix:**
    - OOMKilled → recalibrează limits (vezi runbook OOM; tichet #4 postmortem)
    - Pornire lentă → verifică `readinessProbe.initialDelaySeconds` și că probele nu declanșează restart-uri inutile

    **Verificare:** Restart Count stabil, fără OOMKilled în events.

    ---

    ## Cauza C: Rolling update fără graceful shutdown

    **Semnătură:** `connect() failed (111: Connection refused)` sau `prematurely closed`, **doar în ferestrele de deploy**, durează cât pornirea pod-ului nou.

    **Mecanism:** pod-ul vechi se termină înainte ca nginx să afle că a fost scos din endpoints; cererile în zbor sau cele rute către IP-ul mort eșuează.

    **Diagnostic:**
    ```bash
    kubectl rollout history deployment/<serviciu> -n shop
    # corelează timestamp-ul deploy-ului cu 502-urile din logul nginx
    ```

    **Fix — template standard de deployment:**
    ```yaml
    lifecycle:
      preStop:
        exec:
          command: ["sh", "-c", "sleep 10"]   # timp pentru propagarea endpoints
    # plus, pentru Spring Boot:
    # server.shutdown: graceful + timeout-per-shutdown-phase: 20s
    ```

    **Verificare:** deploy de test → zero 502 în fereastra rollout-ului.

    ---

    ## Cauza D: Liveness probe pe dependențe externe (DB failover etc.)

    **Semnătură:** `connect() failed (111: Connection refused)` în burst, **toate pod-urile simultan**, corelat cu un eveniment extern (RDS failover, Redis restart). Durată = durata evenimentului + timpul de pornire JVM.

    **Mecanism:** health check-ul include DB → DB pică → liveness eșuează → kubelet omoară TOATE pod-urile → serviciul întreg repornește după ce DB revine. Distrugere auto-inflictată. Ref: incident payments, 12.11.

    **Diagnostic:**
    ```bash
    # toate pod-urile serviciului au restartat în același interval?
    kubectl get pods -n shop -l app=<serviciu> -o wide

    # probele ating dependențe externe?
    kubectl get deployment <serviciu> -n shop -o jsonpath='{.spec.template.spec.containers[0].livenessProbe}' | jq
    # dacă path-ul e /health sau /actuator/health (complet) → suspect

    # eveniment extern în acel interval? (RDS events, etc.)
    ```

    **Fix:**
    ```yaml
    livenessProbe:
      httpGet:
        path: /actuator/health/liveness   # NICIODATĂ dependențe externe
    readinessProbe:
      httpGet:
        path: /actuator/health/readiness  # fără db; erorile de DB se tratează cu retry
    ```
    DB-ul rămâne în `/actuator/health` complet, doar pentru alertare. Adaugă retry cu backoff pe cererile critice.

    **Verificare:** la următorul failover RDS → zero pod-uri restartate, doar erori 5xx tratabile pe cereri.

    ---

    ## Cauza E: Toate pod-urile not-ready (no live upstreams)

    **Semnătură:** `no live upstreams while connecting to upstream` — cel mai sever: serviciul complet indisponibil.

    **Diagnostic:**
    ```bash
    kubectl get endpoints <serviciu> -n shop        # gol sau fără adrese?
    kubectl describe pod <pod> -n shop               # de ce e not-ready? (readiness fail, OOM, crash)
    kubectl logs <pod> -n shop --previous | tail -30
    ```

    **Escaladare:** dacă endpoints e gol și pod-urile par sănătoase → verifică selectorul Service vs. label-urile pod-urilor (deploy recent cu label schimbat e cauza clasică).

    ---

    ## Escaladare și după-incident

    1. **Nu găsești cauza în 15 minute** → capturează: loguri nginx (cu exemple), `kubectl get events`, starea pod-urilor, grafice de trafic/latență — și escaladează către platform
    2. **Mitigare rapidă** dacă serviciul e degradat dar funcțional: restart `kubectl rollout restart deployment/<serviciu>` doar dacă suspectezi stare coruptă; altfel NU restarta — distrugi dovezile
    3. **Post-incident:** adaugă incidentul la lista de cauze din runbook dacă e una nouă; verifică dacă tichetele preventive (template deployment, alerte restart/memorie) ar fi prevenit cazul

    ## Legături

    - Runbook OOMKilled (checkout, notification)
    - Tichete postmortem #3, #6, #8 + template deployment (propus după incidentul payments)
- user: |
    ce SLO punem pt checkout? 99,9%?
  assistant: |
    99,9% e un punct de plecare rezonabil pentru checkout, dar hai să-l definim corect — un SLO bun are trei componente, nu doar un procent.

    ## 1. Alege indicatorul (SLI) — cel mai important pas

    Pentru checkout, nu măsura "uptime" — măsoară **succesul din perspectiva userului**:

    **Availability SLI:** proporția de requesturi valide care primesc răspuns non-5xx:

    ```
    requests_fulfilled / total_valid_requests
    ```

    Atenție la detalii care schimbă numărul:
    - **Exclude erorile clientului** (4xx) — un 402 "card refuzat" nu e incident de disponibilitate
    - **Include timeout-urile ca eșecuri** — un request care moare după 30s e eșuat pentru user, chiar dacă tehnic "a răspuns"
    - Dacă plățile trec prin provider extern (Stripe/Adyen), decizează explicit cum tratezi erorile lor — de obicei le incluzi, pentru că userul nu face diferența

    **Latency SLI:** checkout-ul are două praguri relevante:
    - **fast path:** 99% din requesturi sub ~500ms-1s (validări, calcule)
    - **slow path:** 99% din autorizările de plată sub ~3s (include apelul spre provider)

    ## 2. Ținta: 99,9% sau altceva?

    Calculează ce înseamnă numeric:

    | Țintă | Buget de eroare lunar (30 zile) |
    |---|---|
    | 99% | 7,2 ore |
    | 99,9% | 43 minute |
    | 99,95% | 21 minute |
    | 99,99% | 4,3 minute |

    Recomandarea mea: **99,9% availability + 99% sub 1s latency** e un start matur. Motive:

    - **99,99% e capcană** pentru arhitectura voastră actuală: cu RDS failover de 40s, deploy-uri, și 3 incidente în 4 zile, ai arde bugetul de 4 minute dintr-un singur failover. Un SLO pe care nu-l poți ține demoralizează și blochează shipping-ul.
    - **99,9% (43 min/lună)** e provocator dar realizabil — incidentul checkout de luni (3 crash-uri × ~2 min fiecare + BackOff) ar fi consumat cam 15-20% din bugetul lunar. Exact cât trebuie să doară ca să motiveze acțiunile preventive, fără să paralizeze.

    ## 3. Bugetul de eroare — partea care contează cu adevărat

    99,9% = 43 min/lună de erori "permise". Folosiți-l ca instrument de decizie:

    - **Buget rămas > 50%** → echipa poate ship-ui feature-uri fără frică
    - **Buget sub 25%** → prioritate la fiabilitate, feature freeze parțial pe serviciu
    - **Buget epuizat** → doar fix-uri de fiabilitate până se recuperează

    Practic, incidentul de luni ar fi ars ~15-20% din buget → nu blochează nimic, dar apare în review-ul lunar.

    ## 4. Implementare practică

    Cu Prometheus + ingress metrics pe care deja le aveți:

    ```promql
    # SLI availability (30d rolling)
    sum(rate(nginx_ingress_controller_requests{service="checkout", status!~"5.."}[30d]))
    /
    sum(rate(nginx_ingress_controller_requests{service="checkout"}[30d]))
    ```

    Alertare pe **rata de ardere a bugetului**, nu pe SLO-ul brut (alertele pe SLO brut sunt prea lente):

    - **Fast burn (14,4x):** ard 2% din buget în 1h → pagină on-call — înseamnă incident activ
    - **Slow burn (6x):** ard 5% în 6h → tichet — degradare persistentă

    ## 5. Ce să NU faci

    - Nu promite SLO-ul clienților ca SLA contractual încă — mai întâi măsoară-l 2-3 luni, vezi ce realizezi real, apoi negociază
    - Nu pune 100% pe nimic — blochează orice deploy
    - Nu defini SLO doar pe availability — un serviciu "up" dar cu 5s latență e o experiență proastă

    ## Concret

    | SLO | Țintă | Fereastră |
    |---|---|---|
    | Availability (non-5xx pe requesturi valide) | 99,9% | 30 zile rolling |
    | Latency fast path | 99% < 1s | 30 zile rolling |
    | Latency autorizare plată | 99% < 3s | 30 zile rolling |

    Începe cu astea în mod "informal" (dashboard + alerte pe burn rate), măsoară 2 luni, apoi formalizezi. Vrei configurația completă de alerte pe burn rate pentru Prometheus?
