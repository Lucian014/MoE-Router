    1. PDB-uri pe toate serviciile (1-2 zile de lucru)
    2. Karpenter sau node groups mixte on-demand + spot (2-3 zile)
    3. Migrare graduală: 20% spot → monitorizează 2 săptămâni → crește spre 60%

