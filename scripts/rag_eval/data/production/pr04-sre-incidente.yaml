    e python cu celery, 8 workeri concurenti, worker_prefetch_multiplier e pe default. mesajele au atasate pdf-urile facturilor, cam 2MB fiecare
  assistant: |
    Mister rezolvat — e o combinație clasică de probleme Celery cu payload-uri mari:

    ## Matematica problemei

    **Prefetch default = 4** (`worker_prefetch_multiplier=4`) × **8 workeri concurenți** = **32 de mesaje trase în memorie simultan** per pod.

    32 × 2MB = **64MB doar corpurile mesajelor** — și asta e optimist, pentru că:

    - Celery deserializează mesajele (JSON + base64 dacă PDF-ul e încorporat → base64 adaugă ~33%, deci ~2,7MB per mesaj → **~86MB**)
    - La procesare, PDF-ul se încarcă complet în memorie (poate de 2-3 ori: bytes → procesare → serializare la trimitere)
    - Python are overhead semnificativ pe obiecte mari
    - Dacă mesajele conțin PDF-ul **încorporat în body** (nu doar o referință), brokerul le livrează întregi la prefetch

    Total realist: 150-250MB la un burst de mesaje — exact ce vezi. 256Mi era condamnat de la început.

    ## Fix-uri, în ordine

    **1. Imediat — limite și prefetch:**

    ```python
    # celery config
    worker_prefetch_multiplier = 1        # fiecare worker ia 1 mesaj pe rând
    worker_concurrency = 8                # păstrează, dar vezi punctul 3
    task_acks_late = True                 # ack doar după procesare (cu prefetch 1, e sigur)
    worker_max_tasks_per_child = 100      # reciclează procesele worker — eliberează memorie
    ```

    `worker_prefetch_multiplier = 1` e **recomandarea oficială Celery pentru task-uri lungi** — cu 4, workerii "hordăresc" mesaje pe care le procesează în 8 minute în timp ce alți workeri stau pe liber, și totodată le țin în memorie.

