        memory: 512Mi
      requests:
        memory: 384Mi
    ```

    **2. Fix-ul de fond — nu trimite PDF-uri prin broker.** Acesta e adevărata problemă. Celery documentează explicit: mesaje mari (>câteva sute KB) nu trebuie să treacă prin broker. Refactor:

