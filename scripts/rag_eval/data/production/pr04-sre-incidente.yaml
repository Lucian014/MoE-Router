    ## De ce ți s-a întâmplat (probabil)

    Cu 5 oameni și rotație săptămânală pură, un an are 52 de săptămâni, iar 52 mod 5 = **2**. Deci persoana de la Crăciun se mută cu 2 poziții în fiecare an — la rotație pură, **imposibil** să pice același om de Crăciun doi ani la rând. Dacă ți s-a întâmplat, înseamnă că rotația nu e pură: se face manual, cineva a resetat ordinea, sau au fost swap-uri care au deplasat ciclul.

    ## Soluția simplă: rotație fixă, calculată pe un an înainte

    Stabiliți ordinea fixă (A → B → C → D → E → A...) și generați calendarul pe 12 luni înainte. Crăciunul va roti printre voi cu pas de 2: anul N persoana 1, anul N+1 persoana 3, anul N+2 persoana 5 etc. Nimeni nu-l prinde de două ori la rând, dar cineva îl prinde la fiecare ~5 ani — corect.

    Problemă secundară: rotația pură nu ține cont de sărbători — același om poate prinde Crăciunul *și* Revelionul în ani diferiți, sau Paștele de două ori la rând (Paștele e mobil, deci se mișcă altfel prin ciclu).

    ## Soluția mai bună: separă sărbătorile "prime" de rotația obișnuită

    1. **Definește pool-ul de sărbători premium**: Crăciun, Revelion/1 ianuarie, Paște, 1 Mai, Sf. Andrei etc.
    2. **Alocă-le explicit, în ordine rotativă**, independent de rotația săptămânală: fiecare persoană ia o sărbătoare premium pe an, iar cine a luat Crăciunul anul asta nu poate lua nici Crăciunul, nici Revelionul anul viitor.
    3. **Restul săptămânilor** merg pe rotația normală, cu excepția săptămânilor premium care sunt pre-asignate.

    Practic, ține un **ledger de fairness** simplu (o foaie Excel):

    | Persoană | Crăciun 2025 | Revelion 2025 | Crăciun 2026 |
    |---|---|---|---|
    | A | ✅ | — | 🚫 exclus |
    | B | — | ✅ | eligibil |
    | C | — | — | eligibil |
    | D | — | — | eligibil |
    | E | — | — | eligibil |

