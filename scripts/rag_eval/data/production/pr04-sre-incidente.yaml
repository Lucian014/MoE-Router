    Calculul:

    ```
    30 zile × 24h × 60 min = 43.200 minute totale
    43.200 × 0,1% = 43,2 minute de eroare permise
    ```

    Pentru referință rapidă, la alte ferestre:

    | Fereastră | Timp total | Buget la 99,9% |
    |---|---|---|
    | 24h | 1.440 min | 1,44 min |
    | 7 zile | 10.080 min | 10 min |
    | 28 zile (4 săptămâni) | 40.320 min | 40,3 min |
    | 30 zile | 43.200 min | **43,2 min** |
    | 90 zile (trimestru) | 129.600 min | 129,6 min |

    Două observații practice:

    1. **43 de minute sună mult până când vezi cât consumă un incident.** Incidentul checkout de luni: 3 crash-uri × ~2 min de downtime fiecare + fereastra BackOff ≈ 10-15 minute → **25-35% din bugetul lunar** dintr-un singur incident dimineața. Un singur failover RDS de 40s cu pod-uri omorâte (cazul payments) ar fi adăugat încă 2-3 minute.

    2. **Bugetul se consumă pe erori parțiale, nu doar pe downtime total.** Dacă 1% din requesturi eșuează timp de o oră, ai ars ~0,6 minute de buget (1% × 60 min) — de asta SLI-ul pe rată de requesturi e mai corect decât "serviciul era down X minute".

    Dacă vrei să urmărești asta automat, metrica standard e "error budget remaining":

    ```promql
    # buget rămas (%)
    1 - (
      (1 - (
        sum(rate(nginx_ingress_controller_requests{service="checkout", status!~"5.."}[30d]))
        /
        sum(rate(nginx_ingress_controller_requests{service="checkout"}[30d]))
      )) / 0.001
    ) * 100
    ```

    Când valoarea coboară sub 25%, declanșezi politica de "fiabilitate first" discutată mai devreme.
