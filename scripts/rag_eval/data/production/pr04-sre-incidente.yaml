  assistant: |
    Scăderea la 60% ajută puțin, dar nu rezolvă problema reală. Să descompunem de ce lată la 2 secunde la vârfuri:

    ## De ce întârzie scalarea

    1. **CPU-ul e un indicator lagging** — crește *după* ce traficul a crescut. Până când media depășește 70%, serviciul e deja sub presiune.
    2. **HPA are delay inerent** — metricile vin din metrics-server cu scrape la 15s, plus fereastra de 1 minut pentru decizie, plus `--horizontal-pod-autoscaler-sync-period` (15s default). Realist: 30-60s de la spike până la decizie.
    3. **Pod startup** — timp până când noul pod e Ready (pull imagine, pornire Node, readinessProbe). La Node/Express ar trebui să fie rapid (<10s), dar verifică: dacă readiness are `initialDelaySeconds` mare, adaugi secunde inutile.

    Deci chiar și cu 60%, vei avea o fereastră de degradare la spike-uri bruște — doar puțin mai scurtă.

    ## Ce fac, în ordinea eficienței

    **1. Scade ținta, da — dar moderat.** 60% e rezonabil. Sub 50% ai riscul de flapping (scale up/down continuu). 60-65% e un sweet spot pentru servicii web.

    **2. Configurează comportamentul de scale-up agresiv** (asta contează mai mult decât ținta):

    ```yaml
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 0    # default 0 la scaleUp, ok
        policies:
        - type: Percent
          value: 100                     # poți dubla numărul de poduri
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
        selectPolicy: Max
      scaleDown:
        stabilizationWindowSeconds: 300  # default, ok — nu scala în jos prea repede
    ```

    Cu `value: 100%` la 15s, la un spike îți dublează capacitatea în ~15-30s în loc să adauge câte 1-2 poduri.

    **3. Verifică de ce lată crește atât de mult cu CPU sub 70%.** 2 secunde de latență la CPU 70% e suspect — Node e single-threaded pe event loop. Dacă ai endpoint-uri blocking (query sincron, JSON mare, crypto), latența explodează înainte ca CPU-ul să arate probleme. Merită un profil la vârfuri — s-ar putea ca problema reală să fie un endpoint lent, nu capacitatea.

    **4. Pe termen lung: scalează pe latență, nu pe CPU.** CPU-ul nu știe nimic despre experiența userului. KEDA cu scaler Prometheus pe `http_request_duration` p99 e soluția standard:

    ```yaml
    # KEDA ScaledObject, trigger pe p99 latency
    query: histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{service="search"}[1m])) by (le))
    threshold: "0.5"   # scalează când p99 depășește 500ms
    ```

    Asta scalează *când userii simt*, nu când CPU-ul crește.

    **5. Dacă vârfurile sunt predictibile** (ex. trafic de seară, campanii), adaugă scalare programată — KEDA sau CronHPA — ca să ai poduri gata *înainte* de vârf.

    ## Rezumat practic

    - Da, scade la 60% — câștigi puțin
    - Adaugă `behavior.scaleUp` agresiv — câștigi cel mai mult, efort minim
    - Verifică readiness probe și timpul de pornire al pod-ului
    - Investighează de ce latența sare la 2s sub 70% CPU — posibil event loop blocking
    - Planifică migrarea spre scalare pe latență (KEDA) dacă vârfurile rămân o problemă

