    ## Primul diagnostic

    251Mi folosiți din 256Mi limită — pod-ul trăiește permanent la limită. Două întrebări imediate:

    **1. În ce e scris notification-service?** Dacă e Java, 256Mi e foarte puțin — heap-ul JVM + metaspace + thread stacks + direct buffers nu încap confortabil în 256Mi. Un Spring Boot 3 are nevoie de minim 512Mi, realist 768Mi-1Gi. Dacă e Java, fix-ul e aproape mecanic:

    ```yaml
    resources:
      requests:
        memory: 512Mi
      limits:
        memory: 768Mi
    env:
      - name: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=70.0"
    ```

    **2. Dacă e Node/Go/Python** — 256Mi ar trebui să fie suficient pentru un serviciu de notificări, deci aici e probabil un leak sau un buffer nelimitat, la fel ca la checkout.

    ## Suspecți specifici pentru un notification-service

    Serviciile de notificări au un pattern clasic de OOM: **consumă din coadă mai repede decât procesează** și acumulează în memorie:

    - **Buffer de mesaje nelimitat** — consumatorul trage mesaje din SQS/Kafka/RabbitMQ mai repede decât le trimite, și le ține în memorie (batch mare de prefetch, sau coadă internă fără limită)
    - **Prefetch prea mare** — la RabbitMQ, `prefetch` mare + procesare lentă = sute de mesaje acumulate
    - **Payload-uri mari reținute** — template-uri cu date încărcate complet, atașamente în memorie
    - **Retry fără backoff** — mesajele eșuate se acumulează în memorie în loc să meargă înapoi în coadă / DLQ

    Verifică:

    ```bash
    # ce face în momentul OOM — loguri de la restart-ul anterior
    kubectl logs notification-service-5b7c9d4f8-mm2lt -n shop --previous | tail -50

    # cât de repede crește memoria — urmărește 10 minute
    kubectl top pod notification-service-... -n shop -w
    ```

    Dacă memoria crește în trepte bruște (nu gradual) → burst de mesaje din coadă. Dacă crește constant → leak clasic.

    ## Fix-ul imediat (acum)

    Indiferent de cauză, dublează limita ca să oprești sângerarea:

    ```yaml
    resources:
      limits:
        memory: 512Mi
      requests:
        memory: 384Mi
    ```

    ## Fix-ul de fond

    1. **Limitează batch-ul/prefetch-ul** la ce poate procesa serviciul (ex. RabbitMQ prefetch 10-30, Kafka `max.poll.records` mic)
    2. **Nu ține mesajele în memorie** — procesează și confirmă (ack) pe măsură ce termini
    3. **DLQ pentru eșuate**, nu retry în memorie

    Și un lucru de spus echipei: **două OOM-uri în două zile pe servicii diferite confirmă tichetul #4** (audit requests/limits pe toate cele 25 de servicii). Notification-service cu 256Mi arată exact ca un limit setat "din cap", nu măsurat. Merită să prioritizați acel audit — probabil mai sunt 3-4 servicii în aceeași situație, doar că nu au picat încă.

