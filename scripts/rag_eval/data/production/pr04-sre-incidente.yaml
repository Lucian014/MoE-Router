    ```\n\nAlege politica în funcție de semantică:\n\n- **`expireAfterAccess(30min)`** — sesiunea de coș expiră dacă userul nu face nimic (probabil ce vrei, aliniat cu TTL-ul sesiunii)\n- **`expireAfterWrite(...)`** — expiră de la creare, indiferent de activitate\n- **`maximumSize`/`maximumWeight`** — plasă de siguranță ca să nu mai poți ajunge niciodată la OOM, indiferent de trafic\n\nRecomand **ambele**: expirare pe timp + limită de mărime. Expirația singură nu te protejează de un spike de trafic.\n\n## Verifică și sesiunile orfane\n\n1,2 milioane de sesiuni e mult — merită să te întrebi de unde vin:\n\n- **Boti/crawleri** care creează coșuri fără să cumpere nimic\n- **Mobile app** care regenerează sessionId la fiecare restart\n- **Lipsă de cleanup** la checkout finalizat — sesiunea rămâne și după ce comanda e plasată\n\nDacă sesiunile ar trebui să moară la checkout, adaugă explicit `cache.invalidate(sessionId)` acolo.\n\n## Notă despre dimensiunea entry-urilor\n\n600MB / 1,2M = ~500 bytes\
    \ per entry — rezonabil dacă e doar coșul. Dar dacă `Entry` conține obiecte mari (snapshot-uri de produse, imagini base64), ia în considerare să stochezi doar ID-uri și să încarci restul la cerere.\n\n## Pe termen scurt\n\nPână la deploy-ul fixului, mărește limita la 2Gi ca să nu mai pice, și pune alertă pe `jvm_memory_used_bytes` la ~80% din max ca să prindi următorul leak înainte de OOM.\n"
- user: |
    am pus pe cache-ul ala maximumSize(50_000) si expireAfterAccess de 30 de minute. e ok asa?
  assistant: |
    Da, combinația e corectă — expirarea pe timp curăță sesiunile inactive, iar `maximumSize` e plasă de siguranță la spike-uri de trafic. Câteva observații ca să fii sigur că e chiar ok:

    ## 1. Verifică ce se întâmplă la evicție

    `maximumSize(50_000)` înseamnă că, peste limită, Caffeine aruncă entry-uri **chiar dacă sunt active**. Întrebarea de business: ce vede userul al cărui coș tocmai a fost evacuat? Dacă aplicația face `cache.get(id)` și primește `null`:

    - **reconstruiește coșul** (din DB/redis) → perfect, totul ok
    - **crapă sau creează coș gol** → userul își pierde coșul în plină sesiune

    Dacă e cazul al doilea, ai nevoie de un loader:

    ```java
    cache.get(sessionId, id -> cartRepository.load(id));
    ```

    ## 2. Gândește-te dacă cache-ul e chiar locul potrivit pentru sesiuni

    Aici e o problemă mai subtilă: **sesiunile de coș sunt state, nu cache**. Cu ele în memorie:

    - la **fiecare deploy/restart** toți userii își pierd coșul (rolling update pe 25 de servicii = des)
    - nu poți scala orizontal corect — pod-ul A nu vede coșul creat pe pod-ul B
    - `expireAfterAccess` nu supraviețuiește unui restart

    Dacă pierderea coșului contează pentru business, mută starea în **Redis** (cu TTL de 30 min) și ține în Caffeine doar un cache de citire deasupra, dacă e nevoie de performanță. Dacă coșul e efemer oricum (ex. guest checkout simplu), varianta actuală e perfect acceptabilă.

    ## 3. Detalii mici, dar utile

    ```java
    Cache<String, Entry> cache = Caffeine.newBuilder()
        .maximumSize(50_000)
        .expireAfterAccess(Duration.ofMinutes(30))
        .recordStats()   // dacă vrei hit rate în metrics
        .build();
    ```

    - Evicția din `maximumSize` e **aproape imediată, dar asincronă** — pe un spike pot exista temporar >50k entry-uri. Nu-i problemă la 500 bytes/entry (~25MB total), doar să știi.
    - Dacă ai expunut metrics Caffeine prin Micrometer, pune alertă pe `cache_evictions` — un vârf mare înseamnă că limita e prea mică pentru traficul real.

    ## 4. Verifică fix-ul

    După deploy, urmărește 24-48h:

    ```promql
    jvm_memory_used_bytes{area="heap"}
    ```

    Trebuie să vezi un **dinte de fierăstrău** (crește, GC-l coboară, plateau), nu rampă continuă. Dacă rampa persistă, mai ai un al doilea leak — 600MB erau CartSessionCache, dar nu e sigur că era tot.

    Pe scurt: fix-ul e bun pentru simptom. Decizia reală e dacă sesiunile de coș merită să fie în Redis — asta ți-ar rezolva și leak-ul, și pierderea la restart, și scalarea.
