    **b) Adaugă interpretare proprie după fiecare preluare factuală.** Fraza factuală (care se poate suprapune cu sursele) + fraza ta de analiză (care e garantat originală). Capitolul tău are deja secțiunea 2.2.4 cu observații critice — extinde acest model: după fiecare descriere legislativă, o frază de tipul „pentru blocurile din Iași, aceasta înseamnă că...".

