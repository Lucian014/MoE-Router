    ---

    Efectul de revenire (rebound effect) apare atunci când o parte din economiile de energie generate de reabilitarea termică este „consumată" de schimbarea comportamentului locatarilor. Explicația este simplă: înainte de reabilitare, mulți locatari se încălzeau insuficient, tocmai pentru că pierderile de căldură făceau încălzirea scumpă și ineficientă — tolerau temperaturi scăzute, închideau radiatoarele în camerele mai puțin folosite, purtau haine groase în apartament. După izolarea blocului, aceeași sumă de bani cumpără acum mult mai multă căldură, iar locatarii își ajustează în consecință comportamentul: cresc temperatura interioară (studiile regionale indică o creștere medie de 1,2–1,8°C) și încep să încălzească și camerele care înainte rămâneau reci. Astfel, clădirea pierde mai puțină căldură, dar consumă mai multă energie decât ar sugera calculele teoretice, care presupun comportamentul constant al utilizatorilor. Practic, o parte din câștigul de eficiență este „returnat" sub formă de confort suplimentar, nu sub formă de economie bănească.

