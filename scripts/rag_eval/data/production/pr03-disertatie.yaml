    Prima întrebare de cercetare viza măsura în care reabilitarea termică reduce consumul real de energie. Studiul de caz analizat oferă un răspuns clar: intervenția completă (izolarea fațadei, înlocuirea tâmplăriei, izolarea acoperișului) a determinat reducerea consumului specific de la 182 la 96 kWh/m²an, adică o scădere de 47,3%, echivalentă cu o economie anuală de aproximativ 249.400 kWh pentru blocul analizat. Rezultatul confirmă ipoteza de lucru, situându-se în partea superioară a intervalului anticipat de 30–50%.

