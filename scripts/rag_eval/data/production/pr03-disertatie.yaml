- user: |
    salut, lucrez la disertatie: "Reabilitarea termica a blocurilor din Iasi: impactul asupra consumului de energie". ma ajuti cu un plan pe capitole?
  assistant: |
    Salut! Cu plăcere — iată o propunere de plan structurat, adaptată unei disertatii de master pe tema reabilitării termice la blocurile din Iași:

    ## Plan de capitole (propunere)

    ** Capitolul 1. Introducere**
    - Motivația alegerii temei și contextul (parcul imobil vechi din Iași, majoritatea construit în perioada 1960–1990)
    - Obiectivele și întrebările de cercetare
    - Ipoteza de lucru (ex.: reabilitarea termică reduce consumul de energie cu X%)
    - Delimitarea temei și structura lucrării

    ** Capitolul 2. Cadru teoretic și legislativ**
    - Concepte-cheie: eficiență energetică, coeficient de transfer termic (U), punți termice, clasa energetică
    - Cadrul legislativ: Legea 196/2018 privind aprobarea performanței energetice a clădirilor, directivele UE (EPBD), Programul National pentru Eficientizarea Blocurilor
    - Metode de reabilitare termică: fațade (polistiren, vată minerală), înlocuirea tâmplăriei, acoperișuri, subsoluri

    ** Capitolul 3. Studiu de caz: blocurile din Iași**
    - Caracterizarea parcului rezidențial din Iași (structura pe perioade de construcție, tipuri de blocuri)
    - Metodologia cercetării: colectarea datelor (consumuri de la furnizori, chestionare la asociații de proprietari, certificate energetice)
    - Prezentarea blocurilor analizate (criterii de selecție, stadiul de reabilitare)

    ** Capitolul 4. Analiza rezultatelor**
    - Compararea consumurilor înainte/după reabilitare (kWh/m²/an)
    - Impactul pe tipuri de intervenții (fațadă vs. tâmplărie vs. combinații)
    - Factori de influență: comportamentul utilizatorilor, climatul local, calitatea execuției
    - Analiza cost–beneficiu: investiție, economii anuale, perioadă de recuperare

    ** Capitolul 5. Discuții și propuneri**
    - Interpretarea rezultatelor în raport cu literatura de specialitate
    - Bariere întâmpinate (financiare, administrative, organizatorice)
    - Recomandări pentru autorități locale și asociații de proprietari

    ** Capitolul 6. Concluzii**
    - Răspunsul la întrebările de cercetare
    - Limitări ale studiului și direcții viitoare de cercetare

    **Anexe**: chestionar, tabele de date, certificate energetice, fotografii

    Câteva sfaturi practice:
    - Pentru date reale, contactează Asociația Intercomunitară de Dezvoltare Durabilă Iași și direcția de urbanism de la Primărie — au informații despre blocurile reabilitate.
    - Ideal ar fi să ai 3–5 blocuri comparabile (reabilitate vs. nereabilitate) pentru o analiză credibilă.

    Vrei să detaliem vreun capitol sau să discutăm despre metodologia de colectare a datelor?
