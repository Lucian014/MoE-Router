    # Capitolul 4. Analiza rezultatelor

    ## 4.1. Prezentarea datelor analizate

    Prezentul capitol integrează cele două componente empirice ale cercetării: studiul de caz al unui bloc de locuințe reabilitat termic din municipiul Iași și chestionarul aplicat unui eșantion de 120 de locatari, dintre care 58 locuiesc în blocuri reabilitate termic și 62 în blocuri nereabilitate. Cele două surse de date — consumuri reale măsurate, respectiv percepții și comportamente autodeclarate — sunt de natură complementară și permit o verificare triunghiulară a ipotezei de lucru: datele de consum cuantifică impactul tehnic și economic al reabilitării, iar chestionarul surprinde dimensiunea comportamentală, esențială pentru explicarea decalajului dintre economiile estimate și cele reale.

    Blocul analizat în cadrul studiului de caz cuprinde 40 de apartamente, cu o suprafață utilă încălzită de 2.900 m², și a fost reabilitat termic prin intervenție de ansamblu (izolarea fațadei, înlocuirea tâmplăriei și izolarea acoperișului), în conformitate cu cerințele programului național. Pentru analiza comparativă a satisfacției și a comportamentului de încălzire s-a utilizat testul exact Fisher, datorită frecvențelor reduse din unele subgrupe analizate, care nu permiteau aplicarea validă a testului chi-pătrat.

    ## 4.2. Rezultatele studiului de caz: consumul de energie

    Înainte de reabilitare, blocul analizat înregistra un consum specific de energie termică pentru încălzire de 182 kWh/m²an, valoare situată în partea superioară a intervalului tipic pentru blocurile nereabilitate din Iași (160–190 kWh/m²an) și corespunzătoare unei clase energetice inferioare. După finalizarea lucrărilor, consumul specific a scăzut la 96 kWh/m²an, în interiorul intervalului de referință pentru blocurile reabilitate (85–105 kWh/m²an).

    Reducerea absolută este de 86 kWh/m²an, ceea ce reprezintă o scădere de **47,3%** față de consumul inițial. Raportat la suprafața încălzită, acest echivalează cu o economie anuală de energie termică de aproximativ **249.400 kWh/an**. Rezultatul se încadrează în intervalul de 30–50% formulat în ipoteza lucrării, poziționându-se însă în partea sa superioară — o constatare explicabilă prin caracterul complet al intervenției, care a acoperit simultan toate componentele principale ale învelișului termic. Această concluzie este coerentă cu literatura citată în Capitolul 1, potrivit căreia intervențiile parțiale (de exemplu, izolarea fațadei fără înlocuirea tâmplăriei) produc economii semnificativ mai reduse decât cele prognozate.

    ## 4.3. Analiza cost–beneficiu

    La prețul de 0,45 lei/kWh al energiei termice furnizate populației, economia anuală de 249.400 kWh se traduce printr-o reducere a cheltuielilor de aproximativ **112.230 lei/an**, echivalentul a circa 2.806 lei per apartament pe an (în medie aproximativ 234 lei lunar, cu consum concentrat în sezonul rece).

