    # Capitolul 2. Fundamente teoretice, legislative și caracterizarea parcului rezidențial din Iași

    ## 2.2. Cadrul legislativ al reabilitării termice

    ### 2.2.1. Cadrul european

    Politica Uniunii Europene în domeniul eficienței energetice a clădirilor s-a conturat treptat, începând cu anii 2000, ca răspuns la dubla provocare a dependenței de importurile de energie și a emisiilor de gaze cu efect de seră. Sectorul clădirilor este cel mai mare consumator final de energie din Uniune, fiind responsabil pentru aproximativ 40% din consumul total de energie și pentru circa 36% din emisiile de gaze cu efect de seră, motiv pentru care reglementările europene în acest domeniu au devenit din ce în ce mai exigente.

    Piatra de temelie a acestui cadru a fost **Directiva 2002/91/CE privind performanța energetică a clădirilor (EPBD)**, care a introdus pentru prima dată conceptul de metodologie de calcul a performanței energetice, obligativitatea certificatelor energetice la construire, vânzare sau închiriere a clădirilor și cerința de examinare periodică a centralelor termice. Directiva a fost transpusă în legislația românească prin Legea nr. 372/2005, analizată în continuare.

    **Directiva 2010/31/UE** („recast"-ul EPBD) a consolidat semnificativ cerințele inițiale, stabilind ca toate clădirile noi să fie „clădiri cu consum aproape zero de energie" (nZEB) începând cu 31 decembrie 2020 (cu o derogare de doi ani pentru clădirile publice, din 2019). Mai important pentru tema prezentei lucrări, directiva a introdus obligativitatea statelor membre de a stabili **planuri naționale de renovare a clădirilor existente**, recunoscând explicit că principala provocare nu o reprezintă clădirile noi — care sunt deja reglementate strict — ci fondul construit existent, care se va menține în utilizare decenii de acum înainte.

    **Directiva (UE) 2018/844** de modificare a EPBD a adus o nouă accentuare a reabilitării, obligând statele membre să elaboreze strategii pe termen lung pentru renovarea fondului construit, cu scopul de a decarboniza parcul imobil până în 2050. Pentru România, un stat cu un parc rezidențial vechi și cu rate ridicate de sărăcie energetică, această directivă a avut o importanță deosebită, deoarece a legat explicit eficiența energetică de obiectivele sociale — reducerea sărăciei energetice și îmbunătățirea calității locuirii.

    Cea mai recentă etapă este **Directiva (UE) 2024/1275** (noul EPBD, adoptat în 2024), care impune statele membre să adopte scheme naționale de renovare a clădirilor rezidențiale, cu obiective minime de performanță energetică și cu obligația de a reduce consumul mediu de energie al parcului rezidențial. Deși aplicarea integrală a acestei directive depășește orizontul temporal al studiului de caz din prezenta lucrare, ea confirmă direcția de evoluție a politicii europene: de la reglementarea clădirilor noi la reabilitarea agresivă a fondului existent.

    Pe lângă EPBD, două alte instrumente europene sunt relevante: **Directiva privind eficiența energetică (2012/27/UE, modificată prin 2023/1791)**, care stabilește obiective-cadru de reducere a consumului final de energie, și mecanismele de finanțare — Fondul pentru Modernizare, Fondul de Coeziune și, mai recent, Planul Național de Redresare și Reziliență (PNRR) — care au constituit principala sursă de finanțare nerambursabilă a reabilitărilor termice din România, inclusiv din municipiul Iași.

    ### 2.2.2. Cadrul național: Legea nr. 372/2005

    Transpunerea EPBD în legislația românească s-a realizat prin **Legea nr. 372/2005 privind performanța energetică a clădirilor**, republicată, actul normativ fundamental în domeniu. Legea stabilește cerințele esențiale pe care trebuie să le îndeplinească clădirile, printre care cerința de „economie de energie și izolare termică" ocupă un loc central, și obligă la elaborarea unei metodologii de calcul a performanței energetice a clădirilor.

    Elementele cele mai relevante pentru prezenta lucrare sunt:

    - **Certificatul energetic** — document obligatoriu, întocmit de auditori energetici autorizați, care clasifică clădirea pe o scală de clase energetice (de la A, cea mai performantă, la G). Certificatul energetic este necesar la vânzarea, închirierea, construirea sau finalizarea reabilitării unei clădiri și constituie, în practica studiului de caz, o sursă importantă de date despre starea termică a blocurilor analizate.
    - **Auditul energetic** — analiza tehnică și economică pe baza căreia se stabilesc măsurile de reabilitare recomandate și se estimează economiile de energie. Așa cum se va arăta în Capitolul 3, decalajul dintre estimările din audituri și consumurile reale măsurate reprezintă unul dintre punctele centrale ale analizei.
    - **Obligația de a aduce clădirile existente la un nivel minim de performanță** în cazul reabilitărilor majore.

    Aplicarea legii este detaliată de **Indicativul MC 001** (metodologia de calcul a performanței energetice a clădirilor, în versiunile succesive MC 001/2006, MC 001/1-2013 și actualizările ulterioare), care stabilește valorile de referință pentru coeficienții de transfer termic (U) ai elementelor de înveliș, gradul-zile de încălzire (pentru Iași, aproximativ 3.400 °C·zile, unul dintre cele mai ridicate din țară) și indicatorii de consum referențiali. Tot din sfera de aplicare a legii face parte și sistemul de autorizare a auditorilor energetici, gestionat de Ministerul Dezvoltării, Lucrărilor Publice și Administrației.

    ### 2.2.3. Programele naționale de reabilitare termică

    Dacă Legea 372/2005 stabilește „ce" trebuie atins, programele naționale stabilesc „cum" și „cu ce finanțare". Primul program de anvergură a fost lansat prin **Ordonanța de urgență nr. 18/2009 privind creșterea eficienței energetice la blocurile de locuințe**, care a pus bazele mecanismului de finanțare multi-sursă aplicat ulterior: o parte din investiție acoperită din fonduri publice (buget de stat și bugete locale), iar restul suportat de proprietari, prin contribuții lunare colectate de asociațiile de proprietari. Programul a permis reabilitarea a sute de blocuri la nivel național, însă ritmul a fost inegal, iar finanțarea a fost adesea întreruptă de lipsa alocărilor bugetare anuale.

    Un pas important a fost **Legea nr. 196/2018 privind aprobarea Programului național privind creșterea performanței energetice a blocurilor de locuințe**, care a sistematizat cadrul programatic: identificarea blocurilor cu performanță energetică scăzută, prioritizarea intervențiilor, structura finanțării (cu pondere majoritară nerambursabilă) și obligativitatea intervențiilor „de ansamblu" — izolarea învelișului, înlocuirea tâmplăriei, reabilitarea instalațiilor de încălzire — în locul intervențiilor parțiale. Această ultimă cerință răspunde direct uneia dintre concluziile empirice discutate în Capitolul 1: intervențiile parțiale (de exemplu, izolarea fațadei fără înlocuirea tâmplăriei) produc economii mult sub potențial.

    În perioada recentă, finanțarea reabilitărilor a fost dominată de **Planul Național de Redresare și Reziliență (PNRR)**, care alocă fonduri semnificative eficienței energetice a clădirilor publice și rezidențiale, cu cerințe de performanță mai stricte decât programele anterioare (reducerea consumului de energie primară cu minimum 30% pentru clădirile rezidențiale) și cu obligația de a include măsuri de combatere a sărăciei energetice. Pentru municipiul Iași, PNRR reprezintă principala oportunitate de a accelera reabilitarea celor aproximativ 69% din blocuri care nu fuseseră încă intervenite până în 2023.

    ### 2.2.4. Observații critice asupra cadrului legislativ

    Analiza evoluției cadrului legislativ relevă atât progrese, cât și limite cu impact direct asupra rezultatelor reabilitărilor — limite care justifică abordarea empirică a prezentei lucrări.

    În primul rând, cadrul s-a concentrat aproape exclusiv pe **faza de proiectare și finanțare**, neglijând **monitorizarea post-reabilitare**. Legea 372/2005 impune certificarea energetică la finalizarea lucrărilor, dar nu există un mecanism sistematic de verificare a consumurilor reale în anii următori, ceea ce face imposibilă, la nivel de program, evaluarea eficienței reale a investițiilor — exact tipul de evaluare pe care prezenta lucrare o realizează la scara unui studiu de caz.

    În al doilea rând, **estimările din audituri s-au dovedit sistematic optimiste**, după cum documentează studiile citate în Capitolul 1 (economii reale de circa 38% față de 50–60% prognozate). Cadrul legislativ nu include corecții pentru efectul de revenire (rebound) sau pentru calitatea variabilă a execuției, ceea ce duce la așteptări nerealiste ale proprietarilor și, în unele cazuri, la neîncredere în program.

    În al treilea rând, **instabilitatea reglementară și a finanțării** — succesiunea de programe cu reguli diferite (OUG 18/2009, Legea 196/2018, PNRR), întreruperile alocărilor și modificările ponderilor de cofinanțare — a creat costuri administrative ridicate pentru asociațiile de proprietari și pentru autoritățile locale, contribuind la ritmul lent al reabilitării (aproximativ 31% din blocurile din Iași până în 2023).

    În fine, merită remarcat că legislația recentă începe să integreze lecțiile experienței: cerințele PNRR privind intervențiile de ansamblu, măsurile de combatere a sărăciei energetice și, la nivel european, obligația monitorizării din noul EPBD indică o maturizare a cadrului, în sensul în care eficiența energetică nu mai este tratată ca un exercițiu de conformitate tehnică, ci ca un proces măsurabil prin rezultate reale — perspectivă pe care prezenta lucrare o adoptă în analiza studiului de caz din Iași.

