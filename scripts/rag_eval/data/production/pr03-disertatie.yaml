    **Exemplu concret pentru ANRE:**

    > Autoritatea Națională de Reglementare în Domeniul Energiei. (2022). *Raport privind rezultatele activității ANRE în anul 2021*. https://www.anre.ro/...

    **Detalii de care să ții cont:**

    - **Autorul este organizația însăși** — se scrie numele complet al instituției, nu „ANRE" la prima trecere în listă. În lista bibliografică poți folosi abrevierea doar dacă e foarte cunoscută, dar varianta sigură e numele complet.
    - **Titlul se scrie cu italice** (în Word: *cursiv*), doar prima literă cu majusculă (plus nume proprii).
    - **Data completă**: dacă raportul are zi/lună exactă (ex. publicat pe 15 martie 2022), APA 7 permite: (2022, 15 martie). Pentru rapoarte anuale, anul simplu e suficient.
    - **URL-ul se scrie complet**, fără „Retrieved from" și fără punct final după link.
    - Dacă raportul are un număr (ex. „Raport nr. 15/2022"), se pune după titlu: *Titlu* (Raport nr. 15/2022).

    ## Citarea în text

    **Parafrazare:**

    > Consumul de energie termică a înregistrat o scădere semnificativă (Autoritatea Națională de Reglementare în Domeniul Energiei [ANRE], 2022).

    La prima citare se dă numele complet + abrevierea între paranteze pătrate, apoi la citările următoare poți folosi doar:

    > (ANRE, 2022)

    **Citat direct (cu pagină sau secțiune):**

    > (ANRE, 2022, p. 27) — sau, dacă raportul nu are pagini: (ANRE, 2022, secțiunea 3.2)

    ## Observație practică

    Dacă citezi mai multe documente ANRE din același an (raport anual + raport de monitorizare, de exemplu), APA 7 cere să le distingi cu litere mici după an: (ANRE, 2022a), (ANRE, 2022b), în ordinea alfabetică a titlurilor — și în lista bibliografică la fel.

