  assistant: |
    # Introducere

    Reabilitarea termică a clădirilor de locuințe colective a devenit, în ultimele decenii, una dintre cele mai importante direcții de acțiune în politicile de dezvoltare urbană durabilă din Europa. În contextul în care sectorul rezidențial este responsabil pentru o pondere semnificativă din consumul total de energie al Uniunii Europene, iar obiectivele Pactului Verde European impun reduceri drastice ale emisiilor de gaze cu efect de seră până în 2050, eficiența energetică a clădirilor existente reprezintă o prioritate incontestabilă. România nu face excepție de la această tendință, iar orașele cu un parc imobil vechi, precum Iași, se confruntă cu provocări specifice legate de modernizarea locuințelor construite în perioada comunistă.

    Prezenta disertație, intitulată „Reabilitarea termică a blocurilor din Iași: impactul asupra consumului de energie", își propune să analizeze în mod rigorous efectele intervențiilor de reabilitare termică asupra consumului de energie al blocurilor de locuințe din municipiul Iași, oferind în același timp o perspectivă aplicată, susținută de date reale, asupra eficienței acestor investiții.

    ## Motivația alegerii temei

    Alegerea acestei teme se fundamentează pe mai multe argumente, de natură diferită, care converg spre același punct: actualitatea și relevanța problemei cercetate.

    Un prim argument este de natură statistică și socială. Municipiul Iași, al doilea centru urban al României, dispune de un parc rezidențial colectiv vast, construit în mare parte în perioada 1960–1990, în sistemul de proiectare și execuție specific economiei centralizate. Aceste blocuri — de tipul OT/RSc, T744, T766, 1340 sau 1350 — au fost proiectate cu cerințe termice mult mai permisive decât standardele actuale, folosind materiale cu performanțe scăzute (betoane celulare, zidărie de cărămidă fără izolație, tâmplărie din lemn sau aluminiu fără sticlă termoizolantă). Ca urmare, un număr semnificativ dintre aceste clădiri se încadrează în clasele energetice inferioare (D, E, F), cu consumuri anuale de energie termică ce depășesc cu mult valorile recomandate de standardele europene. La nivelul orașului, acest lucru se traduce prin costuri ridicate suportate de locatari, prin disconfort termic — supraîncălzire vara, pierderi de căldură iarna — și prin degradarea accelerată a fațadelor.

    Un al doilea argument este de natură legislativă și instituțională. România a transpus în legislația națională cerințele europene privind performanța energetică a clădirilor, prin Legea nr. 372/2005 privind performanța energetică a clădirilor, republicată, și prin acte normative conexe, iar în ultimii ani au fost derulate programe naționale de finanțare a reabilitării termice, precum Programul Național pentru Eficientizarea Blocurilor de Locuințe. Municipiul Iași a fost unul dintre orașele active în accesarea acestor fonduri, un număr important de blocuri fiind deja reabilitate sau aflate în diverse stadii de intervenție. Această masă critică de cazuri concrete creează condițiile necesare pentru o analiză empirică relevantă, pe care lucrarea de față o valorifică.

    Un al treilea argument este de natură științifică. Deși literatura de specialitate românească și internațională abordează pe larg problematica eficienței energetice a clădirilor, există relativ puține studii de caz care cuantifică, pe baza consumurilor reale măsurate înainte și după intervenție, impactul reabilitării termice la nivelul unui oraș specific. Multe dintre estimările disponibile se bazează pe calcule teoretice sau pe date agregate la nivel național, care nu surprind particularitățile locale — climatul specific Iașului, structura parcului imobil, comportamentul consumatorilor, calitatea execuției lucrărilor. Lucrarea de față încearcă să contribuie la umplerea acestui gol, prin analiza comparativă a unui eșantion de blocuri reabilitate și nereabilitate din municipiul Iași.

    În fine, un argument de ordin personal: tema se înscrie în domeniul de specializare al programului de master urmat și îmi permite să aplic cunoștințele acumulate într-o analiză aplicată, cu relevanță directă pentru comunitatea locală în care trăiesc.

    ## Obiectivele și întrebările de cercetare

    Obiectivul general al lucrării constă în evaluarea impactului reabilitării termice asupra consumului de energie al blocurilor de locuințe colective din municipiul Iași. Acest obiectiv general se descompune în mai multe obiective specifice:

    - identificarea și caracterizarea principalelor tipuri de blocuri din Iași, din perspectiva performanței termice inițiale;
    - prezentarea metodelor de reabilitare termică aplicate în practică (izolarea fațadelor, înlocuirea tâmplăriei, izolarea acoperișurilor și a planșeelor peste subsol) și a cadrului legislativ și instituțional care le reglementează;
    - analiza comparativă a consumurilor de energie înainte și după reabilitare, exprimate în indicatori normalizați (kWh/m²an);
    - evaluarea economică a intervențiilor, prin analiza cost–beneficiu și estimarea perioadei de recuperare a investiției;
    - formularea de recomandări pentru autoritățile locale, asociațiile de proprietari și factorii de decizie.

    Din aceste obiective decurg întrebările de cercetare la care lucrarea încearcă să răspundă:

    1. În ce măsură reabilitarea termică reduce consumul real de energie al blocurilor din Iași, raportat la estimările teoretice?
    2. Care dintre tipurile de intervenții (fațadă, tâmplărie, acoperiș) aduc cea mai semnificativă contribuție la economiile de energie?
    3. Care este perioada de recuperare a investiției și în ce condiții aceasta este acceptabilă pentru proprietari?
    4. Ce factori nontechnici — comportamentul utilizatorilor, calitatea execuției, modificarea regimului de temperatură — influențează rezultatele obținute?

    ## Ipoteza de lucru

    Pornind de la literatura de specialitate și de la datele disponibile la nivel național, lucrarea pornește de la următoarea ipoteză: reabilitarea termică completă (fațadă, tâmplărie, acoperiș) a blocurilor construite în perioada 1960–1990 din Iași determină o reducere a consumului de energie termică cu 30–50%, însă economiile reale sunt frecvent inferioare celor estimate teoretic, din cauza comportamentului utilizatorilor (majorarea temperaturii interioare după reabilitare, denumit în literatura de specialitate „efect de revenire"), a calității variabile a execuției și a punților termice reziduale. Verificarea acestei ipoteze pe cazuri concrete din Iași constituie nucleul analizei empirice a lucrării.

    ## Delimitarea temei

    Pentru a asigura profunzimea analizei, tema a fost delimitată atât spațial, cât și tematic. Din punct de vedere spațial, cercetarea se concentrează exclusiv asupra municipiului Iași, fără a extinde concluziile asupra altor localități, cu recunoașterea explicită a faptului că anumite constatări pot fi transferabile, cu precauție, unor orașe cu caracteristici similare. Din punct de vedere tematic, lucrarea se axează pe impactul asupra consumului de energie termică (încălzire și, unde este cazul, preparare apă caldă menajeră), fără a aborda în detaliu aspectele legate de consumul de energie electrică, de confortul acustic sau de estetica urbană, care sunt menționate doar în măsura în care intervin în analiza principală. De asemenea, nu fac obiectul lucrării aspectele de finanțare publică detaliată sau de analiză juridică a programelor de reabilitare, acestea fiind tratate doar în măsura în care contextul o impune.

    ## Structura lucrării

    Pentru atingerea obiectivelor formulate, lucrarea este organizată în cinci capitole, completate de concluzii, bibliografie și anexe.

    **Capitolul 1**, cel de-al doilea din structura efectivă a lucrării după prezenta introducere, intitulat „Fundamente teoretice, legislative și caracterizarea parcului rezidențial din Iași", prezintă conceptele-cheie ale domeniului (eficiență energetică, coeficient de transfer termic, punți termice, clasa energetică), cadrul legislativ național și european aplicabil, principalele metode de reabilitare termică utilizate în practică, precum și caracterizarea parcului rezidențial colectiv din municipiul Iași, structurat pe perioade de construcție și tipologii de blocuri.

    **Capitolul 2** („Metodologia cercetării și prezentarea studiului de caz") descrie metodologia utilizată: criteriile de selecție a blocurilor analizate, sursele de date (consumurile furnizate de operatorii de energie, certificatele energetice, chestionarele aplicate asociațiilor de proprietari) și limitările metodologice asumate.

    **Capitolul 3** („Analiza rezultatelor") prezintă rezultatele analizei comparative a consumurilor înainte și după reabilitare, impactul diferențiat pe tipuri de intervenții, factorii de influență identificați și analiza cost–beneficiu a investițiilor.

    **Capitolul 4** („Discuții, propuneri și concluzii") interpretează rezultatele în raport cu literatura de specialitate, identifică barierele financiare, administrative și organizatorice întâmpinate în procesul de reabilitare, formulează recomandări pentru actorii implicați și sintetizează concluziile principale ale cercetării, împreună cu limitările acesteia și cu direcțiile posibile de continuare.

    Prin această structurare, lucrarea își propune să ofere nu doar o radiografie a situației actuale a blocurilor din Iași, ci și un instrument util de fundamentare a deciziilor viitoare în domeniul reabilitării termice, într-un moment în care, cu fonduri europene semnificative disponibile prin Planul Național de Redresare și Reziliență, orașul se află la o răscruce importantă în procesul de modernizare a locuințelor sale.

