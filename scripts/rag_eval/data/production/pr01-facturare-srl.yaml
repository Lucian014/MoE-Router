    ## Puncte de care să ții cont la implementare

    - **Cotele se mapează pe coduri de categorie TVA**: `S` = standard (19%), `AA` = redus 9%, `S` cu percent 5... de fapt: 9% și 5% se trimit tot cu `ID = S` și `Percent` corespunzător; `AE` = TVA la încasare, `O` = scutit, `E` = exonerat. Pentru voi: 19/9/5 → `S` cu `Percent` diferit, câte un `TaxSubtotal` per cotă.
    - **Unități de măsură cu cod UN/ECE Rec 20**: `H87` = bucată, `KGM` = kg, `HUR` = oră, `LTR` = litru. Mapați `unit` din aplicație pe aceste coduri.
    - **Sumele trebuie să se închidă exact** (BR-CL/BR-CO-10..15): `LineExtensionAmount` = suma liniilor, `TaxInclusiveAmount` = `TaxExclusiveAmount + TaxAmount`, `PayableAmount` = `TaxInclusiveAmount`. Aici se vede roadele deciziei de calcul pe total pe cotă + alocare pe linii — subsolul din aplicație se copiază direct în XML.
    - **Storno-ul** se trimite ca factură cu sume negative, cu referință la original prin `cac:BillingReference/cac:InvoiceDocumentReference/cbc:ID`.
    - **Transmiterea**: se face prin portalul e-Factura sau prin API-ul ANAF (încărcare XML → primești index încărcare → verifici stare: în așteptare / valid / respins cu erori). Există și mediu de test (sandbox) — începe acolo.
    - **Termen legal**: 5 zile calendaristice de la emitere pentru transmitere, iar clientul are obligația de a prelua factura din virtualul ANAF — deci nu e opțional.

