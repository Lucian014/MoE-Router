    ## 1. Total facturat pe client

    ```sql
    SELECT
        c.id,
        c.name,
        c.cui,
        COUNT(i.id)                          AS invoice_count,
        SUM(i.total_net)                     AS total_net,
        SUM(i.total_vat)                     AS total_vat,
        SUM(i.total_gross)                   AS total_gross
    FROM invoices i
    JOIN clients c ON c.id = i.client_id
    WHERE i.status IN ('issued', 'paid')      -- excludem draft-urile si anulate
      AND i.issue_date >= DATE '2026-01-01'
      AND i.issue_date <  DATE '2026-02-01'
    GROUP BY c.id, c.name, c.cui
    ORDER BY total_gross DESC;
    ```

    ## 2. TVA colectat pe cote

    ```sql
    SELECT
        ln.vat_rate,
        SUM(ln.line_net) AS taxable_base,
        SUM(ln.line_vat) AS vat_collected
    FROM invoice_lines ln
    JOIN invoices i ON i.id = ln.invoice_id
    WHERE i.status IN ('issued', 'paid')
      AND i.issue_date >= DATE '2026-01-01'
      AND i.issue_date <  DATE '2026-02-01'
    GROUP BY ln.vat_rate
    ORDER BY ln.vat_rate DESC;
    ```

    Rezultat de forma:

    ```
     vat_rate | taxable_base | vat_collected
       19.00  |     591.37   |       112.36
        9.00  |     230.00   |        20.70
        5.00  |      80.00   |         4.00
    ```

    Exact ce vrea contabila pentru jurnalul de TVA — și, fiind sumă a liniilor, se închide la ban cu totalurile facturilor.

    ## 3. Combinate: client × cotă (dacă vrei totul într-un singur raport)

    ```sql
    SELECT
        c.name,
        ln.vat_rate,
        SUM(ln.line_net) AS taxable_base,
        SUM(ln.line_vat) AS vat_collected
    FROM invoice_lines ln
    JOIN invoices i ON i.id = ln.invoice_id
    JOIN clients c  ON c.id = i.client_id
    WHERE i.status IN ('issued', 'paid')
      AND i.issue_date >= DATE '2026-01-01'
      AND i.issue_date <  DATE '2026-02-01'
    GROUP BY c.name, ln.vat_rate
    ORDER BY c.name, ln.vat_rate DESC;
    ```

