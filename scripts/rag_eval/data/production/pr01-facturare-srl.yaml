    ## Service-ul de emitere

    ```python
    # app/services/invoice_service.py
    from datetime import date
    from decimal import Decimal

    from sqlalchemy import select
    from sqlalchemy.orm import Session

    from app.models import Invoice, InvoiceLine, InvoiceStatus, InvoiceCounter


    def _get_or_create_counter(db: Session, series: str, year: int) -> InvoiceCounter:
        counter = db.execute(
            select(InvoiceCounter)
            .where(InvoiceCounter.series == series, InvoiceCounter.year == year)
            .with_for_update()  # blochează rândul până la commit/rollback
        ).scalar_one_or_none()

        if counter is None:
            counter = InvoiceCounter(series=series, year=year, last_number=0)
            db.add(counter)
            db.flush()
        return counter


    def issue_invoice(db: Session, *, series: str, client_id: int, due_date: date,
                      lines_data: list[dict], **seller_data) -> Invoice:
        today = date.today()
        counter = _get_or_create_counter(db, series, today.year)
        counter.last_number += 1

        invoice = Invoice(
            series=series,
            number=counter.last_number,
            status=InvoiceStatus.issued,
            issue_date=today,
            due_date=due_date,
            client_id=client_id,
            **seller_data,
        )

        total_net = total_vat = Decimal("0")
        for ld in lines_data:
            qty = Decimal(str(ld["quantity"]))
            price = Decimal(str(ld["unit_price"]))
            vat_rate = Decimal(str(ld.get("vat_rate", "21")))
            net = (qty * price).quantize(Decimal("0.01"))
            vat = (net * vat_rate / 100).quantize(Decimal("0.01"))
            total_net += net
            total_vat += vat
            invoice.lines.append(InvoiceLine(
                description=ld["description"],
                unit=ld.get("unit", "buc"),
                quantity=qty,
                unit_price=price,
                vat_rate=vat_rate,
                line_net=net, line_vat=vat, line_gross=net + vat,
            ))

        invoice.total_net = total_net
        invoice.total_vat = total_vat
        invoice.total_gross = total_net + total_vat
        db.add(invoice)
        db.commit()
        db.refresh(invoice)
        return invoice
    ```

    ## De ce funcționează

    - `with_for_update()` face `SELECT ... FOR UPDATE` pe rândul de contor. Dacă doi useri emit simultan pe seria FCT, al doilea **blochează** pe acel SELECT până când primul face commit. Apoi citește valoarea actualizată (`last_number` incrementat) și primește numărul următor. Postgres garantează asta la nivel de rând, deci e rapid — blochezi un singur rând, nu tabela.
    - E important ca `_get_or_create_counter` să fie **în aceeași tranzacție** cu insert-ul facturii — în FastAPI, cu dependența `get_db()` de mai devreme, tot request-ul e o tranzacție, deci e ok atâta timp cât nu faci commit intermediar.
    - La anularea facturii: doar setezi `status = cancelled`, nu ștergi rândul. Așa seria rămâne continuă și contabila e fericită.

    ## Două observații

    - **Draft-urile nu consumă număr**: creezi draft-ul fără `number` (sau `number = NULL`), iar numărul se atribuie doar la trecerea în `issued`, apelând logica de mai sus. Dacă un draft se șterge, nicio problemă.
    - Alternativ există `pg_advisory_xact_lock(hashtext(series))` — util dacă ai mai multe procese, dar `FOR UPDATE` pe rândul de contor e suficient și mai simplu pentru cazul tău.

    Vrei și endpoint-ul FastAPI (`POST /invoices` + `POST /invoices/{id}/cancel`) cu schemele Pydantic?
