    - **TVA-ul se rotunjește o singură dată pe cota** (`vat_by_rate`), nu pe fiecare linie — cerința contabilei.
    - **Alocarea pe linii cu restul cel mai mare**: liniile primesc TVA proporțional cu baza lor, iar diferențele de rotunjire (câte un ban) merg pe liniile cu cele mai mari resturi. Suma liniilor = exact TVA-ul grupei, deci subsolul facturii și e-Factura sunt consistente.
