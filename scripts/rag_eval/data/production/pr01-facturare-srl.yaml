    - **Rolele/ownerii** — dump-ul conține `ALTER ... OWNER TO facturare`, deci userul `facturare` trebuie să existe pe serverul nou:

    ```bash
    psql -U postgres -c "CREATE USER facturare WITH PASSWORD '...';"
    ```

    Dacă ownerii diferă, poți ignora erorile de ownership cu `psql -v ON_ERROR_STOP=0` sau, mai curat, `--no-owner --no-privileges` la dump.

