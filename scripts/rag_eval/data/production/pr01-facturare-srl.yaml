    ## Observații importante

    - **Fixture-ul `db` folosește rollback per test** — fiecare test pornește cu DB gol, dar fără drop/create la fiecare (lent). Testele de concurență folosesc `engine` direct cu sesiuni proprii, pentru că au nevoie de commit-uri reale pe conexiuni separate — de aceea ele **nu** trec prin fixture-ul `db` și curăță manual ce creează (clientul). Dacă ai multe teste de concurență, merită un fixture dedicat care trunchiază tabelele înainte.
    - **`threading.Barrier`** — forțează toate threadurile să pornească emiterea în același moment, maximizând șansa de coliziune. Fără el, testul ar putea trece chiar și fără `FOR UPDATE` (threadurile s-ar executa secvențial din întâmplare). Chiar și așa, testul nu e determinist ca „demonstrație de race" — e o **asigurare**: dacă cineva scoate `with_for_update()` din service, testul va pica (duplicate key) cel mai probabil, dar nu garantat la fiecare rulare. Pentru verificarea deterministă a blocării, ai nevoie de două conexiuni orchestr manual (una blochează contorul cu `FOR UPDATE`, a doua trebuie să timeout pe emitere) — spune-mi dacă vrei și varianta aia.
