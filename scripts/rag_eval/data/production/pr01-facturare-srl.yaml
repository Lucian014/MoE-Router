    ```python
    # alembic/versions/xxxx_multi_company.py
    """multi-company: companies, invoice_series, invoices.company_id"""

    from alembic import op
    import sqlalchemy as sa


    def upgrade() -> None:
        # 1. tabela companies
        op.create_table(
            "companies",
            sa.Column("id", sa.Integer, primary_key=True),
            sa.Column("name", sa.String(200), nullable=False),
            sa.Column("cui", sa.String(20), nullable=False, unique=True),
            sa.Column("address", sa.String(300)),
            sa.Column("city", sa.String(100)),
            sa.Column("county", sa.String(10)),
            sa.Column("postal_code", sa.String(6)),
            sa.Column("iban", sa.String(34)),
            sa.Column("email", sa.String(200)),
            sa.Column("anaf_cif", sa.String(20), nullable=False),
            sa.Column("active", sa.Boolean, nullable=False, server_default="true"),
        )

        # 2. invoice_series
        op.create_table(
            "invoice_series",
            sa.Column("id", sa.Integer, primary_key=True),
            sa.Column("company_id", sa.Integer,
                      sa.ForeignKey("companies.id"), nullable=False, index=True),
            sa.Column("series", sa.String(20), nullable=False),
            sa.Column("name", sa.String(100)),
            sa.Column("active", sa.Boolean, nullable=False, server_default="true"),
            sa.UniqueConstraint("company_id", "series", name="uq_series_per_company"),
            sa.UniqueConstraint("series", name="uq_series_global"),
        )

        # 3. company_id pe invoices — NULLABIL initial (asta e cheia zero-downtime)
        op.add_column("invoices",
                      sa.Column("company_id", sa.Integer, nullable=True))
        op.create_index("ix_invoices_company_id", "invoices", ["company_id"])

        # 4. backfill — toate facturile existente apartin firmei principale
        op.execute("""
            INSERT INTO companies (name, cui, anaf_cif, address, iban, active)
            VALUES ('FIRMA PRINCIPALA SRL', 'RO12345678', '12345678',
                    'Str. Exemplu 1', 'RO49AAAA1B31007593840000', true)
        """)
        op.execute("""
            INSERT INTO invoice_series (company_id, series, name, active)
            SELECT id, 'FCT', 'Facturi vanzari (istoric)', true FROM companies
        """)
        op.execute("""
            UPDATE invoices
            SET company_id = (SELECT id FROM companies LIMIT 1)
            WHERE company_id IS NULL
        """)


    def downgrade() -> None:
        op.drop_index("ix_invoices_company_id", table_name="invoices")
        op.drop_column("invoices", "company_id")
        op.drop_table("invoice_series")
        op.drop_table("companies")
