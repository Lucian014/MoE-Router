    ## Ce adaugă pe model (câmpuri noi, cu migrare)

    Câteva din câmpurile obligatorii nu le avem încă pe `Invoice`/`Company`:

    ```python
    # pe Company (si snapshot pe Invoice):
    seller_trade_register: Mapped[str | None] = mapped_column(String(40))  # J40/123/2020

    # pe Invoice:
    delivery_date: Mapped[date | None] = mapped_column()          # data livrarii, daca difera
    exchange_rate: Mapped[Decimal | None] = mapped_column(Numeric(10, 4))  # pt moneda straina
    total_gross_ron: Mapped[Decimal | None] = mapped_column(Numeric(12, 2))
    reverse_charge: Mapped[bool] = mapped_column(default=False)
    tvar: Mapped[bool] = mapped_column(default=False)             # TVA la incasare
    efactura_upload_index: Mapped[int | None] = mapped_column()   # sau din EfacturaSubmission
    ```

    ## `vat_breakdown` în service

    Template-ul folosește un rezumat pe cote (util contabil și cerut frecvent la controale) — calculează-l din liniile facturii:

    ```python
    from collections import defaultdict

    def vat_breakdown(invoice) -> list[tuple[str, Decimal, Decimal]]:
        agg: dict[Decimal, list[Decimal]] = defaultdict(lambda: [Decimal("0"), Decimal("0")])
        for ln in invoice.lines:
            agg[ln.vat_rate][0] += ln.line_net
            agg[ln.vat_rate][1] += ln.line_vat
        return [(str(rate), base, vat) for rate, (base, vat) in sorted(agg.items(), reverse=True)]
    ```

    și în endpoint: `template.render(invoice=invoice, lines=invoice.lines, vat_breakdown=vat_breakdown(invoice))`.

    ## Câmpurile obligatorii RO — verificare

    | Obligatoriu | Unde în template |
    |---|---|
    | Identificarea vânzătorului (denumire, adresă, CUI, nr. TVA) | box vânzător |
    | Identificarea cumpărătorului (denumire, adresă, CUI/CNP) | box cumpărător |
    | Număr unic, secvențial | doc-title |
    | Data emiterii | meta |
    | Data livrării/prestării (dacă diferă de emitere) | meta (condițional) |
    | Scadența plății | meta |
    | Denumirea cantitativ-calitativă a bunurilor/serviciilor | coloana descriere |
    | Cantitatea, prețul unitar | coloane |
    | Cota TVA și suma TVA pe fiecare linie | coloane |
    | Totaluri (net, TVA, brut) | totals |
    | Moneda + curs BNR dacă e străină | meta + totals (condițional) |
    | Modalitatea de plată + IBAN | meta + box vânzător |
    | Mențiuni speciale (reverse charge, TVAR) | legal (condițional) |

    Un detaliu: pentru **cumpărător neplatitor** (cazul Agroserv), template-ul afișează mențiunea „(neplatitor de TVA)" lângă CUI — nu e obligatorie legal, dar previne confuzii la client și e consecventă cu XML-ul e-Factura care omită BT-48.
