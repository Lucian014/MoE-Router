    De ce merge fără downtime:

    - **`ADD COLUMN ... nullable`** — instant în Postgres (doar metadata, nu rescrie tabela). 60k rânduri ar fi fost rapide oricum, dar nullable e instant chiar și la milioane.
    - **`UPDATE`-ul de backfill** — 60k rânduri, sub o secundă. La volume mari ar fi fost pe batch-uri (`WHERE id BETWEEN ... LIMIT 10000` în buclă), dar aici nu merită complexitatea.
