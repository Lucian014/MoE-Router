    Adică DB-ul a fost creat fără Alembic (ex. `Base.metadata.create_all()` la setup) sau cineva a șters tabela. Schema există, dar Alembic nu știe de ea. Fix: marchează starea actuală ca punct de plecare:

    ```bash
    alembic stamp head    # daca schema reala = ultima migrare din cod
    alembic upgrade head  # daca mai sunt migrari noi de aplicat dupa stamp
