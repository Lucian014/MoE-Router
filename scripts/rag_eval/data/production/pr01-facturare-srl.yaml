    **WeasyPrint**, clar în cazul vostru — și motivul e arhitectura pe care o ai deja.

    ## De ce WeasyPrint

    - **Ai deja Jinja2** — WeasyPrint randează HTML+CSS la PDF, deci template-ul PDF-ului e un Jinja template clasic, identic ca stil cu restul aplicației. Layout-ul facturii (tabel de linii, totaluri, antet firmă) se scrie în HTML/CSS pe care îl știi deja, nu într-un API procedural de desenare.
    - **ReportLab** e o librărie de desenare imperative — construiești PDF-ul cu `canvas.line()`, `Table()`, `Style()` în Python. Merge, dar pentru o factură cu layout decent ajungi la 150-300 de linii de cod de poziționare, iar orice ajustare de design (margine, font, aliniere) înseamnă modificare de cod, nu de template. Merită doar la PDF-uri generate în masă cu performanță critică — nu e cazul vostru la 200 facturi/lună.
    - **CSS real** — `@page` cu margini, header/footer repetat pe fiecare pagină, numărare pagini (`counter(page)`), fonturi custom. Facturile pe mai multe pagini (linii multe) ies corect din cutie.

    ## Implementare

    ```bash
    pip install weasyprint
    ```

    ```python
    # app/services/pdf_service.py
    from io import BytesIO

    from weasyprint import HTML
    from jinja2 import Environment, FileSystemLoader

    env = Environment(loader=FileSystemLoader("app/templates"))

    def render_invoice_pdf(invoice) -> bytes:
        template = env.get_template("invoice_pdf.html")
        html = template.render(invoice=invoice, lines=invoice.lines)
        return HTML(string=html, base_url="app/templates").write_pdf()
    ```

    Endpoint:

    ```python
    @router.get("/invoices/{invoice_id}/pdf")
    def invoice_pdf(invoice_id: int, db: Session = Depends(get_db)):
        invoice = db.get(Invoice, invoice_id)
        if invoice is None:
            raise HTTPException(404)
        return Response(
            pdf_service.render_invoice_pdf(invoice),
            media_type="application/pdf",
            headers={"Content-Disposition":
                     f'inline; filename="{invoice.series}-{invoice.number:04d}.pdf"'},
        )
    ```

    Și `app/templates/invoice_pdf.html` — HTML simplu cu CSS pentru print:

