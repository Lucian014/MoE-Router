    ## 1. Model — `app/models/reminder.py`

    ```python
    from datetime import datetime

    from sqlalchemy import DateTime, ForeignKey, UniqueConstraint, func
    from sqlalchemy.orm import Mapped, mapped_column

    from app.db.base import Base


    class InvoiceReminder(Base):
        __tablename__ = "invoice_reminders"
        __table_args__ = (
            UniqueConstraint("invoice_id", "days_overdue", name="uq_reminder_once"),
        )

        id: Mapped[int] = mapped_column(primary_key=True)
        invoice_id: Mapped[int] = mapped_column(ForeignKey("invoices.id"))
        days_overdue: Mapped[int]
        sent_at: Mapped[datetime] = mapped_column(DateTime(timezone=True), server_default=func.now())
    ```

    Constraint-ul unic e plasă de siguranță: chiar dacă jobul rulează de două ori, a doua încercare pică pe unique — nu se trimite dublu.

    ## 2. Service — `app/services/reminder_service.py`

    ```python
    from datetime import date

    from sqlalchemy import select
    from sqlalchemy.orm import Session

    from app.models import Invoice, InvoiceReminder, InvoiceStatus
    from app.services.email_service import send_email

    REMINDER_DAYS = [7, 14, 30]


    def send_due_reminders(db: Session) -> list[tuple[str, int, int]]:
        """Trimite remindere pentru facturile neincasate la 7/14/30 zile dupa scadenta.
        Returneaza lista (serie-numar, zile intarziere, client_id) trimise."""
        today = date.today()
        sent: list[tuple[str, int, int]] = []

        overdue = db.execute(
            select(Invoice)
            .where(
                Invoice.status == InvoiceStatus.issued,   # platitele nu mai primesc remindere
                Invoice.due_date.is_not(None),
                Invoice.number.is_not(None),              # doar facturi emise
            )
        ).scalars().all()

        for invoice in overdue:
            days = (today - invoice.due_date).days
            if days not in REMINDER_DAYS:
                continue

            # idempotent: unique constraint blocheaza dublurile
            exists = db.execute(
                select(InvoiceReminder).where(
                    InvoiceReminder.invoice_id == invoice.id,
                    InvoiceReminder.days_overdue == days,
                )
            ).scalar_one_or_none()
            if exists:
                continue

            client = invoice.client
            if client is None or not client.email:
                continue

            send_email(
                to=client.email,
                subject=f"Reamintire factura {invoice.series}-{invoice.number:04d} — scadenta depasita",
                body=(
                    f"Buna ziua,\n\n"
                    f"Va reamintim ca factura {invoice.series}-{invoice.number:04d}, "
                    f"in valoare de {invoice.total_gross} {invoice.currency}, "
                    f"avea scadenta in data de {invoice.due_date.isoformat()} "
                    f"si este neplatita de {days} de zile.\n\n"
                    f"Va rugam sa achitati suma sau sa ne contactati daca plata a fost "
                    f"efectuata intre timp.\n\n"
                    f"Cu stimă,\n{invoice.seller_name}"
                ),
            )

            db.add(InvoiceReminder(invoice_id=invoice.id, days_overdue=days))
            sent.append((f"{invoice.series}-{invoice.number:04d}", days, client.id))

        db.commit()
        return sent
    ```

