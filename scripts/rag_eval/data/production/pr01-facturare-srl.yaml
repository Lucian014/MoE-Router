    Alternativa serioasă e **Chart.js** (mai rapid pe volume mari de puncte, dar API mai puțin „React"), iar pentru dashboards complexe cu multe tipuri de grafice — **ECharts**. La nevoile tale, toate trei sunt overkill; Recharts e cel mai productiv.

