    def _county_code(county: str) -> str:
        """Normalizeaza numele sau codul judetului la codul ISO 3166-2:RO."""
        key = county.strip().upper().removeprefix("RO-")
        code = COUNTY_CODES.get(key) or COUNTY_CODES.get(county.strip())
        if code is None:
