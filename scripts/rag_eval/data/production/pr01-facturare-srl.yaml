    ## De ce secvența nu merge

    `nextval()` nu e tranzacțional. Asta înseamnă:

    - **Rollback-ul consumă numărul.** Dacă tranzacția pică după `nextval()` (eroare de validare, deadlock, restart de server, cancel de la user), numărul alocat se pierde definitiv. Rezultat: goluri. E comportamentul documentat al secvențelor, nu un bug.
    - **La restart, secvența poate sări** înainte (valoarea din WAL nu e mereu la zi, depinde de `CACHE` și de cum a picat).
    - **Nu ai per serie/an.** Secvența e un contor global. Pentru FCT-2026, FCT-2027, seria ALT etc. ar trebui secvențe separate, create manual sau din migrări — bătaie de cap la fiecare an nou.

    Secvențele sunt făcute exact pentru opusul cerinței tale: alocare rapidă, fără blocaje, cu toleranță la goluri. Pentru ID-uri tehnice sunt perfecte; pentru numere de factură legală, nu.

    ## De ce tabela de contor e alegerea corectă

    - **Incrementul e tranzacțional**: rollback → numărul se întoarce, nu există gol.
    - **Blocarea e pe un singur rând**, ține doar pe durata tranzacției (milisecunde la voi), deci la 200 facturi/lună concurența e irelevantă.
    - **Ai contor per serie + an** natural, în același rând, fără operațiuni extra.
    - **Vizibil și auditabil**: vezi în DB exact la ce număr e seria, poți depana, poți reconcilia cu registrul.

    ## Singurul trade-off

    Blocarea contorului serializează emiterile pe aceeași serie — două emiteri simultane pe FCT se execută pe rând. La volumele voastre asta e zero cost. Ar deveni relevant la mii de emiteri pe secundă, iar atunci tot nu ai trece pe secvență, ci pe alocare în batch-uri — cu goluri, deci oricum nu e opțiunea voastră.

    Deci: păstrează implementarea cu `InvoiceCounter` + `FOR UPDATE` + retry-ul de siguranță, și asigură-te că **tot** codul care scrie facturi trece prin `_next_number()`. Asta e garanția reală de serie continuă, nu mecanismul de alocare în sine.
