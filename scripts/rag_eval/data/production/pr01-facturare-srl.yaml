                "description": f"Storno {original.series}-{original.number:04d} — {ln.description}",
                "unit": ln.unit,
                "quantity": -ln.quantity,
                "unit_price": ln.unit_price,
                "vat_rate": ln.vat_rate,
            }
            for ln in original.lines
        ]

        invoice = _build_invoice(
            db,
            series=original.series,          # ACEEASI serie
            client_id=original.client_id,
            due_date=original.issue_date,
            lines_data=lines_data,
            notes=f"Storno factura {original.series}-{original.number:04d}",
            **seller_data,
        )
        invoice.storno_of_id = original.id
        invoice.number = _next_number(db, series=original.series, year=date.today().year)
        invoice.status = InvoiceStatus.issued
        original.status = InvoiceStatus.cancelled

        db.commit()
        db.refresh(invoice)
        return invoice
