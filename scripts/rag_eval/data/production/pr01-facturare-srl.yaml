  assistant: |
    Deadlock-ul ăla e clasic la contorul de serie: când **contorul nu există încă** (prima emitere din serie/an), threadurile concurează la crearea lui — fiecare face INSERT pe `invoice_counters` + INSERT pe `invoices`, cu așteptări pe indexuri unice în ordini diferite, iar Postgres detectează ciclul și omoară o tranzacție. Retry-ul nostru prinde doar `IntegrityError`, dar deadlock-ul vine ca `OperationalError` (SQLSTATE `40P01`) — deci nu e reîncercat.

    Fix-ul curat: **advisory lock pe serie** înainte de orice altceva. Toate emiterile pe aceeași serie se aliniază pe un singur lacăt, ordinea de blocare devine uniformă, deci nu mai există nimic de care să se agațe un deadlock. Lacătul se eliberează automat la commit/rollback (`xact`).

    ## Fix în `invoice_service.py`

    ```python
    from sqlalchemy import text
    from sqlalchemy.exc import IntegrityError, OperationalError


    def _lock_series(db: Session, series: str) -> None:
        """Serializaza emiterea pe serie. Se elibereaza la commit/rollback."""
        db.execute(text("SELECT pg_advisory_xact_lock(hashtext(:s))"), {"s": series})
    ```

    Apelezi `_lock_series(db, series)` **prima dată** în `create_and_issue`, `issue_invoice` și `create_storno` — înainte de `_build_invoice` / `_next_number`:

    ```python
    def create_and_issue(db: Session, **kwargs) -> Invoice:
        series = kwargs.get("series", "FCT")
        for attempt in range(3):
            try:
                _lock_series(db, series)
                invoice = _build_invoice(db, **kwargs)
                invoice.number = _next_number(db, series=series, year=invoice.issue_date.year)
                invoice.status = InvoiceStatus.issued
                db.commit()
                db.refresh(invoice)
                return invoice
            except (IntegrityError, OperationalError):   # + deadlock
                db.rollback()
                if attempt == 2:
                    raise
        raise InvoiceServiceError("Nu am putut emite factura.")
    ```

    (la fel în `issue_invoice`, cu `series=invoice.series` citit înainte de buclă)

    ## De ce merge

    - **Un singur lacăt per serie** = zero interleaving pe contor și pe inserturi. Nu mai e nevoie de `with_for_update()` pe contor ca mecanism principal — îl poți păstra (inofensiv) sau scoate; advisory lock-ul îl subsumează.
    - **Cursa la crearea contorului dispare** — doar un thread ajunge să creeze rândul, celelalte așteaptă la lock, apoi îl văd existent. Poți chiar simplifica `_get_or_create_counter` înapoi la varianta fără savepoint, deși nu strică s-o lași.
    - **Cost zero la volumele tale** — un lacăt în memorie, ținut milisecunde. Emiterile pe serii diferite rămân paralele (lacătul e per string de serie).
    - Retry-ul rămâne plasă de siguranță, acum și pentru deadlock-uri transiente (de la alte surse, ex. migrări care rulează în paralel).

    Testul tău rămâne neschimbat — și e exact testul potrivit: fără advisory lock pică (cum ai văzut), cu el trece determinist, pentru că barrier-ul forțează coliziunea maximă. Rulează-l de câteva ori ca să confirmi stabilitatea.
