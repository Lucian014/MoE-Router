    ## Observații

    - **Datele vin din snapshot** — template-ul folosește `invoice.seller_*` și liniile din DB, nu `Company`/`Product` actuale, ca PDF-ul unei facturi vechi să arate identic cu XML-ul transmis în e-Factura.
    - **Fonturi**: WeasyPrint folosește fonturile de sistem; pe VPS minimal instalează `fonts-dejavu` (`apt install fonts-dejavu-core`) — altfel diacriticele românești pot ieși greșit.
    - **Dependențe de sistem**: WeasyPrint are nevoie de Pango/Cairo (`apt install libpango-1.0-0 libpangocairo-1.0-0` pe Debian/Ubuntu). Pe unele hosting-uri e bătaie de cap; dacă vă lovește, alternativa e `xhtml2pdf` (mai slab vizual, dar pur Python) — dar pe VPS-ul vostru propriu instalarea e trivială.
    - **Atașat la remindere**: acum că ai PDF-ul, mailul ferm de la 30 de zile poate atașa factura — `msg.add_attachment(pdf_bytes, maintype="application/pdf", subtype="pdf", filename=...)`.
