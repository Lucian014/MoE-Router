    ```bash
    pg_restore -U postgres -d facturare --no-owner facturare_2026-01-15.dump
    ```

    Formatul custom e deja comprimat intern, deci nu mai trebuie `gzip`. La dimensiunile tale oricare variantă e ok — dar dacă vrei consistență între backup și restore, alege una și ține-te de ea.
