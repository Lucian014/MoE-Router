    ## **Recharts**

    E cea mai potrivită pentru cazul tău:

    - **Declarativ, stil React** — componentele (`<BarChart>`, `<LineChart>`, `<PieChart>`) se compun natural, fără să te atingi de DOM sau de API-ul imperative al canvas-ului.
