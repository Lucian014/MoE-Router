    ## `app/services/invoice_service.py`

    ```python
    from datetime import date
    from decimal import Decimal, ROUND_HALF_UP

    from sqlalchemy import select
    from sqlalchemy.orm import Session

    from app.models import Invoice, InvoiceLine, InvoiceCounter, InvoiceStatus

    TWO_PLACES = Decimal("0.01")


    class InvoiceServiceError(Exception):
        """Eroare de business (client va primi 400/409, nu 500)."""


    class InvoiceNotFoundError(InvoiceServiceError):
        pass


    class InvalidStatusTransitionError(InvoiceServiceError):
        pass


    def _money(value: Decimal) -> Decimal:
        return value.quantize(TWO_PLACES, rounding=ROUND_HALF_UP)


    def _compute_line(ld: dict) -> dict:
        """Calculeaza totalurile unei linii din quantity / unit_price / vat_rate."""
        qty = Decimal(str(ld["quantity"]))
        price = Decimal(str(ld["unit_price"]))
        vat_rate = Decimal(str(ld.get("vat_rate", "21")))

        if qty <= 0:
            raise InvoiceServiceError("Cantitatea trebuie sa fie pozitiva.")
        if price < 0:
            raise InvoiceServiceError("Pretul nu poate fi negativ.")

        net = _money(qty * price)
        vat = _money(net * vat_rate / 100)
        return {
            "description": ld["description"],
            "unit": ld.get("unit", "buc"),
            "quantity": qty,
            "unit_price": price,
            "vat_rate": vat_rate,
            "line_net": net,
            "line_vat": vat,
            "line_gross": net + vat,
        }


    def _get_or_create_counter(db: Session, series: str, year: int) -> InvoiceCounter:
        counter = db.execute(
            select(InvoiceCounter)
            .where(InvoiceCounter.series == series, InvoiceCounter.year == year)
            .with_for_update()
        ).scalar_one_or_none()

        if counter is None:
            counter = InvoiceCounter(series=series, year=year, last_number=0)
            db.add(counter)
            db.flush()  # ca sa existe randul in tranzactie inainte de commit
        return counter


    def _next_number(db: Session, series: str, year: int) -> int:
        counter = _get_or_create_counter(db, series, year)
        counter.last_number += 1
        return counter.last_number


    def _build_invoice(
        db: Session,
        *,
        series: str,
        client_id: int,
        due_date: date,
        lines_data: list[dict],
        seller_name: str,
        seller_cui: str,
        seller_address: str | None = None,
        seller_iban: str | None = None,
        currency: str = "RON",
        notes: str | None = None,
    ) -> Invoice:
        if not lines_data:
            raise InvoiceServiceError("Factura trebuie sa aiba cel putin o linie.")

        invoice = Invoice(
            series=series,
            status=InvoiceStatus.draft,  # numarul se atribuie la emitere
            issue_date=date.today(),
            due_date=due_date,
            client_id=client_id,
            seller_name=seller_name,
            seller_cui=seller_cui,
            seller_address=seller_address,
            seller_iban=seller_iban,
            currency=currency,
            notes=notes,
        )

        total_net = total_vat = Decimal("0")
        for ld in lines_data:
            computed = _compute_line(ld)
            total_net += computed["line_net"]
            total_vat += computed["line_vat"]
            invoice.lines.append(InvoiceLine(**computed))

        invoice.total_net = total_net
        invoice.total_vat = total_vat
        invoice.total_gross = total_net + total_vat
        db.add(invoice)
        return invoice


    def create_draft(db: Session, **kwargs) -> Invoice:
        """Creeaza un draft. Nu consuma numar din serie."""
        invoice = _build_invoice(db, **kwargs)
        db.commit()
        db.refresh(invoice)
        return invoice


    def issue_invoice(db: Session, invoice_id: int) -> Invoice:
        """Emite un draft: atribuie numarul din serie si trece in status 'issued'.

        Numarul se aloca in ACEEASI tranzactie cu commit-ul, deci doi useri
        care emit simultan primesc numere consecutive, fara coliziuni si fara goluri.
        """
        invoice = db.get(Invoice, invoice_id)
        if invoice is None:
            raise InvoiceNotFoundError(f"Factura {invoice_id} nu exista.")
        if invoice.status != InvoiceStatus.draft:
            raise InvalidStatusTransitionError(
                f"Doar draft-urile pot fi emise (status curent: {invoice.status.value})."
            )

        year = invoice.issue_date.year
        invoice.number = _next_number(db, series=invoice.series, year=year)
        invoice.status = InvoiceStatus.issued

        db.commit()
        db.refresh(invoice)
        return invoice


    def create_and_issue(db: Session, **kwargs) -> Invoice:
        """Scurtatura: creeaza si emite intr-o singura tranzactie."""
        invoice = _build_invoice(db, **kwargs)
        year = invoice.issue_date.year
        invoice.number = _next_number(db, series=invoice.series, year=year)
        invoice.status = InvoiceStatus.issued
        db.commit()
        db.refresh(invoice)
        return invoice


    def cancel_invoice(db: Session, invoice_id: int) -> Invoice:
        """Anuleaza o factura emisa. Numarul ramane consumat (seria continua fara goluri).

        Nu se sterge niciodata o factura emisa — doar anulare.
        """
        invoice = db.get(Invoice, invoice_id)
        if invoice is None:
            raise InvoiceNotFoundError(f"Factura {invoice_id} nu exista.")
        if invoice.status == InvoiceStatus.draft:
            raise InvalidStatusTransitionError(
                "Draft-urile se sterg, nu se anuleaza (nu au numar alocat)."
            )
        if invoice.status == InvoiceStatus.cancelled:
            raise InvalidStatusTransitionError("Factura este deja anulata.")

        invoice.status = InvoiceStatus.cancelled
        db.commit()
        db.refresh(invoice)
        return invoice


    def delete_draft(db: Session, invoice_id: int) -> None:
        """Sterge un draft. Nu afecteaza numerotarea (draft-ul nu are numar)."""
        invoice = db.get(Invoice, invoice_id)
        if invoice is None:
            raise InvoiceNotFoundError(f"Factura {invoice_id} nu exista.")
        if invoice.status != InvoiceStatus.draft:
            raise InvalidStatusTransitionError(
                "Doar draft-urile pot fi sterse. Facturile emise se anuleaza."
            )
        db.delete(invoice)
        db.commit()


    def update_draft(db: Session, invoice_id: int, lines_data: list[dict], **fields) -> Invoice:
        """Actualizeaza un draft (linii + campuri). Nu se poate modifica o factura emisa."""
        invoice = db.get(Invoice, invoice_id)
        if invoice is None:
            raise InvoiceNotFoundError(f"Factura {invoice_id} nu exista.")
        if invoice.status != InvoiceStatus.draft:
            raise InvalidStatusTransitionError("Doar draft-urile pot fi modificate.")

        for key, value in fields.items():
            if hasattr(invoice, key):
                setattr(invoice, key, value)

        if lines_data is not None:
            invoice.lines.clear()
            total_net = total_vat = Decimal("0")
            for ld in lines_data:
                computed = _compute_line(ld)
                total_net += computed["line_net"]
                total_vat += computed["line_vat"]
                invoice.lines.append(InvoiceLine(**computed))
            invoice.total_net = total_net
            invoice.total_vat = total_vat
            invoice.total_gross = total_net + total_vat

        db.commit()
        db.refresh(invoice)
        return invoice


    def mark_paid(db: Session, invoice_id: int) -> Invoice:
        invoice = db.get(Invoice, invoice_id)
        if invoice is None:
            raise InvoiceNotFoundError(f"Factura {invoice_id} nu exista.")
        if invoice.status != InvoiceStatus.issued:
            raise InvalidStatusTransitionError(
                f"Doar facturile emise pot fi marcate ca platite (status curent: {invoice.status.value})."
            )
        invoice.status = InvoiceStatus.paid
        db.commit()
        db.refresh(invoice)
        return invoice
    ```

    ## Observații importante

    - **`create_and_issue`** e varianta pe care o vei folosi cel mai des din endpoint-ul `POST /invoices` — creează și emite într-o singură cerere, deci numărul se atribuie imediat, atomic.
    - **Toate funcțiile fac un singur `commit()` la final** — asta e esențial. Blocarea contorului (`FOR UPDATE`) se eliberează la commit, deci fereastra de blocare e minimă (câteva milisecunde). Dacă ar fi două commit-uri (unul la draft, unul la emitere), ai avea o cursă între ele.
    - **Excepțiile custom** le prinzi în endpoint și le mapezi: `InvoiceNotFoundError` → 404, `InvalidStatusTransitionError` / `InvoiceServiceError` → 400 sau 409. Așa nu scapă erori de business ca 500.
    - **`update_draft` cu `lines.clear()`** — funcționează datorită `cascade="all, delete-orphan"` de pe relație: SQLAlchemy șterge liniile vechi și inserează altele noi. E mai simplu decât diff manual și la volumele tale e perfect ok.
