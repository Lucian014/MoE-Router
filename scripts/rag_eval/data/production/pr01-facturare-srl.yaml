    - **„capped at"** e formula scurtă și uzuală pentru limita maximă. Dacă te temi că e prea colocvial, varianta 2 o spune pe larg.
    - Am înlocuit „the amount on which they are calculated" cu „outstanding principal amount" — „principal" clarifică că limita se referă la suma datorată, nu la penalitățile acumulate între timp.

