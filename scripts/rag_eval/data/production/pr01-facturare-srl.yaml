    Da, sintaxa e **UBL 2.1**, dar formatul propriu-zis e **RO_CIUS** — un profil românesc construit peste standardul european **EN 16931**. ANAF validează XML-ul primit împotriva regulilor EN 16931 (BR-xx) plus regulile naționale (BR-RO-xx), deci un UBL „generic" valid poate fi respins dacă îi lipsesc câmpurile cerute de RO_CIUS.

    ## Ce cere RO_CIUS în plus față de EN 16931 (esențialul)

    - **CUI-ul vânzătorului și cumpărătorului** în `cac:Party/cbc:CompanyID` (BT-31/BT-48), cu prefixul `RO` pentru persoanele cu cod de TVA.
    - **Moneda RON** la `cbc:DocumentCurrencyCode` (BT-5).
    - **TaxTotal cu subtotaluri pe fiecare cotă** folosită pe linii — dacă ai linii la 19% și 9%, trebuie două `cac:TaxSubtotal`, iar sumele trebuie să se închidă la ban cu liniile.
    - `cbc:CustomizationID` cu identificatorul RO_CIUS (versiunea se schimbă periodic — verifică pe site-ul ANAF/e-Factura versiunea curentă înainte de implementare).

