- user: |
    cum ma autentific la api-ul lor? e oauth2?
  assistant: |
    Da, OAuth2 — ANAF folosește OpenID Connect pe `logincert.anaf.ro`. Ai două variante de flow, iar pentru o aplicație server-to-server ca a ta e clară alegerea:

    ## Cele două flow-uri

    1. **Authorization Code** — flow-ul clasic: te loghezi în browser cu **certificat digital calificat** (sau utilizator ANAF), primești un `code` pe callback, îl schimbi în token. Token de acces valabil ~10 ore, refresh token ~90 de zile. E flow-ul pentru aplicații cu UI, unde un om se autentifică.
    2. **Client Credentials** — introdus de ANAF pentru aplicații B2B: doar `client_id` + `client_secret`, fără interacțiune umană. **Asta e pentru tine** — serverul tău FastAPI se autentifică singur la ANAF. Îți creezi aplicația în portalul ANAF (spațiul privat, secțiunea de aplicații OAuth) și primești credențialele.

    ## Implementare client credentials

    ```python
    # app/services/anaf_client.py
    import time
    import httpx

    from app.core.config import settings

    TOKEN_URL = "https://logincert.anaf.ro/anaf-oauth2/v1/token"
    UPLOAD_URL = "https://api.anaf.ro/prod/FCTEL/rest/uploadXML"
    STATUS_URL = "https://api.anaf.ro/prod/FCTEL/rest/stareMesaj"
    DOWNLOAD_URL = "https://api.anaf.ro/prod/FCTEL/rest/descarcare"

    _token_cache: dict = {"access_token": None, "expires_at": 0}


    def _get_access_token() -> str:
        """Obtine si cache-uieste tokenul OAuth2 (client credentials)."""
        if _token_cache["access_token"] and time.time() < _token_cache["expires_at"] - 60:
            return _token_cache["access_token"]

        resp = httpx.post(
            TOKEN_URL,
            data={
                "grant_type": "client_credentials",
                "client_id": settings.anaf_client_id,
                "client_secret": settings.anaf_client_secret,
            },
            headers={"Content-Type": "application/x-www-form-urlencoded"},
            timeout=30,
        )
        resp.raise_for_status()
        data = resp.json()

        _token_cache["access_token"] = data["access_token"]
        _token_cache["expires_at"] = time.time() + data.get("expires_in", 3600)
        return data["access_token"]


    def upload_invoice_xml(xml_bytes: bytes, cif: str, standard: str = "UBL") -> dict:
        """Trimite XML-ul in e-Factura. Returneaza {index_incarcare, ...}."""
        resp = httpx.post(
            UPLOAD_URL,
            params={"standard": standard, "cif": cif},
            content=xml_bytes,
            headers={
                "Authorization": f"Bearer {_get_access_token()}",
                "Content-Type": "application/xml",
            },
            timeout=60,
        )
        resp.raise_for_status()
        return resp.json()


    def check_upload_status(upload_index: int, cif: str) -> dict:
        """Verifica starea: in asteptare / OK / respins (cu erori de validare)."""
        resp = httpx.get(
            STATUS_URL,
            params={"id_incarcare": upload_index, "cif": cif},
            headers={"Authorization": f"Bearer {_get_access_token()}"},
            timeout=30,
        )
        resp.raise_for_status()
        return resp.json()


    def download_result(download_id: int, cif: str) -> bytes:
        """Descarca rezultatul (XML cu erori de validare sau factura semnata)."""
        resp = httpx.get(
            DOWNLOAD_URL,
            params={"id": download_id, "cif": cif},
            headers={"Authorization": f"Bearer {_get_access_token()}"},
            timeout=60,
        )
        resp.raise_for_status()
        return resp.content
    ```

    Config:

    ```python
        anaf_client_id: str = ""
        anaf_client_secret: str = ""
        anaf_cif: str = ""  # CUI-ul firmei tale, fara prefix RO
    ```

    ## Fluxul complet de trimitere

    1. `upload_invoice_xml()` → primești un **index de încărcare** (îl salvezi pe factură).
    2. Aștepți (de regulă secunde–minute) și apelezi `check_upload_status()` → răspunsul conține `stare` (`ok` / `ok_prelucrare` / `respins`) și un `id_descarcare` dacă e gata.
    3. `download_result()` → dacă e respins, XML-ul descărcat conține **erorile de validare** (BR-RO etc.); dacă e ok, conține factura semnată electronic.

    ## Observații practice

    - **Client credentials e disponibil doar pentru persoane juridice** și trebuie activat de administratorul firmei în spațiul privat ANAF. Dacă nu apare opțiunea, contabilul/admin trebuie să o activeze.
    - **Mediu de test**: schimbă URL-urile pe `https://api.anaf.ro/test/FCTEL/rest/...` și folosește credențiale de sandbox — testează acolo până tot fluxul trece curat.
    - **Rate limit**: ANAF limitează cererile (câteva pe secundă); la 200 facturi/lună nu e problemă, dar dacă faci batch, pune un mic delay între upload-uri.
    - **Salvează `index_incarcare` și starea pe factură** — un model `EfacturaSubmission(invoice_id, upload_index, status, errors, sent_at)` ca să poți reconcilia ce s-a trimis și ce a picat.
    - Tokenul de la client credentials nu are refresh token — expiră și ceri altul, de aceea cache-ul de mai sus e suficient.

    Vrei și modelul `EfacturaSubmission` + endpoint-ul care leagă factura de trimitere și verificarea automată a stării?
- user: |
    tokenul expira? cum fac refresh automat fara sa ma loghez manual cu certificatul
  assistant: |
    Da, expiră — dar aici e vestea bună: **cu client credentials nu trebuie să te loghezi niciodată manual**. Refresh-ul e automat prin natura flow-ului.

    ## De ce nu ai nevoie de refresh token

    - La **Authorization Code** (flow cu browser + certificat), tokenul de acces expiră (~10 ore) și primești un `refresh_token` (~90 zile) ca să reînnoiești fără re-login. După 90 de zile, re-login manual. Asta e flow-ul „cu om".
    - La **Client Credentials**, nu există refresh token pentru că **nu e nevoie**: oricând tokenul expiră, serverul tău cere altul direct cu `client_id` + `client_secret` — o simplă cerere POST, fără browser, fără certificat, fără om. Credențialele clientului nu expiră (sau revoci tu, dacă e cazul).

    Deci „refresh automat" = „ceri un token nou când cel vechi a murit". Exact ce face deja cache-ul din `_get_access_token()`:

    ```python
    if _token_cache["access_token"] and time.time() < _token_cache["expires_at"] - 60:
        return _token_cache["access_token"]
    # altfel: POST la TOKEN_URL cu client_id + client_secret -> token nou
    ```

    Durata reală o primești în `expires_in` din răspuns, deci codul se adaptează oricât ar fi (la ANAF e scurt — ordinul minutelor, nu orelor — dar nu contează, pentru că re-obținerea e gratuită și instantă).

    ## Două întărituri pentru producție

    **1. Retry pe 401** — dacă tokenul expiră între cache și utilizare (sau ANAF îl invalidează mai devreme), reîncearcă o dată cu token proaspăt:

    ```python
    def _authed_request(method: str, url: str, **kwargs) -> httpx.Response:
        for attempt in range(2):
            resp = httpx.request(
                method, url,
                headers={"Authorization": f"Bearer {_get_access_token()}", **kwargs.pop("headers", {})},
                timeout=60, **kwargs,
            )
            if resp.status_code == 401 and attempt == 0:
                _token_cache.update({"access_token": None, "expires_at": 0})
                continue
            return resp
        return resp
    ```

    și folosește `_authed_request` în `upload_invoice_xml` / `check_upload_status` / `download_result`.

    **2. Thread-safety** — dacă mai multe request-uri FastAPI cer token simultan la pornire, pot face două cereri de token paralel. Inofensiv (doar un token în plus irosit), dar dacă vrei curat, un `threading.Lock` în jurul blocului de obținere rezolvă:

