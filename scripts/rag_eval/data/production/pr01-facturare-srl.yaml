    ## 3. Întărește idempotența la nivel de DB (indiferent de variantă)

    Chiar și cu un singur proces, mută **trimiterea după rezervarea rândului**, ca dublura să fie imposibilă structural:

    ```python
    def send_due_reminders(db: Session) -> list[tuple[str, int, int]]:
        today = date.today()
        sent: list[tuple[str, int, int]] = []

        overdue = db.execute(
            select(Invoice).where(
                Invoice.status == InvoiceStatus.issued,
                Invoice.due_date.is_not(None),
                Invoice.number.is_not(None),
            )
        ).scalars().all()

        for invoice in overdue:
            days = (today - invoice.due_date).days
            if days not in REMINDER_DAYS:
                continue

            client = invoice.client
            if client is None or not client.email:
                continue

            # 1) REZERVA rândul INTAI — commit imediat, unique constraint decide cine trimite
            reminder = InvoiceReminder(invoice_id=invoice.id, days_overdue=days)
            db.add(reminder)
            try:
                db.commit()
            except IntegrityError:
                db.rollback()
                continue  # alt proces l-a trimis deja — sarim

            # 2) ABIA ACUM trimitem mailul
            send_email(
                to=client.email,
                subject=f"Reamintire factura {invoice.series}-{invoice.number:04d} — scadenta depasita",
                body=(...),
            )
            sent.append((f"{invoice.series}-{invoice.number:04d}", days, client.id))

        return sent
    ```

    Diferența esențială: înainte, ordinea era *verifică → trimite → inserează* (fereastră de cursă între verificare și insert). Acum e *inserează (atomic, protejat de unique) → trimite*. Două procese concurente: unul face commit, celălalt primește `IntegrityError` și sare — mailul pleacă exact o dată, garantat, indiferent câte procese rulează.

