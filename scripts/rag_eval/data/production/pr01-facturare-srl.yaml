    Planul spune clar problema: **`Seq Scan on invoice_lines`** — Postgres citește toate cele 411.822 de linii ca să găsească cele ~5.000 care aparțin facturilor din lună, pentru că **nu are index pe `invoice_lines.invoice_id`**. Hash join-ul e singura lui opțiune fără index: „citește tot, vezi ce se potrivește". Acolo se duc cei ~3 secunde din plan.

    ## Fix: index pe foreign key

    ```sql
    CREATE INDEX idx_invoice_lines_invoice_id ON invoice_lines (invoice_id);
    CREATE INDEX idx_invoices_issue_date ON invoices (issue_date);
    ANALYZE invoice_lines;
    ANALYZE invoices;
    ```

    Regula generală: **orice FK din Postgres ar trebui să aibă index** — Postgres nu le creează automat la `FOREIGN KEY` (spre deosebire de alte DB-uri). Ai același gol și pe `invoices.client_id`, probabil:

    ```sql
    CREATE INDEX idx_invoices_client_id ON invoices (client_id);
    ```

    ## Ce se schimbă după

    Plannerul va putea alege un **nested loop**: pentru fiecare din cele ~5.000 de facturi din lună, un index lookup pe linii (≈7 linii/factură la tine) — adică ~35.000 de citiri țintite în loc de 411.822 secvențiale. Așteaptă-te la zeci de milisecunde, nu secunde.

