    Cea mai frecventă cauză: fișierele de migrare au fost regenerate/redenumite/șterse (de exemplu colegul a făcut `alembic revision --autogenerate` și a șters migrări vechi, sau istoricul din git a fost rescris). DB-ul are `alembic_version` cu un ID pe care codul nu-l mai cunoaște.

