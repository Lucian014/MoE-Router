    numerotarea facturilor trebuie sa fie continua pe serie, gen FCT-2026-0001, fara goluri (asa zice contabila ca e legal). cum fac sa nu iasa doua facturi cu acelasi numar daca emit doi useri in acelasi timp?
  assistant: |
    Bună întrebare — e o problemă clasică de concurență. Soluția corectă are două piese:

    1. **Un contor pe serie+an, blocat cu `SELECT ... FOR UPDATE`** în aceeași tranzacție cu emiterea facturii. Al doilea user așteaptă până se termină primul, apoi primește numărul următor. Fără coliziuni.
    2. **Regula de business**: numărul se atribuie doar la emitere (nu la draft), iar o factură emisă **nu se șterge niciodată** — doar se anulează. Anularea consumă numărul (asta e și corect contabil: factura FCT-2026-0007 anulată rămâne în registru, seria rămâne continuă). Dacă ai permite ștergerea după emitere, ai avea goluri.

    Rollback-ul tranzacției nu e o problemă: dacă INSERT-ul pică, contorul se întoarce la valoarea veche și numărul nu a fost niciodată vizibil, deci nu există gol.

