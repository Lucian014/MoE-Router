    def test_concurrent_issuing_no_duplicates_no_gaps(engine, client_factory):
        """10 threaduri emit simultan pe aceeasi serie.

        Asteptari:
        - 10 facturi cu numerele 1..10, fara duplicate, fara goluri
        - contorul final = 10
        Fiecare thread are propria sesiune (ca request-uri FastAPI separate).
        """
        from sqlalchemy.orm import sessionmaker

        # clientul il cream inainte, intr-o sesiune separata, commit-uita
        Session = sessionmaker(bind=engine, expire_on_commit=False)
        setup = Session()
        client = Client(name="Client Concurenta", cui="RO99999999")
        setup.add(client)
        setup.commit()
        client_id = client.id
        setup.close()

        N_THREADS = 10
        results: list[int | None] = [None] * N_THREADS
        errors: list[Exception | None] = [None] * N_THREADS
        barrier = threading.Barrier(N_THREADS)  # pornim toate threadurile simultan

        def worker(idx: int):
            s = Session()
            try:
                barrier.wait(timeout=10)  # sincronizam pornirea
                inv = _issue(s, client_id)
                s.commit()
                results[idx] = inv.number
            except Exception as e:
                s.rollback()
                errors[idx] = e
            finally:
                s.close()

        threads = [threading.Thread(target=worker, args=(i,)) for i in range(N_THREADS)]
        for t in threads:
            t.start()
        for t in threads:
            t.join(timeout=30)

        assert not any(errors), f"Threaduri cu erori: {errors}"

        numbers = sorted(n for n in results if n is not None)
        assert len(numbers) == N_THREADS
        assert numbers == list(range(1, N_THREADS + 1))  # consecutive, fara duplicate

        # contorul din DB e consistent cu numerele emise
        from app.models import InvoiceCounter
        check = Session()
        counter = check.query(InvoiceCounter).filter_by(series="FCT", year=date.today().year).one()
        check.close()
        assert counter.last_number == N_THREADS


    def test_concurrent_issuing_multiple_series(engine, client_factory):
        """Concurenta pe serii diferite nu se blocheaza reciproc (blocare per rand)."""
        from sqlalchemy.orm import sessionmaker

        Session = sessionmaker(bind=engine, expire_on_commit=False)
        setup = Session()
        client = Client(name="Client Multi Serie", cui="RO88888888")
        setup.add(client)
        setup.commit()
        client_id = client.id
        setup.close()

        results: list[tuple[str, int]] = []
        lock = threading.Lock()

        def worker(series: str):
            s = Session()
            try:
                inv = _issue(s, client_id, series=series)
                s.commit()
                with lock:
                    results.append((series, inv.number))
            finally:
                s.close()

        threads = [threading.Thread(target=worker, args=(s,))
                   for s in ["FCT", "ALT", "FCT", "ALT", "FCT"]]
        for t in threads:
            t.start()
        for t in threads:
            t.join(timeout=30)

        fct = sorted(n for s, n in results if s == "FCT")
        alt = sorted(n for s, n in results if s == "ALT")
        assert fct == [1, 2, 3]
        assert alt == [1, 2]
