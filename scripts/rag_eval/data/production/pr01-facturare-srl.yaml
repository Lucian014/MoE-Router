    ## Observații importante

    - **Un singur worker uvicorn!** Scheduler-ul rulează în procesul aplicației — dacă pornești cu `--workers 4`, fiecare worker are propriul scheduler și **trimite remindere de 4 ori**. Unique constraint-ul din `invoice_reminders` te salvează parțial (dublurile pică la insert), dar e cursă între procese — nu te baza. Rulează cu `uvicorn app.main:app` (1 worker) sau, dacă ai nevoie de mai mulți workers, mută scheduler-ul într-un proces separat (`python -m app.core.scheduler` cu un mic `if __name__ == "__main__"` care apelează `start_scheduler()` + `while True: sleep()`).
    - **`misfire_grace_time` + `coalesce`** — dacă VPS-ul e repornit la ora 9:00, jobul rulează când revine aplicația, nu îl pierde. Fără ele, APScheduler ar sări rularea pierdută.
    - **`replace_existing=True`** — la reload-uri de dezvoltare (uvicorn `--reload`), jobul nu se duplică.
    - **Cron-ul de backup rămâne** — APScheduler e pentru remindere (legat de aplicație), cron pentru backup (legat de sistem). Nu muta backup-ul în APScheduler: dacă aplicația e jos, backup-ul tot trebuie să ruleze.
    - **Vizibilitate**: APScheduler ține istoricul rulărilor în memorie (`scheduler.get_jobs()`), dar dacă vrei audit persistent, loghează în fișier — deja `send_due_reminders` returnează ce a trimis, iar print-ul de mai sus ajunge în jurnalul systemd (`journalctl -u facturare`).
    - Dacă mai târziu adaugi alte job-uri periodice (sync e-Factura, exporturi), le adaugi în același `start_scheduler()` cu `scheduler.add_job(...)` — fără infrastructură nouă.
