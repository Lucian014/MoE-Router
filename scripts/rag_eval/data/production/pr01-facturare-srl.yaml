    ```python
    from datetime import date
    from decimal import Decimal

    from sqlalchemy import select, text
    from sqlalchemy.exc import IntegrityError, OperationalError
    from sqlalchemy.orm import Session

    from app.models import Invoice, InvoiceCounter, InvoiceSeries, InvoiceStatus
    from app.models.company import Company


    class InvoiceServiceError(Exception):
        pass


    # ------------------------------------------------------------------ locking

    def _lock_series(db: Session, series: str) -> None:
        """Serializaza emiterea pe serie.

        pg_advisory_xact_lock = lacat la nivel de tranzactie, se elibereaza
        automat la commit/rollback. Toate emiterile pe aceeasi serie asteapta
        aici; pe serii diferite raman paralele. Fara acest lacat, doua
        tranzactii concurente pot citi acelasi last_number -> numere duplicate.
        """
        db.execute(text("SELECT pg_advisory_xact_lock(hashtext(:s))"), {"s": series})


    # ------------------------------------------------------------------ contor

    def _get_or_create_counter(db: Session, series: str, year: int) -> InvoiceCounter:
        """Citeste contorul. Apeleaza-l DOAR dupa _lock_series — lacatul
        garanteaza ca nimeni altcineva nu e in mijlocul crearii contorului."""
        counter = db.execute(
            select(InvoiceCounter).where(
                InvoiceCounter.series == series,
                InvoiceCounter.year == year,
            )
        ).scalar_one_or_none()

        if counter is None:
            counter = InvoiceCounter(series=series, year=year, last_number=0)
            db.add(counter)
            db.flush()
        return counter


    def _next_number(db: Session, *, series: str, year: int) -> int:
        """Aloca numarul urmator. Obligatoriu in interiorul lacatului."""
        counter = _get_or_create_counter(db, series, year)
        counter.last_number += 1
        db.flush()
        return counter.last_number


    # ------------------------------------------------------------------ validare serie

    def _validate_series(db: Session, company_id: int, series: str) -> InvoiceSeries:
        s = db.execute(
            select(InvoiceSeries).where(
                InvoiceSeries.company_id == company_id,
                InvoiceSeries.series == series,
                InvoiceSeries.active.is_(True),
            )
        ).scalar_one_or_none()
        if s is None:
            raise InvoiceServiceError(
                f"Seria '{series}' nu exista sau nu apartine acestei firme."
            )
        return s


    # ------------------------------------------------------------------ emitere

    def create_and_issue(db: Session, *, company_id: int, series: str, **kwargs) -> Invoice:
        """Creeaza si emite factura intr-o singura tranzactie.

        Ordinea in tranzactie (important):
          1. advisory lock pe serie  -> serializam numerotarea
          2. validare apartenenta serie-firma
          3. build factura (linii, totaluri, snapshot seller)
          4. alocare numar (contor +1)
          5. commit
        Daca orice pas pica, rollback intoarce TOT — inclusiv contorul,
        deci numarul alocat se intoarce in secventa (fara goluri).
        """
        for attempt in range(3):
            try:
                _lock_series(db, series)
                _validate_series(db, company_id, series)

                invoice = _build_invoice(db, company_id=company_id, series=series, **kwargs)
                invoice.number = _next_number(db, series=series, year=invoice.issue_date.year)
                invoice.status = InvoiceStatus.issued

                db.commit()
                db.refresh(invoice)
                return invoice
            except (IntegrityError, OperationalError):
                # plasă de siguranță: coliziuni rare (ex. deadlock transcient
                # de la alte surse). Retry cu lacat proaspat.
                db.rollback()
                if attempt == 2:
                    raise
        raise InvoiceServiceError("Nu am putut emite factura.")


    def issue_invoice(db: Session, invoice_id: int) -> Invoice:
        """Emite un draft existent."""
        for attempt in range(3):
            try:
                invoice = db.get(Invoice, invoice_id)
                if invoice is None:
                    raise InvoiceServiceError("Factura nu exista.")
                if invoice.status != InvoiceStatus.draft:
                    raise InvalidStatusTransitionError(
                        f"Doar draft-urile pot fi emise (status curent: {invoice.status})."
                    )
                if invoice.number is not None:
                    raise InvoiceServiceError("Draft-ul are deja numar alocat.")

                _lock_series(db, invoice.series)
                _validate_series(db, invoice.company_id, invoice.series)

                invoice.number = _next_number(
                    db, series=invoice.series, year=invoice.issue_date.year
                )
                invoice.status = InvoiceStatus.issued

                db.commit()
                db.refresh(invoice)
                return invoice
            except (IntegrityError, OperationalError):
                db.rollback()
                if attempt == 2:
                    raise
        raise InvoiceServiceError("Nu am putut emite factura.")


    def create_storno(db: Session, original_id: int) -> Invoice:
        """Storno = factura noua, sume negative, aceeasi serie ca originalul."""
        original = db.get(Invoice, original_id)
        if original is None:
            raise InvoiceServiceError("Factura originala nu exista.")
        if original.status not in (InvoiceStatus.issued, InvoiceStatus.paid):
            raise InvalidStatusTransitionError("Se poate storna doar o factura emisa/platita.")
        if any(
            inv.status in (InvoiceStatus.issued, InvoiceStatus.paid)
            for inv in original.stornos
        ):
            raise InvoiceServiceError("Factura are deja un storno activ.")

        series = original.series  # citim inainte de lacat
        for attempt in range(3):
            try:
                _lock_series(db, series)
                _validate_series(db, original.company_id, series)

                storno = _build_storno(db, original)
                storno.number = _next_number(db, series=series, year=storno.issue_date.year)
                storno.status = InvoiceStatus.issued

                db.commit()
                db.refresh(storno)
                return storno
            except (IntegrityError, OperationalError):
                db.rollback()
                if attempt == 2:
                    raise
        raise InvoiceServiceError("Nu am putut emite storno-ul.")
    ```

    (`_build_invoice`, `_build_storno`, `compute_totals`, `cancel_invoice`, `delete_draft` rămân cum sunt — nu țin de locking.)

    ## Ce scoți din varianta veche

    1. **`with_for_update()` pe contor** — în `_get_or_create_counter` sau `_next_number`, dacă mai există:

    ```python
    # SCOATE:
    counter = db.execute(
        select(InvoiceCounter)
        .where(...)
        .with_for_update()   # <- asta
    ).scalar_one_or_none()
    ```

    Lacatul advisory subsumează blocarea rândului; `FOR UPDATE` pe contor e redundant și, în combinație cu ordinea diferită de blocare din alte tranzacții, chiar sursă de deadlock.

    2. **Savepoint-ul din crearea contorului** — dacă `_get_or_create_counter` are varianta veche cu `db.begin_nested()` + `IntegrityError` pe cursa de creare:

    ```python
    # SCOATE tot blocul de genul:
    try:
        with db.begin_nested():
            counter = InvoiceCounter(...)
            db.add(counter)
            db.flush()
    except IntegrityError:
        counter = db.execute(select(InvoiceCounter).where(...)).scalar_one()
    ```

    Cu advisory lock, doar un proces poate fi „în mijlocul" creării — cursa nu mai există. Varianta simplă din codul de mai sus e suficientă.

    3. **Retry pe `IntegrityError` cu re-citire de număr** — dacă în `create_and_issue` vechi era logică de tipul „dacă pică unique pe (series, year, number), recitește contorul și reîncearcă în aceeași tranzacție": scoate-o. Bucla de retry de mai sus reface **întreaga tranzacție** de la zero (rollback + lock + build), nu doar numărul — asta e varianta corectă.

    4. **Orice `SELECT pg_advisory_lock` (fără `xact`)** — dacă există undeva varianta pe sesiune, `pg_advisory_lock` trebuie eliberat manual (`pg_advisory_unlock`) și se blochează la conexiuni returnate în pool fără unlock. Doar **`pg_advisory_xact_lock`** e corect aici.

    5. **`_lock_series` apelat după `_build_invoice`** — verifică ordinea: lacatul trebuie **primul** în tranzacție. Dacă în varianta veche era apelat după construirea facturii, mută-l în față (ordinea uniformă de blocare e exact ce previne deadlock-ul).

