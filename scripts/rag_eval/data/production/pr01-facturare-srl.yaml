    - **Notificare pe e-mail la eșec** — cron trimite automat output-ul pe mail dacă există MTA configurat; altfel, cel mai simplu e un healthcheck (ex. healthchecks.io — un ping HTTP la finalul scriptului, iar dacă nu vine ping, primești alertă).
    - **`pg_dump` vs snapshot VPS**: `pg_dump` e corect aici — e consistent logic și restore-uiesc selectiv. Snapshot-urile de la provider-ul de VPS sunt ok ca plasă suplimentară, dar nu ca backup principal.
