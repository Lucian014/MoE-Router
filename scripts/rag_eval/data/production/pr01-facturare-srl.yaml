    ## Recomandări în plus (merită pe un VPS)

    - **Backup-ul local nu e suficient** — dacă VPS-ul moare, ai pierdut și datele și backup-urile. Copiază fișierul și în afara serverului, ex. cu `rclone` spre un storage S3/Backblaze/Google Drive:

