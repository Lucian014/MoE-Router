    ## Observații importante

    - **`InvoiceTypeCode` 380/381** — 380 = factură, 381 = factură rectificativă/storno (sume negative). Generatorul îl deduce automat din semnul `total_gross`, plus `BillingReference` dacă există `storno_of`.
    - **`_vat_breakdown` face suma liniilor**, nu recalculare — exact ce am stabilit la calculul totalurilor. Dacă XML-ul nu s-ar închide la ban cu `TaxSubtotal`, e bug în `compute_totals`, nu aici.
    - **Codul poștal** — l-am pus hardcodat `000000` ca placeholder, dar RO_CIUS îl cere; ideal adaugi `postal_code` pe `Client` și pe snapshot-ul seller și scoți placeholder-ul.
