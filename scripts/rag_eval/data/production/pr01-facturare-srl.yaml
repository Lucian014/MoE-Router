    ## `app/services/invoice_service.py` — funcțiile de calcul rescrise

    ```python
    from collections import defaultdict
    from decimal import Decimal, ROUND_HALF_UP

    TWO_PLACES = Decimal("0.01")


    class InvoiceServiceError(Exception):
        """Eroare de business (client va primi 400/409, nu 500)."""


    def _money(value: Decimal) -> Decimal:
        return value.quantize(TWO_PLACES, rounding=ROUND_HALF_UP)


    def compute_totals(lines_data: list[dict]) -> tuple[list[dict], Decimal, Decimal, Decimal]:
        """Calculeaza liniile si totalurile facturii.

        Regula contabila: TVA-ul se calculeaza pe TOTAL pe fiecare cota,
        nu pe fiecare linie. Apoi TVA-ul grupei se aloca pe linii
        (metoda restului cel mai mare) ca suma line_vat sa fie exact
        egala cu TVA-ul grupei — fara diferente de un ban la subsol.

        Returns: (linii_calculate, total_net, total_vat, total_gross)
        """
        if not lines_data:
            raise InvoiceServiceError("Factura trebuie sa aiba cel putin o linie.")

        # 1) baza impozabila pe fiecare linie, rotunjita la 2 zecimale
        lines: list[dict] = []
        net_by_rate: dict[Decimal, Decimal] = defaultdict(lambda: Decimal("0"))

        for ld in lines_data:
            qty = Decimal(str(ld["quantity"]))
            price = Decimal(str(ld["unit_price"]))
            vat_rate = Decimal(str(ld.get("vat_rate", "21")))

            if qty <= 0:
                raise InvoiceServiceError("Cantitatea trebuie sa fie pozitiva.")
            if price < 0:
                raise InvoiceServiceError("Pretul nu poate fi negativ.")

            net = _money(qty * price)
            net_by_rate[vat_rate] += net
            lines.append({
                "description": ld["description"],
                "unit": ld.get("unit", "buc"),
                "quantity": qty,
                "unit_price": price,
                "vat_rate": vat_rate,
                "line_net": net,
                "line_vat": Decimal("0"),      # se aloca la pasul 3
                "line_gross": Decimal("0"),    # se completeaza la pasul 3
            })

        # 2) TVA pe total pe fiecare cota, rotunjit o singura data
        vat_by_rate: dict[Decimal, Decimal] = {
            rate: _money(net * rate / 100) for rate, net in net_by_rate.items()
        }

        # 3) alocarea TVA-ului grupei pe linii, metoda restului cel mai mare
        #    (garanteaza ca suma line_vat == vat grupei, la ban)
        for rate, group_vat in vat_by_rate.items():
            group_lines = [ln for ln in lines if ln["vat_rate"] == rate]
            group_net = net_by_rate[rate]

            raw = [(ln, group_vat * ln["line_net"] / group_net) for ln in group_lines]
            allocated = [(ln, _money(v)) for ln, v in raw]

            total_allocated = sum(v for _, v in allocated)
            diff = (group_vat - total_allocated).quantize(TWO_PLACES)

            if diff != 0:
                # corectam liniile cu cele mai mari resturi de rotunjire
                remainders = sorted(
                    range(len(raw)),
                    key=lambda i: raw[i][1] - allocated[i][1],
                    reverse=(diff > 0),
                )
                step = TWO_PLACES if diff > 0 else -TWO_PLACES
                count = int(abs(diff) / TWO_PLACES)
                for i in remainders[:count]:
                    ln, v = allocated[i]
                    allocated[i] = (ln, (v + step).quantize(TWO_PLACES))

            for ln, vat in allocated:
                ln["line_vat"] = vat
                ln["line_gross"] = ln["line_net"] + vat

        total_net = _money(sum(ln["line_net"] for ln in lines))
        total_vat = _money(sum(vat_by_rate.values()))
        total_gross = total_net + total_vat

        return lines, total_net, total_vat, total_gross


    def vat_breakdown_by_rate(lines: list[dict]) -> dict[Decimal, dict[str, Decimal]]:
        """Subsolul facturii: baza si TVA pe fiecare cota."""
        breakdown: dict[Decimal, dict[str, Decimal]] = defaultdict(
            lambda: {"net": Decimal("0"), "vat": Decimal("0")}
        )
        for ln in lines:
            b = breakdown[ln["vat_rate"]]
            b["net"] += ln["line_net"]
            b["vat"] += ln["line_vat"]
        return dict(breakdown)
    ```

