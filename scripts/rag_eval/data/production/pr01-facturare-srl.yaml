    - **`status IN ('issued', 'paid')`** — draft-urile nu au TVA colectat, iar anulate (prin storno) sunt compensate de liniile negative ale storno-ului, deci nu le filtrezi pe ele, ci pe draft-uri. Dacă ai și anulate *fără* storno (nu ar trebui, dar verifică), exclude-le explicit.
    - **Intervalul cu `<` pe luna următoare** (nu `BETWEEN ... AND ...-31`) e sigur indiferent de lungimea lunii și folosește index pe `issue_date`. Adaugă un index dacă nu ai: `CREATE INDEX idx_invoices_issue_date ON invoices (issue_date);` — la 200 facturi/lună nu e critic, dar costă zero.
