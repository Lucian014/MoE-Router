    ## `app/services/efactura_service.py`

    ```python
    """Generator XML UBL 2.1 / RO_CIUS (EN 16931) pentru e-Factura ANAF.

    Regula de baza: XML-ul NU recalculeaza nimic. Toate sumele vin din
    snapshot-urile de pe Invoice / InvoiceLine (calculate la emitere),
    astfel XML-ul este mereu identic cu ce e in aplicatie si in registru.
    """
    from decimal import Decimal

    from lxml import etree

    from app.models import Invoice, InvoiceLine

    NS_MAIN = "urn:oasis:names:specification:ubl:schema:xsd:Invoice-2"
    NS_CAC = "urn:oasis:names:specification:ubl:schema:xsd:CommonAggregateComponents-2"
    NS_CBC = "urn:oasis:names:specification:ubl:schema:xsd:CommonBasicComponents-2"

    NSMAP = {None: NS_MAIN, "cac": NS_CAC, "cbc": NS_CBC}

    CUSTOMIZATION_ID = "urn:cen.eu:en16931:2017#compliant#urn:efactura.mfinante.ro:CIUS-RO:1.0.1"
    PROFILE_ID = "urn:cen.eu:en16931:2017"

    # mapare unit (aplicatie) -> cod UN/ECE Rec 20 (e-Factura)
    UNIT_CODES = {
        "buc": "H87",
        "kg": "KGM",
        "l": "LTR",
        "litru": "LTR",
        "ora": "HUR",
        "h": "HUR",
        "m": "MTR",
        "mp": "MTK",
        "ml": "MMT",
        "set": "SET",
    }

    TWO = Decimal("0.01")


    class EfacturaError(Exception):
        pass


    def _fmt_amount(value: Decimal) -> str:
        return f"{value.quantize(TWO):.2f}"


    def _fmt_qty(value: Decimal) -> str:
        return f"{value.normalize():f}"


    def _unit_code(unit: str) -> str:
        code = UNIT_CODES.get(unit.strip().lower())
        if code is None:
            raise EfacturaError(
                f"Unitate de masura necunoscuta: '{unit}'. Adauga maparea in UNIT_CODES."
            )
        return code


    def _sub(parent, tag: str, text: str | None = None, ns: str = "cbc"):
        """Creeaza un element copil (optional cu text) si il returneaza."""
        el = etree.SubElement(parent, f"{{{NSMAP[ns]}}}{tag}")
        if text is not None:
            el.text = text
        return el


    def _tax_category(parent, percent: Decimal, container: str = "TaxCategory"):
        cat = _sub(parent, container, ns="cac")
        _sub(cat, "ID", "S")  # 19/9/5 sunt toate standard rate, difera Percent
        _sub(cat, "Percent", f"{percent:.2f}")
        scheme = _sub(cat, "TaxScheme", ns="cac")
        _sub(scheme, "ID", "VAT")


    def _party(parent, *, name: str, cui: str, address: str | None,
               city: str | None, country: str, email: str | None = None):
        party = _sub(parent, "Party", ns="cac")

        if email:
            ep = _sub(party, "EndpointID", email)
            ep.set("schemeID", "EM")

        postal = _sub(party, "PostalAddress", ns="cac")
        if address:
            _sub(postal, "StreetName", address)
        if city:
            _sub(postal, "CityName", city)
        _sub(postal, "PostalZone", "000000")  # RO_CIUS: obligatoriu; pune cod postal real in DB daca il ai
        country_el = _sub(postal, "Country", ns="cac")
        _sub(country_el, "IdentificationCode", country[:2].upper())

        # PartyTaxScheme cu CUI-ul complet (cu prefix RO daca e plativ de TVA)
        tax = _sub(party, "PartyTaxScheme", ns="cac")
        _sub(tax, "CompanyID", cui)
        scheme = _sub(tax, "TaxScheme", ns="cac")
        _sub(scheme, "ID", "VAT")

        legal = _sub(party, "PartyLegalEntity", ns="cac")
        _sub(legal, "RegistrationName", name)
        # CompanyID fara prefix (CUI numeric), conform RO_CIUS
        _sub(legal, "CompanyID", cui.removeprefix("RO").removeprefix("R"))


    def _vat_breakdown(invoice: Invoice) -> dict[Decimal, dict[str, Decimal]]:
        """Baza si TVA pe fiecare cota, ca SUMA a liniilor (nu recalculat)."""
        breakdown: dict[Decimal, dict[str, Decimal]] = {}
        for ln in invoice.lines:
            b = breakdown.setdefault(ln.vat_rate, {"net": Decimal("0"), "vat": Decimal("0")})
            b["net"] += ln.line_net
            b["vat"] += ln.line_vat
        return breakdown


    def build_invoice_xml(invoice: Invoice) -> bytes:
        if invoice.number is None:
            raise EfacturaError("Factura nu este emisa (fara numar) — nu se poate genera XML.")
        if not invoice.lines:
            raise EfacturaError("Factura nu are linii.")

        client = invoice.client
        if client is None:
            raise EfacturaError("Factura nu are client asociat.")

        root = etree.Element(f"{{{NS_MAIN}}}Invoice", nsmap=NSMAP)

        _sub(root, "CustomizationID", CUSTOMIZATION_ID)
        _sub(root, "ProfileID", PROFILE_ID)
        _sub(root, "ID", f"{invoice.series}-{invoice.number:04d}")
        _sub(root, "IssueDate", invoice.issue_date.isoformat())
        _sub(root, "DueDate", invoice.due_date.isoformat())
        _sub(root, "InvoiceTypeCode", "381" if invoice.total_gross < 0 else "380")
        _sub(root, "DocumentCurrencyCode", invoice.currency)

        # referinta la factura originala (pentru storno)
        if invoice.storno_of_id is not None and invoice.storno_of is not None:
            orig = invoice.storno_of
            billing_ref = _sub(root, "BillingReference", ns="cac")
            doc_ref = _sub(billing_ref, "InvoiceDocumentReference", ns="cac")
            _sub(doc_ref, "ID", f"{orig.series}-{orig.number:04d}")
            _sub(doc_ref, "IssueDate", orig.issue_date.isoformat())

        # --- vanzator (din snapshot-ul facturii) ---
        supplier = _sub(root, "AccountingSupplierParty", ns="cac")
        _party(
            supplier,
            name=invoice.seller_name,
            cui=invoice.seller_cui,
            address=invoice.seller_address,
            city=None,
            country="RO",
        )

        # --- cumparator (din client) ---
        customer = _sub(root, "AccountingCustomerParty", ns="cac")
        _party(
            customer,
            name=client.name,
            cui=client.cui,
            address=client.address,
            city=client.city,
            country=client.country or "Romania",
            email=client.email,
        )

        # --- plata ---
        if invoice.seller_iban:
            means = _sub(root, "PaymentMeans", ns="cac")
            _sub(means, "PaymentMeansCode", "30")  # 30 = transfer bancar
            account = _sub(means, "PayeeFinancialAccount", ns="cac")
            _sub(account, "ID", invoice.seller_iban)

        # --- TaxTotal: subtotaluri pe fiecare cota, ca suma a liniilor ---
        breakdown = _vat_breakdown(invoice)
        tax_total = _sub(root, "TaxTotal", ns="cac")
        _sub(tax_total, "TaxAmount", _fmt_amount(invoice.total_vat)).set(
            "currencyID", invoice.currency
        )
        for rate in sorted(breakdown):
            b = breakdown[rate]
            subtotal = _sub(tax_total, "TaxSubtotal", ns="cac")
            _sub(subtotal, "TaxableAmount", _fmt_amount(b["net"])).set("currencyID", invoice.currency)
            _sub(subtotal, "TaxAmount", _fmt_amount(b["vat"])).set("currencyID", invoice.currency)
            _tax_category(subtotal, rate)

        # --- totaluri document ---
        totals = _sub(root, "LegalMonetaryTotal", ns="cac")
        _sub(totals, "LineExtensionAmount", _fmt_amount(invoice.total_net)).set(
            "currencyID", invoice.currency
        )
        _sub(totals, "TaxExclusiveAmount", _fmt_amount(invoice.total_net)).set(
            "currencyID", invoice.currency
        )
        _sub(totals, "TaxInclusiveAmount", _fmt_amount(invoice.total_gross)).set(
            "currencyID", invoice.currency
        )
        _sub(totals, "PayableAmount", _fmt_amount(invoice.total_gross)).set(
            "currencyID", invoice.currency
        )

        # --- linii ---
        for i, ln in enumerate(invoice.lines, start=1):
            line = _sub(root, "InvoiceLine", ns="cac")
            _sub(line, "ID", str(i))
            qty = _sub(line, "InvoicedQuantity", _fmt_qty(ln.quantity))
            qty.set("unitCode", _unit_code(ln.unit))
            _sub(line, "LineExtensionAmount", _fmt_amount(ln.line_net)).set(
                "currencyID", invoice.currency
            )

            item = _sub(line, "Item", ns="cac")
            _sub(item, "Name", ln.description[:200])
            _tax_category(item, ln.vat_rate, container="ClassifiedTaxCategory")

            price = _sub(line, "Price", ns="cac")
            _sub(price, "PriceAmount", _fmt_amount(ln.unit_price)).set(
                "currencyID", invoice.currency
            )

        return etree.tostring(root, xml_declaration=True, encoding="UTF-8", pretty_print=True)
    ```

    ## Exemplu de folosire (și test rapid)

    ```python
