    def create_storno(db: Session, invoice_id: int, *, seller_data: dict) -> Invoice:
        """Emite factura de storno: aceeasi serie, numar nou din contor,
        liniile originalului cu semn inversat. Originalul trece in 'cancelled'."""
        original = db.get(Invoice, invoice_id)
        if original is None:
            raise InvoiceNotFoundError(f"Factura {invoice_id} nu exista.")
        if original.status not in (InvoiceStatus.issued, InvoiceStatus.paid):
            raise InvalidStatusTransitionError(
                f"Nu se poate storna o factura cu statusul '{original.status.value}'."
            )
        if original.total_gross < 0:
            raise InvalidStatusTransitionError("Nu se poate storna un storno.")

        lines_data = [
            {
                "description": ln.description,
                "unit": ln.unit,
                "quantity": -ln.quantity,
                "unit_price": ln.unit_price,
                "vat_rate": ln.vat_rate,
            }
            for ln in original.lines
        ]

        invoice = _build_invoice(
            db,
            series=original.series,
            client_id=original.client_id,
            due_date=date.today(),
            lines_data=lines_data,
            seller_name=seller_data["seller_name"],
            seller_cui=seller_data["seller_cui"],
            seller_address=seller_data.get("seller_address"),
            seller_iban=seller_data.get("seller_iban"),
            currency=original.currency,
            notes=f"Storno factura {original.series}-{original.number:04d}",
        )
        invoice.storno_of_id = original.id
        invoice.number = _next_number(db, series=original.series, year=date.today().year)
        invoice.status = InvoiceStatus.issued
        original.status = InvoiceStatus.cancelled

        db.commit()
        db.refresh(invoice)
        return invoice
    ```

    Pentru ca storno-ul să treacă prin `compute_totals`, relaxează validarea cantității acolo (cantitatea negativă e permisă doar intern, de la storno):

