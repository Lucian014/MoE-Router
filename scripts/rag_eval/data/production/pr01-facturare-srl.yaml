    ## Câteva decizii de design, pe scurt:

    - **Snapshot-uri pe factură și linii** — prețul produsului și datele clientului se pot schimba; factura trebuie să rămână corectă istoric. De aceea copiez denumirea, prețul, TVA-ul direct pe linii.
    - **Totaluri calculate în service layer**, nu în model — le setezi la creare/editare, ca să nu ai logică de business în modele.
    - **Numerotare facturi**: generează numărul în service (ex. `SELECT max(number) ... WHERE series = ...` + 1, într-o tranzacție, sau o tabelă separată de secvențe pe serie ca să eviți coliziuni la emitere concurentă).
    - **`native_enum=False`** pentru status — mai simplu de migrat cu Alembic.

    Vrei să continuu cu schemele Pydantic și un service de emitere factură (cu calcul totaluri și numerotare pe serie)?
