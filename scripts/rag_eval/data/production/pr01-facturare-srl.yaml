    Elementul `CountrySubentity` trebuie să conțină codul **fără prefixul `RO-`** în BT-39? Nu — ANAF vrea valoarea codificată ISO 3166-2:RO, adică forma `RO-B`, `RO-CJ` etc. în elementul `cbc:CountrySubentity`. Codurile sunt litera județului (B = București, CJ = Cluj, IS = Iași, TM = Timiș...). Practic: dacă în DB stochezi doar `"B"`, `"CJ"`, prefixează la generare.

    ## 3. Modificări în `efactura_service.py`

    În `_party`, adaugă parametri și elementele noi:

    ```python
    def _party(parent, *, name: str, cui: str, address: str | None,
               city: str | None, county: str | None, postal_code: str | None,
               country: str, email: str | None = None):
        party = _sub(parent, "Party", ns="cac")

        if email:
            ep = _sub(party, "EndpointID", email)
            ep.set("schemeID", "EM")

        postal = _sub(party, "PostalAddress", ns="cac")
        if address:
            _sub(postal, "StreetName", address)
        if city:
            _sub(postal, "CityName", city)

        # BR-RO-100: cod postal de exact 6 cifre
        if postal_code:
            pc = postal_code.replace(" ", "")
            if not (pc.isdigit() and len(pc) == 6):
                raise EfacturaError(
                    f"Cod postal invalid: '{postal_code}'. Trebuie sa aiba exact 6 cifre."
                )
            _sub(postal, "PostalZone", pc)

        # BR-RO-111: subdiviziune ISO 3166-2:RO (obligatorie daca tara e RO)
        if country.upper() == "RO" or country.upper().startswith("ROMAN"):
            if not county:
                raise EfacturaError("Judetul (CountrySubentity) e obligatoriu pentru RO.")
            _sub(postal, "CountrySubentity", f"RO-{county.upper().removeprefix('RO-')}")

        country_el = _sub(postal, "Country", ns="cac")
        _sub(country_el, "IdentificationCode", country[:2].upper())

        tax = _sub(party, "PartyTaxScheme", ns="cac")
        _sub(tax, "CompanyID", cui)
        scheme = _sub(tax, "TaxScheme", ns="cac")
        _sub(scheme, "ID", "VAT")

        legal = _sub(party, "PartyLegalEntity", ns="cac")
        _sub(legal, "RegistrationName", name)
        _sub(legal, "CompanyID", cui.removeprefix("RO").removeprefix("R"))
    ```

