    xml_bytes = build_invoice_xml(invoice)

    # verificare rapida in teste:
    # - storno: totalurile negative si InvoiceTypeCode 381
    # - sumele din XML == sumele din DB (nu se recalculeaza)
    with open("fct_0137.xml", "wb") as f:
