    Verifică că fontul e vizibil pentru sistem:

    ```bash
    fc-list | grep -i dejavu
    # trebuie sa vada: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf etc.
    ```

    Regenerează un PDF — diacriticele ar trebui să apară.

    ## Dacă tot nu merge

    1. **Fontul cerut în CSS nu se numește exact așa** — verifică numele exact din `fc-list` și folosește-l identic în template. Varianta robustă: pune o listă de fallback:

    ```css
    body { font-family: "DejaVu Sans", "Liberation Sans", "Noto Sans", sans-serif; }
    ```

    2. **WeasyPrint rulează într-un container/user fără acces la fonturi** — dacă rulezi în Docker, instalează fonturile în imagine:

    ```dockerfile
    RUN apt-get update && apt-get install -y fonts-dejavu-core && fc-cache -f
    ```

    3. **Fonturi custom (branding)** — pune fișierul `.ttf` în proiect și încarcă-l cu `@font-face`, independent de ce e instalat pe sistem:

    ```css
    @font-face {
      font-family: "DejaVu Sans";
      src: url("file:///var/www/facturare/app/static/fonts/DejaVuSans.ttf");
    }
    ```

    (cu `base_url` corect în `HTML(string=html, base_url=...)`, poți folosi și cale relativă `url("fonts/DejaVuSans.ttf")`)

    ## De ce pătrate și nu semne de întrebare

    Pătratele (□) înseamnă că fontul folosit **există** dar **nu are glifele** pentru caracterele alea; semnele `?` ar însemna problemă de encoding. Encoding-ul tău e ok (`<meta charset="utf-8">` + HTML generat corect) — e pur și simplu problema de font. De aceea instalarea DejaVu rezolvă, nu modificări în template.

    Un test rapid ca să izolezi: generează un PDF minimal cu un singur rând `HTML(string='<p>șțăâî test</p>').write_pdf()` — dacă iese corect după instalarea fonturilor, problema era exact asta.
- user: |
    ultima pt azi: checklist inainte sa trecem pe e-factura in productie
  assistant: |
    ## Checklist lansare e-Factura în producție

    ### 1. Înregistrări la ANAF (administrativ — cel mai lent, începe cu asta)

    - [ ] Fiecare firmă înregistrată în **e-Factura B2B** (spațiul privat ANAF) — verifică în profilul ANAF că starea e „activ"
    - [ ] **Credențiale OAuth** (client_id + client_secret) generate pentru fiecare firmă, salvate în settings/vault — nu în git
    - [ ] Utilizator cu drepturi în SPV desemnat per firmă (contabila trebuie să poată descărca mesaje)
    - [ ] Confirmat că **CUI-ul din aplicație = CUI-ul firmelor înregistrate** (după migrarea multi-firmă, verifică `anaf_cif` pe toate cele 3 `Company`)

    ### 2. Validare XML

    - [ ] Toate facturile de test trec **validarea locală** (schema UBL + regulile BR-RO) înainte de upload — nu te baza doar pe ANAF să respingă
    - [ ] **BT-48 condiționat** — clienți neplătitori de TVA au `vat_registered=False` și blocul `PartyTaxScheme` omis (lecția Agroserv)
    - [ ] Județ vânzător ca cod ISO (`RO-IS`), cod poștal 6 cifre, CUI cu prefix `RO` unde e cazul
    - [ ] Storno-urile: sume negative, referință la original, seria originalului
    - [ ] Testat pe toate cotele folosite: 19%, 9%, 5% (și scutite, dacă există)

    ### 3. Testare pe staging cu date reale

    - [ ] Migrat o **copie de producție** pe staging (pg_dump/pg_restore)
    - [ ] Emis + transmis **câte o factură reală de test per firmă** — verificat `stare: ok` și că apare în SPV
    - [ ] Un client neplatitor de TVA în setul de teste
    - [ ] Un storno transmis și validat
    - [ ] Verificat că factura din SPV (descărcată de contabilă) **se potrivește cu PDF-ul** din aplicație

    ### 4. Robustețe

    - [ ] **Retry pe 401** (token expirat) și pe erori de rețea — cu backoff, nu în buclă strânsă
    - [ ] **Token cache per firmă** — nu ceri token nou la fiecare upload (rate limiting ANAF)
    - [ ] Timeout-uri pe toate apelurile HTTP (30s) — un apel blocat nu trebuie să blocheze emiterea
    - [ ] **Emiterea facturii NU depinde de upload** — factura se emite local (numerotare, PDF), upload-ul e pas separat cu tracking în `EfacturaSubmission`. Dacă ANAF e căzut, emiți și transmiți mai târziu
    - [ ] Erorile de upload **logate cu index + răspuns complet**, nu doar „a picat"

    ### 5. Monitorizare (lecția celor 2 săptămâni)

    - [ ] Job zilnic de poll pe `EfacturaSubmission` cu status `sent` → actualizare `ok`/`rejected`
    - [ ] **Alertă la respingere** — mail către voi (nu doar în DB), altfel repeți scenariul Agroserv
    - [ ] Alertă dacă o factură emisă stă >24h fără submission (upload-ul a picat silențios)
    - [ ] Log-urile scheduler-ului verificabile: `journalctl -u facturare-scheduler`

    ### 6. Proces operațional

    - [ ] **Cine transmite și când** — manual din UI sau automat la emitere? Decideți și documentați; recomand automat la emitere + retry zilnic pe eșuate
    - [ ] Contabila știe fluxul: respins → corectat → retransmis, cu păstrarea index-ului original ca dovadă a încercării în termen
    - [ ] Procedură scrisă pentru **facturi respinse după termenul de 5 zile** (documentare + comunicare cu consultantul fiscal)

    ### 7. Siguranță date

    - [ ] Backup funcțional și **testat cu restore recent** (l-ați făcut pe alt server — ok)
    - [ ] Backup înainte de deploy-ul final
    - [ ] Migrările (companies, series, submissions) aplicate curat pe producție — `alembic current` = `heads`

    ### 8. Plan de rollback

    - [ ] Dacă upload-ul în masă pică: aplicația continuă să emită (punctul 4), facturile rămân în coadă `sent`/`pending`, se retransmit când ANAF revine
    - [ ] Tag pe release-ul anterior în git; systemd unit-urile testate pentru restart curat

    ### Ordinea recomandată de lansare

    1. Checklist 1-2 pe staging → 2. Facturi de test reale (punctul 3) → 3. Deploy producție cu monitorizarea din 5 → 4. **Prima săptămână: verificare zilnică manuală** a statusurilor, chiar dacă jobul rulează → 5. După 2 săptămâni curate, relaxezi la verificare săptămânală.

    Cel mai fragil din experiența voastră de până acum: validările BR-RO (Agroserv) și detectarea târzie a respingerilor. Punctele 2 și 5 din checklist sunt cele care previn repetarea. Mult succes mâine! 🚀
