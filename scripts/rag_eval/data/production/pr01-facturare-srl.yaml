    ## Endpoint-uri pentru dashboard

    Adaugă în FastAPI datele gata agregate (query-urile de mai devreme, ca funcții de service):

    ```python
    # app/api/reports.py
    from datetime import date
    from fastapi import APIRouter, Depends, Query
    from sqlalchemy import text
    from sqlalchemy.orm import Session

    from app.db.session import get_db

    router = APIRouter(prefix="/reports", tags=["reports"])


    @router.get("/monthly-by-client")
    def monthly_by_client(year: int = Query(...), month: int = Query(...), db: Session = Depends(get_db)):
        start = date(year, month, 1)
        end = date(year + 1, 1, 1) if month == 12 else date(year, month + 1, 1)
        rows = db.execute(text("""
            SELECT c.name, SUM(i.total_gross) AS total_gross
            FROM invoices i JOIN clients c ON c.id = i.client_id
            WHERE i.status IN ('issued','paid') AND i.issue_date >= :s AND i.issue_date < :e
            GROUP BY c.name ORDER BY total_gross DESC LIMIT 10
        """), {"s": start, "e": end}).mappings().all()
        return [{"name": r["name"], "total": float(r["total_gross"])} for r in rows]


    @router.get("/vat-by-rate")
    def vat_by_rate(year: int = Query(...), month: int = Query(...), db: Session = Depends(get_db)):
        start = date(year, month, 1)
        end = date(year + 1, 1, 1) if month == 12 else date(year, month + 1, 1)
        rows = db.execute(text("""
            SELECT ln.vat_rate, SUM(ln.line_net) AS base, SUM(ln.line_vat) AS vat
            FROM invoice_lines ln JOIN invoices i ON i.id = ln.invoice_id
            WHERE i.status IN ('issued','paid') AND i.issue_date >= :s AND i.issue < :e
            GROUP BY ln.vat_rate ORDER BY ln.vat_rate DESC
        """), {"s": start, "e": end}).mappings().all()
        return [{"rate": str(r["vat_rate"]), "base": float(r["base"]), "vat": float(r["vat"])} for r in rows]
    ```

