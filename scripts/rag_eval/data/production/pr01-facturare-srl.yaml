    ```bash
    alembic stamp <id_revizie_din_cod_care_corespunde_realitatii>
    alembic upgrade head
    ```

    ⚠️ `stamp` nu rulează SQL — doar rescrie `alembic_version`. Folosește-l doar dacă ești sigur că schema reală se potrivește cu revizia respectivă.

    ## Scenariu B: `heads` arată două capete (branched migrations)

    Dacă tu și colegul ați creat fiecare migrări paralele, ai două heads și `upgrade head` nu știe pe care. Fix:

    ```bash
    alembic heads                      # vezi ambele capete
    alembic merge heads -m "merge"     # creeaza migrarea de unire
    alembic upgrade head
    ```

