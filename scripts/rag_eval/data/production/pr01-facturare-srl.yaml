    ## `app/core/scheduler.py`

    ```python
    from apscheduler.schedulers.background import BackgroundScheduler
    from apscheduler.triggers.cron import CronTrigger

    from app.db.session import SessionLocal
    from app.services.reminder_service import send_due_reminders

    scheduler = BackgroundScheduler(timezone="Europe/Bucharest")


    def _reminders_job() -> None:
        """Ruleaza in thread separat de APScheduler; sesiune proprie."""
        db = SessionLocal()
        try:
            sent = send_due_reminders(db)
            for doc, days, _ in sent:
                print(f"[reminders] trimis: {doc} ({days} zile intarziere)")
        except Exception:
            db.rollback()
            raise  # APScheduler logheaza exceptia si pastreaza istoricul jobului
        finally:
            db.close()


    def start_scheduler() -> None:
        scheduler.add_job(
            _reminders_job,
            CronTrigger(hour=9, minute=0),   # zilnic la 09:00
            id="send_due_reminders",
            replace_existing=True,
            misfire_grace_time=3600,         # daca serverul era jos la 09:00, ruleaza pana la 10:00
            coalesce=True,                   # daca a pierdut mai multe rulari, executa doar una
        )
        scheduler.start()


    def stop_scheduler() -> None:
        if scheduler.running:
            scheduler.shutdown(wait=False)
    ```

    ## `app/main.py` — pornire/oprire cu lifespan

    ```python
    from contextlib import asynccontextmanager

    from fastapi import FastAPI

    from app.api.invoices import router as invoices_router
    from app.api.reports import router as reports_router
    from app.core.scheduler import start_scheduler, stop_scheduler


    @asynccontextmanager
    async def lifespan(app: FastAPI):
        start_scheduler()
        yield
        stop_scheduler()


    app = FastAPI(title="Facturare", lifespan=lifespan)
    app.include_router(invoices_router)
    app.include_router(reports_router)
    ```

    ## Test rapid

    Pentru a verifica fără să aștepți ora 9:00, adaugă temporar un trigger de test sau un endpoint de rulare manuală:

    ```python
