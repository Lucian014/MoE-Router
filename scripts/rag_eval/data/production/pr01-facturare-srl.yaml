    ## Observații

    - **Idempotența e partea importantă** — verificarea în DB + unique constraint garantează că la un restart sau la rulare dublă nu spam-uiți clientul. Nu te baza pe „cron-ul rulează o dată pe zi".
    - **Ziua 7/14/30 cade duminică?** Jobul rulează oricum și trimite — de obicei e ok. Dacă vrei doar în zile lucrătoare, pune în cron `0 9 * * 1-5` și relaxează condiția la `days in (7, 14, 30)` → acceptă și prima zi lucrătoare după (mică ajustare în service).
    - **Plata între timp?** Statusul `paid` exclude factura, deci dacă contabila marchează plata, reminderele se opresc automat. Dacă plătește dar nu se marchează, clientul primește un reminder în plus — de aceea textul include „dacă plata a fost efectuată între timp".
    - **Când are sens Celery**: dacă mai adăugați task-uri (generare PDF-uri în fundal, sincronizare e-Factura cu retry-uri, exporturi mari), atunci merită migrația la Celery + beat. Pentru un singur job zilnic, cron-ul e mai puțin de întreținut.
    - Testează manual înainte de cron: `python scripts/send_reminders.py` cu SMTP de test sau cu un `send_email` mock-uit prin variabilă de mediu.
