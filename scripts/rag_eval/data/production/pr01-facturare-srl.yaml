    ## `app/api/reports.py` — endpoint + date pentru grafice

    ```python
    from datetime import date

    from fastapi import APIRouter, Depends, Query, Request
    from sqlalchemy import text
    from sqlalchemy.orm import Session

    from app.db.session import get_db
    from app.main import templates  # sau injecteaza templates altfel, vezi observatii

    router = APIRouter(tags=["reports"])


    def _month_range(year: int, month: int) -> tuple[date, date]:
        start = date(year, month, 1)
        end = date(year + 1, 1, 1) if month == 12 else date(year, month + 1, 1)
        return start, end


    def _by_client(db: Session, start: date, end: date) -> list[dict]:
        rows = db.execute(text("""
            SELECT c.name, SUM(i.total_gross) AS total
            FROM invoices i JOIN clients c ON c.id = i.client_id
            WHERE i.status IN ('issued','paid') AND i.issue_date >= :s AND i.issue_date < :e
            GROUP BY c.name ORDER BY total DESC LIMIT 10
        """), {"s": start, "e": end}).mappings().all()
        return [{"name": r["name"], "total": float(r["total"])} for r in rows]


    def _vat_by_rate(db: Session, start: date, end: date) -> list[dict]:
        rows = db.execute(text("""
            SELECT ln.vat_rate, SUM(ln.line_vat) AS vat
            FROM invoice_lines ln JOIN invoices i ON i.id = ln.invoice_id
            WHERE i.status IN ('issued','paid') AND i.issue_date >= :s AND i.issue_date < :e
            GROUP BY ln.vat_rate ORDER BY ln.vat_rate DESC
        """), {"s": start, "e": end}).mappings().all()
        return [{"rate": str(r["vat_rate"]), "vat": float(r["vat"])} for r in rows]


    def _monthly_trend(db: Session) -> list[dict]:
        rows = db.execute(text("""
            SELECT date_trunc('month', issue_date) AS m, SUM(i.total_gross) AS total
            FROM invoices i
            WHERE i.status IN ('issued','paid')
              AND i.issue_date >= date_trunc('month', CURRENT_DATE) - INTERVAL '11 months'
            GROUP BY m ORDER BY m
        """)).mappings().all()
        return [{"month": r["m"].strftime("%b %Y"), "total": float(r["total"])} for r in rows]


    @router.get("/dashboard")
    def dashboard(request: Request, year: int | None = None, month: int | None = None,
                  db: Session = Depends(get_db)):
        today = date.today()
        year = year or today.year
        month = month or today.month
        start, end = _month_range(year, month)

        return templates.TemplateResponse(request, "dashboard.html", {
            "year": year,
            "month": month,
            "by_client": _by_client(db, start, end),
            "vat_by_rate": _vat_by_rate(db, start, end),
            "trend": _monthly_trend(db),
        })
    ```

