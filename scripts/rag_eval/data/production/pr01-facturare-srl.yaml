    ## `app/models/invoice.py`

    ```python
    import enum
    from datetime import date, datetime
    from decimal import Decimal

    from sqlalchemy import String, Date, DateTime, Enum, Numeric, ForeignKey, func, UniqueConstraint
    from sqlalchemy.orm import Mapped, mapped_column, relationship

    from app.db.base import Base


    class InvoiceStatus(str, enum.Enum):
        draft = "draft"
        issued = "issued"
        paid = "paid"
        cancelled = "cancelled"


    class Invoice(Base):
        __tablename__ = "invoices"
        __table_args__ = (
            UniqueConstraint("series", "number", name="uq_invoices_series_number"),
        )

        id: Mapped[int] = mapped_column(primary_key=True)
        series: Mapped[str] = mapped_column(String(20), nullable=False, default="FCT")
        number: Mapped[int] = mapped_column(nullable=False)
        status: Mapped[InvoiceStatus] = mapped_column(
            Enum(InvoiceStatus, native_enum=False), default=InvoiceStatus.draft
        )
        issue_date: Mapped[date] = mapped_column(Date, default=date.today)
        due_date: Mapped[date] = mapped_column(Date, nullable=False)

        client_id: Mapped[int] = mapped_column(ForeignKey("clients.id"), nullable=False)
        client: Mapped["Client"] = relationship(lazy="joined")  # type: ignore[name-defined]

        # snapshot date firma emitenta (ca sa nu se strice daca schimbi datele firmei)
        seller_name: Mapped[str] = mapped_column(String(255), nullable=False)
        seller_cui: Mapped[str] = mapped_column(String(20), nullable=False)
        seller_address: Mapped[str | None] = mapped_column(String(500))
        seller_iban: Mapped[str | None] = mapped_column(String(34))

        currency: Mapped[str] = mapped_column(String(3), default="RON")
        total_net: Mapped[Decimal] = mapped_column(Numeric(14, 2), default=0)
        total_vat: Mapped[Decimal] = mapped_column(Numeric(14, 2), default=0)
        total_gross: Mapped[Decimal] = mapped_column(Numeric(14, 2), default=0)

        notes: Mapped[str | None] = mapped_column(String(2000))
        created_at: Mapped[datetime] = mapped_column(DateTime(timezone=True), server_default=func.now())

        lines: Mapped[list["InvoiceLine"]] = relationship(  # type: ignore[name-defined]
            back_populates="invoice",
            cascade="all, delete-orphan",
            lazy="selectin",
        )
    ```

