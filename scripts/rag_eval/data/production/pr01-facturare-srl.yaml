    ## Detalii de care să ții cont

    - **Cotele se păstrează identic** cu originalul (liniile negative pe aceleași cote 19/9/5) — altfel jurnalul de TVA nu se închide. `compute_totals` funcționează și cu cantități negative, dar verifică validarea `qty <= 0` din `_compute_line` — pentru storno trebuie relaxată (acceptă negativ doar dacă e apel de storno).
    - **e-Factura**: storno-ul se transmite ca document separat, cu referință la factura originală (câmpul de referință al documentului rectificativ). Contabila se ocupă de partea asta la transmitere.
    - **Factura refăcută** e o a treia factură normală, cu număr următor din serie — nu „înlocuiește" nimic.
    - **Alternativa legală** e factura rectificativă (corecție pe aceeași factură, fără storno), dar e mai complicat de implementat corect; storno + refacere e mai simplu și perfect acceptat pentru greșeli de genul ăsta.

    Un detaliu: la storno, `issue_date`-ul e data storno-ului (azi), nu data originalului — de aceea contorul se ia pe anul curent. Dacă originalul e din decembrie și storno-ul e în ianuarie, numărul vine din seria anului nou, ceea ce e corect.
