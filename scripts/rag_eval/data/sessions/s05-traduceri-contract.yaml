    Recomandarea standard pentru contracte în engleză: **„RON 2,400”** — codul ISO înaintea sumei, fără spațiu, cu separator de mii prin virgulă.

    **Codul valutei:**

    - **RON 2,400** – varianta recomandată, folosită în contracte internaționale și documente financiare. Codul ISO 4217 elimină orice ambiguitate.
    - **2,400 lei** – acceptabil, dar mai puțin riguros; „lei” e denumirea populară, nu codul. E ok în corespondență, nu în anexe de prețuri.
    - **2,400 RON** – evitat; ordinea standard e cod înaintea sumei.
    - **2,400.00 lei** – dacă vrei să afișezi și bani (cenți), scrie **RON 2,400.00**.

    **Separatorii — aici e partea delicată:**

    În convenția engleză (UK/US):

    - separator de mii: **virgulă** – RON 2,400 / RON 9,800
    - separator zecimal: **punct** – 99.5%, 0.1%

    Deci în contractul vostru englezesc, toate cifrele ar trebui trecute la format englezesc: *99.5%* nu „99,5%”, *0.1%* nu „0,1%”. Am folosit format românesc în primele traduceri — dacă documentul final e integral în engleză, standardizează tot pe punct zecimal.

    **Două precauții de contract:**

    1. **Ambiguitatea virgulei.** „2,400” în convenția engleză = două mii patru sute, dar în convenția continentală = 2,4 (două virgulă patru). Pentru sume mari, practica prudentă din contracte internaționale e să scrii și în litere la prima mențiune: *RON 2,400 (two thousand four hundred Romanian lei)*. În anexe cu tabele, asta nu e necesară, dar în clauzele de penalități sau preț da.

    2. **O clauză de interpretare.** Dacă vrei să elimini complet riscul, adaugă în secțiunea de interpretare: *Amounts expressed in figures refer to the currency and number conventions stated in this Agreement.* Sau, mai simplu, asigură-te că tot documentul folosește o singură convenție.

    Pe scurt: **RON 2,400** pentru sume, **punct** pentru zecimale, **virgulă** pentru mii — consecvent în tot documentul, inclusiv la procente.
