- user: |
    Cum ai tradus „dol” și „culpă gravă”? Există echivalente exacte în common law sau e doar o aproximare?
  assistant: |
    E o aproximare, nu echivalență exactă — și merită să știi exact unde se rupe corespondența.

    **„Dol” (românesc: intenția de a păcăli, art. 1351 C. civ. și art. 1440 pentru nulități)** nu are echivalent fix în common law. Cele mai apropiate noțiuni sunt:

    - ***fraud*** / ***fraudulent misrepresentation*** – înșelăciunea intenționată; e mai îngust decât „dol” în sens civilist, dar e termenul consacrat în clauzele de excludere a răspunderii.
    - ***wilful misconduct*** – conduită intenționată abuzivă; apare în contracte, dar e o noțiune fuzzy, definită rar.
    - ***intent*** – simpla intenție, fără elementul de viclenie pe care „dol” îl implică în tradiția romană.

    În clauze de limitare a răspunderii, standardul de common law e aproape întotdeauna *fraud* (sau *fraud or fraudulent misrepresentation*), tocmai pentru că instanțele engleze nu tolerează excluderea răspunderii pentru fraudă — o clauză care limitează răspunderea pentru fraudă e nulă (*Salford Estates v. Miller* linia de jurisprudență, consolidată în practica modernă).

    **„Culpă gravă”** se traduce de obicei prin ***gross negligence***, dar aici e o capcană mai subtilă: în dreptul englez, *gross negligence* nu are o definiție fermă. Instanțele au spus uneori că nu e o categorie distinctă de *negligence*, ci doar neglijență „atât de gravă încât demonstrează indiferență față de contract”. În schimb, în dreptul american (și în dreptul civil, inclusiv românesc), gradul e clar: neglijență simplă / gravă / dol.

    Consecințe practice pentru contractul vostru:

    1. Dacă e guvernat de **legea engleză**, înlocuiește *intent or gross negligence* cu ***fraud or fraudulent misrepresentation*** și, eventual, adaugă *wilful misconduct* — altfel clauza de excludere riscă să fie neaplicabilă exact acolo unde voia să opereze.
    2. Dacă e **legea română**, formularea actuală e corectă, dar poți fi explicit: *damage caused by intent (dol) or gross negligence*.
    3. Dacă e **legea americană**, *gross negligence* funcționează bine, pentru că acolo are conținut juridic ferm.

    A treia opțiune, folosită des în contracte internaționale, e să definești termenii în contractul însuși, ca să nu depinzi de legea aplicabilă.
