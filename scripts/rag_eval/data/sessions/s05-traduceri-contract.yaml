    1. **Negația a dispărut.** Originalul spune „nu poate cesiona... fără acordul prealabil scris” — o **interdicție** cu excepție. Traducerea spune „may assign... with the prior written notice” — un **drept** de cesiune. Sunt opuse: una protejează Beneficiarul, cealaltă îi înlătură controlul asupra identității contractantului.

    2. **„Acordul” a devenit „notice”.** *Written notice* = notificare scrisă (o simplă informare); *written consent* = acord scris (o aprobare). Chiar dacă s-ar fi păstrat structura negației, „with prior written notice” ar fi însemnat că Prestatorul cesionează liber, doar anunțând — exact ce clauza interzice.

    3. **„Beneficiarul” a devenit „Client”.** În glosarul nostru, *Beneficiary* e termenul stabilit. *Client* nu e greșit în sine, dar introducerea unui al doilea termen pentru aceeași parte creează ambiguitate — exact problema discutată la Provider/Supplier.

    Varianta corectă:

    ```text
    The Supplier may not assign its rights and obligations under this Agreement without the Beneficiary's prior written consent.
    ```

    Sau, mai aproape de formula consacrată în contractele englezești:

    ```text
    The Supplier shall not assign any of its rights or obligations under this Agreement without the prior written consent of the Beneficiary.
    ```

    A doua variantă e preferabilă: *shall not* e formula standard de interdicție în contractele englezești, iar „any of its rights or obligations” acoperă și cesiunile parțiale, pe care formularea „its rights and obligations” (drepturile și obligațiile — citite ca un tot) le-ar putea lăsa în afara clauzei.

