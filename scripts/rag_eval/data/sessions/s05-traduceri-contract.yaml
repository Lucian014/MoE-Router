    Câteva observații de redactare:

    - *regardless of the legal basis thereof* – echivalentul consacrat pentru „indiferent de temeiul acesteia”; în contractele englezești apare adesea ca *howsoever arising*, dar e arhaic, am preferat varianta modernă.
