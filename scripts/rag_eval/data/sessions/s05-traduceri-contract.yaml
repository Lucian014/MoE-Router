    Fără această formulă, în dreptul englez, un termen poate fi interpretat ca *condition* (esențial) sau *innominate term* (a cărui încălcare dă drept la reziliere doar dacă e gravă) — iar instanțele tind spre a doua interpretare. Formula elimină incertitudinea.

    **Echivalentul românesc:** nu există o formulă identică consacrată. Efectul se obține prin redactare explicită, de exemplu: *„Termenul de livrare constituie o obligație esențială a Prestatorului; neîndeplinirea lui la termen constituie încălcare gravă a contractului, care dă Beneficiarului dreptul de a rezilia contractul, fără prejudicarea dreptului la daune-interese și penalități.”*

