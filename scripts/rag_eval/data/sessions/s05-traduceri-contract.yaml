    - Formula e blunt: teoretic, o întârziere de o zi ar putea justifica rezilierea. Practica mai fină e un **prag**: *„În cazul în care livrarea nu are loc în termen de 15 zile de la termenul stabilit, Beneficiarul poate rezilia contractul, păstrând dreptul la penalități pentru toată perioada întârzierii.”*

