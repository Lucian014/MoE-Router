    |---|---|
    | Științe exacte (fizică, chimie) | 0.70+ |
    | Biologie / agricultură | 0.40–0.60 |
    | **Psihologie / educație / științe sociale** | **0.10–0.30** |
    | Predicția comportamentului uman individual | 0.05–0.15 |

    Comportamentul uman e extrem de multifațetat — nota la examen nu are „o cauză", ci zeci. În acest context:

    - **R² = 0.31 e peste medie** pentru cercetarea educațională
    - Pentru comparație: multe meta-analize din psihologie găsesc că predictorii „clasici" individuali explică mult mai puțin — de exemplu, corelația dintre motivație și performanță academică (ρ ≈ 0.27) dă R² ≈ 0.07

    ## Traducere în termeni de corelație

    $$R = \sqrt{0.31} = 0.56$$

    Modelul tău echivalează cu o corelație multiplă de 0.56 între nota reală și nota „prezisă" de model — o asociere substanțială.

    ## O interpretare practică frumoasă pentru apărare

    Dacă ar fi să prezici notele a doi studenți aleși aleator, modelul tău îți spune care are nota mai mare în **~65–70% din cazuri** (aproximare pentru R ≈ 0.56, prin analogie cu CLES) — față de 50% dacă ghiceai la întâmplare.

    ## ⚠️ Ce să NU faci

    - ❌ „R² = 0.31 e mic, deci rezultatele nu contează" — fals; vezi contextul de mai sus
    - ❌ „R² = 0.31 înseamnă că modelul e corect în 31% din cazuri" — fals; nu e o rată de predicție, e proporția din **variație** explicată
    - ❌ Să extrapolezi R² dincolo de eșantion — cu N = 67 și 2 predictori, R² are un bias pozitiv mic; de asta raportezi și **Adj. R² = 0.29**, care e cifra onestă

    ## Formulare pentru Discuție

    > „Modelul de regresie a explicat 31% din variația notei la examen (R² = .31, R² ajustat = .29), o proporție substanțială pentru cercetarea din domeniul educațional, unde predictorii individuali explică de regulă sub 10% din varianță. Rămâne însă de explorat ceilalți factori — precum motivația, strategiile de învățare și variabilele de context — care ar putea atât să îmbunătățească puterea predictivă a modelului, cât și să clarifice mecanismele prin care aplicația influențează performanța."

    Un detaliu fin pentru comisie: dacă te întreabă „de ce Adj. R² e mai mic?", răspunsul e că R² crește **mereu** când adaugi predictori, chiar și inutili; Adj. R² penalizează pentru fiecare predictor și arată contribuția reală. Faptul că la tine diferența e minusculă (0.31 → 0.29) arată că ambii predictori sunt utili.

    Vrei să-ți arăt cum să calculezi și IC-ul pentru R² sau cum să compare modelul tău cu un model doar cu ore (test F pentru contribuția incrementală a grupului)?
- user: |
    Comisia o să mă întrebe de ce n-am randomizat studenții în grupe. Ce argumente am și ce limite recunosc?
  domain: brainstorming
  assistant: |
    Întrebare aproape sigură la susținere — și vestea bună e că ai un răspuns solid, dacă e onest. Iată structura completă: argumente, limite recunoscute și cum le-ai atenuat parțial.

    ## Argumentele tale (ce poți spune în apărare)

    **1. Randomizarea era impracticabilă în context real.**
    Aplicația de organizare a timpului se poate folosi doar **voluntar și constant** — un student randomizat să o folosească, dar care nu vrea, o abandonează în două săptămâni. Ai avea non-complianță masivă, care distruge randomizarea oricum. Studiul tău reflectă **utilizare reală**, nu obligație impusă.

    **2. Validitate ecologică mai mare.**
    Grupele tale sunt „naturale": cei cu aplicația chiar au ales-o. Rezultatele descriu ce se întâmplă în lumea reală, nu într-un experiment artificial. Comisia apreciază distincția: **randomizarea cumpără cauzalitate, dar pierde realism; tu ai ales realism.**

    **3. Considerente etice.**
    Nu poți (și nu trebuie) să **interzici** unui student să folosească o aplicație gratuită — ar fi o restricție nejustificată. Randomizarea ar fi însemnat să controlezi comportamentul de studiu al studenților, ceea ce ridică probleme etice reale.

    **4. Ai tratat problema metodologic, nu ai ignorat-o.**
    Asta e cel mai puternic argument — ai făcut analize care **parțial compensează** lipsa randomizării:
    - **Regresia cu ajustare pentru ore** — ai controlat mecanismul principal prin care grupele ar putea diferi
    - **Comparația corelațiilor intra-grup** — ai arătat că asociera ore–notă există în ambele grupe
    - **Teste de robusteță** (Mann-Whitney) — concluzia nu depinde de metoda aleasă

    ## Limitele pe care le recunoști (fără să te aperi excesiv)

    **1. Auto-selecția (selection bias) — limita principală.**
    Studenții care aleg o aplicație de organizare a timpului sunt probabil **sistematic diferiți**: mai motivați, mai conștiincioși, mai organizați. Aceste trăsături cauzează atât utilizarea aplicației, cât și mai mult studiu și note mai mari. **Nu poți exclude că diferența observată e explicată de motivație, nu de aplicație.**

    **2. Variabile confundatoare nemăsurate.**
    Motivația, conștiințiozitatea, situația financiară (un job part-time reduce orele disponibile) — toate pot diferenția grupele și pot afecta rezultatul.

    **3. Fără măsurătoare „înainte" pentru grupul de control.**
    Ai arătat că grupul cu aplicația a crescut (t pereche, p < .001), dar nu știi dacă grupul de control **nu** a crescut la fel — de exemplu din cauza apropierii de sesiune. Asta limitează interpretarea creșterii.

    **4. Auto-raportarea orelor de studiu.**
    Studenții care folosesc aplicația își măsoară orele mai precis (aplicația le contorizează!), iar cei din control estimează — posibil eronat. Diferența de 1.8 ore ar putea conține și o diferență de **precizie de măsurare**, nu doar de comportament. Asta e o observație foarte fină care impresionează comisiile.

    ## Cum formulezi la susținere

    > „Studiul are un design **quasi-experimental**: repartizarea în grupe nu a fost randomizată, ci reflectă utilizarea voluntară a aplicației. Aceasta a fost o decizie conștientă, determinată de impracticabilitatea și etica impunerii utilizării, și de dorința de a studia comportament real, nu impus. Consecința principală este riscul de auto-selecție: studenții care aleg o astfel de aplicație pot fi mai motivați, iar diferențele observate pot reflecta parțial aceste diferențe preexistente. Am atenuat parțial riscul prin ajustarea statistică pentru orele de studiu în regresie și prin verificări de robusteță, dar recunosc că nu pot exclude complet explicația alternativă a auto-selecției. De aceea concluziile sunt formulate în termeni de **asociere**, nu de cauzalitate, iar randomizarea pe un eșantion mai mare constituie direcția principală pentru cercetări viitoare."

    ## De ce această formulare câștigă

    Comisia nu sancționează limita — sancționează **necunoașterea** ei. Un student care spune „da, e quasi-experimental, iată riscul, iată ce am făcut, iată ce nu pot afirma" e mai convingător decât unul care pretinde că are un experiment adevărat. Distingerea **design experimental vs. quasi-experimental** și formularea prudentă („asociat cu", nu „cauzează") arată exact maturitatea metodologică pe care o caută.

    Un detaliu bonus: dacă te întreabă „cum ai randomizat atunci?", răspunsul corect e să explici ce **ar** implica randomizarea corectă — randomizarea la nivel individual cu verificarea complianței, sau măcar la nivel de grupă/clasă — ca să arăți că știi cum ar arăta designul ideal, chiar dacă nu l-ai putut implementa.

    Vrei să exersăm împreună 2-3 scenarii de întrebări dificile de la comisie, cu răspunsuri model?
- user: |
    Fă-mi un tabel cu toate testele făcute și rezultatele lor, pentru anexă.
  assistant: |
    Iată tabelul complet pentru anexă, cu toate analizele din lucrare:

    ---

    **Tabel A1**
    *Rezumatul analizelor statistice efectuate*

    | # | Analiză / Test | Statistică | df | p | Mărimea efectului | IC 95% | Concluzie la α = .01 |
    |---|---|---|---|---|---|---|---|
    | 1 | Shapiro-Wilk — grup control | W = 0.91 | 32 | .011 | — | — | Normalitate neatinsă la α = .01 |
    | 2 | Shapiro-Wilk — grup cu aplicația | W = 0.97 | 35 | .43 | — | — | Normalitate acceptată |
    | 3 | Test t Welch (comparație între grupe) | t = 2.20 | 64.8 | .031 | d = 0.53; g = 0.52 | Δ = 1.80 ore [0.16, 3.44] | Nesemnificativ |
    | 4 | U Mann-Whitney (verificare robusteță) | U = 381; z = −2.25 | — | .024 | r = 0.27 | — | Nesemnificativ |
    | 5 | Test t pereche (grup cu aplicația, înainte/după) | t = 4.86 | 34 | < .001 | d_z = 0.82 | Δ = 2.30 ore [1.34, 3.26] | **Semnificativ** |
    | 6 | Corelație ore–notă (eșantion total) | r = .42 | 65 | < .001 | r² = .18 | [.20, .60] | **Semnificativ** |
    | 7 | Comparație corelații între grupe (Fisher) | Z = 1.16 | — | .245 | — | — | Nesemnificativ |
    | 8 | Regresie liniară: notă ~ ore + grup | ore: t = 4.75; grup: t = 2.18 | 64 | < .001; .033 | R² = .31 (adj. .29) | — | ore: semnificativ; grup: nesemnificativ |
    | 9 | Analiză de putere (a priori, d = 0.5, putere .80) | n necesar = 87/grupă | — | — | — | — | Eșantion subdimensionat |

    *Notă.* N = 67 (control n = 32; aplicație n = 35). Toate testele sunt bilaterale. Pragul de semnificație utilizat în lucrare: α = .01. Analizele 3 și 4 testează aceeași ipoteză prin metode parametrică și neparametrică. Analiza 5 se referă la schimbarea în cadrul grupului cu aplicația și nu permite inferență cauzală în absența măsurătorii post-intervenție pentru grupul de control. Analiza 9: dimensiunea eșantionului actual oferă putere de aproximativ 35–40% pentru detectarea unui efect mediu la α = .01.

    ---

    ## Câteva observații de utilizare

    **1. Colțurile „Nesemnificativ" nu sunt puncte slabe.** Tabelul arată onest imaginea completă: două rezultate puternice (creșterea în timp, corelația ore–notă), unul moderat (diferența între grupe, sub pragul strict), iar restul verificări de precondiții și robustețe. Asta e o anatomie metodologică sănătoasă, nu o colecție de eșecuri.

    **2. Coerență între text și tabel.** Dacă pui tabelul în anexă, în textul principal raportezi detaliat doar analizele 3, 5, 6 și 8 (cele substanțiale), iar pentru restul faci trimiteri: „(vezi Tabelul A1)".

    **3. Formatare APA:** titlul tabelului în italic deasupra, nota (*Notă.*) sub tabel, statisticile (W, t, U, r, Z, p, d, R²) în italic în text. Valorile p fără zero inițial.

    **4. O mică decizie de luat:** la analiza 1, Shapiro-Wilk pentru control dă p = .011 — la α = .05 ar fi semnalat abatere de la normalitate, la α = .01 nu. Dacă în text ai explicat ambele situații (cum am discutat), tabelul e consecvent cu pragul de .01. Dacă vrei să eviți confuzia, poți adăuga în notă: „La pragul convențional α = .05, analiza 1 ar fi indicat o abatere de la normalitate în grupul de control; acest aspect a fost tratat prin verificarea robusteței (analiza 4)."

    Vrei și o variantă a tabelului cu valorile descriptive complete (M, SD, mediane pe grupe, înainte/după) ca Tabel A2, sau cu asta ai tot ce trebuie pentru anexă?
- user: |
    Ultima: cum scriu în LaTeX formula statisticii t și a gradelor de libertate pentru testul Welch?
  assistant: |
    Iată codul LaTeX pentru ambele formule, gata de pus în lucrare (necesită `\usepackage{amsmath}` în preambul):

    ## Statistica t (Welch)

    ```latex
    \begin{equation}
        t = \frac{\bar{X}_1 - \bar{X}_2}{\sqrt{\dfrac{s_1^2}{n_1} + \dfrac{s_2^2}{n_2}}}
        \label{eq:welch-t}
    \end{equation}
    ```

    Rezultat:

    $$t = \frac{\bar{X}_1 - \bar{X}_2}{\sqrt{\dfrac{s_1^2}{n_1} + \dfrac{s_2^2}{n_2}}}$$

    ## Gradele de libertate (Welch–Satterthwaite)

    ```latex
    \begin{equation}
        df = \frac{\left( \dfrac{s_1^2}{n_1} + \dfrac{s_2^2}{n_2} \right)^{2}}
        {\dfrac{\left( s_1^2 / n_1 \right)^{2}}{n_1 - 1} + \dfrac{\left( s_2^2 / n_2 \right)^{2}}{n_2 - 1}}
        \label{eq:welch-df}
    \end{equation}
    ```

    Rezultat:

    $$df = \frac{\left( \dfrac{s_1^2}{n_1} + \dfrac{s_2^2}{n_2} \right)^{2}}{\dfrac{\left( s_1^2 / n_1 \right)^{2}}{n_1 - 1} + \dfrac{\left( s_2^2 / n_2 \right)^{2}}{n_2 - 1}}$$

    ## Detalii utile

    - **`\dfrac` în loc de `\frac`** — forțează fracții în mărime completă (display style) chiar și în interiorul altor fracții sau rădăcini; fără el, fracțiile imbricate devin mici și greu de citit.
    - **`\left( ... \right)`** — paranteze care se dimensionează automat la conținut; esențial la fracțiile imbricate din formula df.
    - **`\bar{X}`** pentru medii; dacă folosești notația cu M (stil APA), scrie `M_1 - M_2` — în APA se raportează cu M și SD, dar în formule e acceptată ambele notații, atâta timp cât ești consecvent.
    - **`\label{}` + `\eqref{}`** — referințele în text se fac cu `~\eqref{eq:welch-t}`, care produce „(1)" cu paranteze automate (necesită amsmath).

    ## Varianta compactă pentru text (inline)

    ```latex
    statistica $t = (\bar{X}_1 - \bar{X}_2) / \sqrt{s_1^2/n_1 + s_2^2/n_2}$ cu
    grade de libertate Welch--Satterthwaite
    ```

    ## Bonus: cu valorile tale, ca exemplu numerotat

    ```latex
    \begin{equation}
        t = \frac{13.2 - 11.4}{\sqrt{\dfrac{3.1^2}{32} + \dfrac{3.6^2}{35}}} = 2.20, \quad
        df = 64.8, \quad p = .031
    \end{equation}
    ```

    Un sfat de formatare: în lucrări de licență în stil APA, formulele importante se numerotează la dreapta (opțiunea `\usepackage[leqno]{amsmath}` sau setarea clasei de document), iar simbolurile statistice din text (*t*, *p*, *df*, *n*) se pun în italic — în LaTeX asta e automat pentru literele din modul matematic, dar în textul obișnuit scrie `\textit{t}`(64.8) = 2.20.

    Cu asta ai tot: analize, interpretări, raportare APA, tabel de anexă și formule LaTeX. Mult succes la susținere! 🎓
