id: s10-statistica-licenta
category: math
lang: ro
turns:
- user: |
    Fac lucrarea de licență: am două grupe de studenți, una folosește o aplicație de organizare a timpului, cealaltă nu. Am măsurat orele de studiu pe săptămână. Ce test statistic folosesc ca să compar grupele?
  assistant: |
    Pentru comparația dintre două grupuri independente (cu aplicație vs. fără aplicație), testul standard este **testul t pentru eșantioane independente** (testul t Student).

    ## Pașii recomandați

    **1. Verifică precondițiile:**
    - **Normalitatea distribuției** în fiecare grup → testul Shapiro-Wilk (sau vizual, histogramă/Q-Q plot)
    - **Omogenitatea varianțelor** → testul Levene

    **2. Alege testul în funcție de rezultate:**
    - Dacă datele sunt aproximativ normale → **testul t pentru eșantioane independente** (folosește varianta Welch dacă varianțele nu sunt egale)
    - Dacă datele nu sunt normale sau ai eșantioane foarte mici → **testul U Mann-Whitney** (alternativa neparametrică)

    **3. Raportează și mărimea efectului**, nu doar p-ul:
    - **Cohen's d** pentru testul t (convenție: 0.2 mic, 0.5 mediu, 0.8 mare)

    ## Exemplu în R

    ```r
    # Normalitate
    shapiro.test(ore[grupa == "cu_aplicatie"])
    shapiro.test(ore[grupa == "fara_aplicatie"])

    # Omogenitatea varianțelor
    library(car)
    leveneTest(ore ~ grupa)

    # Testul t (Welch, implicit în R)
    t.test(ore ~ grupa)

    # Mărimea efectului
    library(effectsize)
    cohens_d(ore ~ grupa)
    ```

    ## Exemplu în Python

    ```python
    from scipy import stats

    t_stat, p_value = stats.ttest_ind(grupa_cu_aplicatie, grupa_fara, equal_var=False)
    ```

    Un detaliu util pentru licență: dacă ai măsurat orele de studiu **înainte și după** introducerea aplicației în aceiași studenți, atunci nu mai e testul t independent, ci **testul t pentru eșantioane pereche** (sau Wilcoxon signed-rank ca alternativă neparametrică). Spune-mi cum ai colectat datele și te ajut să alegi varianta corectă.
- user: |
    Grupul de control: n = 32, media 11.4 ore, abaterea standard 3.1. Grupul cu aplicația: n = 35, media 13.2 ore, abaterea standard 3.6. Calculează-mi testul t pas cu pas.
  assistant: |
    Sigur! Hai să calculăm pas cu pas. Voi folosi testul t Student cu varianțe reunite (pooled), iar la final îți arăt și varianta Welch.

    ## Pasul 0: Datele

    | | Grup control | Grup cu aplicație |
    |---|---|---|
    | n | 32 | 35 |
    | Media (M) | 11.4 | 13.2 |
    | SD | 3.1 | 3.6 |

    ## Pasul 1: Varianța reunită (pooled variance)

    $$s_p^2 = \frac{(n_1-1)s_1^2 + (n_2-1)s_2^2}{n_1 + n_2 - 2} = \frac{31 \cdot 3.1^2 + 34 \cdot 3.6^2}{65}$$

    $$s_p^2 = \frac{31 \cdot 9.61 + 34 \cdot 12.96}{65} = \frac{297.91 + 440.64}{65} = \frac{738.55}{65} = 11.36$$

    Deci $s_p = \sqrt{11.36} = 3.37$

    ## Pasul 2: Eroarea standard a diferenței

    $$SE = s_p \sqrt{\frac{1}{n_1} + \frac{1}{n_2}} = 3.37 \cdot \sqrt{\frac{1}{32} + \frac{1}{35}} = 3.37 \cdot \sqrt{0.0598} = 3.37 \cdot 0.2446 = 0.824$$

    ## Pasul 3: Statistica t

    $$t = \frac{M_2 - M_1}{SE} = \frac{13.2 - 11.4}{0.824} = \frac{1.8}{0.824} = 2.18$$

    ## Pasul 4: Gradele de libertate

    $$df = n_1 + n_2 - 2 = 32 + 35 - 2 = 65$$

    ## Pasul 5: Valoarea p

    Pentru t = 2.18 cu df = 65 (test bilateral): **p ≈ 0.033**

    Deoarece p = 0.033 < 0.05, diferența este **statistic semnificativă**.

    ## Pasul 6: Mărimea efectului (Cohen's d)

    $$d = \frac{M_2 - M_1}{s_p} = \frac{1.8}{3.37} = 0.53$$

    Un efect **mediu** — studenții cu aplicația studiază cu ~1.8 ore mai mult pe săptămână.

    ## Verificare cu varianta Welch (mai sigură, recomandată implicit)

    $$SE = \sqrt{\frac{3.1^2}{32} + \frac{3.6^2}{35}} = \sqrt{0.300 + 0.370} = 0.819$$

    $$t = \frac{1.8}{0.819} = 2.20, \quad df \approx 64.8, \quad p \approx 0.031$$

    Concluzia rămâne aceeași. ✅

    ## Cum raportezi în licență

    > „Studenții care au folosit aplicația de organizare a timpului au raportat mai multe ore de studiu pe săptămână (M = 13.2, SD = 3.6) decât grupul de control (M = 11.4, SD = 3.1), t(65) = 2.18, p = .033, d = 0.53."

    Vrei să-ți arăt și codul în R/Python care reproduce aceste calcule, sau cum să faci verificarea normalității înainte de test?
- user: |
    Ce înseamnă p-ul ăsta în cuvinte, pentru concluzie?
  assistant: |
    Foarte bună întrebare — p-ul e cel mai des interpretat greșit concept din statistica aplicată, deci merită clarificat înainte să-l pui în concluzie.

    ## Ce spune p = 0.033 în cuvinte

    > **Dacă aplicația nu ar avea niciun efect** (adică dacă diferența reală dintre grupe ar fi zero), **probabilitatea de a obține o diferență de cel puțin 1.8 ore între medii, doar din întâmplare, ar fi de 3.3%.**

    Cu alte cuvinte: diferența observată e destul de mare încât să fie **puțin probabil să fie doar noroc** — e sub pragul convențional de 5%.

    ## Ce NU înseamnă p-ul (greșeli frecvente în licențe)

    - ❌ „Există o probabilitate de 96.7% că aplicația funcționează" — nu, p-ul nu e probabilitatea ca ipoteza să fie adevărată
    - ❌ „Aplicația cauzează creșterea orelor de studiu" — p-ul nu spune nimic despre cauzalitate; asta depinde de designul studiului (randomizare etc.)
    - ❌ „Diferența e importantă practic" — pentru asta ai Cohen's d (0.53, efect mediu), nu p-ul

    ## Cum ar suna în concluzia licenței

    > „Diferența dintre grupe este statistic semnificativă (p = .033 < .05), ceea ce indică faptul că diferența observată de 1.8 ore pe săptămână este puțin probabil să fie rezultatul întâmplării. Având în vedere mărimea efectului medie (d = 0.53), rezultatele sugerează că utilizarea aplicației de organizare a timpului este asociată cu o creștere moderată a orelor de studiu."

    Observă formularea prudentă — „asociată cu", nu „cauzează" — mai ales dacă nu ai randomizat studenții în grupe. Dacă repartizarea a fost aleatorie, poți fi mai ferm și folosi limbaj cauzal.

    Un ultim detaliu util: p = 0.033 e semnificativ, dar nu „foarte" semnificativ (nu e sub 0.01), deci în discuție merită să menționezi că rezultatul e convingător, dar ar merita replicat pe un eșantion mai mare.
- user: |
    Coordonatorul zice să folosesc testul Welch, nu testul t clasic. De ce? Refă calculul cu Welch.
  assistant: |
    Coordonatorul are dreptate — și e o cerință foarte actuală. Iată de ce, apoi calculul refăcut.

    ## De ce Welch în loc de testul t clasic?

    **1. Varianțele grupelor tale nu sunt egale.** Grupul cu aplicația are SD = 3.6, cel de control SD = 3.1. Testul t clasic (pooled) presupune varianțe egale; când această presupunere e încălcată, testul clasic dă valori p distorsionate.

    **2. Grupele tale au dimensiuni diferite** (32 vs. 35). Combinația „varianțe inegale + n inegale" e exact situația în care testul clasic greșește cel mai mult.

    **3. Cercetările recente recomandă Welch ca implicit.** Studii de simulare (Delacre, Lakens & Leys, 2017 — un articol frecvent citat, poți să-l referențiezi în licență) arată că Welch funcționează aproape la fel de bine ca testul clasic când varianțele **sunt** egale, și mult mai bine când **nu sunt**. De aceea R, de exemplu, folosește Welch ca opțiune implicită în `t.test()`.

    Pe scurt: Welch e alegerea sigură care nu-ți costă nimic.

    ## Calculul Welch, pas cu pas

    **Pasul 1: Eroarea standard** (fără varianță reunită — fiecare grup contribuie cu propria varianță)

    $$SE = \sqrt{\frac{s_1^2}{n_1} + \frac{s_2^2}{n_2}} = \sqrt{\frac{3.1^2}{32} + \frac{3.6^2}{35}} = \sqrt{0.3003 + 0.3703} = \sqrt{0.6706} = 0.819$$

    **Pasul 2: Statistica t**

    $$t = \frac{13.2 - 11.4}{0.819} = \frac{1.8}{0.819} = 2.20$$

    **Pasul 3: Gradele de libertate (formula Welch–Satterthwaite)**

    $$df = \frac{\left(\frac{s_1^2}{n_1} + \frac{s_2^2}{n_2}\right)^2}{\frac{(s_1^2/n_1)^2}{n_1-1} + \frac{(s_2^2/n_2)^2}{n_2-1}} = \frac{0.6706^2}{\frac{0.3003^2}{31} + \frac{0.3703^2}{34}} = \frac{0.4497}{0.00291 + 0.00403} = \frac{0.4497}{0.00694} = 64.8$$

    Observă: df nu mai e număr întreg (64.8, nu 65) — asta e normal la Welch.

    **Pasul 4: Valoarea p**

    Pentru t = 2.20 cu df = 64.8 (test bilateral): **p ≈ 0.031**

    **Pasul 5: Mărimea efectului** — neschimbată, Cohen's d se calculează tot cu SD reunit:

    $$d = \frac{1.8}{3.37} = 0.53$$

    ## Comparație

    | | Test clasic | Welch |
    |---|---|---|
    | t | 2.18 | 2.20 |
    | df | 65 | 64.8 |
    | p | 0.033 | 0.031 |

    Rezultatele sunt aproape identice pentru că varianțele și n-urile tale nu diferă foarte mult — dar Welch e metodologic mai corect.

    ## Raportarea în licență

    > „Studenții care au folosit aplicația au raportat mai multe ore de studiu pe săptămână (M = 13.2, SD = 3.6) decât grupul de control (M = 11.4, SD = 3.1); testul t Welch, t(64.8) = 2.20, p = .031, d = 0.53."

    Vrei și codul în R sau Python care face testul Welch direct, ca să-l poți pune în anexa metodologică?
- user: |
    Cum calculez intervalul de încredere de 95% pentru diferența mediilor?
  assistant: |
    Excelentă idee — intervalul de încredere e o completare valoroasă la testul t și coordonatorii apreciază din ce în ce mai mult raportarea lui. Hai să-l calculăm pas cu pas, continuând cu valorile Welch.

    ## Formula

    $$IC_{95\%} = (M_2 - M_1) \pm t_{crit} \cdot SE$$

    unde SE este aceeași eroare standard Welch de la testul t.

    ## Pasul 1: Diferența mediilor

    $$M_2 - M_1 = 13.2 - 11.4 = 1.8 \text{ ore}$$

    ## Pasul 2: Eroarea standard (deja calculată la Welch)

    $$SE = \sqrt{\frac{3.1^2}{32} + \frac{3.6^2}{35}} = 0.819$$

    ## Pasul 3: Valoarea critică t

    Pentru un interval de 95% cu df = 64.8 (rotunjit, 65):

    $$t_{crit} \approx 2.00$$

    (Găsești valoarea în tabelul t la df = 65, α = 0.05 bilateral, sau în software cu `qt(0.975, df = 64.8)`.)

    ## Pasul 4: Marja de eroare

    $$ME = 2.00 \cdot 0.819 = 1.64$$

    ## Pasul 5: Intervalul

    $$IC_{95\%} = 1.8 \pm 1.64 = [0.16, \ 3.44]$$

    ## Interpretare în cuvinte

    > **„Suntem încrezători în proporție de 95% că diferența reală dintre medii se află între 0.16 și 3.44 ore pe săptămână, în favoarea grupului cu aplicația."**

    Detalii importante pentru concluzie:

    - **Intervalul nu conține 0** → consistent cu rezultatul semnificativ al testului (p = .031). Cele două metode spun același lucru, dar din unghiuri diferite.
    - **Limita inferioară e foarte aproape de 0** (0.16 ore ≈ 10 minute pe săptămână) → asta confirmă observația de mai devreme: efectul e real, dar plauzibil și de dimensiune mică în cel mai pesimist scenariu. Merită menționat în discuție.
    - Intervalul îți dă **o plajă de valori plauzibile**, nu doar un verdict da/nu — exact de asta e mai informativ decât p-ul singur.

    ## Raportarea în licență

    > „Testul t Welch a indicat o diferență semnificativă între grupe, t(64.8) = 2.20, p = .031, d = 0.53, IC 95% [0.16, 3.44]."

    ## Verificare în software

    ```r
    t.test(ore ~ grupa)   # afișează automat IC 95% în output
    ```

    ```python
    from scipy import stats
    res = stats.ttest_ind(cu_aplicatie, control, equal_var=False)
    ci = res.confidence_interval(0.95)   # scipy >= 1.10
    ```

    Un sfat pentru apărare: dacă te întreabă „de ce 95%?", răspunsul e că e convenția dominantă în domeniul tău — dar poți menționa că un interval de 90% ar fi fost mai îngust, iar unul de 99% mai larg, alegerea reflectând nivelul de risc pe care ți-l asumi. Vrei să-ți arăt și cum să reprezinți grafic intervalul (error bars) pentru partea de rezultate?
- user: |
    Și mărimea efectului? Calculează Cohen's d.
  assistant: |
    Cu plăcere — mărimea efectului e probabil cel mai valoros număr din analiza ta, pentru că nu depinde de dimensiunea eșantionului (spre deosebire de p). Hai să-l calculăm riguros.

    ## Pasul 1: SD reunit (pooled SD)

    Cohen's d se calculează cu abaterea standard reunită a celor două grupe (aceeași de la testul t clasic):

    $$s_p = \sqrt{\frac{(n_1-1)s_1^2 + (n_2-1)s_2^2}{n_1+n_2-2}} = \sqrt{\frac{31 \cdot 9.61 + 34 \cdot 12.96}{65}} = \sqrt{11.36} = 3.37$$

    ## Pasul 2: Formula lui Cohen

    $$d = \frac{M_2 - M_1}{s_p} = \frac{13.2 - 11.4}{3.37} = \frac{1.8}{3.37} = 0.53$$

    ## Pasul 3: Interpretare

    Convențiile lui Cohen (1988):

    | d | Mărimea efectului |
    |---|---|
    | 0.2 | mic |
    | 0.5 | mediu |
    | 0.8 | mare |

    **d = 0.53 → efect mediu.** Interpretare practică: diferența de 1.8 ore reprezintă cam jumătate de abatere standard — un student „tipic" din grupul cu aplicația studiază mai mult decât aproximativ **70%** dintre studenții din grupul de control.

    ## Pasul 4 (bonus): Corecția Hedges' g

    Pentru eșantioane mici (< 50), d tinde să supraestimeze ușor efectul. Corecția lui Hedges:

    $$g = d \cdot \left(1 - \frac{3}{4(n_1+n_2)-9}\right) = 0.53 \cdot \left(1 - \frac{3}{251}\right) = 0.53 \cdot 0.988 = 0.52$$

    Practic identic (0.52 vs. 0.53), dar menționarea lui arată rigoare — poți raporta ambele sau doar pe g.

    ## Pasul 5 (bonus): IC 95% pentru d

    $$SE_d \approx \sqrt{\frac{n_1+n_2}{n_1 n_2} + \frac{d^2}{2(n_1+n_2)}} = \sqrt{\frac{67}{1120} + \frac{0.28}{134}} = \sqrt{0.0598 + 0.0021} = 0.249$$

    $$IC_{95\%} = 0.53 \pm 1.96 \cdot 0.249 = [0.04, \ 1.02]$$

    Observă: limita inferioară e aproape de 0 — la fel ca la IC-ul diferenței mediilor. Efectul e mediu în estimarea punctuală, dar datele tale sunt compatibile și cu un efect foarte mic. Asta e o observație excelentă pentru secțiunea de discuție (limitări → eșantion mai mare în cercetări viitoare).

    ## Raportarea în licență

    > „Mărimea efectului a fost medie, Cohen's d = 0.53 (Hedges' g = 0.52), IC 95% [0.04, 1.02], indicând o diferență substanțială între grupe, dar cu incertitudine considerabilă dată de dimensiunea eșantionului."

    ## Verificare în software

    ```r
    library(effectsize)
    cohens_d(ore ~ grupa)          # d cu IC 95% automat
    hedges_g(ore ~ grupa)          # varianta corectată
    ```

    ```python
    from scipy import stats
    res = stats.ttest_ind(cu_aplicatie, control, equal_var=False)
    d = (13.2 - 11.4) / 3.37   # sau calculezi sp din datele brute
    ```

    Cu asta ai setul complet pentru capitolul de rezultate: t Welch, p, IC pentru diferență, d și IC pentru d. Vrei să-ți ajut să structurezi secțiunea „Rezultate" — cum să ordonezi aceste raportări și ce tabel să incluzi?
- user: |
    Cum interpretez un d de mărimea asta? E mult sau puțin?
  assistant: |
    Foarte bună întrebare — și exact cea pe care ți-o vor pune la apărare. Răspunsul sincer: **0.53 e „mediu" după convenții, dar adevărata interpretare depinde de context.** Iată cum să gândești asta pe straturi.

    ## 1. Interpretarea convențională (Cohen, 1988)

    | d | Convenție |
    |---|---|
    | 0.2 | mic |
    | 0.5 | mediu |
    | 0.8 | mare |

    d = 0.53 → **efect mediu**. Dar atenție: Cohen însuși a spus că aceste praguri sunt arbitrare, gândite pentru psihologia aplicată în general, nu ca legi. Nu te opri aici în licență.

    ## 2. Ce înseamnă 0.53 în termeni concreți (mai convingător)

    **a) Suprapunerea distribuțiilor.** Două distribuții cu d = 0.53 se suprapun în proporție de ~**67%**. Deci grupele diferă vizibil, dar un student dintr-o grupă poate arăta la fel ca unul din cealaltă — efectul nu e „evident cu ochiul liber".

    **b) Probabilitatea de superioritate (CLES).** Dacă alegi la întâmplare câte un student din fiecare grupă, există o probabilitate de **~65%** ca cel cu aplicația să studieze mai mult. (La d = 0, probabilitatea ar fi 50% — aruncarea cu banul.)

    **c) Indexul U₃.** Un student „mediu" din grupul cu aplicația studiază mai mult decât **~70%** din grupul de control.

    Aceste trei traduceri sunt excelente pentru apărare, pentru că transformă un număr abstract în ceva pe care oricine îl înțelege.

    ## 3. Contextul practic — cel mai important criteriu

    Întoarce-te la ce măsori: **1.8 ore pe săptămână**. Întreabă-te:

    - E mult în raport cu media grupului de control (11.4 ore)? E o creștere de **~16%** — substanțială.
    - Are semnificație practică? 1.8 ore/săptămână ≈ **2 ore și jumătate de studiu în plus la două săptămâni** — pe un semestru, asta înseamnă zeci de ore în plus. Pentru un student, e o diferență care contează.
    - Care e „costul"? Dacă aplicația e gratuită și ușor de folosit, un efect mediu cu cost aproape zero e un rezultat **foarte bun**. Același d = 0.53 pentru un intervenție scumpă sau invazivă ar fi mai puțin impresionant.

    ## 4. Puncte de referină din literatură

    Pentru a argumenta că 0.53 e respectabil, compară cu domeniu:

    - În **cercetarea educațională**, intervențiile au de obicei efecte mici: meta-analize mari (de ex. Hattie, 2009) arată că efectul mediu al intervențiilor educaționale e în jur de **d = 0.4**. Intervenția ta e peste această medie.
    - În **psihologia socială**, efectul mediu al studiilor publicate e ~d = 0.4; în **medicină**, multe tratamente aprobate au efecte mai mici.

    ## 5. Nu uita incertitudinea

    IC-ul tău pentru d e [0.04, 1.02] — larg. Deci cel mai onest răspuns la „e mult sau puțin?" este:

    > „Estimarea noastră punctuală e un efect mediu (d = 0.53), peste media intervențiilor educaționale, dar datele sunt compatibile și cu un efect foarte mic. Cu eșantion mai mare, intervalul s-ar îngusta și am putea fi mai categorici."

    ## Formulare recomandată pentru discuție

    > „Mărimea efectului (d = 0.53) corespunde unei diferențe medii după convențiile lui Cohen și depășește efectul mediu raportat în meta-analizele din domeniul educațional (~0.4). În termeni practici, aceasta înseamnă o creștere de aproximativ 16% a orelor de studiu săptămânale și o probabilitate de 65% ca un student utilizator al aplicației să studieze mai mult decât un student ales aleator din grupul de control. Totuși, intervalul de încredere larg al estimării recomandă prudență și replicare."

    Vrei să-ți arăt cum să calculezi rapid CLES, U₃ și suprapunerea în R (pachetul `effectsize` le are gata făcute)?
- user: |
    Vreau să verific și normalitatea datelor. Ce test folosesc?
  assistant: |
    Pentru dimensiunile grupelor tale (n = 32 și n = 35), testul recomandat este **Shapiro-Wilk** — e cel mai puternic test de normalitate pentru eșantioane mici și medii (funcționează bine până la n ≈ 2000).

    ## Testul Shapiro-Wilk

    **Ipotezele:**
    - H₀: datele provin dintr-o distribuție normală
    - H₁: datele NU provin dintr-o distribuție normală

    **Regula de decizie:** dacă **p > 0.05**, nu respingi H₀ → poți presupune normalitatea (bine ✅). Dacă **p < 0.05**, datele deviază semnificativ de la normalitate.

    ⚠️ Atenție la direcție — e invers față de testul t: aici **îți dorești un p mare**.

    ## Cod în R

    ```r
    # Per grup
    shapiro.test(ore[grupa == "control"])
    shapiro.test(ore[grupa == "cu_aplicatie"])

    # Vizual — obligatoriu de raportat
    qqnorm(ore[grupa == "control"]); qqline(ore[grupa == "control"])
    qqnorm(ore[grupa == "cu_aplicatie"]); qqline(ore[grupa == "cu_aplicatie"])
    ```

    ## Cod în Python

    ```python
    from scipy import stats

    stats.shapiro(ore_control)      # (W, p)
    stats.shapiro(ore_aplicatie)
    ```

    ## Cum raportezi în licență

    > „Normalitatea distribuției orelor de studiu a fost verificată cu testul Shapiro-Wilk, atât în grupul de control (W = ..., p = ...), cât și în grupul cu aplicația (W = ..., p = ...). Deoarece ambele valori p au depășit pragul de 0.05, ipoteza normalității nu a fost respinsă, justificând utilizarea testului t Welch."

    ## Trei sfaturi importante

    **1. Nu te baza doar pe test — folosește și grafice.** Testele Shapiro-Wilk sunt sensibile la n: la eșantioane mici (ca al tău) pot să nu detecteze deviații reale, iar la eșantioane mari semnalează deviații minore, fără importanță practică. De aceea buna practică e **test + Q-Q plot + asimetrie/curtosis**. La Q-Q plot, punctele ar trebui să stea aproximativ pe linia diagonală.

    **2. Verifică și asimetria (skewness) și curtosisul.** Valori în intervalul ±1 (unii autori acceptă ±2) sunt considerate acceptabile pentru testul t:

    ```r
    library(psych)
    describe(ore ~ grupa)   # coloanele skew și kurtosis
    ```

