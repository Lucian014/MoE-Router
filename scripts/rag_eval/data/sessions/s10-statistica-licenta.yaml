    $$z = \frac{1}{2}\ln\left(\frac{1+r}{1-r}\right) = \text{arctanh}(r)$$

    Care **dăunează asimetriei**: z variază de la −∞ la +∞ și e aproximativ normal, cu eroare standard cunoscută:

    $$SE = \frac{1}{\sqrt{n-3}}$$

    ## Pasul 1: Transformă r în z

    Exemplu cu r = 0.42:

