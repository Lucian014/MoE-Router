    ```python
    # handlers/booking.py (continuare)
    from datetime import datetime, timedelta

    from telegram import InlineKeyboardButton, InlineKeyboardMarkup, Update
    from telegram.ext import ContextTypes

    CANCEL_WINDOW = timedelta(hours=2)


    def _format_slot(slot: datetime) -> str:
        # zilele în română, fără să tragi dependențe de locale
        zile = ["Luni", "Marți", "Miercuri", "Joi", "Vineri", "Sâmbătă", "Duminică"]
        return f"{zile[slot.weekday()]} {slot.strftime('%d.%m.%Y, %H:%M')}"


    async def my_bookings(update: Update, context: ContextTypes.DEFAULT_TYPE) -> None:
        query = update.callback_query
        await query.answer()

        bookings = await get_user_bookings(update.effective_user.id)

        if not bookings:
            await query.edit_message_text("Nu ai rezervări active. ✂️")
            return

        now = datetime.now()
        lines = ["📅 Rezervările tale:\n"]
        keyboard = []

        for b in bookings:
            slot = b["slot"]
            lines.append(f"• {_format_slot(slot)} — {b['service']}")

            if now <= slot - CANCEL_WINDOW:
                keyboard.append([
                    InlineKeyboardButton(
                        f"❌ Anulează {_format_slot(slot).split(' ')[-1]}",
                        callback_data=f"cancel:{b['id']}",
                    )
                ])
            else:
                lines.append("  (mai puțin de 2 ore — nu mai poate fi anulată aici)")

        await query.edit_message_text(
            "\n".join(lines),
            reply_markup=InlineKeyboardMarkup(keyboard) if keyboard else None,
        )


    async def cancel_handler(update: Update, context: ContextTypes.DEFAULT_TYPE) -> None:
        query = update.callback_query
        await query.answer()

        booking_id = int(query.data.split(":")[1])
        user_id = update.effective_user.id

        booking = await get_booking(booking_id)

        # validări în ordinea importanței
        if booking is None or booking["user_id"] != user_id:
            await query.edit_message_text("Rezervarea nu a fost găsită.")
            return
        if booking["status"] != "active":
            await query.edit_message_text("Această rezervare a fost deja anulată.")
            return
        if datetime.now() > booking["slot"] - CANCEL_WINDOW:
            await query.edit_message_text(
                "⏰ Mai puțin de 2 ore până la programare — "
                "nu o mai poți anula din bot. Sună la frizerie dacă e ceva urgent!"
            )
            return

        ok = await cancel_booking(booking_id, user_id)
        if ok:
            await query.edit_message_text(
                f"✅ Rezervarea de {_format_slot(booking['slot'])} a fost anulată.\n"
                "Te așteptăm altădată!"
            )
        else:
            await query.edit_message_text("Ceva n-a mers la anulare. Încearcă din nou.")
    ```

    Înregistrare în `bot.py`:

    ```python
    app.add_handler(CallbackQueryHandler(booking.my_bookings, pattern="^my_bookings$"))
    app.add_handler(CallbackQueryHandler(booking.cancel_handler, pattern="^cancel:\d+$"))
    ```

    ## Detalii de design de care să ții cont

    - **Verificare dublă a ferestrei de 2 ore** — o dată la afișarea listei (ca să nu arăt butoane inutile), o dată în `cancel_handler` (ca să nu anuleze ceva care a scăzut sub prag între timp). Verificarea din handler e cea care contează; cea din listă e doar UX.
    - **Verificarea `user_id` în handler** — oricine poate trimite un `callback_data` falsificat, deci nu te baza doar pe faptul că butonul i-a fost arătat. `cancel_booking` verifică din nou în query-ul `UPDATE ... WHERE id = ? AND user_id = ?`, deci ai apărare pe două niveluri.
    - **Verificarea `status`** — previne dubla anulare dacă clientul apasă butonul de două ori repede.
    - **`cancel_booking` returnează `False`** dacă rezervarea fusese deja anulată între verificare și UPDATE — cursa e acoperită și acolo.
    - **Butonul afișează doar ora** (`Anulează 11:00`) ca să nu devină uriaș; dacă ai mai multe rezervări în aceeași zi la ore diferite, e suficient de clar. Dacă vrei mai explicit, pune ziua și ora scurt: `slot.strftime('%d.%m %H:%M')`.

