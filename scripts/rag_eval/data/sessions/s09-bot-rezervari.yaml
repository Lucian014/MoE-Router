    Programul frizeriei e luni–vineri 10:00–19:00, sâmbătă 10:00–14:00, duminică închis. O programare durează 30 de minute. Cum generez sloturile libere pentru o zi?
  assistant: |
    Iată un mod curat de a le genera, în `services/scheduler.py`:

    ```python
    # services/scheduler.py
    from datetime import datetime, time, timedelta

    SLOT_DURATION = timedelta(minutes=30)

    # Programul: {ziua săptămânii (0=luni): (ora_deschidere, ora_închidere)}
    WORKING_HOURS = {
        0: (time(10, 0), time(19, 0)),   # luni
        1: (time(10, 0), time(19, 0)),   # marți
        2: (time(10, 0), time(19, 0)),   # miercuri
        3: (time(10, 0), time(19, 0)),   # joi
        4: (time(10, 0), time(19, 0)),   # vineri
        5: (time(10, 0), time(14, 0)),   # sâmbătă
        # 6 (duminică) lipsește => închis
    }


    def get_all_slots(day: datetime) -> list[datetime]:
        """Toate sloturile posibile pentru o zi (indiferent de rezervări)."""
        hours = WORKING_HOURS.get(day.weekday())
        if hours is None:
            return []  # duminică / închis

        open_time, close_time = hours
        slot = datetime.combine(day.date(), open_time)
        closing = datetime.combine(day.date(), close_time)

        slots = []
        while slot + SLOT_DURATION <= closing:  # ultimul slot trebuie să încapă complet
            slots.append(slot)
            slot += SLOT_DURATION
        return slots


    def get_free_slots(day: datetime, booked: list[datetime]) -> list[datetime]:
        """Sloturile libere: toate sloturile posibile minus cele rezervate."""
        booked_set = set(booked)
        free = [s for s in get_all_slots(day) if s not in booked_set]

        # dacă e azi, eliminăm sloturile care au trecut deja
        now = datetime.now()
        if day.date() == now.date():
            free = [s for s in free if s > now]

        return free
    ```

    Exemplu de folosire:

    ```python
    from datetime import datetime

    azi = datetime.now()
    rezervari = [datetime(2025, 1, 15, 11, 0), datetime(2025, 1, 15, 11, 30)]

    libere = get_free_slots(azi, rezervari)
    # => 10:00, 10:30, 12:00, 12:30, ... (fără 11:00 și 11:30)
    ```

    Detalii importante de observat:

    - **`day.weekday()`** returnează 0=luni ... 6=duminică, deci programul se mapează direct. Duminica nu e în dicționar → lista goală.
    - **Condiția `slot + SLOT_DURATION <= closing`** asigură că ultimul slot de luni–vineri e **18:30** (se termină la 19:00), nu 19:00.
    - **Sloturile de 30 min** înseamnă că o rezervare la 11:00 blochează doar 11:00–11:30; următorul client poate veni la 11:30. Dacă vrei pauză de curățenie între clienți, adaugă un buffer la `SLOT_DURATION` sau filtrează și sloturile adiacente.
    - **Compararea prin `set`** funcționează doar dacă în DB stochezi datetime-ul exact la fix (fără secunde/offset-uri diferite). Cel mai simplu: salvează totul ca `DATETIME` în format `YYYY-MM-DD HH:MM` și normalizează la citire.

    Când afișezi sloturile în bot, le formatezi ca butoane:

    ```python
    from telegram import InlineKeyboardButton, InlineKeyboardMarkup

    def slots_keyboard(free_slots: list[datetime]) -> InlineKeyboardMarkup:
        rows = [
            [InlineKeyboardButton(s.strftime("%H:%M"), callback_data=f"slot:{s.isoformat()}")]
            for s in free_slots
        ]
        # câte 4 butoane pe rând, mai compact
        return InlineKeyboardMarkup([rows[i:i+4] for i in range(0, len(rows), 4)])
    ```

