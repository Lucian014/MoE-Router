    ## 1. Detectarea din `language_code`

    ```python
    def detect_lang(user) -> str:
        code = user.language_code or ""   # poate fi None!
        return "en" if code.startswith("en") else "ro"
    ```

    Capcane de care să ții cont:

    - **Poate fi `None`** — unii utilizatori au privacy settings stricte sau profiluri fără limbă setată. De asta fallback-ul la română e obligatoriu.
    - **E cod compus** — `en_GB`, `en_US`, `pt_BR`. De asta `startswith("en")`, nu `== "en"`.
    - **E limba interfeței Telegram, nu naționalitatea** — un turist german va avea `de`, deci nu primește engleză automat. Pentru frizeria ta, engleza e limba-pont pentru oricine nu e român, deci o variantă pragmatică: română pentru `ro`, engleză pentru **tot restul**:

      ```python
      def detect_lang(user) -> str:
          return "ro" if (user.language_code or "").startswith("ro") else "en"
      ```

      Asta acoperă turiștii de orice naționalitate. E o decizie de produs, nu tehnică — discută cu prietenul tău ce preferă.

    ## 2. Stocarea alegerii: `user_data` vs DB

    **`context.user_data`** — simplu, dar se pierde la restartarea botului și e per-proces (pagina web viitoare nu-l vede):

    ```python
    async def start(update: Update, context: ContextTypes.DEFAULT_TYPE):
        if "lang" not in context.user_data:
            context.user_data["lang"] = detect_lang(update.effective_user)
        lang = context.user_data["lang"]
        await update.message.reply_text(t("welcome", lang, nume=update.effective_user.first_name))
    ```

    **În DB** — persistent, partajat cu viitoarea pagină web. Având deja Postgres, recomand un mic tabel:

    ```sql
    CREATE TABLE IF NOT EXISTS users (
        user_id BIGINT PRIMARY KEY,
        lang TEXT NOT NULL DEFAULT 'ro'
    );
    ```

    ```python
    async def get_lang(user_id: int) -> str:
        async with _pool.acquire() as conn:
            return await conn.fetchval("SELECT lang FROM users WHERE user_id = $1", user_id) or "ro"

    async def set_lang(user_id: int, lang: str):
        async with _pool.acquire() as conn:
            await conn.execute(
                "INSERT INTO users (user_id, lang) VALUES ($1, $2) "
                "ON CONFLICT (user_id) DO UPDATE SET lang = $2",
                user_id, lang,
            )
    ```

    ## 3. Buton de schimbare manuală

    Detectarea automată nu e suficientă — un român care folosește Telegram în engleză va primi engleza greșit. Adaugă o comandă sau un buton:

    ```python
    async def toggle_lang(update: Update, context: ContextTypes.DEFAULT_TYPE):
        user_id = update.effective_user.id
        current = await get_lang(user_id)
        new_lang = "en" if current == "ro" else "ro"
        await set_lang(user_id, new_lang)
        await update.message.reply_text(t("lang_changed", new_lang))
    ```

