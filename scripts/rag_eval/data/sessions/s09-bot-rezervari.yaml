    ## Schema

    ```sql
    CREATE TABLE IF NOT EXISTS bookings (
        id INTEGER PRIMARY KEY AUTOINCREMENT,
        user_id INTEGER NOT NULL,          -- ID-ul Telegram al clientului
        user_name TEXT NOT NULL,           -- numele afișat
        slot TEXT NOT NULL,                -- 'YYYY-MM-DD HH:MM'
        service TEXT NOT NULL,             -- 'tăiere', 'barbă', 'combo'
        status TEXT NOT NULL DEFAULT 'active',  -- active / cancelled
        created_at TEXT NOT NULL DEFAULT (datetime('now'))
    );
    ```

    ## Implementare simplă cu sqlite3

    ```python
    # db/database.py
    import sqlite3
    from contextlib import contextmanager
    from datetime import datetime

    DB_PATH = "barbosu.db"

    SCHEMA = """
    CREATE TABLE IF NOT EXISTS bookings (
        id INTEGER PRIMARY KEY AUTOINCREMENT,
        user_id INTEGER NOT NULL,
        user_name TEXT NOT NULL,
        slot TEXT NOT NULL,
        service TEXT NOT NULL,
        status TEXT NOT NULL DEFAULT 'active',
        created_at TEXT NOT NULL DEFAULT (datetime('now'))
    );
    """


    @contextmanager
    def get_conn():
        conn = sqlite3.connect(DB_PATH)
        conn.row_factory = sqlite3.Row
        try:
            yield conn
            conn.commit()
        finally:
            conn.close()


    def init_db():
        with get_conn() as conn:
            conn.execute(SCHEMA)


    def add_booking(user_id: int, user_name: str, slot: datetime, service: str) -> int:
        with get_conn() as conn:
            cur = conn.execute(
                "INSERT INTO bookings (user_id, user_name, slot, service) VALUES (?, ?, ?, ?)",
                (user_id, user_name, slot.strftime("%Y-%m-%d %H:%M"), service),
            )
            return cur.lastrowid


    def get_booked_slots(day: datetime) -> list[datetime]:
        """Sloturile active pentru o zi — le dai direct în get_free_slots()."""
        with get_conn() as conn:
            rows = conn.execute(
                "SELECT slot FROM bookings WHERE slot LIKE ? AND status = 'active'",
                (day.strftime("%Y-%m-%d") + "%",),
            ).fetchall()
        return [datetime.strptime(r["slot"], "%Y-%m-%d %H:%M") for r in rows]


    def get_user_bookings(user_id: int) -> list[sqlite3.Row]:
        with get_conn() as conn:
            return conn.execute(
                "SELECT * FROM bookings WHERE user_id = ? AND status = 'active' "
                "ORDER BY slot",
                (user_id,),
            ).fetchall()


    def cancel_booking(booking_id: int, user_id: int) -> bool:
        """Anulare doar dacă rezervarea aparține userului respectiv."""
        with get_conn() as conn:
            cur = conn.execute(
                "UPDATE bookings SET status = 'cancelled' WHERE id = ? AND user_id = ?",
                (booking_id, user_id),
            )
            return cur.rowcount > 0
    ```

    Apel la pornire, în `bot.py`:

    ```python
    from db.database import init_db
    init_db()
    ```

    ## De ce e suficient și la ce să fii atent

    - **Concurență**: python-telegram-bot e async, dar sqlite3 rulează sincron. La volumul unei frizerii (câteva zeci de rezervări/zi) nu e nicio problemă. Dacă vrei să fii riguros, rulezi query-urile cu `asyncio.to_thread(...)`.
    - **Slotul ca text normalizat** (`YYYY-MM-DD HH:MM`) — exact ce discutam anterior: compararea din `get_free_slots` merge garantat, fără secunde sau timezone-uri care să strice potrivirea.
    - **`status` în loc de DELETE** — păstrezi istoricul, util dacă frizerul vrea să vadă câți clienți a avut.
    - **Backup**: un simplu cron pe VPS care copiază `barbosu.db` zilnic e suficient:
      ```bash
      0 3 * * * cp /cale/catre/barbosu.db /cale/backup/barbosu-$(date +\%F).db
      ```
    - **Când să treci pe altceva**: doar dacă apar mai mulți frizeri, notificări masive sau raportare complexă. Atunci PostgreSQL + SQLAlchemy. Până atunci, SQLite e mai puțin cod și zero mentenanță.

