    );
    ```

    Ziua lipsă = frizer închis (de exemplu, nicio linie cu `weekday = 6` pentru Sorin dacă nu lucrează duminica). Dacă vreodată un frizer are pauză de masă sau program diferit pe sezoane, extinzi ulterior cu `valid_from`/`valid_to` — acum nu merită.

