    ```python
    # services/scheduler.py
    from datetime import datetime, time, timedelta

    from db.database import _pool

    SLOT_DURATION = timedelta(minutes=30)


    async def get_working_hours(barber_id: int, day: datetime) -> tuple[time, time] | None:
        """Programul frizerului pentru ziua dată, sau None dacă e închis."""
        async with _pool.acquire() as conn:
            row = await conn.fetchrow(
                "SELECT open_time, close_time FROM working_hours "
                "WHERE barber_id = $1 AND weekday = $2",
                barber_id, day.weekday(),
            )
        if row is None:
            return None
        return row["open_time"], row["close_time"]


    async def get_all_slots(barber_id: int, day: datetime) -> list[datetime]:
        """Toate sloturile posibile ale frizerului într-o zi, indiferent de rezervări."""
        hours = await get_working_hours(barber_id, day)
        if hours is None:
            return []  # frizerul nu lucrează în ziua asta

        open_time, close_time = hours
        slot = datetime.combine(day.date(), open_time)
        closing = datetime.combine(day.date(), close_time)

        slots = []
        while slot + SLOT_DURATION <= closing:
            slots.append(slot)
            slot += SLOT_DURATION
        return slots


    async def get_free_slots(barber_id: int, day: datetime,
                             booked: list[datetime]) -> list[datetime]:
        """Sloturile libere: toate posibilele, minus cele rezervate la frizerul respectiv."""
        booked_set = set(booked)
        free = [s for s in await get_all_slots(barber_id, day) if s not in booked_set]

        now = datetime.now()
        if day.date() == now.date():
            free = [s for s in free if s > now]

        return free
    ```

