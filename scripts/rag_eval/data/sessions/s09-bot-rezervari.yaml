    Vreau să fac un bot de Telegram pentru rezervări la frizeria unui prieten, „Frizeria Bărbosu”. În Python. Ce bibliotecă folosesc și cum structurez proiectul?
  assistant: |
    Recomand **python-telegram-bot** (v21+, async) — e cea mai populară, bine documentată și are ConversationHandler, perfect pentru fluxuri de rezervare. Alternativa e **aiogram**, dacă preferi un stil mai decorator-based.

    ## Structura proiectului

    ```
    barbosu_bot/
    ├── bot.py              # punctul de intrare
    ├── config.py           # token, ore de lucru (din .env)
    ├── requirements.txt
    ├── .env
    ├── handlers/
    │   ├── __init__.py
    │   ├── booking.py      # fluxul de rezervare
    │   └── admin.py        # comenzi pentru frizer (listă rezervări)
    ├── services/
    │   ├── __init__.py
    │   └── scheduler.py    # generare sloturi libere, verificări
    ├── db/
    │   ├── __init__.py
    │   └── database.py     # SQLite via SQLAlchemy sau sqlite3
    └── keyboards.py        # butoane inline (calendar, ore)
    ```

    ## Exemplu minim de start

    ```python
    # bot.py
    import asyncio
    from telegram.ext import Application, CommandHandler

    from config import BOT_TOKEN
    from handlers import booking, admin

    async def main():
        app = Application.builder().token(BOT_TOKEN).build()

        app.add_handler(CommandHandler("start", booking.start))
        app.add_handler(booking.conversation_handler)
        app.add_handler(CommandHandler("rezervari", admin.list_bookings))

        await app.initialize()
        await app.start_polling()
        await app.updater.stop()
        await app.stop()

    if __name__ == "__main__":
        asyncio.run(main())
    ```

    ## Fluxul de rezervare (ConversationHandler)

    1. `/start` → buton „Programează-te”
    2. Alegere **serviciu** (tăiere, barbă, combo) — ReplyKeyboard
    3. Alegere **zi** — butoane cu următoarele 7 zile
    4. Alegere **oră** — afișezi doar sloturile libere (verifici în DB)
    5. Confirmare nume/telefon → salvezi rezervarea

    ## Sfaturi practice

    - **SQLite** e suficient la început; treci pe PostgreSQL dacă crește.
    - Stochează rezervările cu `user_id`, `datetime`, `service`, `status`.
    - Adaugă un job care **amintește** clientul cu 2 ore înainte (`JobQueue` din python-telegram-bot, se instalează cu `pip install "python-telegram-bot[job-queue]"`).
    - Pune tokenul în `.env`, nu în cod, și adaugă `.env` în `.gitignore`.
    - Pentru admin, filtrează pe `chat_id`-ul frizerului ca doar el să vadă comenzile de administrare.

