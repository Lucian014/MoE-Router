    ## De ce nu e vina SQLite

    `database is locked` apare când două conexiuni se bat pe fișier. Cauzele tipice sunt:

    - o conexiune ținută deschisă cu o tranzacție necomitată,
    - backup cu `cp` în timp ce botul scrie,
    - un `sqlite3` deschis manual în terminal,
    - două instanțe de bot pornite simultan.

    Postgres **nu te-ar salva** de ultimele două (procese externe rămân procese externe), iar pentru primele, fixul corect e în codul tău: context manager + WAL + timeout, cum ți-am arătat. Dacă migrezi pe Postgres cu același cod problematic, vei avea aceleași conexiuni rătăcite — doar că acum cu un server în plus de administrat.

    ## Ce ți-ar da Postgres oricum

    - Concurență reală: scrieri multiple simultane, fără locking la nivel de fișier.
    - Acces din mai multe procese fără grijă (bot + script de rapoarte + panel web, eventual).
    - Tipuri de date mai bune (`TIMESTAMP` nativ, `UNIQUE` fără trucuri cu index parțial... de fapt și acolo ai nevoie de index parțial, dar cu sintaxă mai curată).

    ## Costul

    - Un server Postgres instalat și rulat pe VPS-ul mic (RAM, mentenanță, update-uri).
    - Backup nu mai e „copiezi un fișier” — e `pg_dump` + restore.
    - Configurație de conexiune, credențiale, pool de conexiuni.
    - Migrarea codului existent.

    ## Recomandarea mea

    Pentru o frizerie cu un singur frizer și câteva zeci de rezervări pe zi, SQLite cu WAL e **mai mult decât suficient** — vorbim de scrieri de câteva ori pe oră, nu de mii pe secundă. Migrează pe Postgres doar când apare unul din these declanșatoare:

    1. mai mulți frizeri / mai multe locații,
    2. un panel web sau alt serviciu care accesează aceeași bază simultan cu botul,
    3. raportări/analytics serioase.

    Până atunci, fă astea în ordine:

    1. Verifică `ps aux | grep python` — nu ai două instanțe de bot pornite (se întâmplă des după un deploy ratat, mai ales dacă rulezi cu systemd și ai repornit manual și serviciul).
    2. Adaugă WAL + `busy_timeout` la conexiune.
    3. Asigură-te că **toate** conexiunile trec prin context managerul cu `commit()`/`close()`.
    4. Schimbă backup-ul pe `sqlite3 .backup`.

    Dacă după asta mai vezi eroarea, vino cu `db.py`-ul tău complet și cu `lsof` pe fișier — găsim vinovatul. Postgres rămâne în buzunar pentru ziua în care proiectul crește.
