    ## Schema

    ```sql
    CREATE TABLE IF NOT EXISTS bookings (
        id BIGSERIAL PRIMARY KEY,
        user_id BIGINT NOT NULL,
        user_name TEXT NOT NULL,
        slot TIMESTAMPTZ NOT NULL,
        service TEXT NOT NULL,
        status TEXT NOT NULL DEFAULT 'active',
        created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    CREATE UNIQUE INDEX IF NOT EXISTS idx_slot_active
        ON bookings (slot) WHERE status = 'active';
    ```

    ## Codul

    ```python
    # db/database.py
    import asyncpg
    from datetime import datetime

    DB_DSN = "postgresql://barbosu:parola@localhost:5432/barbosu"

    _pool: asyncpg.Pool | None = None


    async def init_db():
        """Creează pool-ul și schema. Apelat o dată la pornirea botului."""
        global _pool
        _pool = await asyncpg.create_pool(DB_DSN, min_size=1, max_size=5)
        async with _pool.acquire() as conn:
            await conn.execute("""
                CREATE TABLE IF NOT EXISTS bookings (
                    id BIGSERIAL PRIMARY KEY,
                    user_id BIGINT NOT NULL,
                    user_name TEXT NOT NULL,
                    slot TIMESTAMPTZ NOT NULL,
                    service TEXT NOT NULL,
                    status TEXT NOT NULL DEFAULT 'active',
                    created_at TIMESTAMPTZ NOT NULL DEFAULT now()
                );
                CREATE UNIQUE INDEX IF NOT EXISTS idx_slot_active
                    ON bookings (slot) WHERE status = 'active';
            """)


    # ---------- Salvare ----------

    async def add_booking(user_id: int, user_name: str, slot: datetime, service: str) -> int | None:
        """Creează rezervarea. Returnează id-ul sau None dacă slotul e deja luat."""
        async with _pool.acquire() as conn:
            try:
                return await conn.fetchval(
                    "INSERT INTO bookings (user_id, user_name, slot, service) "
                    "VALUES ($1, $2, $3, $4) RETURNING id",
                    user_id, user_name, slot, service,
                )
            except asyncpg.UniqueViolationError:
                return None


    # ---------- Citire ----------

    async def get_booked_slots(day: datetime) -> list[datetime]:
        """Sloturile active dintr-o zi — intră direct în get_free_slots()."""
        async with _pool.acquire() as conn:
            rows = await conn.fetch(
                "SELECT slot FROM bookings "
                "WHERE slot >= $1 AND slot < $1 + interval '1 day' AND status = 'active'",
                day.replace(hour=0, minute=0, second=0, microsecond=0),
            )
        return [r["slot"] for r in rows]


    async def get_user_bookings(user_id: int) -> list[asyncpg.Record]:
        """Rezervările active și viitoare ale unui client."""
        async with _pool.acquire() as conn:
            return await conn.fetch(
                "SELECT id, slot, service FROM bookings "
                "WHERE user_id = $1 AND status = 'active' AND slot > now() "
                "ORDER BY slot",
                user_id,
            )


    async def get_booking(booking_id: int) -> asyncpg.Record | None:
        async with _pool.acquire() as conn:
            return await conn.fetchrow(
                "SELECT * FROM bookings WHERE id = $1", booking_id
            )


    # ---------- Anulare ----------

    async def cancel_booking(booking_id: int, user_id: int) -> bool:
        async with _pool.acquire() as conn:
            status = await conn.execute(
                "UPDATE bookings SET status = 'cancelled' WHERE id = $1 AND user_id = $2",
                booking_id, user_id,
            )
        return status == "UPDATE 1"
    ```

    În `bot.py`:

    ```python
    from db.database import init_db

    async def main():
        await init_db()
        # ... restul ca înainte
    ```

    ## Diferențe importante față de sqlite3

    - **Pool, nu conexiuni per apel** — `create_pool` deschide conexiunile o dată; `pool.acquire()` le împrumută. Nu mai există risc de conexiuni uitate deschise (cauza principală a `database is locked`-ului de ieri).
    - **`$1, $2` în loc de `?`** — placeholder-ele Postgres sunt poziționale, nu cu semn de întrebare.
    - **`TIMESTAMPTZ`** — asyncpg primește și returnează obiecte `datetime` direct, fără conversii manuale. Atenție: `TIMESTAMPTZ` stochează tot în UTC; dacă frizerul e în România, fie salvezi datetime-uri naive și folosești `TIMESTAMP` (fără TZ — mai simplu pentru un singur fus orar), fie lucrezi conștient cu timezone-uri. Pentru simplitate, recomand `TIMESTAMP` naive + `datetime.now()` peste tot, ca până acum.
    - **`cancel_booking` verifică `UPDATE 1`** — asyncpg returnează statusul ca string, nu `rowcount`.
    - **`get_booked_slots`** — am înlocuit `LIKE`-ul cu o comparație pe interval, care folosește indexul și e mai corectă.

    Instalare: `pip install asyncpg`, și nu uita să creezi userul și baza:

    ```sql
    CREATE USER barbosu WITH PASSWORD 'parola';
    CREATE DATABASE barbosu OWNER barbosu;
    ```

