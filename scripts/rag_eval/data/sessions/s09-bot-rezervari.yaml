    async def get_booked_slots(barber_id: int, day: datetime) -> list[datetime]:
        async with _pool.acquire() as conn:
            rows = await conn.fetch(
                "SELECT slot FROM bookings "
                "WHERE barber_id = $1 AND slot >= $2 AND slot < $2 + interval '1 day' "
                "AND status = 'active'",
                barber_id, day.replace(hour=0, minute=0, second=0, microsecond=0),
            )
        return [r["slot"] for r in rows]
    ```

