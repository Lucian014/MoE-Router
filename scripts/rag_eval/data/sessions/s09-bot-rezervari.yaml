    ## Varianta pivot: frizeri pe coloane, luni pe rânduri

    Mai ușor de citit pentru frizer:

    ```sql
    SELECT
        to_char(date_trunc('month', bk.slot), 'YYYY-MM') AS luna,
        COUNT(*) FILTER (WHERE b.name = 'Bărbosu') AS barbosu,
        COUNT(*) FILTER (WHERE b.name = 'Sorin')   AS sorin
    FROM bookings bk
    JOIN barbers b ON b.id = bk.barber_id
    WHERE bk.status = 'active'
      AND bk.slot >= now() - interval '12 months'
    GROUP BY date_trunc('month', bk.slot)
    ORDER BY date_trunc('month', bk.slot);
    ```

    ## Detalii de care să ții cont

    - **`status = 'active'`** — anulate nu intră în statistici. Dacă vrei și rata de anulare (utilă!), scoate filtrul și adaugă `COUNT(*) FILTER (WHERE status = 'cancelled') AS anulate` — poți compara direct.
    - **`date_trunc('month', ...)`** — mai robust decât `strftime` pe text: folosește indexul pe `slot` și nu se strică la schimbarea formatului.
    - **Filtrul pe lună e semi-deschis** (`>= start AND < start + 1 month`) — include corect prima zi la miezul nopții și exclude prima zi a lunii următoare. Nu folosi `BETWEEN`, care ar include dublu granița.
    - **Frizeri fără nicio programare** nu apar deloc în rezultat (JOIN-ul îi elimină). Dacă vrei să apară cu 0, schimbă în `LEFT JOIN` din `barbers`:

      ```sql
      SELECT b.name, COUNT(bk.id) AS programari
      FROM barbers b
      LEFT JOIN bookings bk
          ON bk.barber_id = b.id
          AND bk.status = 'active'
          AND bk.slot >= date_trunc('month', now())
      GROUP BY b.name
      ORDER BY programari DESC;
      ```

      (Atenție: condițiile pe `bookings` trebuie în `ON`, nu în `WHERE`, altfel LEFT JOIN devine de fapt INNER JOIN.)

    - **Anul trecut vs. anul curent** — dacă vrei comparație „luna asta vs. aceeași lună anul trecut", spune și îți scriu varianta cu `date_trunc` shiftat.

    Dacă vrei să le vezi direct în Telegram, pot legăm query-ul de o comandă `/stats` doar pentru frizeri — spune și o facem.
