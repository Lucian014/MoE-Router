    Reminder-ul se face cu **JobQueue** din python-telegram-bot: un job care rulează la fiecare câteva minute, caută rezervările care încep în mai puțin de ~2 ore și nu au fost deja notificate, trimite mesajul și le marchează. Ai nevoie de o coloană `reminded` ca să nu trimiți de două ori.

    ## 1. Instalare

    ```bash
    pip install "python-telegram-bot[job-queue]"
    ```

    (JobQueue are nevoie de `APScheduler`, care vine ca extra.)

    ## 2. Migrarea în DB

    ```sql
    ALTER TABLE bookings ADD COLUMN IF NOT EXISTS reminded BOOLEAN NOT NULL DEFAULT FALSE;
    ```

    ## 3. Funcțiile DB

    ```python
    # db/database.py (adaugă)

    async def get_bookings_needing_reminder() -> list[asyncpg.Record]:
        """Rezervări active care încep în următoarele ~2 ore și nu au primit reminder."""
        async with _pool.acquire() as conn:
            return await conn.fetch(
                "SELECT id, user_id, user_name, slot, service FROM bookings "
                "WHERE status = 'active' AND reminded = FALSE "
                "AND slot > now() AND slot <= now() + interval '2 hours 10 minutes'"
            )


    async def mark_reminded(booking_id: int):
        async with _pool.acquire() as conn:
            await conn.execute(
                "UPDATE bookings SET reminded = TRUE WHERE id = $1", booking_id
            )
    ```

    ## 4. Job-ul

    ```python
    # jobs/reminders.py
    from datetime import datetime

    from telegram.ext import ContextTypes

    from db.database import get_bookings_needing_reminder, mark_reminded
    from texts import t


    async def send_reminders(context: ContextTypes.DEFAULT_TYPE) -> None:
        for b in await get_bookings_needing_reminder():
            slot: datetime = b["slot"]
            minutes = int((slot - datetime.now()).total_seconds() // 60)

            lang = await get_lang(b["user_id"])
            await context.bot.send_message(
                chat_id=b["user_id"],
                text=t("reminder", lang, ora=slot.strftime("%H:%M"), minute=minutes),
            )
            await mark_reminded(b["id"])
    ```

    Și textele noi în `texts.py`:

    ```python
    # ro
    "reminder": "⏰ Îți amintim că ai programare la Frizeria Bărbosu în mai puțin de {minute} de minute, la ora {ora}. Ne vedem curând!",
    # en
    "reminder": "⏰ Reminder: you have an appointment at Frizeria Bărbosu in less than {minute} minutes, at {ora}. See you soon!",
    ```

    ## 5. Înregistrarea

    Job-ul se adaugă la pornirea aplicației. Cum folosești PTB integrat în uvicorn (`app:api`), pune-l acolo unde apeși `app_tg.start()` — job queue-ul pornește odată cu aplicația:

    ```python
    # app.py, după app_tg.start()
    from jobs.reminders import send_reminders

    app_tg.job_queue.run_repeating(
        send_reminders,
        interval=300,       # la fiecare 5 minute
        first=10,           # primul run la 10 secunde după start
    )
    ```

    ## Cum funcționează fereastra

    - Job-ul rulează la 5 minute; interogarea prinde rezervările cu `slot <= now + 2h10m`. Marja de 10 minute acoperă intervalul dintre două rulări — nicio rezervare nu sare peste reminder.
    - `reminded = FALSE` garantează o singură trimitere, chiar dacă job-ul rulează de mai multe ori în fereastra de 2 ore.
    - Mesajul spune „în mai puțin de X minute” — la prima rulare din fereastră va fi ~120, la următoarea ~115 etc. Dacă preferi un mesaj fix („astăzi la ora 11:00”), scoate `{minute}` și lasă doar ora.

    ## Două observații

    - **Fusul orar**: totul se bazează pe `now()` din Postgres vs. datetime-urile naive pe care le salvezi. Dacă ai salvat orele ca `TIMESTAMP` naive cu ora locală românească, dar serverul e pe UTC, `now()` va fi cu 3 ore defazat — reminder-urile vor pleca greșit. Verifică rapid: `SELECT now();` în psql vs. ora din România. Dacă nu se potrivesc, fie setezi timezone-ul serverului pe `Europe/Bucharest`, fie salvezi datetime-uri aware. E cea mai frecventă capcană la reminder-e.
    - **Restart-uri**: dacă botul e oprit 20 de minute, job-ul recuperează automat la prima rulare (prinde tot ce e în fereastră, nemarcate). Nu pierzi reminder-e la deploy.

    Test rapid fără să aștepți 2 ore: inserează manual o rezervare cu slot la 5 minute în viitor, repornește aplicația și vezi dacă mesajul sosește la prima rulare a job-ului.
