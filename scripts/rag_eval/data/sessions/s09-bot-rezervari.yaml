    - **`conversation_timeout`** — fără el, un client care abandonează la jumătate rămâne „blocat” în conversație pentru totdeauna și `/start` nu-i mai răspunde normal. Cu timeout, fluxul se închide singur. Adaugă și `CallbackQueryHandler(cancel, pattern="^cancel_booking$")` + un buton „❌ Renunță” pe fiecare ecran, dacă vrei ieșire explicită.
