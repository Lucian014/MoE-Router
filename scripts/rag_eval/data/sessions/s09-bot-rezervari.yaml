    ## Detalii importante

    - **`NULLIF(COUNT(*), 0)`** — fără ea, o lună fără nicio programare la un frizer dă `division by zero`. Cu ea, rata iese `NULL` (afișat gol), ceea ce e corect: 0 din 0 nu e 0%, e „fără date”.
    - **`100.0`, nu `100`** — împărțire pe întregi în Postgres trunchează: `5/38*100` cu întregi dă `13`, nu `13.2`. `.0` forțează numeric.
    - **Am scos filtrul `status` din `WHERE`** — aici ai nevoie și de anulate, deci numărul total include toate rezervările (active + anulate). Rata = anulate / total.
    - **Denumirea coloanelor** — dacă adaugi al treilea frizer, query-ul pivot crește cu 3 coloane per frizer. La 3+ frizeri, formatul „long" (un rând per frizer per lună) devine mai practic:

