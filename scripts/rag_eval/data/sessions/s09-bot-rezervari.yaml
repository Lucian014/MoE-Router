  assistant: |
    `database is locked` înseamnă că un alt proces (sau altă conexiune din același proces) ține baza blocată în momentul INSERT-ului. La SQLite e cea mai comună problemă și are câteva cauze tipice:

    ## Cauze probabile

    1. **O conexiune ținută deschisă prea mult timp** — de exemplu, dacă undeva deschizi conexiunea la pornirea botului și o refolosești, orice citire lungă blochează scrierile.
    2. **Alt proces atinge fișierul** — cronul de backup, un `sqlite3 barbosu.db` deschis într-un terminal, un al doilea bot pornit accidental (verifică cu `ps aux | grep python`).
    3. **Lipsă de `commit()`/`close()`** — o tranzacție rămasă deschisă blochează totul până la restart.
    4. **Acces concurent din handler-e async** — două rezervări care se salvează în același timp.

    ## Soluția: WAL mode + busy_timeout

    Adaugă asta la deschiderea conexiunii, în `db.py`:

    ```python
    def get_conn():
        conn = sqlite3.connect(DB_PATH, timeout=10)  # așteaptă până la 10s în loc de 5s default
        conn.row_factory = sqlite3.Row
        conn.execute("PRAGMA journal_mode=WAL")      # citirile nu mai blochează scrierile
        conn.execute("PRAGMA busy_timeout=10000")
        return conn
    ```

    **WAL (Write-Ahead Logging)** e fixul principal: permite citiri simultane cu o scriere, deci handler-ele de citire (sloturi libere, rezervările mele) nu mai blochează INSERT-ul. E o setare persistentă — se aplică o dată pe fișierul DB, dar e sigur să o execuți la fiecare conexiune.

    ## Verifică și procesele externe

    ```bash
    # cine mai atinge fișierul?
    lsof /opt/barbosu/bot/barbosu.db

    # există conexiuni blocate de mult?
    sqlite3 /opt/barbosu/bot/barbosu.db "PRAGMA wal_checkpoint;"
    ```

    Dacă ai cronul de backup din recomandarea mea anterioară, asigură-te că folosește `sqlite3 barbosu.db ".backup ..."` în loc de `cp` — copierea brută a fișierului în timp ce botul scrie poate cauza exact această eroare (și, mai rău, backup-uri corupte):

    ```bash
    # în cron, în loc de cp:
    0 3 * * * sqlite3 /opt/barbosu/bot/barbosu.db ".backup /cale/backup/barbosu-$(date +\%F).db"
    ```

    ## Bonus: dacă ești paranoic cu concurența

    Deoarece python-telegram-bot e async, poți muta operațiile DB pe un thread ca să nu blocheze event loop-ul și să le serializzi natural:

    ```python
    import asyncio
    from db import database

    booking_id = await asyncio.to_thread(
        database.add_booking, user_id, nume, slot, serviciu
    )
    ```

    La volumul unei frizerii asta e opțional, dar nu strică.

    Pe scurt: pune **WAL + timeout**, verifică că nu ai un `sqlite3` deschis sau backup cu `cp`, și asigură-te că fiecare conexiune se închide prompt (context manager, cum aveam în `database.py`). Dacă eroarea persistă după WAL, dă-mi un `lsof` pe fișierul DB și structura din `db.py` — probabil e o conexiune rămasă deschisă undeva.
