    ```python
    # db/database.py
    import sqlite3
    from contextlib import contextmanager
    from datetime import datetime

    DB_PATH = "barbosu.db"

    SCHEMA = """
    CREATE TABLE IF NOT EXISTS bookings (
        id INTEGER PRIMARY KEY AUTOINCREMENT,
        user_id INTEGER NOT NULL,
        user_name TEXT NOT NULL,
        slot TEXT NOT NULL,                     -- 'YYYY-MM-DD HH:MM'
        service TEXT NOT NULL,
        status TEXT NOT NULL DEFAULT 'active',  -- active / cancelled
        created_at TEXT NOT NULL DEFAULT (datetime('now'))
    );
    CREATE UNIQUE INDEX IF NOT EXISTS idx_slot_active
        ON bookings (slot) WHERE status = 'active';
    """


    @contextmanager
    def get_conn():
        conn = sqlite3.connect(DB_PATH)
        conn.row_factory = sqlite3.Row
        try:
            yield conn
            conn.commit()
        finally:
            conn.close()


    def init_db():
        with get_conn() as conn:
            conn.executescript(SCHEMA)


    # ---------- Salvare ----------

    def add_booking(user_id: int, user_name: str, slot: datetime, service: str) -> int | None:
        """Creează rezervarea. Returnează id-ul sau None dacă slotul e deja luat."""
        with get_conn() as conn:
            try:
                cur = conn.execute(
                    "INSERT INTO bookings (user_id, user_name, slot, service) VALUES (?, ?, ?, ?)",
                    (user_id, user_name, slot.strftime("%Y-%m-%d %H:%M"), service),
                )
                return cur.lastrowid
            except sqlite3.IntegrityError:
                return None  # indexul unic a prins o rezervare dublă


    # ---------- Citire ----------

    def get_booked_slots(day: datetime) -> list[datetime]:
        """Sloturile active dintr-o zi — intră direct în get_free_slots()."""
        with get_conn() as conn:
            rows = conn.execute(
                "SELECT slot FROM bookings WHERE slot LIKE ? AND status = 'active'",
                (day.strftime("%Y-%m-%d") + "%",),
            ).fetchall()
        return [datetime.strptime(r["slot"], "%Y-%m-%d %H:%M") for r in rows]


    def get_user_bookings(user_id: int) -> list[sqlite3.Row]:
        """Rezervările active ale unui client, în ordine cronologică."""
        with get_conn() as conn:
            return conn.execute(
                "SELECT id, slot, service FROM bookings "
                "WHERE user_id = ? AND status = 'active' AND slot >= datetime('now', 'localtime') "
                "ORDER BY slot",
                (user_id,),
            ).fetchall()


    def get_booking(booking_id: int) -> sqlite3.Row | None:
        with get_conn() as conn:
            return conn.execute(
                "SELECT * FROM bookings WHERE id = ?", (booking_id,)
            ).fetchone()


    # ---------- Anulare ----------

    def cancel_booking(booking_id: int, user_id: int) -> bool:
        """Anulare doar dacă rezervarea aparține userului respectiv."""
        with get_conn() as conn:
            cur = conn.execute(
                "UPDATE bookings SET status = 'cancelled' WHERE id = ? AND user_id = ?",
                (booking_id, user_id),
            )
            return cur.rowcount > 0
    ```

    Ce am adăugat față de varianta anterioară:

