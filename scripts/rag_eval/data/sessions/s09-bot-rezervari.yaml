- user: |
    Înapoi la bot: cineva a făcut 200 de rezervări false într-o seară. Cum pun o limită?
  assistant: |
    200 de rezervări false într-o seară = un user (sau un script) care a parcurs fluxul de rezervare în buclă. Ai nevoie de limitare pe **două niveluri**: câte rezervări active poate avea un client și cât de repede poate face rezervări noi. Plus o curățare a datelor false.

    ## 1. Limita cea mai eficientă: max rezervări active per user

    Un client real are nevoie de 1–2 rezervări active, nu de 200. Verificare în `add_booking`:

    ```python
    # db/database.py
    MAX_ACTIVE_BOOKINGS = 2

    async def add_booking(user_id: int, user_name: str, slot: datetime,
                          service: str, barber_id: int) -> int | None:
        async with _pool.acquire() as conn:
            active = await conn.fetchval(
                "SELECT COUNT(*) FROM bookings "
                "WHERE user_id = $1 AND status = 'active' AND slot > now()",
                user_id,
            )
            if active >= MAX_ACTIVE_BOOKINGS:
                return -1  # cod special: limită atinsă

            try:
                return await conn.fetchval(
                    "INSERT INTO bookings (user_id, user_name, slot, service, barber_id) "
                    "VALUES ($1, $2, $3, $4, $5) RETURNING id",
                    user_id, user_name, slot, service, barber_id,
                )
            except asyncpg.UniqueViolationError:
                return None
    ```

    Și în handler-ul de confirmare:

    ```python
    booking_id = await add_booking(...)
    if booking_id == -1:
        await query.edit_message_text(t("too_many_bookings", lang))
        return
    if booking_id is None:
        # slot luat — cum aveai deja
    ```

    **Bonus — garanție la nivel de DB**, ca să nu depinzi doar de cod (aceeași filozofie ca la indexul unic de slot):

    ```sql
    CREATE UNIQUE INDEX idx_max_active_per_user
        ON bookings (user_id) WHERE status = 'active' AND slot > now()
        -- hmm, asta limitează la 1. Pentru 2, vezi observația de mai jos.
    ```

    Un index unic parțial limitează la **1** rezervare activă. Dacă 1 e acceptabil pentru frizeria ta (cel mai probabil da — nimeni nu-și face 2 programări simultane), folosește-l direct și simplifici codul. Pentru limita 2, rămâi la verificarea din cod.

    ## 2. Cooldown între rezervări succesive

    Împotriva scriptului care rezervă în buclă, un minim de timp între rezervările aceluiași user:

    ```python
    async def add_booking(...):
        async with _pool.acquire() as conn:
            last = await conn.fetchval(
                "SELECT MAX(created_at) FROM bookings WHERE user_id = $1",
                user_id,
            )
            if last and datetime.now() - last < timedelta(minutes=10):
                return -2  # prea repede

            # ... restul ca mai sus
    ```

    ## 3. Curăță rezervările false

    ```sql
    -- identifică vinovatul
    SELECT user_id, user_name, COUNT(*) AS n, MIN(created_at), MAX(created_at)
    FROM bookings
    WHERE created_at > now() - interval '1 day'
    GROUP BY user_id, user_name
    ORDER BY n DESC;

    -- anulează-le în masă (nu șterge — păstrezi evidența)
    UPDATE bookings SET status = 'cancelled'
    WHERE user_id = <id_vinovat> AND status = 'active';
    ```

    Sloturile se eliberează instant, iar clienții reali își pot reface programările.

    ## 4. Notificare către frizer când se detectează abuz

    Opțional, dar util — în handler, când `add_booking` returnează `-1` sau `-2`, trimite un mesaj la `ADMIN_CHAT_ID` cu user_id-ul și numele. Așa frizerul vede tentativa în timp real.

    ## 5. Dacă atacul continuă: bann

    Dacă persoana insistă (și-a refăcut contul etc.), adaugă un tabel de blocare:

    ```sql
    CREATE TABLE banned_users (
        user_id BIGINT PRIMARY KEY,
        reason TEXT,
        banned_at TIMESTAMPTZ DEFAULT now()
    );
    ```

    Și un filtru global, la începutul procesării — în PTB poți folosi un `TypeHandler` sau verifici direct în `book_start`:

    ```python
    async def is_banned(user_id: int) -> bool:
        async with _pool.acquire() as conn:
            return await conn.fetchval(
                "SELECT EXISTS(SELECT 1 FROM banned_users WHERE user_id = $1)", user_id
            )
    ```

    Nu pune verificarea în fiecare handler individual — un `TypeHandler` pe `Update` care face `raise ApplicationHandlerStop` pentru bannați e curat:

    ```python
    from telegram.ext import TypeHandler, ApplicationHandlerStop

    async def ban_filter(update: Update, context: ContextTypes.DEFAULT_TYPE):
        if await is_banned(update.effective_user.id):
            raise ApplicationHandlerStop()

    app_tg.add_handler(TypeHandler(Update, ban_filter), group=-1)  # rulează primul
    ```

    ## Pe scurt, ordinea de implementare

    1. **Acum**: curăță cu UPDATE-ul din punctul 3 și identifică user_id-ul.
    2. **Azi**: limita de rezervări active (punctul 1) — rezolvă 95% din problemă.
    3. **Când apuci**: cooldown-ul (punctul 2) și notificarea de abuz (punctul 4).
    4. **Doar dacă se repetă**: bann-ul (punctul 5).

    Un detaliu: verifică și **cine** a fost — dacă `user_id`-ul e același, e un troll cu un cont. Dacă au fost 200 de user_id-uri diferite într-o seară, e un script cu conturi multiple, iar atunci limita per user nu e suficientă — ar trebui gândit și un limit global pe oră (de exemplu, max 30 rezervări/oră pentru toți clienții, alertă la frizer când se depășește). Spune-mi ce arată query-ul din punctul 3 și calibram.
- user: |
    Rescrie salvarea rezervării ca să verifice și limita: maximum 2 rezervări active per client. Păstrează constrângerea pe slot de mai devreme.
  assistant: |
    Iată `add_booking` rescris, cu ambele verificări — limita de 2 rezervări active și constrângerea de slot unic — într-o singură tranzacție:

    ```python
    # db/database.py
    MAX_ACTIVE_BOOKINGS = 2

    # coduri de retur:
    #   >0  = id-ul rezervării create
    #   None = slotul a fost luat între timp (UniqueViolationError)
    #   -1  = limita de rezervări active atinsă

    async def add_booking(user_id: int, user_name: str, slot: datetime,
                          service: str, barber_id: int) -> int | None:
        async with _pool.acquire() as conn:
            async with conn.transaction():
                # 1. limita de rezervări active per client
                active = await conn.fetchval(
                    "SELECT COUNT(*) FROM bookings "
                    "WHERE user_id = $1 AND status = 'active' AND slot > now()",
                    user_id,
                )
                if active >= MAX_ACTIVE_BOOKINGS:
                    return -1

                # 2. inserarea — indexul unic idx_barber_slot_active respinge sloturile duble
                try:
                    return await conn.fetchval(
                        "INSERT INTO bookings (user_id, user_name, slot, service, barber_id) "
                        "VALUES ($1, $2, $3, $4, $5) RETURNING id",
                        user_id, user_name, slot, service, barber_id,
                    )
                except asyncpg.UniqueViolationError:
                    return None
    ```

    Indexul de slot rămâne neschimbat (el face treaba la nivel de DB):

    ```sql
    CREATE UNIQUE INDEX IF NOT EXISTS idx_barber_slot_active
        ON bookings (barber_id, slot) WHERE status = 'active';
    ```

    Și handler-ul de confirmare, actualizat cu noul cod de retur:

    ```python
    # handlers/booking.py, în confirm()
    booking_id = await add_booking(
        user_id=user.id,
        user_name=user.first_name,
        slot=context.user_data["slot"],
        service=context.user_data.get("service", "tăiere"),
        barber_id=context.user_data["barber_id"],
    )

    if booking_id == -1:
        await query.edit_message_text(t("too_many_bookings", lang))
        return ConversationHandler.END

    if booking_id is None:
        await query.edit_message_text(
            t("slot_taken", lang),
            reply_markup=days_keyboard(lang),
        )
        return DAY

    # succes — mesajul de confirmare, ca înainte
    ```

    Textele noi:

    ```python
    # ro
    "too_many_bookings": "Ai deja 2 rezervări active. Anulează una dacă vrei să faci alta. 🙏",
    # en
    "too_many_bookings": "You already have 2 active bookings. Cancel one if you'd like to book again. 🙏",
    ```

    ## De ce tranzacție

    Fără `conn.transaction()`, verificarea limită și INSERT-ul sunt două operații separate — un user care confirmă două rezervări simultan (două telefoane, sau dublu-click rapid) ar putea trece ambele de verificarea `COUNT(*)` înainte ca vreun INSERT să se comită. Tranzacția serializează cele două operații pe aceeași conexiune, iar la nivelul de concurență al frizeriei, plus indexul unic pe slot ca plasă de siguranță, e suficient de solid.

    **Notă de onestitate tehnică**: la nivel de DB, limita de 2 rămâne aplicată doar în cod — Postgres nu are constraint nativ de „max 2 rânduri per user". Dacă vrei garanție absolută ca la slotul unic, există trucul cu trigger sau cu un tabel contor, dar pentru cazul tău e exagerat: chiar dacă o cursă rară ar permite 3 rezervări, consecința e benignă (un client cu 3 programări), spre deosebire de slotul dublu care e o eroare vizibilă de business.

    ## Un detaliu de UX

    Când limita e atinsă, mesajul spune clientului ce să facă (anulează una). E bine ca butonul „Rezervările mele" să fie accesibil ușor — clientul e deja în mijlocul unui flux de conversație, iar `ConversationHandler.END` din handler îl scoate curat; de acolo poate da `/start` și apăsa „Rezervările mele". Dacă vrei mai fin, poți pune în mesajul de eroare un buton inline direct către `my_bookings` — dar ține cont că ești în conversație, deci butonul trebuie gestionat de fallback-uri sau scoate-l din flux înainte.
- user: |
    Ce ar trebui să mai verific înainte să-l las pe prietenul meu să-l folosească cu clienți reali?
  assistant: |
    Bună întrebare — diferența dintre „merge la mine în teste" și „merge cu clienți reali" e exact lista asta. O împart pe categorii, în ordinea importanței:

    ## Siguranță și acces

    - **Secret token pe webhook** — fără el, oricine descoperă URL-ul poate trimite update-uri false botului. `secret_token` în `run_webhook` + header check în nginx.
    - **Comenzile de admin** (`/stats`, `/rezervari`) — verifică că filtrează pe `ADMIN_CHAT_ID`, nu doar că nu le-ai publicat. Oricine poate citi codul dacă e pe GitHub.
    - **Tokenul și DSN-ul** — confirmă că `.env` e în `.gitignore` și că nu a ajuns vreodată într-un commit (dacă da, revocă tokenul).

    ## Fiabilitate

    - **systemd cu `Restart=always`** — ai deja; testează-l: `kill -9` pe proces și verifică că revine singur.
    - **Backup funcțional, nu doar configurat** — rulează manual comanda din cron, restaurează fișierul într-o bază de test și verifică-l. Un backup netestat nu e backup.
    - **Loguri** — adaugă logging cu `logging.basicConfig(level=logging.INFO)` și un `error_handler` în PTB (`app_tg.add_error_handler`) ca excepțiile din handler-e să apară în `journalctl`, nu să fie înghițite silențios.
    - **Timezone-ul** — verifică `SELECT now()` în psql vs. ora României. Reminder-ele și digestul depind de asta; e capcana #1 la lansare.

    ## Comportament cu date reale

    - **Fluxul complet, end-to-end, cu cont real**: rezervare → reminder (fă una cu slot la 5 minute) → anulare → notificare frizer → digest de dimineață.
    - **Două conturi simultan pe același slot** — verifică că al doilea primește `slot_taken`, nu o dublă rezervare.
    - **Nume cu caractere speciale** — un client cu nume cu apostrof sau diacritice ciudate nu trebuie să crape nimic (cu query-uri parametrizate ești OK, dar testează).
    - **Clientul care blochează botul** — dacă un user a blocat botul, `send_message` pentru reminder aruncă `Forbidden` și, fără try/except, job-ul de reminder moare pentru toți ceilalți din buclă. Învelește trimiterile în `try/except TelegramError`.

    ## Limite și abuz

    - Limita de 2 rezervări active — implementată, testează-o.
    - Cooldown-ul între rezervări — dacă nu l-ai pus încă, acum e momentul, înainte de primul troll.

    ## UX de lansare

    - **Mesajul `/start`** — primul contact al clientului. Citește-l ca și cum ai fi client, nu dezvoltator.
    - **Instrucțiuni pentru frizer** — cum anulează el o rezervare dacă cineva sună? Dacă nu are comandă pentru asta, fă una minimă (`/anuleaza <id>`) sau măcar documentează procedura.
    - **Un canal de feedback** — spune-i prietenului tău să-ți raporteze problemele cu screenshot, nu din memorie.

    ## Un test final

    Pornește botul, deconectează-ți intenționat Postgres (`systemctl stop postgresql`), scrie botului și verifică că eroarea apare în loguri și serviciul se recuperează după repornirea DB-ului. Clienții reali găsesc moduri de a-l stresa pe bot pe care nu le-ai imaginat — vrei ca eșecurile să fie vizibile în loguri, nu invizibile pentru tine și frustrante pentru ei.

    Dacă treci de lista asta, ești mai pregătit decât majoritatea bot-urilor de producție pe care le-am văzut. Spor la lansare! 💈
