          b.name AS frizer,
          to_char(date_trunc('month', bk.slot), 'YYYY-MM') AS luna,
          COUNT(*) AS total,
          COUNT(*) FILTER (WHERE bk.status = 'cancelled') AS anulate,
          ROUND(100.0 * COUNT(*) FILTER (WHERE bk.status = 'cancelled') / NULLIF(COUNT(*), 0), 1) AS rata_pct
      FROM bookings bk
      JOIN barbers b ON b.id = bk.barber_id
      WHERE bk.slot >= now() - interval '12 months'
      GROUP BY b.name, date_trunc('month', bk.slot)
      ORDER BY date_trunc('month', bk.slot), b.name;
      ```

    - **Nuanță de interpretare**: rata e calculată pe **luna slotului**, nu pe luna creării rezervării. O rezervare făcută în ianuarie pentru martie, anulată în februarie, apare la martie. Pentru frizer asta e de obicei perspectiva corectă („câți clienți mi-au spart programul în luna X”), dar dacă vrei „câte anulări s-au produs în luna X", grupezi pe `created_at` sau adaugi o coloană `cancelled_at` — spune-mi dacă vrei varianta asta.

    - **Observație practică**: o rată mare de anulare poate însemna și clienți care anulează târziu (sub fereastra de 3 ore, deci prin telefon) — dacă frizerul vrea imaginea completă, merită și un `cancelled_at` în DB de acum încolo, chiar dacă datele istorice nu-l au.
