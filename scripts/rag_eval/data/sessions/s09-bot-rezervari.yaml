    ## Indexul parțial unic

    ```sql
    CREATE UNIQUE INDEX idx_slot_active
        ON bookings (slot) WHERE status = 'active';
    ```

    Ce face:

    - **Unic**: nu pot exista două rânduri cu același `slot` care satisfac condiția.
    - **Parțial** (`WHERE status = 'active'`): restricția se aplică doar rezervărilor active. Cele anulate (`status = 'cancelled'`) nu contează — altfel, o dată ce cineva anulează, slotul ar fi blocat pentru totdeauna.

    Adică: clientul A rezervă 11:00, apoi anulează, clientul B poate lua 11:00 — dar dacă A și B încearcă simultan, doar unul reușește.

    ## Ce se întâmplă la încălcare

    Postgres respinge INSERT-ul cu eroare, indiferent de cod, proces sau aplicație — chiar și din psql sau din viitoarea pagină web. În asyncpg o prinzi ca excepție:

    ```python
    async def add_booking(user_id: int, user_name: str, slot: datetime, service: str) -> int | None:
        async with _pool.acquire() as conn:
            try:
                return await conn.fetchval(
                    "INSERT INTO bookings (user_id, user_name, slot, service) "
                    "VALUES ($1, $2, $3, $4) RETURNING id",
                    user_id, user_name, slot, service,
                )
            except asyncpg.UniqueViolationError:
                return None  # slotul a fost luat între timp
    ```

    Asta rezolvă și **race condition-ul clasic**: doi clienți văd simultan slotul ca liber (ambele citiri trec), ambele apasă „confirmă”. Fără index, ambele INSERT-uri ar reuși. Cu index, al doilea primește `UniqueViolationError` — baza de date e arbitru final, nu codul tău.

    Poți verifica manual comportamentul:

    ```sql
    INSERT INTO bookings (user_id, user_name, slot, service)
    VALUES (1, 'Test A', '2025-06-10 11:00', 'tăiere');  -- OK

    INSERT INTO bookings (user_id, user_name, slot, service)
    VALUES (2, 'Test B', '2025-06-10 11:00', 'tăiere');  -- ERROR: duplicate key value
                                                          -- violates unique constraint
    ```

    ## De ce nu un simplu `UNIQUE(slot)` pe coloană

    ```sql
    slot TIMESTAMPTZ NOT NULL UNIQUE   -- ❌ NU face asta
    ```

    Ar bloca re-rezervarea unui slot anulat: rândul anulat rămâne în tabel (istoric), iar `UNIQUE` pe toată coloana ar respinge orice nouă rezervare la acea oră. Condiția `WHERE status = 'active'` e esențială pentru designul cu soft-delete.

    ## Alternativă: constraint de excludere (dacă duratele devin variabile)

    Indexul parțial funcționează perfect pentru sloturi fixe de 30 min. Dacă într-o zi frizerul vrea servicii de 30, 45 și 60 de minute, sloturile nu mai sunt discrete și ai nevoie de **exclusion constraint** cu intervale:

    ```sql
    CREATE EXTENSION IF NOT EXISTS btree_gist;

    ALTER TABLE bookings ADD CONSTRAINT no_overlap
        EXCLUDE USING gist (
            tstzrange(slot, slot + interval '30 minutes') WITH &&,
            status WITH =
        ) WHERE (status = 'active');
    ```

    `&&` înseamnă „fără suprapuneri de intervale între rezervările active”. Astfel, o rezervare la 11:00–11:30 blochează și un start la 11:15. Pentru modelul actual cu sloturi fixe, indexul parțial e suficient și mai simplu — ține constraintul de excludere în minte pentru viitor.

    ## Un detaliu de care să ții cont

    `UniqueViolationError` nu-ți spune *ce* index a sărit. Dacă adaugi mai târziu alte constrângeri unice (de exemplu, un user să nu poată avea două rezervări active), verifică și numele constraintului:

    ```python
    except asyncpg.UniqueViolationError as e:
        if "idx_slot_active" in str(e):
            return None  # slot luat
        raise  # altă încălcare — nu o înghiți
    ```

    Pe scurt: ai deja garanția la nivel de DB prin `idx_slot_active`. Codul tău doar interpretează frumos eroarea — chiar dacă mâine scrii pagina web sau un script de import, baza de date nu lasă niciodată două rezervări active pe același slot.
