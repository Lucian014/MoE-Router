    **1. JWKS-ul e construit din alte chei decât cele de semnare.** Cea mai comună: două fixture-uri diferite, fiecare generând chei proprii. De exemplu:

    ```python
    @pytest.fixture
    def keyring():
        return generate_key_pem(), generate_key_pem()   # cheile A

    @pytest.fixture
    def jwks(keyring):   # ok dacă folosește keyring...
        ...
    ```

    dar dacă `jwks` își generează propriile chei în loc să primească `keyring`-ul ca parametru, tokenul e semnat cu chei care nu apar deloc în JWKS. Verifică că lanțul de dependențe e corect: `jwks` trebuie să primească *aceleași* obiecte cheie din care vine `old_private`.

    **2. `kid`-urile nu se potrivesc.** Tokenul are `kid=k-old`, dar dacă helper-ul care construiește JWKS-ul generează `kid`-uri automat (de exemplu `k-test-0`, ca în exemplul meu), căutarea după `k-old` eșuează. Depinde cum tratează `decode_token` un kid necunoscut: dacă încearcă toate cheile sau dacă ridică direct, mesajul poate fi oricum „Signature verification failed”. Verifică:

    ```python
