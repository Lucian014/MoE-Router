    print(jwt.get_unverified_header(token))          # ce kid declară tokenul
    print([k["kid"] for k in jwks_fixture["keys"]])  # ce kid-uri există în JWKS
    ```

    **3. `decode_token` nu folosește JWKS-ul injectat.** Dacă semnătura funcției e `decode_token(token, jwks=None)` dar testul apelează `decode_token(token)` fără al doilea argument, funcția citește de pe disc (director gol în CI sau chei de producție) — și pică logic.

    **Test care izolează problema în 10 secunde** — verifică perechea direct, fără aplicație:

    ```python
    def test_keypair_consistency(keyring, jwks):
        """Cheia privată veche trebuie să corespundă publicului din JWKS cu același kid."""
        from jose import jwk as jose_jwk, jwt

        old_priv, old_pub = keyring.old_private, keyring.old_public
        token = jwt.encode({"sub": "x"}, jose_jwk.construct(old_priv, algorithm="RS256").to_dict(),
                           algorithm="RS256")
        key = next(k for k in jwks["keys"] if k["kid"] == jwt.get_unverified_header(token)["kid"])
        payload = jwt.decode(token, key, algorithms=["RS256"],
                             options={"verify_exp": False, "verify_aud": False, "verify_iss": False})
        assert payload["sub"] == "x"
    ```

    Dacă și acest test minimal pică, problema e la fixture-uri (cauzele 1 sau 2). Dacă trece, problema e în `decode_token` (cauza 3).

    Lipește-mi `conftest.py` și `decode_token` dacă nu iese cu asta — la aceste trei cauze se reduce aproape sigur.
- user: |
    Ce ar trebui să conțină un checklist de securitate pentru autentificare înainte de lansarea oficială? Avem lansarea pe 1 decembrie.
  assistant: |
    Un checklist adaptat la ce ați construit până acum, organizat pe categorii. Bifează-le cu dată și responsabil, nu din memorie.

    **Chei și tokenuri**

    - [ ] Cheia privată există doar în serviciul de auth (secret manager / montată ca secret), nu în git, nu în imaginea Docker, nu la echipa de mobil — verifică istoricul git pentru chei comise accidental
    - [ ] Fingerprint-ul cheii de semnare e logat la pornire și e cel din runbook
    - [ ] Rotația a fost repetată *întreagă* cel puțin o dată în staging, cu runbook scris (inclusiv pasul de restart al podurilor)
    - [ ] JWKS-ul expune doar chei publice și are Cache-Control setat; procesul de rotație respectă TTL-ul de cache
    - [ ] `iss` și `aud` sunt validate la fiecare decode; audiența e una singură (`bilete-api`) sau lista temporară are deadline scris în cod
    - [ ] `algorithms=["RS256"]` explicit la fiecare `jwt.decode` — nicăieri listă goală sau preluată din input
    - [ ] Access token scurt (15 min), refresh 7 zile, `type` verificat la `/refresh` și la rutele protejate
    - [ ] Refresh token: rotație la fiecare folosire + detecție de reutilizare (revocarea sesiunii)

    **Cookie-uri și transport**

    - [ ] `httponly`, `Secure`, `SameSite` corect pentru topologia voastră (dacă ați rămas pe subdomenii separate: `None` + `path` restrâns; ideal: același site, `Lax`)
    - [ ] HTTPS obligatoriu end-to-end: redirect 301 pe HTTP, HSTS activ (`Strict-Transport-Security`), TLS 1.2+; testat cu SSL Labs (target A)
    - [ ] `--proxy-headers --forwarded-allow-ips` configurat corect; IP-ul clientului real ajunge în rate limiting și în loguri, nu IP-ul nginx-ului
    - [ ] `X-Forwarded-For` nu poate fi falsificat de client (nginx suprascrie, nu adaugă)

    **Login și brute force**

    - [ ] Rate limiting funcțional pe `/token`: în aplicație cu Redis (verificat că e partajat între workeri/replice — test cu 2 workeri) + limită în nginx
    - [ ] Limită și per username, nu doar per IP (credential stuffing distribuit)
    - [ ] Mesaj de eroare identic pentru user inexistent și parolă greșită
    - [ ] Alertă pe: rată anormală de eșecuri per username, per IP, și pe volumul de 401 pe `/refresh`
    - [ ] bcrypt cu cost factor adecvat; load test pe `/token` la volum estimat pentru 1 decembrie (bcrypt e lent intenționat — CPU-ul la vârf e riscul real)
    - [ ] Lockout temporar sau CAPTCHA după N eșecuri consecutive pe același cont (decizie de produs, dar discutată)

    **Autorizare**

    - [ ] Rolul citit din DB la fiecare request; niciun cod care mai citește `role` din token
    - [ ] Ownership verificat în query (`WHERE organizer_id = ?`), nu post-filtrare; 404 pentru resursele altora
    - [ ] Teste automate pe fiecare rută: acces fără token (401), cu rol greșit (403), cu rol corect (200), resursă a altui organizator (404)
    - [ ] `/refresh` verifică rolul/userul din DB înainte să emită token nou

    **Loguri și audit**

    - [ ] Log de audit separat pentru login success/failed, cu câmpurile discutate (username, IP, user_agent, reason) — fără parole, fără tokenuri
    - [ ] Verificat explicit: niciun token, parolă sau cookie în logurile de aplicație, în acces log-urile nginx, în traceback-uri, în Sentry
    - [ ] Alertare activă pe logurile de audit (nu doar „sunt acolo”)
    - [ ] Retenție documentată + mențiune în politica de confidențialitate (date personale în loguri de securitate)

    **Reziliență la incident**

    - [ ] Procedură de revocare de urgență: cum invalidezi *toate* tokenurile în < 5 minute (rotație cheie = cel mai rapid kill-switch; sau `token_version` pe user)
    - [ ] Procedură de blocare a unui cont compromis
    - [ ] Runbook-uri scrise pentru: rotație chei, cheie compromisă, val de credential stuffing — testate de o persoană care nu le-a scris
    - [ ] Smoke test post-deploy: login + decode + apel rută protejată, rulat automat la fiecare deploy

    **Teste și verificare finală**

    - [ ] Testele de rotație (inclusiv mismatch-ul kid/cheie — incidentul vostru) în CI
    - [ ] Test pentru audiențe: token cu `aud` greșit respins
    - [ ] Un audit extern sau măcar o revizuire cross-team a configurației (persoană care nu a scris codul, cu checklist-ul ăsta în mână)
    - [ ] Data de 1 decembrie nu e prima zi în care ceva e în producție: dacă rate limiting, cookie-uri sau rotația s-au schimbat recent, lasă minim o săptămână de funcționare stabilă înainte de vârf

    **Prioritatea mea pentru timpul rămas**, dacă nu apuci tot: rate limiting verificat sub sarcină, procedura de revocare de urgență, și smoke test-ul post-deploy. Primele două sunt diferența dintre un incident și un incident gestionat.

    Vrei să detaliez vreo secțiune — de exemplu procedura de revocare de urgență sau scenariul de load test pe `/token`?
- user: |
    Fă-mi un rezumat cu tot ce s-a schimbat în autentificare de la primul rezumat încoace.
  assistant: |
    Rezumatul schimbărilor de la primul rezumat încoace:

    **Configurație**

    - Toată configurația mutată în variabile de mediu, citită cu `pydantic-settings` (`app/config.py`), cu validare la pornire: algoritm permis, TTL-uri în limite rezonabile, `iss` ca URL, existența cheilor. `get_settings` cu `lru_cache`, injectabil ca dependență pentru teste.
    - Cheia privată citită din variabilă de mediu, nu din fișier; base64 (sau `\n` escapat cu validator) pentru newline-uri; verificare la pornire că cheia decodată e PEM valid.

    **Tokenuri**

    - Claim-uri `iss` (`https://auth.bilete.ro`) și `aud` (`bilete-api`) adăugate la emitere și verificate la fiecare `jwt.decode`.
    - Decizie: un singur `aud` pentru toți clienții (web + mobil); distincția se face cu `client_id`, nu cu audiențe separate. Echipa de mobil trebuie să obțină tokenuri de la `auth.bilete.ro`, nu să le genereze.
    - Rolul **nu mai stă în token** — se citește din DB la fiecare request, pentru retragere imediată. Bonus: ștergerea userului îl deloghează instant.

    **RS256 și rotația cheilor**

    - Trecere definitivă pe RS256: semnare cu cheie privată, verificare cu publice.
    - Header `kid` la semnare; verificarea alege cheia publică din JWKS după `kid`.
    - Endpoint public `/.well-known/jwks.json`, construit din directorul cu chei publice, cu Cache-Control.
    - Procedură de rotație în overlap: cheie nouă publicată → semnare cu ea → cheia veche scoasă după `REFRESH_TOKEN_EXPIRE + 1 zi`. Fingerprint-ul cheii logat la pornire.
    - Incident rezolvat: semnături eșuate după rotație (pod nemodificat, secret vechi în env) → remediere prin restart + verificare pereche cu `openssl` + fingerprint în loguri.
    - Incident rezolvat: `Invalid audience` (mobilul emitea cu alt `aud`) → listă temporară de audiențe acceptate, cu deadline în cod.

    **Rate limiting**

    - Două straturi: nginx (`limit_req_zone`, mai permisiv) + aplicație cu Redis (5/min per IP, fereastră fixă, `Retry-After`).
    - Slowapi respins: contoare în proces, se multiplică cu workerii.
    - `--proxy-headers --forwarded-allow-ips` configurat ca IP-ul real al clientului să ajungă în limitare și loguri.
    - Limită recomandată și per username.

    **Cookie-uri și CORS**

    - CORS fixat pentru cookie-uri: `allow_origins` explicit (fără `*`) + `allow_credentials=True`; frontend cu `credentials: "include"`.
    - `SameSite=None` necesar între `bilete.ro` și `api.bilete.ro` (site-uri diferite); alternativă pe termen lung: același site prin proxy.

    **Autorizare**

    - `require_role(*roles)` — fabrică de dependențe, 403 la rol greșit, 401 la neautentificat.
    - Ownership verificat în query (`WHERE organizer_id = ?`), nu post-filtrare; 404 pentru resursele altora.

    **Audit și observație**

    - Logger separat `audit.auth` pentru login success/failed: username, user_id, IP, user_agent, reason, method. Fără parole, tokenuri sau cookie-uri. Alertare pe rate anormale de eșecuri.

    **Teste**

    - Teste de rotație cu chei RSA generate în fixture-uri (fără disc): overlap, cheie scoasă, kid necunoscut, mismatch kid/cheie (incidentul reproducut în CI), consistența perechii.
    - `verify_token` făcută injectabilă (JWKS ca parametru) pentru testabilitate.

    **Proces**

    - Checklist de securitate pre-lansare (1 decembrie), cu priorități: rate limiting sub sarcină, procedură de revocare de urgență, smoke test post-deploy, runbook-uri testate.

    Stadiul actual: auth pe RS256 cu rotație testată, tokenuri scurte cu `iss`/`aud`, roluri dinamice din DB, rate limiting pe Redis + nginx, audit logging, și un set de teste care acoperă inclusiv incidentele reale pe care le-ați avut.
