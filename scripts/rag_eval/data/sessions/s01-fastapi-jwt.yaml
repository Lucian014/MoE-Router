    ```python
    # tests/test_rotation.py
    import pytest
    from jose import jwk, jwt

    from app.security import verify_token  # funcția ta de verificare


    def make_jwks(*public_pems: str) -> dict:
        keys = []
        for i, pem in enumerate(public_pems):
            d = jwk.construct(pem, algorithm="RS256").to_dict()
            d.update({"kid": f"k-test-{i}", "alg": "RS256", "use": "sig"})
            keys.append(d)
        return {"keys": keys}


    def sign(private_pem: str, kid: str, claims: dict) -> str:
        key = jwk.construct(private_pem, algorithm="RS256").to_dict()
        key["kid"] = kid
        key["alg"] = "RS256"
        return jwt.encode(claims, key, algorithm="RS256")


    CLAIMS = {"sub": "ana", "iss": "https://auth.bilete.ro", "aud": "bilete-api"}


    def test_token_signed_with_old_key_during_overlap(old_keys, new_keys):
        """Faza de overlap: token vechi + JWKS cu ambele chei → valid."""
        old_priv, old_pub = old_keys
        _, new_pub = new_keys
        token = sign(old_priv, "k-test-0", CLAIMS)
        payload = verify_token(token, jwks=make_jwks(old_pub, new_pub))
        assert payload["sub"] == "ana"


    def test_token_signed_with_new_key_during_overlap(old_keys, new_keys):
        """Token nou emis după rotație → valid."""
        _, old_pub = old_keys
        new_priv, new_pub = new_keys
        token = sign(new_priv, "k-test-1", CLAIMS)
        payload = verify_token(token, jwks=make_jwks(old_pub, new_pub))
        assert payload["sub"] == "ana"


    def test_old_key_removed_after_rotation(old_keys, new_keys):
        """După rotație: JWKS are doar cheia nouă → tokenul vechi e respins."""
        old_priv, _ = old_keys
        _, new_pub = new_keys
        token = sign(old_priv, "k-test-0", CLAIMS)
        with pytest.raises(jwt.JWTError):
            verify_token(token, jwks=make_jwks(new_pub))


    def test_unknown_kid_rejected(old_keys):
        old_priv, old_pub = old_keys
        token = sign(old_priv, "k-necunoscut", CLAIMS)
        with pytest.raises(jwt.JWTError):
            verify_token(token, jwks=make_jwks(old_pub))


    def test_signature_mismatch_detected(old_keys, new_keys):
        """Exact incidentul vostru: kid nou, dar semnat cu cheia veche."""
        old_priv, _ = old_keys
        _, new_pub = new_keys
        token = sign(old_priv, "k-test-1", CLAIMS)  # kid nou, cheie veche!
        with pytest.raises(jwt.JWTError):
