    Recomandarea mea: **ambele straturi, dar roluri diferite** — nginx pentru limitarea brută pe IP, iar în aplicație ceva bazat pe Redis. Slowapi singur are o problemă importantă la tine:

    **De ce slowapi nu e suficient**

    Slowapi (wrapper peste `limits`) ține contoarele **în procesul aplicației**. Consecințe:

    - dacă rulezi cu mai mulți workeri uvicorn, fiecare are contoarele lui: 5 workeri × 5/min = 25/min efectiv;
    - dacă scalezi la mai multe replici, limita se multiplică și mai mult;
    - la restart, contoarele se șterg.

    Pentru credential stuffing pe o platformă de bilete, asta e o gaură reală. Slowapi e ok pentru o aplicație single-process; tu ai nevoie de stare partajată.

    **Stratul nginx — prima linie de apărare**

    ```nginx
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

    location /token {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://app;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    ```

    Am pus 10/min în nginx (mai permisiv decât limita din aplicație) ca să absoarbă valurile grosiere, iar limita fină de 5/min s-o aplice aplicația.

    **Atenție la IP-ul clientului** — punctul tău despre nginx e exact aici: dacă citești `request.client.host` în FastAPI, vezi IP-ul nginx-ului pentru *toți* clienții, deci ai limita un singur utilizator pentru toată lumea (outage la primul val de login-uri). Soluția:

    ```bash
    uvicorn app.main:app --proxy-headers --forwarded-allow-ips="10.0.0.5"
    ```

    unde `10.0.0.5` e IP-ul intern al nginx-ului. FastAPI va then raporta IP-ul real din `X-Forwarded-For`. **Nu** seta `--forwarded-allow-ips="*"`: atunci clientul poate falsifica IP-ul trimițând propriul header și ocolește limita.

    **Limita de 5/min în aplicație, cu Redis**

    O fereastră glisantă simplă:

    ```python
    from fastapi import HTTPException, Request, status

    async def check_login_rate_limit(request: Request, redis, ip: str):
        key = f"login_rl:{ip}"
        count = await redis.incr(key)
        if count == 1:
            await redis.expire(key, 60)
        if count > 5:
            ttl = await redis.ttl(key)
            raise HTTPException(
                status_code=status.HTTP_429_TOO_MANY_REQUESTS,
                detail="Too many login attempts",
                headers={"Retry-After": str(max(ttl, 1))},
            )
    ```

    Apelată în `/token` înainte de verificarea parolei. Avantajul față de slowapi: contoarele sunt partajate între workeri și replici, supraviețuiesc restarturilor și poți adăuga ușor o a doua cheie pe `form_data.username` (limită și per cont, nu doar per IP — util pentru atacuri distribuite din multe IP-uri pe un singur cont).

    Dacă vrei totuși interfața decorată a slowapi, îl poți folosi cu un storage Redis (`limits` suportă `redis://`), dar implementarea de mai sus e mai transparentă și fără dependență în plus.
