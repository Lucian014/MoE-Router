- user: |
    Unul dintre teste pică:

    ```
    FAILED tests/test_rotation.py::test_old_key_still_valid - jose.exceptions.JWTError: Signature verification failed.
    ___________________________ test_old_key_still_valid ___________________________
    def test_old_key_still_valid(keyring, make_token):
        token = make_token(kid="k-old", key=keyring.old_private)
