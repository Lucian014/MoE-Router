  assistant: |
    **Pune în log (identificatori, nu secrete):**

    - `username` — e identificator de audit, nu secret; fără el logul e inutil pentru investigații
    - `user_id` (dacă îl ai separat de username)
    - `ip` — clientul real, din `X-Forwarded-For` (cu `--proxy-headers` configurat, cum am discutat)
    - `user_agent` — diferențiază „login de pe telefonul meu” de „login de pe un server din altă țară”
    - `status`: `success` / `failed_password` / `failed_unknown_user`
    - `reason` la eșec: `bad_password`, `unknown_user`, `rate_limited`, `account_locked`
    - `timestamp` (vine din logging framework)
    - `request_id` / `correlation_id` — ca să legi login-ul de cererile ulterioare ale aceleiași sesiuni
    - la success: `method` — cum s-a autentificat: `password`, `refresh`, eventual `2fa` mai târziu

    **Nu pune niciodată:**

    - **parola** — nici măcar greșită. Un log cu parole greșite e o mină de aur: utilizatorii scriu adesea parola corectă în câmpul de parolă repetată sau o introduc în câmpul de username. Dacă loghezi `form_data.password` chiar și la eșec, ai un incident GDPR + securitate.
    - **tokenuri** — nici access, nici refresh, nici măcar trunchiate. Un token din log e un token valid până la expirare.
    - **cookie-uri sau headere `Authorization`** — nu activa logging de headere la nivel de middleware/access log fără filtrare.
    - **email + IP + user_agent combinate cu date biometrice sau de localizare precisă** — atenție la calificarea de date personale; pentru audit, IP-ul și user_agent sunt în general considerate necesare și proporționale, dar documentează scopul în registrul de procesare.

    **Implementare:**

    ```python
    import logging

    audit_logger = logging.getLogger("audit.auth")


    @app.post("/token")
    async def login(request: Request, form_data: OAuth2PasswordRequestForm = Depends()):
        ip = request.client.host
        ua = request.headers.get("user-agent", "")
        user = await get_user(form_data.username)

        if not user or not verify_password(form_data.password, user.hashed_password):
            audit_logger.warning(
                "login_failed username=%s ip=%s reason=%s",
                form_data.username, ip,
                "unknown_user" if user is None else "bad_password",
                extra={"user_agent": ua},
            )
            raise HTTPException(...)  # mesajul generic, ca până acum

        audit_logger.info(
            "login_success username=%s user_id=%s ip=%s method=password",
            form_data.username, user.id, ip,
            extra={"user_agent": ua},
        )
        ...
    ```

    **Sfaturi practice:**

    - **Logger separat** (`audit.auth`), nu cel general al aplicației: format propriu, eventual JSON, trimis într-un sink dedicat cu retenție mai lungă (auditul se păstrează de obicei 12+ luni, logurile de aplicație mai puțin).
    - **JSON structurat** e mai util decât text liber pentru alertare: poți alerta pe `reason=rate_limited` în creștere sau pe `login_failed` pentru același username din 20 de IP-uri (credential stuffing).
    - **Nu loga la `DEBUG`** — la nivel de `INFO`/`WARNING`, ca să nu dispară în producție unde nivelul e ridicat.
    - **Alertele contează mai mult decât logurile.** Un log pe care nimeni nu-l privește nu e audit. Minim: alertă pe rată anormală de eșecuri per username și per IP.

    Un detaliu GDPR: logurile de audit cu username + IP sunt date personale, deci menționează-le în politica de confidențialitate („păstrăm înregistrări de securitate privind autentificarea, X luni, în scopul prevenirii fraudei”).
