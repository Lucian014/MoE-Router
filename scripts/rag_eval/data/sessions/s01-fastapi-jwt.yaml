        {"kty": "RSA", "kid": "k-2026-11", "n": "sX7O...", "e": "AQAB", "alg": "RS256", "use": "sig"}
      ]
    }
    ```

    Detalii care contează:

    - **`kid` din numele fișierului** trebuie să fie exact `kid`-ul din header-ul tokenurilor pe care le semnezi — e același mecanism de potrivire pe care l-am discutat la rotație.
    - **`use: "sig"`** spune consumatorilor că cheia e pentru semnătură, nu pentru criptare.
    - **Cache-Control** — serviciile consumatoare pot cache-ui răspunsul o oră. Ține cont de asta la rotație: publică cheia nouă cu cel puțin TTL-ul de cache înainte să semnezi cu ea, exact capcana de care vorbeam.
