        key = next((k for k in jwks["keys"] if k["kid"] == kid), None)
        if key is None:
            raise ValueError(f"unknown kid: {kid}")
        return jwt.decode(token, key, algorithms=["RS256"], issuer=ISSUER, audience="bilete-api")
    ```

