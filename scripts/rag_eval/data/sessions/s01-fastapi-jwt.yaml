    **1. CORS middleware-ul din FastAPI**

    ```python
    from fastapi.middleware.cors import CORSMiddleware

    app.add_middleware(
        CORSMiddleware,
        allow_origins=["https://bilete.ro"],   # NU "*"
        allow_credentials=True,                # trimite Access-Control-Allow-Credentials
        allow_methods=["GET", "POST"],
        allow_headers=["Authorization", "Content-Type"],
    )
    ```

    Cu `allow_credentials=True`, middleware-ul ecou originul cerut în loc de `*` — exact ce cere browserul.

    **2. Frontend-ul trebuie să trimită cookie-ul**

    ```javascript
    const r = await fetch("https://api.bilete.ro/refresh", {
        method: "POST",
        credentials: "include",   // fără asta, cookie-ul nu pleacă deloc
    });
    ```

    Fără `credentials: "include"`, cererea trece de CORS, dar cookie-ul `refresh_token` nu e atașat, deci primești 401 „Missing refresh token” — următorul simptom după ce rezolvi CORS-ul.

    **3. Capcana care vine imediat după: SameSite**

    Cookie-ul e setat de `api.bilete.ro`, dar cererea vine de pe `bilete.ro` — sunt **site-uri diferite** (subdomenii diferite = cross-site pentru SameSite). Cu `samesite="strict"` (și chiar `lax`), browserul nu trimite cookie-ul pe cereri cross-site. Ai nevoie de:

    ```python
    response.set_cookie(
        "refresh_token", new_refresh,
        httponly=True, secure=True,
        samesite="none",          # obligatoriu pentru cross-site
        path="/refresh",
        max_age=7 * 24 * 3600,
    )
    ```

    `SameSite=None` funcționează doar cu `Secure=True` (pe care îl ai deja) și te lasă mai expus la CSRF — de aceea e important că cookie-ul e restrâns la `path="/refresh"` și că endpoint-ul acceptă doar POST.

    **Alternativa mai curată:** servește frontend-ul și API-ul din același site, de exemplu `bilete.ro` (frontend) + `bilete.ro/api` (prin proxy nginx). Atunci cookie-ul e first-party, `SameSite=Lax` e suficient, CORS dispare complet, iar `SameSite=None` nu mai e necesar. Pentru o platformă de bilete, unde securitatea a cerut deja măsuri stricte, merită luată în calcul pe termen lung.

    Pe termen scurt: punctele 1–3 rezolvă problema acum.
