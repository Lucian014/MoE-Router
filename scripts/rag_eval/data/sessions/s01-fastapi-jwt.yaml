    ```python
    r = client.post("/token", data={"username": "ana", "password": "secret123"})
    ```

    Cu `data=`, `TestClient` codifică body-ul ca formular. Dacă te uiți în `r.json()` la 422, vezi exact ce lipsește: `{"detail": [{"loc": ["body", "username"], "msg": "Field required"}, ...]}`.

    Dacă vrei neapărat login cu JSON, înlocuiești `OAuth2PasswordRequestForm` cu un model Pydantic propriu, dar pierzi compatibilitatea cu butonul *Authorize* din `/docs`.
- user: |
    Cum schimb algoritmul pe RS256?
  assistant: |
    RS256 e asimetric: semnezi cu o cheie privată și verifici cu cea publică. E util când mai multe servicii validează tokenurile, dar doar serviciul de autentificare trebuie să le poată emite.

    Generezi perechea de chei:

    ```bash
    openssl genrsa -out private.pem 2048
    openssl rsa -in private.pem -pubout -out public.pem
    ```

    Și schimbi configurarea:

    ```python
    ALGORITHM = "RS256"
    PRIVATE_KEY = Path(os.environ["JWT_PRIVATE_KEY_FILE"]).read_text()
    PUBLIC_KEY = Path(os.environ["JWT_PUBLIC_KEY_FILE"]).read_text()

    # la emitere
    jwt.encode(to_encode, PRIVATE_KEY, algorithm=ALGORITHM)
    # la verificare
    jwt.decode(token, PUBLIC_KEY, algorithms=[ALGORITHM])
    ```

    Cheia privată o montezi ca Secret (în Kubernetes) și nu o pui niciodată în imagine. Cheia publică o poți expune la un endpoint JWKS (`/.well-known/jwks.json`), ca celelalte servicii să o descarce singure.
- user: |
    Mulțumesc, fă un rezumat al pașilor.
  assistant: |
    Rezumat:

    1. Parolele: bcrypt prin `passlib`, cu `get_password_hash` la înregistrare și `verify_password` la login.
    2. Tokenurile: `create_access_token(data, expires_delta)`, cu 15 minute implicit, `type` și `jti`; `create_refresh_token` cu 7 zile.
    3. Login: `POST /token` cu `OAuth2PasswordRequestForm` (formular, nu JSON).
    4. Rute protejate: dependența `get_current_user`, care decodează tokenul și tratează separat `ExpiredSignatureError`.
    5. Refresh: cookie httpOnly, `Secure`, `SameSite=strict`, restrâns la `/refresh`, cu rotație la fiecare folosire.
    6. Logout: revocarea refresh token-ului și blacklist pe `jti` în Redis, cu TTL.
    7. Teste: `TestClient`, cu `data=` pentru login.
    8. Opțional: RS256 cu pereche de chei, când mai multe servicii verifică tokenurile.
- user: |
    Revin după o săptămână: am pus API-ul în producție, în spatele lui nginx. E pentru o platformă de bilete la concerte, bilete.ro. Ce ar trebui să verific prima dată la partea de autentificare, acum că e live?
  assistant: |
    Felicitări pentru lansare. Pentru o platformă de bilete, unde conturile înseamnă bani reali, iată ce aș verifica, în ordine:

    1. **HTTPS-ul real.** Confirmă că nginx termină TLS și că `secure=True` pe cookie funcționează efectiv. Dacă FastAPI vede cererile ca HTTP (nginx face proxy pe port intern), setează `proxy_set_header X-Forwarded-Proto $scheme;` în nginx și `proxy_headers` / `--proxy-headers --forwarded-allow-ips` la uvicorn, altfel unele verificări de scheme pot greși.

    2. **Cheia secretă.** `SECRET_KEY` nu trebuie să fie în cod sau în imaginea Docker, ci în variabile de mediu dintr-un secret manager. Dacă a ajuns undeva în git, rotește-o acum — tokenurile existente expiră repede oricum.

    3. **Rate limiting pe `/token`.** Endpoint-ul de login e ținta principală de credential stuffing. Adaugă limitare în nginx (`limit_req_zone`) pe IP, eventual și pe username. Pentru bilete, atacatorii testează liste de conturi furate exact înainte de vânzările la concerte populare.

    4. **Ce se întâmplă la vârf.** bcrypt-ul e lent intenționat: la un val de login-uri simultane (deschiderea vânzării pentru un concert), CPU-ul poate deveni blocajul. Fă un load test pe `/token` înainte de primul eveniment mare.

    5. **Loguri fără secrete.** Verifică că nu loghezi tokenuri, parole sau cookie-uri — în acces log-urile nginx, în traceback-uri, în Sentry.

    6. **Monitorizarea 401-urilor.** O creștere bruscă a 401 pe `/refresh` înseamnă fie rotație eșuată (bug), fie tokenuri furate în uz. Merită un alert.

    Primul din listă pe care l-aș rezolva *azi* e rate limiting-ul pe login: e cea mai probabilă ținătă imediată. Vrei să-ți arăt configurația `limit_req` pentru nginx?
- user: |
    Vreau ca tokenurile să aibă și aud și iss, ca să nu poată fi folosite de alte servicii de-ale noastre. Cum modific create_access_token și verificarea?
  assistant: |
    Adaugi claim-urile la emitere și le verifici la decode. În `security.py`:

    ```python
    ISSUER = "bilete.ro"          # cine a emis tokenul
    AUDIENCE = "bilete.ro/api"    # pentru cine e destinat


    def create_access_token(data: dict, expires_delta: timedelta | None = None) -> str:
        to_encode = data.copy()
        expire = datetime.now(timezone.utc) + (expires_delta or ACCESS_TOKEN_EXPIRE)
        to_encode.update({
            "exp": expire,
            "iss": ISSUER,
            "aud": AUDIENCE,
        })
        to_encode.setdefault("type", "access")
        to_encode.setdefault("jti", str(uuid4()))
        return jwt.encode(to_encode, SECRET_KEY, algorithm=ALGORITHM)


    def create_refresh_token(username: str) -> str:
        return create_access_token(
            {"sub": username, "type": "refresh"}, expires_delta=REFRESH_TOKEN_EXPIRE
        )
    ```

    Și la verificare, în `get_current_user` și în `/refresh`:

    ```python
    payload = jwt.decode(
        token,
        SECRET_KEY,
        algorithms=[ALGORITHM],
        issuer=ISSUER,
        audience=AUDIENCE,
    )
    ```

    Cum funcționează:

    - `jwt.decode` respinge tokenul dacă `iss` nu corespunde sau dacă `aud` nu e în lista de audiențe acceptate (ridică `JWTError`, deci e prins deja de `except JWTError`).
    - Un alt serviciu al vostru, de exemplu `notificari.bilete.ro`, emite tokenuri cu `aud: "bilete.ro/notificari"`. Dacă cineva încearcă să-l folosească pe API-ul de bilete, decode-ul eșuează, chiar dacă semnătura e validă.
    - Dacă un serviciu e destinatar pentru mai multe audiențe, poți trece o listă: `audience=["bilete.ro/api", "bilete.ro/notificari"]`.

    Două observații:

    - Am scos `type` din `update` și am pus `setdefault`, corectând problema de care vorbeam: refresh tokenul își păstrează acum `type: refresh`.
    - Dacă treci pe RS256 mai târziu, `iss` devine și mai util: fiecare serviciu poate avea propriul `iss` cu chei diferite în JWKS.
