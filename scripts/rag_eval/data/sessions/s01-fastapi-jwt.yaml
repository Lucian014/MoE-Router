    - Cheile RSA 2048 se generează în ~100 ms, deci fixture-urile fără `scope="session"` sunt ok; dacă ai zeci de teste, pune `scope="session"` pe fixture-uri ca să le generezi o dată.
    - Adaugă și un test pentru **fingerprint-ul cheii de semnare** — cel pe care l-am pus în log la pornire: asigură-te că fingerprint-ul logat corespunde cheii private configurate, e verificarea ta de primă linie la deploy.
