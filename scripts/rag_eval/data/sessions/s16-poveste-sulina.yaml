    Iată lista completă a personajelor, cu tot ce s-a stabilit despre ele în text:

    **Personaje principale**

    **Avdei** — paznicul farului de la Sulina, bătrân, de origine lipovenească. Se trezește de cincizeci de ani "înainte de cocoș"; mâinile îi tremură doar dimineața. Nu are ceas de treizeci de ani — "farul e ceasul meu". Aprinde lumina din obicei, deși navele se ghidează din sateliți. Fratele lui mai mic, Fiodor, a dispărut pe mare acum patruzeci de ani, într-o noapte în care Avdei, certat cu el pentru o plasă ruptă, nu a aprins lumina farului — vinovăția centrală a poveștii. A tăcut toată viața despre Fiodor; nici Irina nu știa că a existat. Are o relație fragilă cu fiica lui (mama Irinei). În noaptea furtunii iese pe mare cu barca găsită, urmărește lumina, atinge "ceva cald" și se întoarce în zori — eliberat, cu ceasul care merge înainte.

    **Irina** — nepoata lui Avdei, din Tulcea, tânără (a crescut, "e mai înaltă decât anul trecut"). Vine în vizită cu rucsac verde și fular purtat "ca să pară că a venit departe". Zice "poate" când vine. Are o privire "care citește" — ea descoperă fotografia și inscripția lui Fiodor și leagă ceasul de ora trei și jumătate. E puntea dintre generații și singura căreia Avdei i se deschide parțial. Dormea șezând la masă în noaptea furtunii, așteptându-l. Mama ei (fiica lui Avdei) e menționată doar tangențial — "vorbiră puțin și repede, ca peste o punte putredă".

    **Fiodor** — fratele mai mic al lui Avdei (cu patru ani), dispărut pe mare acum patruzeci de ani, toamna târziu. În fotografia din 1961 e cel care râdea cu toată gura, cu picioarele în aer pe marginea bărcii. A scris pe spatele fotografiei: *"F. — barca mea, marea mea. Cine mă caută, să caute la trei și jumătate."* Căutarea după dispariție durase opt zile; s-a găsit doar o vâslă "la Vădan". În final, prezența lui rămâne ambiguă: lumina pe apă, urmele desculț în nisip, barca plecată. Nu apare direct — e totuși motorul întregii povești.

    **Personaje secundare / menționate**

    **Cazacu** — pescar local; "nu iese în ceața asta". Menționat de Avdei când inventariază bărcile cunoscute.

    **Sava** — alt pescar local; luntrea lui "n-o mai scoate din șantier de trei ani".

    **Turcii de la pescărie** — menționați o singură dată, tot în inventarul bărcilor; dau culoare comunității din Sulina.

    **Tatăl lui Avdei și Fiodor** — mort "de mai bine de jumătate de veac"; apare doar ca voce în amintire: *"motorul e ca un cal, frate, simte când te temi."* Sursa învățăturilor practice ale fraților.

    **Mama fraților** — apare indirect prin două obiecte: "oglinda de la masa mamei" (semnul apei primejdioase) și, implicit, în fraza despre frații îngropați lângă părinți (varianta de final discutată, neintrată încă în text).

    **Mama Irinei (fiica lui Avdei)** — nenumită; relația cu tatăl ei e ruptă sau răcită. E terenul nespus al poveștii — un fir deschis, dacă vrei să-l dezvolți într-o eventuală revizuire.

    **Observație:** povestea e construită economic — doar trei personaje pe pagină, restul sunt contururi. Dacă pentru concurs ți se cere o listă mai bogată, putem fie să dezvoltăm mama Irinei într-o scenă (o telefonare?), fie să lăsăm așa — economia de personaje e o calitate, nu un defect, la o povestire de 3000 de cuvinte.
