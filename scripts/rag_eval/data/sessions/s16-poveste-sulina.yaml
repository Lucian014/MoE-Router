    **Capitolul I**

    Avdei se trezi înainte de cocoș, cum se trezise de cincizeci de ani. Nu era ceas care să-l scoată din somn — era lumina. În Deltă, lumina de dimineață are o vârstă a ei, iar el o știa pe toate: cea de mai, verde și mlădioasă, cea de august, arsă și albă, cea de octombrie, care intra prin fereastra farului ca printr-o sită de paie. Aceea de azi era subțire, gri, de sfârșit de toamnă, și se lipea de pleoape ca o ceață.

    Se ridică, își puse puloverul de lână — degetele îi tremurau puțin, dar numai dimineața, asta își spunea mereu, numai dimineața — și porni scara de piatră în jos, spre mal. Farul de la Sulina nu mai era ce fusese. De când navigația se ghida din sateliți, de când navele treceau pe lângă el ca pe lângă un bătrân surd, Avdei aprindea lumina mai degrabă din obicei decât din datorie. Dar o aprindea. Un om trebuie să-și aprindă lumina, îi spunea uneori nepoatei, Nastya, la telefon. Chiar dacă nimeni nu se mai uită la ea. Chiar dacă nimeni nu mai e pe apă noaptea.

    Malul era acoperit cu o ceață joasă, care nu se ridica, ci ședea pe apă ca o pasăre cenușie adormită. Avdei porni în pasul lui de fiecare dimineață, spre stâncile de unde privea fluviul, și abia după câțiva pași observă că ceva nu se potrivea. Un sunet. Un scârțâit ușor, ritmic, de lemn care se lovește de lemn.

    Opri. Ascultă.

    Ceața se deschise încet, ca o cortină trăgată de o mână obosită, și din ea ieși barca.

    Era o barcă mică, de pescuit, cu fundul vopsit în albastru spălăcit, legată de țărm cu o frânghie scurtă. Nu o cunoștea. În Deltă, Avdei cunoștea toate bărcile de pe opt kilometri de mal — pe ale lui Cazacu, pe ale turcilor de la pescărie, pe luntrea veche a lui Sava, care n-o mai scoate din șantier de trei ani. Aceasta nu era niciuna dintre ele. Ședea pe apă cu o răbdare străină, goală, și se legăna ușor, de parcă tocmai își luase rămas-bun de la cineva.

    — Heeei! strigă Avdei, și glasul îi pără mai slab decât de obicei. Heeei, pe barcă!

    Nimeni. Doar pescărușii, care se ridicară de undeva din stuf și se întoarseră imediat, ca și cum ar fi vrut să vadă și ei.

    Avdei coborî pe nisipul ud, își luă pantofii în mână — nu, de ce, gândi el, la vârsta mea — și se apropie de barcă ținându-se de frânghie. Înăuntru era curat. Prea curat pentru o barcă pierdută: fără plasă, fără cârlige, fără găleată. Doar pe fundul de lemn, lângă bancă, ședea un ceas de buzunar.

    Îl luă în palmă. Era greu, de alamă, cu capacul ciobit la balamauă. Îl deschise cu unghiul, cum deschideai cândva cutiile de conserve, și capacul scârțâi un sunet vechi, de altă vreme. Cadranul era alb, cu cifre negre, subțiri ca firele de păr. Limba mare și limba mică ședeau una peste alta, nemișcate, arătând ora trei și jumătate.

    Avdei scutură ceasul, deși știa că nu se face așa. Îl apropie de ureche. Nimic. Un ceas mort, oprit de mult — mecanismul era plin de o liniște pe care o simțea prin palmă, ca pe o pasăre rece.

    Ora trei și jumătate. Zi sau noapte? De când? De aseară, de acum o săptămână, de acum un an?

    Rămase așa, în picioare în apă rece până la glezne, cu ceasul în mână deschisă, și privi barca. Ceața se închidea iar în spatele ei, peste fluviu, iar undeva, departe, se auzea un motor de barjă — un sunet pe care Avdei îl cunoștea din copilărie și care acum i se părè, pentru prima oară în viață, un sunet de lume care pleacă.

    Își dădu seama că stă de mult. Că apa îi înghețase picioarele. Își puse ceasul în buzunarul de la piept, acolo unde bătrânii țin ceasurile, și se întoarse spre far, fără să mai privească înapoi.

    Nu-i plăcea ce simțea. Nu frică — ceva mai vechi. Ceva ce seamăna cu datoria.
