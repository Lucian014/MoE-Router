    În noaptea aceea, Avdei nu dormi.

    Nu din cauza ceasului — își spuse el —, ci din cauza vântului, care se răsuci dinspre fluviu și bate în geamul farului cum bate un om care are treabă. Se ridică la miezul nopții să aprindă lumina, deși o aprinsese deja, și pe drum, în bucătărie, trecu pe lângă masă și se opri.

