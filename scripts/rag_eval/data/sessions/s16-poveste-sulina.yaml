    *Lasă-l în pace, Avdei.*

    Dar mâna îl luă. Și Avdei văzu — mai întâi nu crezu, apoi văzu limpede, cum vezi un pește sub apă limpede — limba mare a ceasului mișcându-se. Înapoi. Încet, cu răbdare, cum coboară un om treptele pe care le-a urcat toată ziua. Două și jumătate. Două și douăzeci și cinci. Două și douăzeci.

    Ținu ceasul în palmă și privi, și nu-i veni să-l pună jos. *Bătrânețe, Avdei. Ochii tăi. Lumina asta proastă.* Aprinse lampa de pe masă, o apropie, privi din nou. Limba mergea înapoi, netedă, fără să se clatine, ca și cum n-ar fi făcut altceva toată viața.

    Îl puse pe masă, îndepărtă mâna, șterse mâna de haine. Ședea pe scaun și privi ceasul cum privești un om care vorbește singur în camera lui. La un moment dat, limba se opri. Trei și jumătate. Și nemișcare.

    *Noaptea merge înapoi. Ziua stă. Și se oprește tot la trei și jumătate.*

    Nu-i spuse nimănui. Cu cine, gândi el. Cu Sava, care ar râde? Cu Cazacu, care ar veni cu băutură și ar sta până dimineața, și dimineața ceasul ar sta cuminte, și toți ar râde de bătrânul Avdei care nu mai vede drept? *Un om care vede lucruri trebuie să ștă să tacă. Altfel nu mai e om care vede, e om de care se tem.*

    A doua zi, spre prânz, auzi motorul bărcii de la Tulcea și o văzu pe Nastya coborând pe mal, cu rucsacul verde și cu fularul de care nu avea nevoie, dar îl purta ca să pară că a venit departe. Era mai înaltă decât anul trecut, sau el se făcuse mai mic.

    — Bunicule, spuse ea, și-l îmbrățișă, și el simți în îmbrățișare mirosul orașului — autobuz, asfalt, altă viață.

    — Ai venit, spuse el. Zisesei "poate".

    — Am zis "poate" ca să nu te aștepți. Așa se face.

    Îi făcu mâncare, vorbiră de lucruri mici — de mama ei, despre care vorbiră puțin și repede, ca peste o punte putredă —, iar Avdei uitase de ceas. Îl uitase atât de bine, încât când Nastya spuse "Ce e ăsta?" el nu înțelese întâi la ce se referă.

    Ea îl luase de pe masă. Îl ținea în palmă, cu capacul deschis, și privirea ei nu mai era a copilului care venise în fiecare vară până nu demult. Era privirea care citește.

