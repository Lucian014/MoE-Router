- user: |
    Would DuckDB or polars help here? I'd rather not rewrite the whole pipeline.
  assistant: |
    Yes, and you can adopt either surgically — just for the merge — without touching the rest of the pipeline.

    **DuckDB** is the least invasive. It queries pandas DataFrames directly and handles the join out-of-core, so even a bad key ratio won't allocate 11 GiB in RAM:

    ```python
    import duckdb

    con = duckdb.connect()
    matched = con.execute("""
        SELECT a.*, b.order_id AS shopify_order_id, b.amount_net AS amount_net_shopify
        FROM a JOIN b
          ON a._email = b._email AND a._day = b._day
         AND abs(a.amount_net - b.amount_net) <= 0.01
    """).df()
    ```

    It also gives you a free sanity check on the key ratio before joining:

    ```sql
    SELECT _email, _day, count(*) FROM b GROUP BY 1, 2 ORDER BY 2 DESC LIMIT 10
    ```

    **Polars** would also work — its join with `engine="streaming"` spills to disk — but it means converting frames in and out (`pl.from_pandas(...)` / `.to_pandas()`), which copies data and adds a second API to the codebase. Worth it only if you later want to move the whole pipeline over.

    My suggestion: keep pandas for everything you have, use DuckDB for this merge and for any future heavy joins or aggregations on the combined data. The two interoperate well — DuckDB can also read the Parquet files you're already writing, and the result comes back as a normal DataFrame that feeds `validate()` and the Excel export unchanged.

    One caveat: DuckDB won't fix a wrong key. If blank emails slip through, the SQL join will still match garbage to garbage — just without running out of memory. Keep the filtering and the review list from before.
