- user: |
    Some Shopify orders have Financial Status "refunded" or "partially_refunded". How should those count in the monthly revenue?
  assistant: |
    The standard treatment, and what finance will usually expect:

    - **`paid` / `partially_paid`** → count, minus the refunded amount;
    - **`refunded`** → exclude entirely (net revenue is zero);
    - **`pending` / `voided` / `authorized`** → exclude; the money isn't settled, and it will appear in a later export once paid.

    So revenue is net of refunds, not gross:

    ```python
    status = df["financial_status"].str.lower()
    df["amount_net"] = df["amount"].where(status != "refunded", 0.0) - df["refunded_amount"].fillna(0)
    ```

    Two things to check before trusting `refunded_amount`:

    1. Whether it's per order or per line item — if the export has one row per line item, the refund may be repeated on each row and you'd subtract it twice. Verify on a known refunded order.
    2. Timing: a refund usually lands in a different month than the sale. If finance reports revenue when the sale happened, subtract the refund in the sale's month (what the code above does); if they report cash flow, it belongs in the refund's month. Ask which one they want — it changes the monthly numbers, and it's their call, not yours.

    Whatever you decide, record it in `validate()` as an assertion (e.g. no negative `amount_net`) so a data change can't silently break the rule.
