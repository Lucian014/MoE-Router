    Two levels, both offline:

    **1. Regex per country** — each country has a fixed format (prefix + length, sometimes letters in fixed positions):

    ```python
    VAT_PATTERNS = {
        "RO": r"^RO[0-9]{2,10}$",
        "DE": r"^DE[0-9]{9}$",
        "FR": r"^FR[A-Z0-9]{2}[0-9]{9}$",   # 2 chars can be letters
        "HU": r"^HU[0-9]{8}$",
    }

    def vat_format_ok(vat_id: str, country: str) -> bool:
        if pd.isna(vat_id):
            return False
        vat_id = vat_id.strip().upper().replace(" ", "")
        pattern = VAT_PATTERNS.get(country)
        return bool(pattern) and re.match(pattern, vat_id) is not None
