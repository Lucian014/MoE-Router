    - the `bad_lines` dumps from the CSV loader,
    - the cross-source `matched` review CSV you sent finance,
    - backups of all of the above.

    The Excel summary is safe: it's aggregated, no emails.

    **2. Rewrite the Parquet files in place:**

    ```python
    from pathlib import Path
    import pandas as pd

    TARGET = "ana.pop@example.com"   # normalise: lower, strip

    def erase_email(path: Path, email: str) -> int:
        df = pd.read_parquet(path)
        if "customer_email" not in df.columns:
            return 0
        mask = df["customer_email"].str.strip().str.lower() == email
        if not mask.any():
            return 0
        df.loc[mask, "customer_email"] = None
        df.to_parquet(path, index=False)          # overwrite
        return int(mask.sum())
    ```

    Note the match is on the normalised form — the same normalisation the merge uses, or you'll miss rows where the customer typed their address differently. If you want to keep the row joinable for support purposes, replace with a random token instead of `None` and store the mapping separately (that makes it pseudonymisation, and the mapping file itself becomes personal data you hold).

    **3. Raw CSVs and logs.** If you must keep the original CSVs for audit, extract and delete just the email there too — or, simpler and defensible: delete the raw files entirely. The cleaned Parquet is your artifact of record; keeping raw inputs "just in case" is how companies fail erasure requests. Same for `bad_lines` dumps and the `matched` CSV — grep them for the address and rewrite or delete.

    **4. Backups.** This is the awkward one: old backups still contain the email, and restoring one would restore it. You can't surgically edit a tarball. Standard practice: document in your response to the customer that backups age out on schedule (say, 35 days) and the data is erased in the *live* systems; most regulators accept this. Make sure the erasure is re-applied if a backup is ever restored — write it into the restore runbook.

    **5. Going forward.** This request will come again. Two cheap preparations:

    - Add an `erase_customer(email)` function to the pipeline that walks the output directory, so next time it's one command, not an archaeology project.
    - Consider storing emails hashed (SHA-256 of the normalised address) in the Parquet from the start. Deduplication and the cross-source merge still work (hash the join key on both sides), and erasure becomes trivial — though note the hash of a known email is reversible by trial, so salt it and keep the salt in a separate, access-controlled place.

    **6. Document it.** Record what was deleted, when, from which files, and who approved the "keep financials, drop identity" decision. If the regulator ever asks, that record *is* your compliance.
- user: |
    Summarize every decision we made since the Shopify export arrived.
  assistant: |
    ## Decision log — from the Shopify integration onward

    **Schema & loading**
    1. Shopify export is adapted to the ERP schema via a `load_shopify()` adapter, not by editing the pipeline.
    2. Order ids get a `SHOPIFY-` prefix to avoid collisions with ERP ids.
    3. Timestamps are converted to UTC, then tz-stripped — one convention across both sources.
    4. Column names are normalised to snake_case at load time; all downstream code references normalised names only.
    5. Pre-March 2026 exports lack `Refunded Amount` / `Financial Status`: missing columns are filled at load time (`0.0` / `"paid"`), and the gap is documented rather than hidden.

    **Refunds (business rule, agreed with finance)**
    6. Fully refunded orders are excluded entirely; partially refunded ones count as `Total − Refunded Amount`.
    7. Refunds are attributed to the *sale's* month, not the refund's month.
    8. Refund exclusion happens by `order_id`, not by status row-by-row (partially refunded orders span multiple rows).
    9. `validate()` asserts no negative `amount_net` — this doubles as a guard against double-subtracted refunds.

    **Cross-source merge**
    10. Matching key: normalised email + calendar day + amount within ±0.01 — a heuristic, reviewed by finance on first run, not blind truth.
    11. Blank emails are excluded *before* the merge and kept as unmatched, never silently dropped.
    12. The merge runs in DuckDB (pandas cross-product blew 11 GiB); pandas everywhere else. Dtypes are restored explicitly on the way back to pandas.
    13. Shopify line-item rows are aggregated to one row per order before matching.

    **Currency & rounding**
    14. Rates: last published rate on or before the order date (`merge_asof backward`); previous year's rate file is always loaded so 1 January orders have history.
    15. Rounding is half-up, implemented manually — pandas' banker's rounding disagreed with finance by one cent.

    **VAT**
    16. `amount_eur` is treated as gross (inclusive); `net = gross / (1+rate)`, `vat = gross − net`, so `net + vat == gross` exactly.
    17. Reverse charge (B2B with valid VAT ID) = 0%. VAT IDs validated offline (format + checksum via `python-stdnum`), VIES only for flagged cases.
    18. Unknown countries fail validation — no silent 0% default.

    **Delivery & retention**
    19. Finance receives `sales_detail.parquet` (artifact of record) + a small Excel summary (country × month). No order-level Excel files — the 48 MB xlsx killed that.
    20. Order counts in the summary use `nunique`, not row counts.
    21. GDPR erasure: financial rows are kept (tax law), emails are removed from live files; raw inputs and logs are deleted rather than archived; backups age out on schedule and this is documented.

    **Process**
    22. Every business rule above is pinned by a pytest test; a failing test after a change means the change is wrong, not the test.
    23. `validate()` is the gate: the script exits non-zero rather than exporting a frame that fails a check.
