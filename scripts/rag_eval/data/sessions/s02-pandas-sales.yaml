    # convert.py
    import pandas as pd

    def convert_to_eur(orders: pd.DataFrame, rates: pd.DataFrame) -> pd.DataFrame:
        """Convert order amounts to EUR using the last published rate
        on or before the order date. Rates: columns date, currency, rate_to_eur."""
        rates = rates.sort_values("date")
        orders = orders.sort_values("order_date")
        out = pd.merge_asof(
            orders, rates,
            left_on="order_date", right_on="date",
            by="currency", direction="backward",
