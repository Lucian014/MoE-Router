    ## Pipeline overview

    This document explains what `clean.py` does, in order, and why. If you're here because something failed at 3 a.m., check the **Known failure modes** section first.

    ### Inputs

    | File | Source | Notes |
    |---|---|---|
    | `sales.csv` | ERP export, ~2M rows | Columns: `order_id, order_date, customer_email, country, amount, currency`. Malformed lines are captured, not dropped. |
    | `shopify_*.csv` | Shopify export | Different column names; adapted by `load_shopify()`. Pre-March 2026 files lack `Refunded Amount` — handled at load. |
    | `ecb_rates_YYYY.csv` | ECB daily rates | Long format: `date, currency, rate_to_eur`. Load the previous year's file too — orders on 1 January need a fallback rate. |

    ### Steps, in order

    1. **Load & normalise columns.** Both sources are renamed to snake_case at load time. Shopify order ids get a `SHOPIFY-` prefix to avoid collisions with ERP ids. Timestamps are converted to UTC, then tz-stripped, so both sources are comparable.

    2. **Country normalisation.** Raw values ("Romania", "ROMANIA", "România") are mapped to ISO codes via `COUNTRY_ALIASES`. The mapping is applied to `unique()` values only, for speed. Anything unmapped shows up in `validate()` — extend the alias table, don't drop the rows.

    3. **Currency conversion** (`convert_to_eur`). `merge_asof` with `direction="backward"`: each order gets the last published rate on or before its date, which handles weekends and TARGET holidays. EUR orders get rate 1.0. Rounding is half-up (not pandas' default banker's rounding) — finance requires this; see `test_rounding_half_up`.

    4. **Refunds (business rule, agreed with finance 2026-03).** Fully refunded orders are excluded entirely. Partially refunded orders count as `Total − Refunded Amount`. Refunds are attributed to the *sale's* month, not the refund's month. If finance changes this rule, update `clean_shopify.py` and the tests together.

    5. **Deduplication.** Same `order_id` with near-identical timestamps = export artifact; keep the first. If amounts differ, it's a correction — kept and logged, not dropped.

    6. **Cross-source merge.** ERP and Shopify orders are matched on email + day + amount (±0.01) via DuckDB (a pandas merge blew memory on this — see git history). Blank emails are excluded *before* the merge and kept as unmatched. Matches are a heuristic; the first run's match list was reviewed by finance.

    7. **VAT split.** `net_amount = gross / (1 + rate)`, `vat_amount = gross − net`, so the identity `net + vat == gross` holds exactly. Reverse charge (B2B, valid VAT ID) = 0%. VAT IDs are validated offline (format + checksum via `python-stdnum`), not via VIES. Unknown countries fail validation rather than defaulting to 0%.

    8. **Validation** (`validate()`). The script exits non-zero if any check fails. **Do not bypass this to get the file out.** Every check here exists because that failure already happened once.

    9. **Export.** `out/sales_detail.parquet` (full detail, artifact of record) and `out/revenue_summary.xlsx` (one row per country × month). No order-level Excel files — a 48 MB xlsx was sent once and finance laptops froze.

    ### Scheduling

    Nightly at 02:30, Kubernetes CronJob `sales-clean`, `concurrencyPolicy: Forbid`. Failures go to Slack. Exit code 1 = validation failed; 2 = crash.

    ### Known failure modes

    - **NaN rates on 1 January** → you forgot to load the previous year's rates file.
    - **`KeyError: 'refunded_amount'`** → pre-March Shopify export; the loader handles this, so it means the loader was bypassed.
    - **Merge allocating gigabytes** → blank emails got through the filter. Check before investigating anything else.
    - **Validation fails on "no VAT rate for"** → new country appeared in sales. Add it to `VAT_RATES` *after* confirming the rate with finance — don't guess.
    - **1-cent differences vs. finance reports** → rounding convention. Ours is half-up, implemented manually; pandas `.round()` is banker's rounding and will not match.

    ### Running tests

    ```bash
    pytest tests/ -v
    ```

    The rounding, holiday, and refund tests encode decisions finance made explicitly. If one of them fails after your change, the change is probably wrong — not the test.
