    Revin cu articolele pentru newsletter-ul asociației. Rezumă-mi-l pe ăsta în 5 propoziții:

    Pompele de căldură au fost multă vreme considerate o soluție pentru case, nu pentru blocuri. Un proiect-pilot derulat în ultimii doi ani la Cluj-Napoca arată că lucrurile se pot schimba. În cartierul Mănăștur, 120 de apartamente dintr-un bloc construit în 1978 au fost trecute de pe centrala de cvartal pe pompe de căldură aer-apă, montate pe acoperiș și conectate la instalația existentă de calorifere. Inginerii au fost nevoiți să mărească suprafața unor calorifere, pentru că pompele lucrează eficient la temperaturi mai mici ale agentului termic, de 45–50 °C în loc de 70–80 °C. Coeficientul de performanță mediu pe sezonul rece, COP, a fost de 3,2, ceea ce înseamnă că pentru fiecare kilowatt-oră de electricitate consumată blocul a primit în medie 3,2 kilowați-oră de căldură. În lunile cele mai reci, cu temperaturi sub minus 10 °C, COP-ul a scăzut la 2,1, iar o rezistență electrică de rezervă a intrat în funcțiune în 9 zile din toată iarna. Factura medie la încălzire a scăzut cu 38% față de iarna dinaintea proiectului, deși prețul energiei electrice a crescut în aceeași perioadă. Investiția totală a fost de 2,1 milioane de lei, finanțată în proporție de 60% din fonduri europene, iar restul de asociația de proprietari, printr-un credit pe 10 ani. Autorii studiului avertizează că rezultatele nu se pot generaliza automat: blocul fusese anvelopat cu cinci ani înainte, iar fără izolație termică pierderile ar fi făcut pompele mult mai puțin eficiente. Primăria analizează acum extinderea programului la alte 14 blocuri din cartier.
