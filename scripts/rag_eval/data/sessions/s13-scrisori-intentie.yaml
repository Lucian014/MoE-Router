- user: |
    Give me a final checklist I can use to proofread any cover letter before sending it.
  assistant: |
    Here's a checklist you can reuse for every cover letter:

    ## Content

    - [ ] **Company name spelled correctly** — the #1 cover letter killer. Check it appears correctly everywhere (Nordwind vs. Nordwind Analytics, etc.). Search-and-find the old company name if you adapted the letter from a previous one
    - [ ] **Job title matches the ad exactly** — "Junior Data Analyst," not "Data Analyst" or "Junior Analytics Role"
    - [ ] **The role's key requirements are addressed** — go back to the job ad and tick off the top 3–4 requirements against your letter
    - [ ] **At least one concrete, quantified achievement** — a number, a timeframe, a result (e.g., "3 days to 4 hours")
    - [ ] **No leftover placeholders** — search for brackets `[ ]`, "Company Name," "Hiring Manager," etc.
    - [ ] **No contradictions with your CV or other applications** — dates, locations, skills
    - [ ] **Location/relocation statement is accurate** for *this* job

    ## Tone and language

    - [ ] **Read it aloud once** — you'll catch awkward phrasing instantly
    - [ ] **No clichés** — "I am writing to express my interest," "passionate about," "team player," "dynamic"
    - [ ] **Every sentence earns its place** — cut anything that would also be true for 100 other applicants
    - [ ] **Consistent voice** — not stiff in one paragraph and casual in the next
    - [ ] **Confident but not arrogant** — no "I am the ideal candidate," but no apologizing either ("unfortunately," "I only," "just")

    ## Mechanics

    - [ ] **Word count within any stated limit** — check the portal or ad for requirements
    - [ ] **Spelling and grammar check run** — but read it yourself too; tools miss "manger" for "manager"
    - [ ] **Names spelled right** — company, hiring manager, your own name (check the signature!)
    - [ ] **Correct title for the recipient** — Dr., Ms., Mr., or a safe neutral greeting if unsure
    - [ ] **File named professionally** if attaching — `Andrei_Muresan_Cover_Letter.pdf`, not `letter_final_v3.pdf`
    - [ ] **PDF format** unless they ask otherwise

    ## Final checks

    - [ ] **Attachment actually attached** — test by opening the sent draft or double-checking before hitting send
    - [ ] **Recipient email address correct** — no autocomplete disasters
    - [ ] **Subject line clear** if it's an email — include the role title
    - [ ] **The 24-hour rule when possible** — if the deadline allows, sleep on it and reread once in the morning; you'll always find something

    The three that catch the most errors in practice: **read aloud**, **search for the old company name**, and **check the attachment**. Those account for most cover letter embarrassments.
