- user: |
    I don't have any NHS data experience. How do I address that without sounding weak?
  assistant: |
    The key is to frame it as "adjacent experience + fast learning" rather than apologizing for a gap. A few principles:

    **1. Never lead with the negative.** Don't open with "I don't have NHS experience." Lead with what you *do* have, and address the gap only if the ad explicitly requires it (yours says "strong plus," not required — so you can even skip it).

    **2. Use the "closest equivalent" move.** Point to the most transferable thing you've done and let the reader draw the conclusion:

    > "My thesis involved working with patient-level clinical data, including the quirks of real-world health records — coding inconsistencies, missing entries, and the ethical handling of sensitive information. I'd expect HES and SUS to have their own learning curve, but the fundamentals of messy clinical data are familiar territory."

    This says "I've done something harder than learning a new dataset" without claiming expertise you don't have.

    **3. Show you've already started.** Even a small step kills the weakness instantly:

    > "I've started familiarizing myself with NHS data structures through the publicly available HES documentation and open datasets, and I'm looking forward to working with the real thing."

    Only say this if you actually spend a weekend doing it — it's genuinely doable, since NHS Digital publishes documentation and sample data.

    **4. Reframe what "junior" means.** For a junior role, they're hiring trajectory, not a finished product:

    > "What I bring is a proven ability to get up to speed on new domains quickly — I went from logistics outsider to building the reporting tools the operations team depends on, and I'd expect to do the same with NHS data."

    **What to avoid:**
    - "Unfortunately, I don't have..." or "Although I lack..." — these words make the reader's brain file you under "weak"
    - Over-explaining — one sentence on the gap, then move on
    - Claiming familiarity you don't have — if interviewed, it'll unravel fast

    Honestly, for your Calder Health letter, the current line ("I haven't worked with NHS data yet, but...") is already fine. If you want it stronger, swap in option 2 or 3 above.
