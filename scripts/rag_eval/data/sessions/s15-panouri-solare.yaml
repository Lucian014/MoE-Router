    **Bottom line**: Quote A goes from ~130% coverage to ~80% coverage with a 3,000 kWh heat pump — still leaving you with an electricity bill of only ~1,500 lei/year instead of ~8,600. That's a good outcome, not a failure. Just don't buy more panels until the heat pump's real consumption is known.
