- user: |
    What's the difference between on-grid, off-grid and hybrid systems?
  assistant: |
    These three terms describe how a solar system relates to the grid — and they matter for what happens during a power cut and how batteries fit in.

    **On-grid (grid-tied)**
    - The standard setup: panels + inverter, connected to the public grid
    - Surplus goes to the grid (credited via net metering); when panels produce nothing, you draw from the grid
    - **No battery**
    - **Critical limitation**: it shuts down completely during a power outage (anti-islanding safety), even on a sunny day. Your panels are useless in a blackout
    - Cheapest option — this is what both your original quotes were

    **Off-grid**
    - Completely disconnected from the grid: panels + battery bank + a special off-grid inverter
    - The battery is essential, not optional — it carries you through nights and cloudy periods
    - Usually sized with generous panel capacity and often a backup generator for winter
    - **No net metering, no selling surplus** — everything you produce, you must use or store
    - Makes sense only where grid connection is absent or prohibitively expensive (remote cabins, mountain properties). For a house in Cluj with grid access, it's the wrong choice: expensive, complex, and you'd oversize everything to survive the worst winter week

    **Hybrid**
    - Grid-connected *plus* a battery, with a hybrid inverter that manages three energy flows: panels, battery, grid
    - Normal operation: solar powers the house, surplus charges the battery, then excess goes to the grid
    - **During an outage**: the system can disconnect from the grid and keep powering your home from panels + battery (with the right backup hardware)
    - You keep net metering benefits AND gain self-consumption and backup
    - Most expensive option, since it includes the battery

    **Quick comparison**

    | | On-grid | Hybrid | Off-grid |
    |---|---|---|---|
    | Grid connection | Yes | Yes | No |
    | Battery | No | Yes | Yes (essential) |
    | Works in outage | No | Yes (with backup hardware) | Yes |
    | Net metering | Yes | Yes | No |
    | Cost | Lowest | Middle–high | Highest |

    **Where you fit**

    Your decision to ask for a hybrid inverter is the smart middle path: you're installing an **on-grid system now** (no battery, full net metering benefit) but with a **hybrid inverter**, so adding a battery later converts it to a true hybrid system without replacing the inverter. That's exactly the "buy the option, don't pay for the battery yet" strategy — the grid remains your free storage until net billing rules or your needs change.
