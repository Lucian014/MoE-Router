- user: |
    What's the difference between monocrystalline and polycrystalline solar panels?
  assistant: |
    Monocrystalline and polycrystalline solar panels differ mainly in how their silicon cells are made, which affects efficiency, appearance, and cost.

    **Monocrystalline**
    - Made from a single, continuous silicon crystal, grown as a cylindrical ingot and sliced into wafers
    - Higher efficiency (typically 18–23%), since the uniform crystal structure allows electrons to move more freely
    - Perform slightly better in low-light and high-temperature conditions
    - Uniform dark black color
    - More expensive to manufacture (some silicon is wasted cutting the ingots)
    - Often have a longer lifespan and better warranties

    **Polycrystalline**
    - Made by melting multiple silicon fragments together, so each cell contains many crystals
    - Slightly lower efficiency (typically 15–18%) due to grain boundaries impeding electron flow
    - Speckled, blue appearance
    - Cheaper to produce and buy, since the manufacturing process is simpler with less waste
    - Historically slightly less heat-tolerant, though the gap has narrowed

    **Practical takeaway**
    - If roof space is limited or you want maximum output per square meter, monocrystalline is usually worth the premium.
    - If you have plenty of space and want the lowest cost per watt, polycrystalline can be a good value.

    Note that the market has shifted heavily toward monocrystalline in recent years — manufacturing improvements have closed the price gap, and most new panels sold today (including higher-efficiency PERC and half-cut cell designs) are monocrystalline.
- user: |
    What does "kWp" mean on an installer's quote?
  assistant: |
    **kWp** stands for **kilowatt-peak** — it's the maximum power output a solar system can produce under ideal, standardized conditions.

    **What it means**
    - 1 kWp = 1,000 watts of peak capacity
    - It's measured under Standard Test Conditions (STC): 1,000 W/m² sunlight intensity, 25°C cell temperature, and a defined light spectrum
    - So a "4 kWp system" means the panels together are rated to produce 4 kW at peak

    **Important caveats**
    - Real-world output is usually lower than the kWp rating. Typical factors in the UK/Europe mean a 4 kWp system produces roughly 3,400–4,000 kWh per year, depending on location, orientation, and shading
    - Panels get hot in sunlight, which reduces output below the STC rating (typically by 10–15% on a warm sunny day)
    - The kWp figure tells you the system's *size*, not what it will actually generate day to day

    **Related terms you might see on the quote**
    - **kWh** — kilowatt-hour, the actual energy produced or consumed (what your electricity bill uses)
    - **kW** — instantaneous power, without the "peak" qualifier

    **Rule of thumb**: to estimate annual generation, multiply the kWp by your region's typical "yield factor" — roughly 850–1,100 kWh per kWp per year in the UK, or 1,000–1,400+ in sunnier parts of Europe. Installers should provide a projected annual kWh figure, which is more useful for calculating savings and payback than the kWp alone.
- user: |
    Our roof faces south-east with a 35 degree pitch. Is that good for solar?
  assistant: |
    Yes, that's a good setup — better than many roofs.

    **Orientation: south-east**
    - Due south is ideal in the UK, but south-east captures roughly **95% of the output** of a due-south roof
    - You'll generate more in the morning and less in the late afternoon/evening — which can actually suit households that use more electricity earlier in the day
    - Anything from south-east to south-west is generally considered excellent; east and west lose around 10–20%

    **Pitch: 35 degrees**
    - The optimum pitch in the UK is around 30–40 degrees, so 35° is close to perfect for annual yield
    - Steeper roofs also shed dirt, leaves, and snow better, and stay cleaner in heavy rain

    **Combined effect**
    A south-east roof at 35° should achieve roughly **90–95% of the maximum possible yield** for your location. On a typical quote, this might show up as a small "orientation/pitch adjustment factor" of around 0.9–0.95.

    **Things that matter more than your orientation**
    - **Shading** — trees, chimneys, neighbouring buildings. Even partial shade on one panel can disproportionately reduce output unless the system uses optimisers or microinverters
    - **Roof space** — how many panels you can physically fit
    - **Your usage patterns** — using power when the panels generate (or adding a battery) affects savings more than a small orientation loss

    So no need to compromise on the roof choice — an installer's design and shading assessment will tell you the actual expected annual kWh, which is the number that really counts.
- user: |
    Roughly how much does a 5 kWp system produce per year in Cluj-Napoca?
  assistant: |
    In Cluj-Napoca, a 5 kWp system would typically produce around **5,500–6,300 kWh per year**.

    **The maths**
    - Cluj-Napoca gets roughly 1,100–1,250 kWh of generation per kWp installed per year (Romania has good solar resources, though Cluj in the northwest is a bit less sunny than the south of the country)
    - 5 kWp × 1,100–1,250 = **5,500–6,250 kWh annually**

    **Context for that figure**
    - The average Romanian household uses around 2,500–3,500 kWh per year, so a 5 kWp system could cover well over 100% of a typical home's consumption
    - Monthly output will vary a lot: expect roughly 700–800 kWh in peak summer months versus 150–250 kWh in December/January

    **Adjustments for your specific roof**
    - Your south-east orientation at 35° pitch would put you at roughly 90–95% of the theoretical maximum, so if anything, lean toward the middle or lower end of that range
    - Shading, panel placement, and whether you use optimisers will fine-tune the actual figure

    **Worth noting**
    - Any surplus can be fed into the grid — Romania has a net metering / prosumer scheme (though the terms have been changing, so ask your installer about the current rules)
    - A battery could help you self-consume more of your generation, especially given the seasonal and daily mismatch between production and typical evening usage

    Ask installers for a PVGIS-based or simulation-backed annual yield estimate for your exact roof — it should land somewhere in that 5,500–6,000 kWh range, and if it's dramatically different, it's worth questioning why.
- user: |
    What is an inverter actually doing?
  assistant: |
    An inverter converts the **direct current (DC)** electricity produced by solar panels into the **alternating current (AC)** that your home appliances and the grid use. But that's only part of the job — a modern solar inverter does several things:

    **1. DC-to-AC conversion**
    - Panels produce DC: electricity flowing in one direction at a voltage that varies with sunlight
    - Your home and the grid run on AC at 230V and 50 Hz (in Europe)
    - The inverter rapidly switches the DC input to create a smooth sine wave matching the grid's frequency and voltage exactly

    **2. Maximum Power Point Tracking (MPPT)**
    - Every panel combination has a "sweet spot" of voltage and current where power output is maximised — and it shifts constantly with light, temperature, and shading
    - The inverter's MPPT circuit continuously hunts for that sweet spot and keeps the panels operating there. Without it, you'd lose 20–30% of your output

    **3. Grid synchronisation and safety**
    - It matches the grid's voltage and frequency precisely so power can flow into it
    - If the grid goes down, it shuts off immediately (anti-islanding) — this protects engineers working on the lines. This is why standard solar systems don't keep your house powered during an outage unless you have a battery with backup capability

    **4. Monitoring and reporting**
    - It's the system's brain: tracking production, reporting to your monitoring app, and flagging faults

    **Types you'll encounter**
    - **String inverter** — one central unit for the whole array (most common, cheapest)
    - **Microinverters** — one small inverter per panel; better for shaded or multi-orientation roofs
    - **Hybrid inverter** — can also manage a battery, charging it from solar or the grid

    **Where it sits**
    Usually on a wall in a garage, loft, or outside — it's the box the installer mounts that isn't a panel or battery.

    One practical note: the inverter is the component most likely to fail over the system's life (panels often carry 25-year warranties; inverters typically 5–12 years), so check the warranty length and replacement cost on any quote.
- user: |
    String inverter or microinverters: which is better for a roof where a chimney shades part of it in the afternoon?
  assistant: |
    For a roof with partial afternoon shading from a chimney, **microinverters (or power optimisers) are the better choice**.

    **Why shading punishes string inverters**
    - In a string inverter setup, panels are wired in series — like old Christmas lights
    - The string's current is limited by the weakest panel. When the chimney shadow falls across even one panel, it can drag down the output of the *entire string*, not just the shaded panel
    - A small shadow on 10% of one panel can cut string output by 30–50% or more in the worst case

    **What microinverters do differently**
    - Each panel has its own inverter and its own MPPT, so every panel operates independently at its own maximum power point
    - The shaded panel produces less; the unshaded panels carry on at full output
    - Losses are roughly proportional to the actual shaded area, rather than being amplified across the whole array

    **The alternative: power optimisers**
    - A string inverter with per-panel power optimisers (e.g. SolarEdge, Tigo) achieves similar per-panel MPPT benefits
    - Often slightly cheaper than microinverters and keeps a single central inverter
    - One caveat: optimiser systems still have a central inverter, so if it fails, the whole system goes down — same single point of failure as a plain string setup

    **Other considerations**
    - **Cost**: expect microinverters/optimisers to add roughly £/€500–1,000 to a typical system versus a plain string inverter — usually money well spent given your shading
    - **Design matters too**: a good installer will place the panels most affected by the afternoon shadow together on their own string or their own microinverters, and keep the rest of the array clear. Ask them to model the chimney's shadow across the day and seasons (it's longest in winter)
    - **Monitoring**: per-panel systems also let you see each panel's output in the app, making shading issues easy to spot

    **Bottom line**: with a known, recurring afternoon shadow, a plain string inverter is the wrong tool. Either microinverters or an optimiser-based system will meaningfully increase your annual yield — ask installers to quote both and show the projected difference in kWh.
- user: |
    What is net metering, and how does the prosumer status work in Romania?
  assistant: |
    **Net metering** is a billing arrangement where the electricity you export to the grid offsets the electricity you import from it. Instead of being paid separately for exports, your meter effectively "runs backwards" — you're billed only on your *net* consumption.

    **How it works in principle**
    - During the day, your panels often produce more than the house uses; the surplus flows to the grid
    - At night (and in winter), you draw from the grid
    - Over a set period, your exports are credited against your imports in kWh, and you pay (or get paid) only the difference

    **Prosumer status in Romania**
    - A "prosumer" (prosumator) is a grid-connected customer who also produces electricity, typically from solar
    - You register with **ANRE** (the energy regulator) and sign a prosumer contract with your electricity supplier; the distribution operator (e.g. Enel/ENDE, CEZ, E.ON) installs a bidirectional or smart meter
    - Residential prosumers can install up to **100 kWp** (far more than a household needs — typical home systems are 3–10 kWp)

    **The Romanian compensation scheme**
    - Romania uses a **net metering** mechanism (under Law 122/2019): energy fed into the grid is compensated 1:1 in kWh against energy drawn from the grid within the billing period
    - There's an annual settlement cycle: surplus credits accumulated over the year are settled at the end, with any excess beyond your annual consumption bought by the supplier at a price based on the average market price
    - You still pay grid/transport/distribution charges on what you draw, and the compensation applies to the energy component — so "zero bill" isn't quite the same as zero cost

    **Important caveats**
    - The rules have been in flux: the government has discussed moving new prosumers from net metering to a **net billing** model (exports valued at market prices rather than 1:1 kWh), with transition deadlines that have shifted several times. Existing prosumers are generally grandfathered, but the terms for *new* registrations depend on when you apply
    - **Casa Verde / AFM programme**: Romania offers grants covering a large share of PV system costs (including optionally batteries), administered through the Environmental Fund Administration — worth checking current rounds, as it significantly improves payback

    **Practical advice**: ask your installer about current ANRE registration steps and confirm with your supplier which compensation scheme applies to new prosumers right now — this materially affects your savings calculation.
- user: |
    We got two quotes:

    ```
    Quote A: 6.2 kWp, 14 x 445 W panels, Huawei SUN2000-6KTL-M1 string inverter, 10-year inverter warranty, 27,400 lei installed
    Quote B: 5.4 kWp, 12 x 450 W panels, Enphase IQ8+ microinverters, 25-year microinverter warranty, 31,900 lei installed
    ```

    Which one is better value?
  assistant: |
    Short answer: **Quote B is likely the better value for your specific roof**, even though it looks worse on paper. Here's the breakdown:

    **Headline numbers**

    | | Quote A | Quote B |
    |---|---|---|
    | Capacity | 6.2 kWp | 5.4 kWp |
    | Price | 27,400 lei | 31,900 lei |
    | Cost per kWp | ~4,420 lei | ~5,910 lei |
    | Inverter warranty | 10 years | 25 years |

    On pure cost-per-kWp, A wins by a wide margin. But two factors flip the comparison:

    **1. Your chimney shading**
    - Quote A's plain string inverter is exactly the setup we discussed as wrong for a partially shaded roof. If the shadow crosses panels on a string, it drags down the whole string every afternoon
    - A rough estimate: in Cluj, unshaded, A would produce ~7,000 kWh/year vs B's ~6,200 kWh. But with meaningful afternoon shading, A could lose 10–20% while B loses only what the shadow actually covers — potentially bringing them to parity or putting B ahead
    - The 25-year Enphase warranty also matters: A's inverter will likely need replacing at least once in the system's life (budget 2,500–4,000 lei), which narrows the real price gap further

    **2. One technical flag on Quote B**
    - The Enphase IQ8+ has a peak AC output of ~290 VA per panel, while the panels are 450 W. That means slight "clipping" at peak sun (typically 1–2% annual loss — minor, but ask Enphase's compatibility data to confirm the 450 W modules are supported). If the installer can swap to IQ8P or IQ8H for a small premium, that's worth considering

    **What I'd do**
    1. **Go back to Quote A** and ask for a version with power optimisers (e.g. Huawei supports optimisers on that inverter) — this might land around 29,000–30,000 lei and give you the best of both: more capacity *and* shading tolerance
    2. **Ask both installers for a shading simulation** (PVGIS or similar) showing projected annual kWh for *your* roof with the chimney shadow modelled — compare kWh, not kWp
    3. Ask A how they'd arrange the strings relative to the shadow (panels in the shadow path on a separate MPPT at minimum)

    **Bottom line**: as quoted, B is the safer and probably better-yielding choice given your shading. But an optimiser-equipped version of A could beat both — worth one more round of negotiation before deciding.
