    Do panels still work in winter, or when there's snow on them?
  assistant: |
    **Yes, panels work in winter — but snow on top of them blocks production completely until it slides or melts off.**

    **Winter production (no snow)**

    - Panels run on light, not heat — cold actually *helps* efficiency (lower cell temperature = better output per unit of sunlight)
    - Cold, clear winter days can deliver surprisingly good production
    - The real constraint is **day length and sun angle**: in Cluj in December you get ~8.5 hours of daylight with a low sun, so output is roughly 20–25% of a summer month's
    - Realistic figures for your system: ~700–800 kWh in July vs **~150–250 kWh in December**

    **When snow covers the panels**

    - Snow is opaque — a covered panel produces essentially **zero**
    - Good news: panels have smooth glass, sit at a steep angle (your 35° helps), and their dark surface warms up in sun, so snow slides off faster than off a roof. Often clears within a day or two of sunshine
    - Bad news: at 35° pitch, wet snow can linger for days in overcast weather, and the bottom row can get blocked by snow accumulating on the ground or lower roof edge

    **Practical implications for you**

    1. **Net metering absorbs the seasonal dip**: your summer surplus credits offset winter imports, so a weak December doesn't hurt your annual bill — this is exactly what the prosumer scheme is for
    2. **Don't climb on the roof to clear snow** — dangerous, and you risk cracking cold glass or voiding warranties. Let the sun do it
    3. **Panel placement matters**: if the bottom row sits close to the roof edge, snow build-up on the ground can bury it for weeks. Ask the installer to raise the lowest row if possible
    4. **Microinverters/optimisers help here too**: if one panel is snow-covered while others are clear, per-panel electronics let the clear ones keep producing — a string inverter may throttle the whole string
    5. **Bifacial or premium panels** shed snow slightly faster, but it's a marginal gain — not worth choosing panels over

    **Bottom line**: winter is the weakest season by far, but the annual design already accounts for it. Expect a few snow-blocked days each winter, near-zero production during them, and no meaningful impact on your yearly savings thanks to net metering.
- user: |
    Do I need a building permit in Romania for panels on the roof of a house?
  assistant: |
    **In most cases, no building permit is needed for standard rooftop panels on a detached house — but there are exceptions and some paperwork.**

    **The general rule**

    - Under Romania's construction law (Law 50/1991, as amended), installing solar panels on the roof of an existing **individual dwelling** is exempt from needing an *autorizație de construire* (building permit), provided the panels are mounted on or flush with the roof and don't significantly change the building's structure or appearance
    - Ground-mounted systems and large installations (or systems on apartment blocks) have different rules — not relevant to your case

    **What you may still need**

    1. **Documentation for the prosumer contract**: your supplier/distribution operator will want the system's technical details and an installation certificate from the installer
    2. **AFM / Casa Verde programme**: if you apply for the grant, it comes with its own documentation requirements (technical documentation, sometimes an energy audit or certificate) — but that's programme paperwork, not a building permit
    3. **Electrical connection notification**: the distribution operator must be informed and will install/replace the meter — handled as part of the prosumer process

    **The exceptions where you DO need authorisation**

    - **Historic or protected areas**: if your house is a listed historic monument or sits in a protected urban zone (e.g. parts of Cluj's historic centre), you'll need approval from the Ministry of Culture / local heritage commission, and panels visible from the street may be restricted or refused
    - **Major roof modifications**: if the installation requires structural changes to the roof (raising it substantially, altering the structure), a permit may be required
    - **New construction**: panels integrated into a new build are simply part of the building permit for the house

    **Practical advice**

    - Ask your installer — reputable ones in Cluj handle this routinely and will know the local rules, including whether your address falls in a protected zone
    - If in doubt, a quick written query to the local **primărie** (city hall) urbanism department settles it definitively
    - Keep the installer's commissioning documents and electrical certificate regardless — you'll need them for ANRE registration, the grant, and any insurance claims

    **Bottom line**: for a typical house roof outside protected zones, no building permit — just the standard prosumer and (optionally) grant paperwork. The heritage-zone check is the one thing worth confirming early, especially if you're in Cluj's older districts.
