    Coverage drops to ~63%. The deficit costs roughly **3,300–4,100 lei/year** at retail prices.

    **Why this scenario is actually where solar + EV shine**

    1. **Charging aligns with solar better than you'd think**: if the car sits home on sunny days (weekends, remote work), you can charge directly from the panels at midday — the cleanest, cheapest km you'll ever drive. Even without smart controls, weekend daytime charging captures a lot of solar
    2. **The EV is a flexible load**: unlike the heat pump (which must run when it's cold), charging can shift to when the sun shines. A simple timer or the charger's solar mode (many wallboxes support "PV surplus charging") turns the car into a solar sink
    3. **Per-km economics**: solar-charged driving costs almost nothing; grid-charged at 1.1 lei/kWh costs ~1.9 lei/100 km × 17 kWh ≈ **~2 lei per 100 km** vs ~8–9 lei/100 km for a petrol car. Even fully grid-charged, 12,000 km costs ~2,300 lei vs ~10,000+ lei in fuel

    **Would you need more panels?**

    - The 3,700 kWh deficit would need ~3.2 kWp more — but your roof and inverter are already near their limits (6.2 kWp on a 6 kW hybrid inverter)
    - **The economics of closing the gap are weaker than the original install**: under net metering, extra panels displace retail-priced imports (worth ~1.1 lei/kWh), so payback on an extension isn't terrible — but you'd likely need a second inverter or inverter upgrade, adding fixed costs
    - **Better sequencing**: don't pre-build for the hypothetical car. When the EV actually arrives, re-evaluate with real consumption data

    **What to do differently now (small, cheap decisions)**

    1. **Inverter headroom**: we discussed this — the 6 kW Huawei is nearly maxed at 6.2 kWp. If the installer offers a 8KTL-LC0 for a modest price difference, the extra capacity headroom preserves your options for a future extension. Worth pricing
    2. **Garage conduit**: have the installer run an empty conduit/cable route from the distribution board to where a wallbox would go — costs almost nothing now, saves tearing walls later
    3. **Distribution board space**: leave a spare breaker slot or two for a future wallbox circuit (wallboxes typically need a dedicated 32 A circuit)
    4. **Battery reconsideration**: an EV + heat pump + battery is the full triad — at that point, a battery's self-consumption value improves, especially if net billing has replaced net metering by then. Your hybrid inverter keeps that door open

    **The honest summary across all scenarios**

    | Scenario | Consumption | Coverage by Quote A | Residual bill |
    |---|---|---|---|
    | Today | 4,800 kWh | ~130% | ~0 lei |
    | + Heat pump | 7,800 kWh | ~80% | ~1,500 lei |
    | + Heat pump + EV | 9,900 kWh | ~63% | ~3,500 lei |

