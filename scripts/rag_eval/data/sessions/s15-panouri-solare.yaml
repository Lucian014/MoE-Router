    **Day-to-day monitoring is handled by your inverter's app — in your case, Huawei's FusionSolar.** Here's how it works and what to look at:

    **The FusionSolar app (Huawei)**

    - The inverter connects to your home Wi-Fi (or via an Ethernet/4G dongle) and uploads data continuously
    - You install the FusionSolar app (or use the web portal), register, and link your inverter via its serial number — the installer typically sets this up during commissioning
    - **What you can see**:
      - Real-time power output (kW), updated every few minutes
      - Daily, monthly, yearly, and lifetime production (kWh)
      - Revenue/savings estimates
      - Fault alerts and error codes
      - String-level data — both MPPT inputs separately, which is how you'll spot shading behaviour

    **A sensible daily/weekly routine**

    1. **First weeks — learn your system's rhythm**: check the app daily to see what a clear day, cloudy day, and shaded afternoon look like. Expect a bell curve peaking around midday, with a visible dip when the chimney shadow crosses in the afternoon
    2. **After that, weekly is enough**: glance at the daily totals. You'll quickly know what "normal" looks like per season — e.g. ~35–45 kWh/day in June vs ~5–8 kWh/day in December for your 6.2 kWp
    3. **Compare against expectations**: a simple sanity check is kWh per kWp per day — roughly 4–5 in summer, 0.5–1.5 in winter for Cluj. A clear day producing half of normal deserves investigation

    **What to watch for (red flags)**

    - **Sudden drops** in output on good sun days — could be a string fault, inverter issue, or tripped breaker
    - **A persistent flat-top or midday dip** beyond the known chimney shadow — possible new shading (tree growth) or a fault
    - **Error codes or the inverter offline** for more than a day
    - Zero production on an obviously sunny day — check the AC breaker and the inverter's display first

    **Useful extras**

    - **PVGIS comparison**: the EU's free PVGIS tool lets you model your system and gives expected monthly output — a good independent benchmark for "is my system performing right?"
    - **Consumption side**: if you add a Huawei smart power sensor (or smart meter integration), the app also shows household consumption and grid import/export — much more informative than production alone, and essential if you later add a battery
    - **Export the data**: FusionSolar allows CSV exports — handy for verifying the annual settlement with your supplier under net metering

    **One practical tip**: make sure the installer shows you the app working, with your system visible, before final payment — and that the monitoring account is registered to *your* email, not the installer's. Installers can have a "parent" account for support, but you should own the primary login.
- user: |
    Our neighbor's system shuts down by itself on sunny days, usually around noon, and comes back a few minutes later. Any idea why?
  assistant: |
    That's a classic symptom, and there are two likely culprits — both common around midday on sunny days:

    **1. Grid overvoltage (the most likely cause)**

    - Around noon on sunny days, lots of prosumers in the neighbourhood are exporting simultaneously, and voltage on the local grid rises
    - Inverters must disconnect when grid voltage exceeds limits (typically ~253 V on a 230 V nominal supply) — this is a safety requirement, not a fault
    - When the voltage drops back (cloud passes, neighbours' output dips), the inverter reconnects after its mandatory waiting period — hence the "few minutes later" return
    - **Pattern signature**: happens around midday, on sunny days, more often at the *end* of a long feeder line where voltage rise is worst, and worse in summer when many systems export at once

    **2. Inverter thermal derating**

    - On hot sunny days, an inverter mounted in direct sun or a poorly ventilated loft can overheat and reduce power or shut down temporarily, restarting once it cools
    - **Pattern signature**: correlates with hot afternoons rather than exactly noon; worse in summer; inverter hot to the touch

    **How to tell which one it is**

    - Check the event log in the monitoring app — it records shutdown reasons. Look for "grid overvoltage" / "AC voltage out of range" vs "temperature derating"
    - If it's overvoltage, the app often shows AC voltage climbing toward 250+ V just before the trip

    **Why this matters for you**

    - **Overvoltage trips cost real money**: every minute offline at noon is peak production lost. If the neighbour's grid connection suffers this, yours might too — same street, same feeder
    - **Prevention for overvoltage**: the distribution operator can check/adjust the local transformer tap or the connection; some inverters can be configured with slightly wider voltage windows (within legal limits); EN 50149 smart inverter functions help. If it's severe, a complaint to the distribution operator (ENDE in your area) is the route — they're obliged to investigate voltage quality issues
    - **Prevention for thermal**: mount the inverter on a shaded north-facing wall or in a ventilated space, never in direct sun — worth specifying for your own installation

    **Practical takeaway**: ask your neighbour what the event log says — it takes two minutes to check. And when your installer commissions your system, ask them to note the grid voltage at your connection point at midday; if it's already running high, raise it with the distribution operator *before* your system is up and losing noon production to the same problem.
