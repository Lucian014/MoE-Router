    What's the "Casa Verde Fotovoltaice" program and is it still worth applying?
  assistant: |
    **"Casa Verde Fotovoltaice" is the Romanian state's grant programme for household solar, run by AFM (Administrația Fondului pentru Mediu)** — and yes, it's almost always worth applying if you qualify. Here's the picture:

    **How it works**

    - Individual owners of residential buildings can receive a grant covering a large share of a PV system's cost — historically **up to ~20,000 lei**, with additional support for battery storage in recent rounds (the exact amounts and storage terms change between sessions)
    - You apply online during an announced application window, typically with documents proving ownership, identity, and the technical offer from an installer
    - **Selection is competitive**: demand massively exceeds budget, so eligible applications go through a computerised selection/draw — applying doesn't guarantee funding
    - **Funding is reimbursed after installation**: you pay the installer first, then submit completion documents to AFM and receive the grant afterwards. You need to be able to front the full cost (or finance it temporarily)

    **Key caveats to check for the current session**

    1. **System size limits**: recent rounds have had conditions on eligible system capacity (often tied to your consumption or capped at a maximum kWp). Your quotes are 5.4–6.2 kWp — **verify the current cap**, because if the eligible limit is, say, 6 kWp or is sized to consumption, part of your system might fall outside the grant
    2. **Authorised installers**: you must use an installer meeting AFM's requirements — check that your chosen company qualifies
    3. **Timing**: windows open irregularly (roughly annually), and there can be a long wait between application and selection
    4. **One grant per person/house**: if you've received AFM funding before, you may be excluded

    **Is it worth it?**

    Almost certainly yes, financially:

    - A ~20,000 lei grant on a ~28,000–32,000 lei system cuts your net cost to roughly a third, dropping payback from ~5–6 years to **~2 years**
    - The main costs of participating are patience (waiting for selection) and paperwork — and since you're paying only after selection, there's little financial risk in applying

    **Practical strategy**

    - **Apply, but don't stall the project indefinitely**: if the next window is far off or selection odds look poor, weigh the grant (~20,000 lei) against a year or more of lost savings (~5,000–6,000 lei/year). Waiting two years for the grant roughly cancels its benefit
    - Ask both installers: they've been through Casa Verde rounds many times, know the current rules, and can tell you honestly whether your system configuration fits this year's eligibility criteria
    - Monitor the AFM website (afm.ro) for the next session announcement, and prepare documents in advance — application windows can be short

    **Bottom line**: it's free money that roughly halves-to-thirds your net cost, with the only real downsides being bureaucracy and waiting. Just confirm the current session's capacity cap applies to your 5.4–6.2 kWp system before counting on it.
