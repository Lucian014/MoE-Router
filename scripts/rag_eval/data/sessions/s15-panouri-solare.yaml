    **Practical recommendation**

    - **Proceed with Quote A as planned** — it's the right foundation either way, and the heat pump is hypothetical until you actually buy one
    - **When the heat pump becomes real**: get the actual model's consumption data for a house like yours, then model the combined balance. If the deficit is ~1,500–2,000 kWh, live with it; if it's 3,500+, price an extension (checking inverter capacity first)
