    Give me a list of questions to ask the installer before we sign the contract.
  domain: brainstorming
  assistant: |
    **Questions for the installer — tailored to your project (6.2 kWp, Huawei hybrid, shaded roof, Cluj):**

    **About the design and your roof**

    1. Can you show a shading simulation (PVGIS or similar) for our roof with the chimney shadow modelled across seasons — and what annual kWh do you project?
    2. How will you arrange the strings relative to the chimney shadow? Will the affected panels share an MPPT with unshaded ones?
    3. Should we add power optimisers given the shading? What would they cost and what do they add?
    4. Where exactly will the panels sit relative to the roof edge? (Snow build-up can block the bottom row in winter.)
    5. How is the mounting fixed to our roof type, and how do you guarantee waterproofing? What's the warranty on roof penetrations?

    **About the equipment**

    6. Exactly which hybrid inverter model are you quoting (SUN2000-6KTL-LC0 or equivalent), and what warranty comes with it — 10 years standard or extendable?
    7. Is the inverter DC-coupled to a specific battery ecosystem? Which batteries can we add later, and at what typical cost?
    8. What backup hardware would we need later for outage power (e.g. Huawei Backup Box), and can it be retrofitted?
    9. Which panel brand/model exactly, and what are its product and performance warranties (expect ≥15 years product, ≥87% at 25–30 years)?
    10. Are surge protection devices (SPDs) included on both DC and AC sides? Itemise them in the quote.
    11. How will the panel frames and rails be earthed, and what is the condition/resistance of our house's earthing system — will you verify it?

    **About the electrical work**

    12. What cable cross-section will you use for the AC run from inverter to meter, and what's the voltage drop? (Our neighbour's 35 m run at 4 mm² causes daily overvoltage trips — we want this sized properly, e.g. 10–16 mm² for long runs.)
    13. Can you measure our grid voltage at midday before commissioning, so we know if we're on a high-voltage feeder?
    14. Will you leave a conduit from the distribution board to a future wallbox location, and spare breaker slots?
    15. Is the inverter mounting location shaded and ventilated? (Thermal derating kills output on hot days.)

    **About paperwork and money**

    16. Do you handle the full prosumer registration — ANRE, supplier contract, distribution operator meter change? Is it included in the price?
    17. Are you an authorised installer for the current Casa Verde round, and does our system configuration meet this session's eligibility rules (capacity caps, documentation)?
    18. What exactly is the payment schedule? (We want to pay the bulk after commissioning, not before.)
    19. What is the total price with the hybrid inverter substitution, itemised: panels, inverter, mounting, electrical works, paperwork?
    20. Are there any hidden costs — scaffolding, roof reinforcement, meter replacement, travel?

    **About commissioning and support**

    21. Will the monitoring account (FusionSolar) be registered to *our* email, with us as owners?
    22. Will you show us the system working and the app live before final payment?
    23. What's your response time for warranty calls, and for how many years do you support the installation?
    24. Can we see a system you installed 2–3 years ago and speak to that customer?
    25. What commissioning documents will we receive (electrical certificate, yield projection, warranty documents) — needed for insurance and any claims?

    **Red flags to watch for**: reluctance to do a shading simulation, vague answers on cable sizing, monitoring account registered to the installer, large upfront payment, or SPDs/earthing missing from the quote. Any of these is a reason to push back or walk away.
