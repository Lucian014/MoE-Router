    Trimite următorul set de stringuri când e gata.
- user: |
    „Let's go” tradus „Hai să mergem” e prea literal pentru un buton. Ceva mai natural?
  assistant: |
    Mică precizare: în traducerea mea am folosit deja „Hai să începem" tocmai pentru că „Hai să mergem" ar fi sunat literal (și ar fi sugerat deplasare). Dar discutabil — iată alternative pentru butonul de onboarding, de la cea mai energică la cea mai neutră:

    | Variantă | Ton / context |
    |---|---|
    | **„Hai să începem"** | Prietenos, natural — alegerea mea actuală |
    | **„Să începem!"** | Mai scurt, la fel de natural, excelent pentru butoane |
    | **„Hai la treabă!"** | Jucăuș, energic — poate fi prea casual pentru unii |
    | **„Începe acum"** | Direct, orientat spre acțiune |
    | **„Start"** | Minimalist, foarte comun în UI-uri românești |

    **Recomandarea mea:** pentru un buton CTA de onboarding, **„Să începem!"** e probabil cea mai bună variantă — scurt, natural, cu energie, și se potrivește perfect pe butoane înguste. „Hai să începem" rămâne bună dacă butonul are spațiu generos.

    Dacă vreți, o schimb direct în JSON:

    ```json
    "onboarding.cta": "Să începem!"
    ```

    Ce preferați?
- user: |
