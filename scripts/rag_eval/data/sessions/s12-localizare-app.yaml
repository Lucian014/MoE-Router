  assistant: |
    Iată traducerile, cu numărul de caractere verificat (fără emoji-uri suplimentare):

    ```json
    {
      "push.workout_waiting": "Antrenamentul te așteaptă. 15 min azi?",
      "push.streak_risk": "Nu rupe seria! Antrenează-te azi.",
