  assistant: |
    Iată traducerea, respectând glosarul stabilit („serie de zile" pentru streak, „check-in" păstrat netradus):

    ```json
    {
      "onboarding.title": "Începe-ți călătoria fitness",
      "onboarding.subtitle": "Pași mici în fiecare zi duc la schimbări mari.",
      "onboarding.cta": "Hai să începem",
      "workout.start": "Începe antrenamentul",
      "workout.rest_day": "Zi de odihnă: mușchii tăi cresc când te odihnești",
      "workout.finished": "Bravo! Ai terminat {exercises} exerciții în {minutes} minute.",
      "streak.current": "Serie de {days} zile",
      "streak.lost": "Ai pierdut seria de zile. Reluăm azi!",
      "checkin.prompt": "Cum te simți azi?",
      "paywall.title": "Deblochează-ți întregul potențial",
      "paywall.trial": "Încearcă PulsFit Pro gratuit 7 zile",
      "paywall.cancel": "Poți anula oricând din setările contului.",
      "settings.units": "Unități (kg / lb)",
      "settings.reminders": "Memento-uri antrenament"
