id: s12-localizare-app
category: translation
lang: ro
turns:
- user: |
    Traduc o aplicație de fitness, PulsFit, din engleză în română. Hai să stabilim întâi un glosar: workout, streak, rest day, rep, set, check-in. Cum le-ai traduce?
  assistant: |
    Excelentă idee să stabilim glosarul înainte — în aplicațiile de fitness, consistența termenilor e crucială. Iată propunerea mea:

    | EN | RO | Observații |
    |---|---|---|
    | **workout** | **antrenament** | Traducere standard, naturală în română. „Workout" netradus e tot mai comun, dar „antrenament" e sigur și clar. |
    | **streak** | **serie** sau **șir de zile** | „Serie" e scurt și funcționează în UI (ex. „Serie: 7 zile"). Alternativ, „șir" — dar „serie" sună mai bine. Evitați „streak" netradus dacă publicul e larg. |
    | **rest day** | **zi de odihnă** | Traducere directă, consacrată în comunitatea fitness din România. |
    | **rep** | **repetiție** (sau **rep** în contexte tehnice) | „Repetiție" e termenul consacrat. În liste compacte se poate abrevia „reps." — dar verificați spațiul din UI. |
    | **set** | **serie** ⚠️ | Aici e o coliziune: „set" = „serie" în jargonul fitness românesc („3 serii a câte 10 repetiții"). Dacă folosiți „serie" și pentru *streak*, apare ambiguitate. Recomand: **set = serie**, iar **streak = șir de zile** sau „zile consecutive". |
    | **check-in** | **prezență** sau **înregistrare** | Depinde de funcție: dacă e despre confirmarea zilnică a activității → „check-in" se poate păstra (e familiar), sau „înregistrare zilnică". Dacă e despre prezență la sală → „prezență". |

    **Rezolvarea coliziunii serie/streak** — două variante coerente:

    1. **Conservatoare:** set = serie, streak = șir de zile / zile consecutive
    2. **Modernă:** set = set (netradus, foarte răspândit în saloanele RO), streak = serie

    Personal aș alege varianta 2 dacă publicul e tânăr și obișnuit cu sala, varianta 1 dacă aplicația vizează utilizatori casual.

    Cum funcționează „check-in" în PulsFit? Cu asta pot rafina recomandarea, apoi putem continua cu alți termeni (ex. warm-up, cooldown, PR, badge).
- user: |
    „Streak” tradus „serie” sună ciudat într-o aplicație. Ce alternative am?
  assistant: |
    Ai dreptate — „serie" e încărcat deja (set, serie de TV, serie de produse) și nu transmite ideea de *continuitate motivațională* pe care o are „streak". Alternative:

    **1. „Șir de zile" / „șir"**
    Cea mai corectă traducere. „Șir de 7 zile" e clar, dar „șir" singur, într-un badge mic, sună sec.

    **2. „Zile consecutive"**
    Foarte des folosit în aplicațiile românești (Duolingo RO, de exemplu, folosește construcții de genul). Funcționează excelent în contexte scurte: „5 zile consecutive 🔥". Dezavantaj: e mai lung, deci mai greu de pus într-un buton sau etichetă compactă.

    **3. „Rulantă" / „serie activă"**
    Perifraze care adaugă context, dar devin greoaie — nu le recomand.

    **4. „Streak" netradus**
    De luat în serios: în România, publicul de fitness și cel de aplicații e deja expus la termenul (Duolingo, Snapchat, GitHub). Multe produse locale îl păstrează. Dacă publicul vostru e sub 35 de ani și obișnuit cu tehnologie, „streak" e probabil mai clar decât orice traducere.

    **5. Traducere adaptată, nu literală**
    În loc de un substantiv unic, adaptați fraza în funcție de context:
    - Badge: „🔥 7 zile la rând"
    - Mesaj motivațional: „Nu întrerupe șirul!"
    - Statistică: „Cea mai lungă perioadă activă: 21 de zile"

    **Recomandarea mea:** combinația 4 + 5 — păstrați „streak" ca termen de brand/UI acolo unde e etichetă de sine stătătoare, iar în propoziții folosiți „zile la rând" / „zile consecutive". Astfel evitați atât ciudățenia lui „serie", cât și perifrazele lungi.

    Cum arată contextele în care apare „streak" în PulsFit (badge, notificare, ecran de statistici)? Vă pot propune formulări concrete pentru fiecare.
- user: |
    Ok, mergem pe „serie de zile” pentru streak. Și „check-in” rămâne „check-in” sau îl traducem?
  assistant: |
    „Check-in" netradus e o alegere legitimă, dar depinde mult de ce face funcția în PulsFit. Să le luăm pe rând:

    **Când „check-in" netradus funcționează bine:**
    - Publicul vostru e tânăr/urban și obișnuit cu aplicații (check-in-ul de la sală, Facebook, hoteluri)
    - Termenul apare ca buton sau etichetă scurtă („Check-in zilnic")
    - E o funcție centrală, cu nume de brand — atunci e mai degrabă nume de feature decât cuvânt de dicționar

    **Când merită tradus:**
    - Publicul e larg, inclusiv persoane mai în vârstă sau din mediul rural
    - Contextul e explicativ („Fă-ți check-in-ul zilnic" → „Înregistrează-ți antrenamentul zilnic")

    **Alternative, în funcție de funcționalitate:**

    | Ce face check-in-ul | Traducere potrivită |
    |---|---|
    | Confirmare zilnică „am fost activ" | „prezență zilnică" / „pontaj zilnic" (mai jucăuș) |
    | Înregistrarea antrenamentului efectuat | „înregistrare" / „logare antrenament" |
    | Check-in fizic la sală (geolocație) | „check-in" — aici nu prea are substitut natural |

    **Recomandarea mea:** dacă check-in-ul din PulsFit înseamnă „confirm că am făcut mișcare azi", aș traduce cu **„prezență"** sau **„înregistrare zilnică"** în textul explicativ, dar aș păstra „check-in" ca etichetă de buton dacă e scurt și are iconiță. Practic: termenul englezesc ca UI compact, traducerea ca explicație.

    Un detaliu de coerență: dacă îl păstrați netradus, folosiți-l consecvent la fel peste tot în aplicație („Check-in", nu amestecat cu „check-in-ul tău" / „înregistrarea ta" în ecrane diferite).

    Ce face exact check-in-ul în PulsFit? Așa închidem decizia definitiv și o trecem în glosar.
- user: |
