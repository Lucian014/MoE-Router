    Câteva decizii de traducere, ca să le validăm:

    - **„Let's go" → „Hai să începem"** — mai natural decât „Hai să mergem" (care ar sugera deplasare fizică). Alternativă mai scurtă pentru buton: „Start".
    - **„streak.current"** — am reformulat: „{days}-day streak" nu se poate traduce literal, așa că am mutat numărul în interior: „Serie de {days} zile". Verificați că layout-ul suportă ordinea diferită a placeholder-ului.
    - **„streak.lost" → „Reluăm azi!"** — mai cald și mai motivațional decât „Începe din nou azi". Alternativă: „Începem de la zero azi!".
    - **„Workout reminders" → „Memento-uri antrenament"** — alternativă: „Notificări antrenament", dacă în restul aplicației folosiți „notificări" pentru push-uri. Spuneți-mi ce termen folosiți pentru „notification" și aliniem.
    - **„checkin.prompt"** — întrebarea rămâne naturală în română, fără a fi nevoie de termenul „check-in" în string.

    Doriți să continuăm cu un glosar extins (notification, reminder, badge, warm-up, cooldown, PR) înainte de următorul set de stringuri?
- user: |
    Tutuim utilizatorul sau folosim „dumneavoastră”? Publicul e între 20 și 35 de ani.
  assistant: |
    Pentru publicul 20–35 de ani, clar **tutuitul**. Argumente:

    - **Convenția pieței:** aproape toate aplicațiile consumer din România (Foodpanda, Bolt, eMAG, Revolut RO, aplicațiile de fitness precum Fitbit sau Strava în varianta localizată) folosesc tutuitul. „Dumneavoastră" ar suna formal, distant — ca o bancă, nu ca un antrenor.
    - **Tonul produsului:** PulsFit e un companion motivațional. „Bravo! Ai terminat..." funcționează doar la persoana a II-a singular; „Ați terminat" ar distruge exact căldura pe care am construit-o în stringuri.
    - **Demografic:** 20–35 e intervalul în care tutuitul e perceput ca prietenos, nu lipsit de respect.

    Singurele excepții în care aș folosi „dumneavoastră":
    - Texte legale (Termeni și condiții, Politica de confidențialitate) — acolo e standard
    - Ecrane de plată/facturare, dacă vreți un ton mai serios — dar chiar și aici multe aplicații păstrează tutuitul

    **Recomandare practică:** adăugați în glosar o regulă de stil: *„Ton: prietenos, motivațional, persoana a II-a singular (tutuit) în tot UI-ul; persoana a II-a plural (dumneavoastră) doar în documente legale."* Astfel, dacă mai traduce cineva după dvs., va fi consecvent.

    Stringurile traduse deja sunt toate la tutuit, deci nu avem nimic de corectat. Continuăm cu următorul set?
