    Decizii de traducere de semnalat:

    - **„core"** — l-am păstrat netradus; „core" e termenul folosit în comunitatea fitness RO, iar „tonus/trunchi" ar suna artificial. Alternativă: „exerciții pentru abdomen și spate".
