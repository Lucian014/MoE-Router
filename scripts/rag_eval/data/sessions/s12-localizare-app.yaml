    - **„Your data stays yours" → „Datele tale rămân ale tale"** — formulare directă, potrivită pentru publicul 20–35 atent la privacy.

    Dacă App Store cere și un **subtitle (max 30 caractere)** sau **promotional text (max 170 caractere)**, le pot propune imediat. De asemenea, pot pregăti lista de cuvinte-cheie pentru căutări (keywords) în română, dacă e nevoie.
