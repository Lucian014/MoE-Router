    Verificare caractere:

    | # | String | Caractere |
    |---|---|---|
    | 1 | Antrenamentul te așteaptă. 15 min azi? | 38 ✓ |
    | 2 | Nu rupe seria! Antrenează-te azi. | 33 ✓ |
    | 3 | Record personal nou! Devii mai puternic. | 40 ✓ (exact la limită) |
    | 4 | Zi de odihnă. Întinde-te și bea apă. | 36 ✓ |
    | 5 | Rezumatul săptămânii e gata. | 28 ✓ |
    | 6 | 3 zile de pauză. Ne este dor de tine! | 37 ✓ |

    Decizii de traducere de semnalat:

    - **#1:** „15 minutes" → „15 min" pentru a încăpea; în push-uri abrevierea e acceptată.
    - **#2:** am sacrificat „before midnight" — „până la miezul nopții" depășea limita. Dacă detaliul e important, alternativă: „Seria expiră la miezul nopții!" (31 caractere), dar pierde tonul de încurajare.
    - **#3:** exact 40 de caractere. Dacă vreți marjă de siguranță: „Record personal! Devii mai puternic." (36). „Every single week" nu încăpea; am păstrat ideea de progres continuu.
    - **#6:** „we miss you" → „Ne este dor de tine" — corect gramatical; varianta colocvială „Ne dor de tine" e mai scurtă, dar considerată greșită.

    Dacă sistemul vostru de push permite emoji, „🔥" pe #2 și „💪" pe #3 ar crește rata de deschidere — dar verificăți că numărătoarea de caractere include și emoji-ul (unele platforme îl contează ca 2 caractere).
- user: |
    A treia e tot prea lungă. Scurteaz-o fără să pierzi ideea de record personal.
  assistant: |
