    |---|---|---|
    | **one** | exact 1 | 1 zi |
    | **few** | numere de la 2 la 19 (sau care se termină în 2–19, cu excepția celor care se termină în 01–019... practic: n % 100 ∈ 2–19) | 2 zile, 11 zile, 17 zile |
