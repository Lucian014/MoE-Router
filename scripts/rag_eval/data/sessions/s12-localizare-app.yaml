    Dacă preferați ceva mai scurt și mai punchy, „Ai bătut recordul personal!" e foarte naturală în română și lasă loc pentru un emoji. Care o alegeți?
- user: |
    Cum traduc „PR” (personal record)? În comunitatea de sală de la noi se zice tot „PR”?
  assistant: |
    Da, în comunitatea de sală din România „PR" e folosit exact ca în engleză — pronunțat „pe-er" — mai ales în powerlifting, crossfit și printre cei care se antrenează serios. „A făcut un PR nou", „a bătut PR-ul" — toate sună natural în sală.

    **Dar atenție la contextul aplicației:**

    | Public | Recomandare |
    |---|---|
    | Utilizatori avansați, powerlifting/crossfit | **„PR"** netradus — e limbajul nativ al comunității |
    | Public larg, începători, aplicație mainstream | **„record personal"** — „PR" poate fi neclar pentru cineva care abia a început să se miște |

    **Pentru PulsFit**, cu public 20–35 și ton prietenos, aș face o combinație:

    - **În stringuri scurte (badge, push, notificare):** „PR" — compact, familiar, și deja l-am folosit implicit în „Record personal!"... de fapt aici puteți alege: „PR nou! 💪" (13 caractere) e și mai scurt.
    - **Prima dată când apare termenul în aplicație (onboarding, tooltip):** „record personal (PR)" — o singură dată, ca să ancoreze sensul, apoi doar „PR".

    **De evitat:** „reper personal" (calchiu nenatural) sau „record nou" singur (ambiguu — record la ce?).

    Decizie pentru glosar: propun **PR = „PR"** în etichete și notificări, „record personal" în texte explicative. Dacă sunteți de acord, actualizez și push-ul #3 — „PR nou! Devii mai puternic." (29 caractere) ar fi varianta aliniată la glosar.
