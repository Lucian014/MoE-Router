    14 oameni într-o sală de 30–35 de locuri arată gol. La primele ediții:

    - **Comprimă spațiul:** aranjează mesele doar într-o zonă, ca sala să pară plină;
    - Nu lăsa goluri vizibile spre vitrină – un local care pare plin atrage, unul gol descurajează chiar și pe cei veniți special.

    **7. Socoteala realistă a creșterii**

    - Ediția 1: 14 → ediția 2: 20–24 (cei vechi + 1 prieten fiecare) → ediția 3: 28–32 (efectul temei și al parteneriatului) → ediția 4–5: 40;
