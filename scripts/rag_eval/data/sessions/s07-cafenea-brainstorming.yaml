    - Cere-le celor veniți să posteze o poză cu hashtag-ul evenimentului – oferă-le o prăjitură pentru asta.

    **2. Umple golurile dinainte de eveniment**

    - Anunță cu **2 săptămâni înainte**, nu cu 3 zile. Postează apoi un reminder cu 3 zile și unul în ziua respectivă;
    - **Rezervările deschise** pe Instagram: echipa își lasă numele, iar tu afișezi „echipe înscrise: 7/10”. Frica că se umple locurile aduce înscrieri devreme;
    - Flyere în cămine și la facultăți în săptămâna dinainte, cu QR direct la postarea de rezervare.

    **3. Schimbă ziua și ora dacă e nevoie**

    Întreabă la finalul serii: „v-a fost bine, dar joi e ok?”. Dacă joi se lovește de laboratoare până târziu sau de alte evenimente din campus, mută marți sau miercuri. O singură întrebare adresată direct îți poate spune mai mult decât orice statistică.

    **4. Dă seara un temă lunară**

    Quiz-ul generic atrage greu; quiz-ul tematic atrage pasionații care vin cu echipa lor pregătită:

    - „Quiz Harry Potter”, „Quiz de fotbal”, „Quiz Iași vechi”, „Quiz de medicină” (perfect pentru publicul de la Păcurari);
    - Tema se anunță din timp, iar echipele vin „costumate” sau pregătite – asta generează poze, distribuiri și așteptare.

    **5. Parteneriate cu asociațiile studențești**

    - O asociație își aduce 2–3 echipe dacă le dai ceva în schimb: o rundă cu întrebări de la ei, logo-ul pe afiș, sau un procent mic din taxe pentru proiectul lor;
