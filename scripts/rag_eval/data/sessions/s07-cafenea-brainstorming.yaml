    3. **Folosește umorul cu măsură** – ironia recenziei e o oportunitate, iar un răspuns cu personalitate e citit de toți cei care ajung la pagina ta;
    4. **Oferă ceva concret** (cafea gratuită) – transformă un client nemulțumit într-unul care poate reveni, iar publicul care citește vede că stai la dispoziție;
    5. **Se termină pozitiv**, cu identitatea brandului.

    **Un sfat practic:** înainte de a posta răspunsul, asigură-te că reparațiile chiar s-au făcut. Dacă recenzentul revine și prizele tot nu merg, al doilea răspuns va fi mult mai dur decât primul. Și verifică tu însuți Wi-Fi-ul la geam, cu laptopul, într-o zi de vârf – dacă pică din oră în oră, problema poate fi mai mare decât un router resetat.
- user: |
    Am un buget de marketing de 1.500 de lei pentru semestrul al doilea. Cum îl împart?
  assistant: |
    Cu 1.500 de lei pentru ~5 luni (octombrie–februarie, deci incluzând sesiunea și începutul semestrului al doilea), bugetul e mic, dar suficient dacă îl concentrezi pe canalele care merg la publicul tău. Iată o împărțire:

    **1. Instagram/TikTok – 400 lei (promovare plătită)**

    - 80–100 lei/lună pentru boostarea postărilor cheie: anunțul quiz-ului, ofertele de abonamente, „Noaptea Lungă de Studiu”;
    - Țintește doar raza de 2–3 km în jurul cafenelei, vârsta 18–26. Bugetul mic e ok aici: 50 de lei bine țintiți bat 500 de lei împrăștiați;
    - Promovează postările care merg deja bine organic, nu cele care nu funcționează.

    **2. Flyere și materiale tipărite – 300 lei**

    - 1.000 de flyere cu QR (reducere la primul abonament sau cafea gratuită la prima vizită), distribuite în cămine și la ieșirile din facultăți în săptămânile de început de semestru – astea sunt ferestrele de aur, când oamenii își caută locuri de studiu;
    - 2–3 afișe A3 pentru panourile din facultăți (cere acordul asociațiilor studențești).

    **3. Quiz-ul lunar – 250 lei (premii suplimentare)**

    - Bugetul de premii pe care l-am stabilit (150–250 lei/seară) e deja acoperit parțial din taxele de participare; aici adaugi 50 lei/ediție pentru premiul surpriză și materiale;
    - Quiz-ul e cel mai bun „reclamă” pe care o ai: fiecare participant aduce alții.

    **4. Stickere și merch mic – 200 lei**

    - 500 de stickere cu logo-ul și sloganul „Stai conectat. La cafea.” – se pun pe laptopuri și lucrează pentru tine în biblioteci;
    - Câteva căni sau tricouri pentru concursuri pe Instagram („poza cu cel mai plin laptop din Priza câștigă...”).

    **5. Rezervă de urgență – 350 lei**

    - Nu-l atinge decât dacă apare ceva concret: un parteneriat cu o asociație care cere o contribuție, o ediție specială a quiz-ului cu temă mare, sau o lună slabă care are nevoie de un impuls.

    **Ce NU cheltui:**

    - Panouri publicitare, radio, presă locală – prea scumpe pentru publicul tău;
    - Influenceri mari – un micro-influencer local (2.000–5.000 urmăritori, student) e altă poveste: o cafea gratuită + un mic bon pot fi suficiente, fără bani din buget.

    **Regula de măsurare:** fiecare canal primește un cod sau o ofertă distinctă (flyer = „PRIZA10”, Instagram = link cu reducere). La finalul semestrului știi exact ce a adus clienți și unde pui banii în semestrul următor.

    **Prioritatea absolută:** dacă trebuie să alegi un singur lucru, pune totul în primele 3 săptămâni de semestru – momentul în care studenții își aleg „locul lor” contează mai mult decât orice altceva în restul anului.
- user: |
    Fă-mi un rezumat al planului actualizat, cu toate deciziile noi.
  assistant: |
    Rezumatul planului actualizat pentru „Priza”:

    **Concept și identitate**

    - Study café lângă campusul Copou, Iași, strada Păcurari, cu zone separate pentru liniște și grupuri;
    - Nume: **„Priza”**, slogan: **„Stai conectat. La cafea.”** – pe vitrină, pahare și stickere, cu font și culori consistente;
    - Logo: ștecher stilizat din care iese abur de cafea.

    **Locație și investiție**

    - Spațiu de 68 mp, parter, vitrină mare;
    - Chirie negociată: **1.650 €/lună, cu 3 luni de grație** pentru amenajare;
    - Investiție estimată: 90.000–150.000 lei (echipamente + amenajare);
    - Break-even: **~51–59 clienți pe zi** (la bon mediu 18–20 lei), ținte de confort la 70+.

    **Furnizor de cafea**

    - **Prăjitoria Nord**: 95 lei/kg, espressor cu 2 grupuri în comodat;
    - Contract de comodat cu clauze clare: service în 48 h, ieșire fără penalizări cu preaviz de 30–60 zile, proces-verbal de predare cu poze, verificat de avocat.

    **Meniu**

    - 10 băuturi, prețuri student-friendly: espresso 7 lei, filtru 8 lei, cappuccino 10 lei, băuturile reci max 12 lei;
    - Combo-uri (băutură + sandviș ~18 lei) pentru creșterea bonului; lapte vegetal +2 lei.

    **Personal și program**

    - 2 bariști cu jumătate de normă (~4.140 lei/lună total cu taxe) + tu;
    - Programul dorit (7:30–22:00) e la limită – de decis înainte de deschidere: **al treilea barist cu jumătate de normă** sau **program scurtat** (8:00–21:00, duminică redus).

    **Evenimente**

    - **Seara de Quiz lunară** (ultimul joi): echipe de 2–5, taxa 10 lei cu băutură inclusă, 5 runde, premii 150–250 lei, teme lunare, parteneriate cu asociațiile studențești; țintă: 40 de participanți în 4–5 ediții.

    **Autorizări**

    - Ordinea: ONRC (CAEN 5630) → amenajare → DSVSA + ISU → autorizare primărie; plus atestate de manipulant, casă de marcat fiscală; durată estimată 1–3 luni, în paralel cu grația chiriei.

    **Marketing – buget 1.500 lei/semestru**

    - Instagram/TikTok plătit: 400 lei (raza 2–3 km, 18–26 ani);
    - Flyere și afișe la început de semestru: 300 lei;
    - Premii quiz suplimentare: 250 lei;
    - Stickere și merch mic: 200 lei;
    - Rezervă de urgență: 350 lei;
    - Fiecare canal cu cod propriu de reducere, pentru măsurare; concentrare pe primele 3 săptămâni de semestru.

    **Riscuri urmărite**

    - Vara fără studenți (evenimente + clienți din cartier);
    - Abonații care consumă peste medie (monitorizare lunară);
    - Fluctuația personalului la salariu minim (posibil +300–400 lei/persoană);
    - Reputația online: răspunsuri rapide și concrete la recenzii, cu reparații făcute înainte de răspuns.

    **Următorii pași concreți:** semnarea contractului de închiriere și a comodului, pornirea autorizărilor, angajarea bariștilor, decizia finală despre program și al treilea angajat.
