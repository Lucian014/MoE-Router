    Two notes:

    - The phrase *open to discussing depending on the overall package* keeps the door open without underselling yourself – banks often have benefits (meal vouchers, private health insurance) that matter on top of the base salary;
    - Pointing to the specific project in the portfolio is better than just dropping a link: it tells her what to look at.
- user: |
    Wait, is 6,500 net too much for a junior in Bucharest? Should I give a range instead of one number?
  assistant: |
    6,500 lei net is at the higher end for a junior data analyst in Bucharest, but not unreasonable – junior roles there typically land somewhere around 4,500–7,000 lei net, and banks tend to pay toward the upper half of that. Whether 6,500 is realistic depends on your leverage: a finished portfolio, a referral, and SQL/Python skills put you above the average junior candidate, so it's not an outrageous ask. That said, I can't see live salary data, so treat these figures as a rough guide and check current listings on ejobs or Hipo.ro for "junior data analyst" to calibrate.

    On the range question – yes, give a range. A single number is a take-it-or-leave-it anchor; a range signals flexibility and is standard practice. Two tips:

    - **Make your bottom of range a number you'd genuinely accept.** Recruiters hear the first number, so 6,000–7,000 really means "around 6,000."
    - **Keep the floor high enough.** If 6,500 is your real target, say 6,500–7,000 rather than 5,500–6,500.

    So the sentence could become:

    > Regarding salary, my expectation is in the range of 6,500–7,000 lei net per month, depending on the overall package.

    If your research shows the bank's junior roles pay less, you can lower the floor to 6,000 – but don't go below what you'd actually accept, because that's the number they'll remember.
