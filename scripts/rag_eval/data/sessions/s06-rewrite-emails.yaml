    The recruiter, Elena Stan, asked for my portfolio link and a salary expectation. Help me answer. My portfolio is on GitHub and I want to say 6,500 lei net.
  assistant: |
    Subject: Re: Interview – Junior Data Analyst, 21 November

    Dear Ms. Stan,

    Thank you for confirming the interview on 21 November at 11:30.

    My portfolio is available here: [your GitHub link]. It includes the Airbnb Bucharest analysis I mentioned in my application, with the code and charts.

    Regarding salary, my expectation is 6,500 lei net per month. I'm open to discussing this depending on the overall package.

