- user: |
    I have a second offer, from a startup called DataNest: 7,500 net but no training budget. Help me write to Carpatica asking for a decision by Friday, without sounding like I'm bluffing.
  assistant: |
    Here's a draft for Elena, who is the right person to nudge – she owns the process:

    Subject: Junior Data Analyst – timeline question

    Hi Elena,

    I hope you're doing well. I wanted to give you a quick update: I've received another offer and need to make a decision in the next few days.

    Carpatica remains my preferred option – I really enjoyed the interview with Radu and the team – so I'd be grateful if you could let me know where things stand by Friday, 28 November. If a decision needs more time, just tell me and I'll see what I can do on my end.

    Thanks for all your help so far!

    Best,
    Ana

    Why this works without sounding like a bluff:

    - **You state the fact, not the threat.** You never say "or I'll take the other offer" – the deadline does the work on its own;
    - **"Carpatica remains my preferred option"** is the key line: it tells them they'd win by deciding fast, which motivates them instead of making them defensive;
    - **The escape hatch** (*if you need more time, tell me*) makes you look reasonable and keeps the relationship safe if they can't decide by Friday;
    - Don't mention DataNest's name or the 7,500 figure – sharing the competing number invites them to lowball you at 7,600 instead of evaluating you on merit.

    One practical note: if Friday passes without an answer, follow up once, briefly. And before you send this, make sure DataNest's offer is actually still open on those terms – no training budget is a real cost for a junior, so weigh that against the higher salary and the bank's stability.
