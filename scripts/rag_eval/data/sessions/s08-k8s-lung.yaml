    kubectl rollout status deployment api
    ```

    Dacă după aplicare OOM-ul revine și la limita nouă, atunci nu mai e o problemă de configurare, ci consum real: `kubectl top pod` în timp ce rulează ca să vezi curba de memorie. Creștere lentă și constantă = leak (de obicei cache fără limită sau conexiuni care se acumulează); salt rapid la un anumit request = un endpoint care încarcă ceva mare în memorie.
- user: |
    Cum văd ce anume consumă memoria în procesul Python din pod, fără să opresc aplicația?
  assistant: |
    Cea mai bună unealtă e **py-spy**, care se atașează la procesul în rulare fără să-l oprească și fără instrumentare:

    ```bash
    # găsește PID-ul procesului Python
    kubectl exec api-7d9f8c6b5-x2kq4 -- ps aux

    # snapshot al stivei tuturor thread-urilor, cu alocări
    kubectl exec api-7d9f8c6b5-x2kq4 -- py-spy dump --pid 1
    ```

    Problema: imaginea ta nu are py-spy. Două opțiuni:

    **1. Pod ephemeral de debug** (nu atingi deployment-ul):

    ```bash
    kubectl debug -it api-7d9f8c6b5-x2kq4 --image=python:3.12 --target=api -- sh
    # în containerul de debug:
    pip install py-spy
    py-spy dump --pid 1
    ```

    `--target=api` îți dă acces la procesul din containerul original prin namespace-ul de proces partajat. Necesită `shareProcessNamespace: true` în pod spec, sau k3s recent îl activează prin `kubectl debug` automat — dacă nu merge, adaugă în Deployment:

    ```yaml
    spec:
      template:
        spec:
          shareProcessNamespace: true
    ```

    **2. Fără unelte externe**, direct din proces — dacă poți adăuga un endpoint de diagnostic temporar:

    ```python
    import tracemalloc, os
    from fastapi import APIRouter
    router = APIRouter()

    @router.get("/debug/memory")
    def memory():
        if not tracemalloc.is_tracing():
            tracemalloc.start(25)
        current, peak = tracemalloc.get_traced_memory()
        top = tracemalloc.take_snapshot().statistics("lineno")[:10]
        return {
            "rss_mb": int(open("/proc/self/status").read().split("VmRSS:")[1].split()[0]) // 1024,
            "traced_mb": current // 1024**2,
            "peak_mb": peak // 1024**2,
            "top": [str(s) for s in top],
        }
    ```

    `tracemalloc` are un overhead de ~2x pe alocări, deci nu-l lăsa activ permanent — activează-l doar pentru diagnostic.

    **Interpretare rapidă:**

    - RSS mare, dar `traced_mb` mic → memoria nu e în obiecte Python: e vorba de native extensions (numpy/pandas, bufferi C) sau de fragmentare;
    - crește lent, constant, la fiecare request → leak clasic: obiecte ținute în cache global, liste care se acumulează, conexiuni neînchise;
    - salt brusc la un endpoint anume → vezi în `py-spy dump` ce făcea procesul când a murit, sau corelează cu logurile de acces.

    Dacă vrei profilare continuă în producție, **memray** sau py-spy în modul `record` pe o fereastră scurtă îți dau flacăra alocărilor, dar rulează-le pe un pod de staging cu trafic reprodus, nu pe producție.
