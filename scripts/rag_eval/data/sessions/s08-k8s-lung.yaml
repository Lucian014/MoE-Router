    ```bash
    kubectl get deployment api -o jsonpath='{.spec.template.spec.containers[0].resources}'
    ```

    Dacă arată tot 512Mi, cauza e una din:

    - ai modificat `values-prod.yaml`, dar nu ai rulat `helm upgrade`;
    - ai rulat upgrade, dar cu alt fișier de values sau alt namespace;
