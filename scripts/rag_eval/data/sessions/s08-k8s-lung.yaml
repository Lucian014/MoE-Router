- user: |
    Fă-mi un runbook scurt cu toate incidentele de până acum, cum le-am recunoscut și cum le-am rezolvat.
  assistant: |
    # Runbook — Cluster k3s (prod)

    ## 1. Pod în Pending

    **Recunoaștere:** `kubectl get pod` → STATUS `Pending` minute în șir.
    **Diagnostic:** `kubectl describe pod <pod>` → secțiunea Events.
    **Cauze și rezolvare:**
    - `Insufficient memory` → reduce `resources.requests` sau eliberează nod;
    - `unbound PersistentVolumeClaims` → verifică `kubectl get pvc` și StorageClass-ul implicit;
    - `didn't match node affinity/selector` → corectează `nodeSelector` sau etichetează nodul (`kubectl label node <nod> role=database`);
    - taint pe control-plane → normal, nu interveni.

    ## 2. ImagePullBackOff — certificat registry intern

    **Recunoaștere:** Events cu `x509: certificate signed by unknown authority`.
    **Rezolvare:** CA-ul registry-ului în `/etc/rancher/k3s/registries.yaml` (`tls.ca_file`) pe **toate nodurile**, restart k3s/k3s-agent, șterge podul pentru pull nou. După upgrade k3s, reverifică registries.yaml și config.toml.tmpl.

    ## 3. CrashLoopBackOff la Postgres — versiune incompatibilă

    **Recunoaștere:** loguri `database files are incompatible with server`.
    **Rezolvare:** revino imediat la imaginea veche (tag fix, ex. `15.8`). Upgrade de versiune majoră doar prin dump & restore: instanță nouă cu PVC nou → `pg_dump -Fc` din veche → `pg_restore --no-owner` în nouă → verificare → comutare Service → păstrează PVC-ul vechi câteva zile.

    ## 4. OOMKilled la podul API

    **Recunoaștere:** STATUS `OOMKilled`, Exit Code 137.
    **Diagnostic:** `kubectl describe pod` — verifică dacă limita afișată e cea dorită (dacă nu: `helm upgrade` lipsă sau suprascris). `kubectl top pod` pentru curba de consum: creștere lentă = leak; salt la request = endpoint care încarcă mare.
    **Profilare fără oprire:** `kubectl debug --target=api` + `py-spy dump --pid 1`.

    ## 5. Traefik 404

    **Recunoaștere:** 404 de la ingress, aplicația pare pornită.
    **Diagnostic:** `curl -H 'Host: api.lab.local' http://<ip-nod>/`; `kubectl get ingress` (ADDRESS populat); `kubectl get endpoints <svc>` — **gol = selectorul Service-ului nu se potrivește cu etichetele podurilor** (cauză frecventă: `app: api-server` vs `app: api`).

    ## 6. Rotire parolă — aplicația folosește parola veche

    **Recunoaștere:** `password authentication failed` după schimbarea Secret-ului.
    **Cauză:** env vars din Secret se citesc doar la pornirea containerului.
    **Rezolvare:** `kubectl rollout restart deployment api`. Ordine corectă: `ALTER ROLE` în Postgres → actualizezi Secret → rollout.

    ## 7. PVC aproape plin (alertă Grafana)

    **Recunoaștere:** `KubePersistentVolumeFillingUp`, sub 10% liber.
    **Rezolvare:** identifică marii consumatori (`pg_total_relation_size`, pg_wal, loguri); extinde PVC-ul:
    ```bash
    kubectl patch pvc data-postgres-0 -p '{"spec":{"resources":{"requests":{"storage":"30Gi"}}}}'
    kubectl delete pod postgres-0   # local-path: resize-ul filesystem-ului la remontare
    ```
    Nu poți micșora PVC. Backup înainte.

    ## 8. Podul API nu se conectează după NetworkPolicy

    **Recunoaștere:** `Temporary failure in name resolution` = DNS blocat de egress policy.
    **Rezolvare:** politică `allow-dns` (UDP/TCP 53 spre namespace `kube-system`). Ordine de verificare: DNS → port → selectori.
    **Atenție:** flannel (CNI implicit k3s) **nu enforcează** NetworkPolicy — verifică ce CNI rulezi înainte să te bazezi pe politici.

    ## 9. Helm: „another operation is in progress"

    **Rezolvare:** `helm history <release>` → `helm rollback <release> <ultima-revizie-reușită>` → reia upgrade-ul.

    ## 10. Backup eșuat — autentificare

    **Recunoaștere:** `password authentication failed for user "backup"` în CronJob.
    **Rezolvare:** aliniază Secret-ul (`pg-backup-auth`) cu rolul din baza de date; test direct: `kubectl exec postgres-0 -- psql -U backup -d app -c 'SELECT 1;'`.

    ---

    **Reguli generale:**
    - Orice pod problemă: `describe` → Events, apoi `logs --previous`.
    - Backup nerestaurat testat nu e backup — test de restore lunar.
    - Tag-uri de imagine fixe (`15.8`), niciodată mobile (`15`, `latest`).
    - După orice upgrade de k3s: verifică registries.yaml, CNI, StorageClass.
