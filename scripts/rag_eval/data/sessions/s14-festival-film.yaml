    | **Comunicare & conținut** | 3 | Foto, video, stories live, postări în timp real, colectarea voturilor pentru Premiul Publicului |
    | **Logistică & evenimente paralele** | 3 | Recepțiile, cateringul, standul sponsorului din foaier, atelierul (sala, semnele, materialele), montaj/demontaj |
    | **Mobili & rezervă** | 2 | Alergători: cumpărături de ultim moment, probleme neprevăzute, înlocuiri la orice echipă |
    | **Coordonator voluntari** | 2 | Nu sunt „echipă", ci coordonatorii: unul general + unul adjunct, care țin legătura între echipe și cu echipa de organizare |

    ## Principii de organizare

    **1. Un coordonator per echipă** – fiecare echipă are un responsabil (poate un membru al echipei de organizare sau cel mai experimentat voluntar). Toate întrebările merg la el, nu haotic la organizatori.

    **2. Ture, nu zile întregi** – nimeni nu rezistă 10 ore de voluntariat cu energie. Programați în schimburi de 4-5 ore, mai ales la acces și sala:

    | Tura | Acces & sala |
    |---|---|
    | Dimineața (11–16) | 2 oameni |
    | Seara (16–22) | 2-3 oameni |

    Echipele de 3 de mai sus = efectiv acoperire cu rotație. Faceți un tabel Excel/Google Sheets cu ture pe zile și blocuri.

    **3. Briefing înainte de festival** – o întâlnire comună (prezențial sau online) cu o săptămână înainte: prezentarea programului, a rolurilor, a oamenilor-cheie, a răspunsurilor la întrebări frecvente („unde e toaleta", „când începe blocul X"). Dați-le un **document de 1-2 pagini cu tot ce trebuie să știe** – program, contacte, planul sălii.

    **4. Grup de WhatsApp/Telegram** – un grup general + grupuri pe echipe. Regulă: urgențele se rezolvă telefonic, grupul e pentru coordonare.

    **5. Ecusoane diferențiate** – voluntarii cu ecuson de altă culoare decât invitații, presa, juriul. Ajută publicul să știe pe cine să întrebe.

    **6. Ce primesc voluntarii** – spuneți-le clar de la început: ecuson, tricou (dacă aveți), masa în zilele festivalului, acreditare la toate proiecțiile, mențiune în credits și pe site, adeverință de voluntariat. Adeverința contează mult pentru studenți (dosare, burse, CV).

