    **8. Nu postați poze care arată sala goală** – alegeți unghiuri care arată sala plină (din spate spre scenă, planuri apropiate, publicul din față). E o practică universală, nu o înșelătorie

    **9. Analizați rapid de ce** – vineri seară e o seară slabă în general? Promovarea a fost insuficientă în ultimele 2 săptămâni? Prețul? Vremea? Aflați cauza ca să corectați pentru sâmbătă

