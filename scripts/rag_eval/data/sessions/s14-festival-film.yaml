    ## Pe moment (vineri seara)

    **4. Nu arătați panică** – publicul simte. O sală cu 50 de oameni entuziasmați e o deschidere decentă; deschiderea cu fața lungă e un dezastru. Moderatorul deschide cu energie, nu cu scuze

