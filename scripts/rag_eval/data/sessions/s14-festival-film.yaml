    ## 2. Satisfacția filmmakerilor (metrica cea mai importantă pe termen lung)

    - **Trimiteți un chestionar scurt** (5-6 întrebări, Google Forms) tuturor celor selectați: cum au găsit comunicarea, organizarea, proiecția, gazduirea. Ei vor decide dacă vă recomandă altor filmmakeri – și asta vă determină calitatea înscrierilor la ediția a II-a
