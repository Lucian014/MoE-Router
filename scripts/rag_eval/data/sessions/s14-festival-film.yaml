    | Echipă | Oameni | Responsabilități |
    |---|---|---|
    | **Acces & acreditări** | 3 | Prezența la intrare, verificarea biletelor/invitațiilor, predarea ecusoanelor, ghidarea spectatorilor la locuri |
    | **Coordonare sala / proiecții** | 3 | Câte unul pe fiecare bloc: introducerea blocurilor (sau sprijin pentru moderator), cronometrarea Q&A, comunicarea cu operatorul tehnic al cinematografului, gestionarea problemelor (locuri ocupate, întârzieri) |
