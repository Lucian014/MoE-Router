    - **Voluntarii NU sunt personal de servitute** – nu-i trimiteți la comisioane personale sau sarcini în afara festivalului; reputația printre studenți vă decide voluntarii de la ediția a II-a
    - **Mulțumiți public** – la gala de premiere, o mențiune specială + aplauze pentru echipa de voluntari; o poză de grup finală postată pe pagină, cu tag la fiecare
    - **Debriefing după festival** – o întâlnire scurtă cu coordonatorii de echipe: ce a mers, ce nu. Aur pur pentru ediția a II-a
    - **Recrutarea viitoare începe acum** – voluntarii mulțumiți devin coordonatori la ediția a II-a; tratați-i ca pe viitorii voștri colegi de organizare

    ## Un calendar minim

    | Când | Ce |
    |---|---|
    | 3-4 săptămâni înainte | Confirmarea celor 18 + repartizarea pe echipe |
    | 1 săptămână înainte | Briefing general + distribuirea documentului și a turelor |
