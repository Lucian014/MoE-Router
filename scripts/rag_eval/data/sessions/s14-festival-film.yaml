id: s14-festival-film
category: brainstorming
lang: ro
turns:
- user: |
    Organizez cu asociația studenților un festival de scurtmetraje, prima ediție, în Iași. Dă-mi idei de nume pentru festival.
  assistant: |
    Felicitări pentru inițiativă! Iată câteva idei de nume pentru festivalul de scurtmetraje din Iași:

    **Nume legate de oraș:**
    - **Scurt la Iași** – joc de cuvinte simplu și memorabil
    - **Copou Film Fest** – dacă are loc în zona universitară
    - **Iași Shorts** – internațional, ușor de promovat
    - **Festivalul de Scurtmetraje Palas** – dacă e găzduit acolo

    **Nume creative / poetice:**
    - **Cadru Scurt** – direct și elegant
    - **Primele Cadre** – potrivit pentru o primă ediție și pentru debutanți
    - **24 de Secunde** – sugerează formatul scurt
    - **Cut** – scurt, modern, termen din montaj
    - **Interferon** – joc de cuvinte cu "interferență" (specific Iașului, ca oraș de film și universitar)

    **Nume cu iz studențesc:**
    - **Student Cuts**
    - **Film de Camin** – cu autoironie
    - **Generația 24** – referire la cadrele pe secundă și la generația studențească

    **Nume cu potențial de brand pe termen lung:**
    - **Iași Short Film Festival (ISFF)** – clasic, serios, bun pentru parteneri și ediții viitoare
    - **ShortUp Iași** – sugerează ascensiunea tinerilor creatori

    Câteva sfaturi: alege un nume ușor de pronunțat și de căutat pe Google, verifică dacă domeniul de internet și conturile de social media sunt libere și gândește-te cum va suna la ediția a 5-a sau a 10-a.

    Vrei să dezvolt vreo variantă cu slogan sau să-ți fac și o propunere de identitate vizuală?
- user: |
    Ne place „Cadru 24”. Ce secțiuni de concurs am putea avea?
  assistant: |
    „Cadru 24" sună foarte bine! Iată câteva propuneri de secțiuni de concurs:

    **Secțiuni principale:**
    - **Ficțiune** – scurtmetraje narative, secțiunea centrală a oricărui festival
    - **Documentar** – scurtmetraje documentare
    - **Animație** – tehnică liberă (2D, 3D, stop-motion etc.)
    - **Experimental** – lucrări care împing granițele limbajului filmic

    **Secțiuni tematice / speciale:**
    - **Scurt studențesc** – dedicată exclusiv lucrărilor realizate în cadrul universitar (facultăți de teatru/film, dar și alte specializări)
    - **Debut** – pentru regizori cu primul sau al doilea film
    - **Locală / Iași și Moldova** – filme realizate în regiune sau de creatori locali; valorifică comunitatea și atrage public local
    - **Liceu** – dacă vreți să atrageți și publicul tânăr din licee

    **Secțiuni non-competiție (pentru program și atmosferă):**
    - **Panoramă** – selecție de scurtmetraje românești premiate recent, fără concurs
    - **Invitat de onoare** – retrospectivă a unui regizor sau studio
    - **Ateliere / masterclass** – nu sunt secțiuni de concurs, dar completează programul

    **Câteva sfaturi practice:**
    - Pentru o primă ediție, 3-4 secțiuni de concurs sunt suficiente – mai multe înseamnă mai multe jurii, trofee și bani de premii
    - Stabiliți clar criteriile de eligibilitate (durată max. – de obicei 15-20 min, anul producției, condiția de student sau nu)
    - O secțiune „locală" e ușor de promovat prin parteneri media din Iași și aduce public sigur

    Vreți să vă ajut și cu regulamentul concursului sau cu idei de premii?
- user: |
    Avem un buget de 15.000 de lei. Cum l-ai împărți pe categorii de cheltuieli?
  assistant: |
    Pentru o primă ediție cu 15.000 de lei, iată o împărțire realistă:

    **Repartizarea propusă:**

    | Categorie | Sumă | Procent |
    |---|---|---|
    | **Premii** | 3.500 lei | ~23% |
    | **Tehnic / proiecție** | 3.000 lei | 20% |
    | **Marketing & promovare** | 2.500 lei | ~17% |
    | **Onorarii invitați** | 2.000 lei | ~13% |
    | **Locație** | 1.500 lei | 10% |
    | **Print & materiale** | 1.000 lei | ~7% |
    | **Recepție / catering** | 800 lei | ~5% |
    | **Rezervă pentru neprevăzut** | 700 lei | ~5% |

    **Detalii pe categorii:**

    - **Premii (3.500 lei):** de ex. 1.000 lei pentru Marele Premiu, 500 lei pentru fiecare secțiune de concurs (3 × 500), 500 lei pentru Premiul Publicului. Alternativ, puteți oferi trofee + premii mai mici în bani sau în servicii (echipamente închiriate gratuit de la parteneri).

    - **Tehnic (3.000 lei):** videoproiector bun, ecran, sunet, tehnician. Dacă proiectați într-o cinematografă sau sală universitară cu echipamente proprii, această sumă scade drastic – verificați mai întâi asta.

    - **Marketing (2.500 lei):** materiale promoțiale, boost pe social media, posibil un afiș stradal. Ca asociație studențească, puteți compensa cu voluntari și parteneri media.

    - **Invitați (2.000 lei):** onorarii modeste + transport/cazare pentru 2-3 invitați (regizor, critic, cineast) pentru Q&A sau masterclass.

    - **Locație (1.500 lei):** chirie pentru sala de spectacol, dacă nu obțineți una gratuit. Universitatea, Casa de Cultură a Studenților sau Teatrul Național pot oferi spații gratuit sau redus pentru evenimente studențești – negociați întâi!

    **Cum să întindeți bugetul:**
    - Cereți sponsorizări în natură: catering, print, echipamente, cazare
    - Aplicați la fonduri: AFCN, Primăria Iași, Consiliul Județean, programul național de burse culturale
    - Taxa de înscriere la competiție (ex. 30-50 lei/film) poate acoperi parțial premiile
    - Bilete cu preț simbolic (10-15 lei) sau intrare liberă cu rezervare

    Vreți să detaliez o categorie anume sau să vă ajut cu o listă de potențiali sponsori din Iași?
- user: |
    Unde l-am putea ține? Ne gândim la Casa de Cultură a Studenților sau la Cinema Victoria. Avantaje și dezavantaje?
  assistant: |
    Ambele opțiuni sunt foarte bune pentru un festival de scurtmetraje studențesc. Iată o comparație:

    ## Casa de Cultură a Studenților (CCS)

    **Avantaje:**
    - **Costuri minime sau zero** – ca asociație studențească, aveți șanse mari să obțineți sala gratuit sau la preț simbolic prin parteneriat cu instituția
    - **Afiliație naturală** cu publicul țintă – studenții știu deja unde e
    - **Spații multiple** – puteți folosi sala mare pentru proiecții și alte săli/foaier pentru ateliere, expoziții, zone de networking
    - **Flexibilitate program** – mai ușor de negociat 2-3 zile de festival
    - Atmosferă permisivă pentru un eveniment de debut, cu posibilitatea de a decora și personaliza spațiul

    **Dezavantaje:**
    - **Echipamente tehnice mai slabe** – probabil va trebui să închiriați proiector, ecran, sunet (din bugetul tehnic de 3.000 lei)
    - **Calitatea proiecției** – nu veți avea condiții de cinema propriu-zis, ceea ce contează pentru o experiență filmică
    - **Prestigi mai mic** pentru invitați și presă decât un cinematograf
    - Acustica și confortul sălii pot fi imprevizibile

    ## Cinema Victoria

    **Avantaje:**
    - **Condiții tehnice excelente** – proiecție și sunet profesioniste, economisiți aproape tot bugetul tehnic
    - **Prestigi și credibilitate** – un festival care debutează la un cinematograf istoric din Iași arată profesionist, atrage mai ușor invitați, presă și sponsori
    - **Experiență autentică de cinema** pentru public și filmele selectate
    - Locație centrală, vizibilă, ușor de găsit

    **Dezavantaje:**
    - **Cost mai mare** – închirierea unei săli de cinema poate consuma 1.500-3.000 lei/zi, depășind bugetul alocat locației
    - **Disponibilitate limitată** – cinematograful are propriul program de filme, deci datele festivalului depind de ei
    - **Mai puțină flexibilitate** pentru evenimente paralele (ateliere, expoziții, recepții)
    - Negocierile cu o companie de cinema sunt mai rigide decât cu propria universitate

    ## Recomandarea mea

    **Varianta hibridă** ar fi ideală dacă bugetul permite: **gala de deschidere și premiere la Cinema Victoria** (1 seară, pentru impact maxim), iar **proiecțiile competiției și atelierele la CCS** (2-3 zile, gratuit sau aproape). Astfel combinați prestigiul cu accesibilitatea.

    Dacă trebuie să alegeți doar una: pentru o **prima ediție**, CCS e alegerea mai sigură – riscul financiar e mai mic, iar relația cu instituția vă poate aduce și alte sprijinuri (cazare invitați, voluntari, promovare). Cinema Victoria rămâne un obiectiv excelent pentru ediția a 2-a sau a 3-a, când festivalul are deja nume și public.

    Vreți să vă ajut cu un model de email de parteneriat pentru CCS sau Cinema Victoria?
- user: |
    Am ales Cinema Victoria, trei zile, 14–16 mai. Cum ar arăta programul pe zile?
  assistant: |
    Iată o propunere de program pentru cele trei zile, structurată pe blocuri de proiecție:

    ## Ziua 1 – 14 mai (Vineri) – Deschidere

    | Ora | Activitate |
    |---|---|
    | 17:00 – 18:00 | **Accreditări și welcome** – predarea ecusoanelor pentru juriu, invitați, filmmakeri |
    | 18:00 – 19:00 | **Ceremonia de deschidere** – discursuri (asociația, reprezentant Cinema Victoria, eventual un oficial de la Primărie/facultate), prezentarea juriului |
    | 19:00 – 20:30 | **Proiecție inaugurală** – selecție de scurtmetraje reprezentative (ex. filmele cu potențial de premiu sau o panoramă) |
    | 20:30 – 21:30 | **Q&A cu filmmakerii prezenți** |
    | 21:30 – 23:00 | **Recepție de deschidere** – networking (în foaier sau la un partener – cafenea/bar din zonă) |

    ## Ziua 2 – 15 mai (Sâmbătă) – Ziua competiției

    | Ora | Activitate |
    |---|---|
    | 11:00 – 13:00 | **Masterclass / atelier** – cu invitatul de onoare (intrare liberă, cu rezervare) |
    | 14:00 – 15:30 | **Blocul 1: Ficțiune** (4-5 filme) |
    | 16:00 – 17:15 | **Blocul 2: Animație + Experimental** |
    | 17:45 – 19:15 | **Blocul 3: Documentar** |
    | 19:45 – 21:15 | **Blocul 4: Scurt studențesc / Debut** |
    | 21:30 – 22:30 | **Q&A cu regizorii zilei** |

    *Pauzele de 30 min între blocuri lasă timp pentru schimb de sală, discuții și postări pe social media.*

    ## Ziua 3 – 16 mai (Duminică) – Public și premiere

    | Ora | Activitate |
    |---|---|
    | 12:00 – 13:30 | **Proiecție pentru familii / liceeni** – bloc accesibil, eventual filmele secțiunii Liceu sau o selecție „all ages" |
    | 14:00 – 15:30 | **Redifuzare** – blocul cel mai cerut (reproiectarea filmelor favorite, la cererea publicului) |
    | 16:00 – 17:00 | **Q&A final / meet & greet** cu filmmakerii |
    | 18:00 – 19:00 | **Proiecția filmelor nominalizate la Marele Premiu** (opțional, dacă juriul nu a decis deja) |
    | 19:30 – 20:30 | **Gala de premiere** – anunțarea câștigătorilor, decernarea trofeelor și premiilor |
    | 20:30 – 22:00 | **Petrecere de închidere** – networking, mulțumiri echipei și voluntarilor |

    **Câteva observații practice:**

    - **Vineri seară** e momentul cu cel mai mult public tânăr, deci deschiderea atunci e o alegere bună; duminica după-amiază e mai slabă pentru proiecții, dar perfectă pentru gala de premiere
    - **Verificați programul Cinema Victoria** – ei au propriile proiecții comerciale, deci blocurile de mai sus trebuie negociate în avans
    - **Premiul Publicului** se poate vota după fiecare bloc (bilete de vot sau QR code) și se anunță la gala
    - Lăsați **tampon de 15-30 min** în fiecare bloc – scurtmetrajele depășesc mereu durata estimată cu Q&A-uri spontane
    - Dacă numărul de filme selectate e mare, puteți adăuga un bloc vineri după-amiază (ex. 15:00) pentru secțiunea locală

    Vreți să vă ajut și cu un model de comunicat de presă pentru lansarea programului sau cu textul pentru bilete/acreditări?
- user: |
    Câte filme putem proiecta realist într-o zi, cu pauze și discuții cu regizorii?
  assistant: |
    Depinde de durata medie a filmelor și de cât de mult timp vreți să alocați discuțiilor, dar iată un calcul realist:

    ## Calculul de bază

    **Un bloc de proiecție de ~90 de minute** încape confortabil într-o fereastră de 2 ore (cu introducere și tampon):

    - Filme de **5-10 minute** (tipice pentru scurtmetraje studențești): **6-8 filme pe bloc**
    - Filme de **10-15 minute**: **4-5 filme pe bloc**
    - Filme de **15-20 minute**: **3-4 filme pe bloc**

    **La care se adaugă Q&A:** 10-15 minute după fiecare bloc, cu 2-3 regizori prezenți, nu toți – altfel depășiți timpul.

    ## Totalul pe o zi

    Cu programul pe care l-am schițat (4 blocuri de competiție + Q&A-uri):

    - **Realist: 16-22 de filme pe zi**, adică **~40-60 de filme pe întreg festivalul** (3 zile, dar ziua 1 și 3 au mai puține proiecții de competiție)

    ## Limitele de care să țineți cont

    - **Atenția publicului scade** – după ~2 ore de proiecție continuă, oamenii obosesc. Pauzele de 30 min între blocuri nu sunt opționale, sunt esențiale
    - **Calitatea vs. cantitatea** – pentru o primă ediție, e mai bine să aveți 30 de filme bune decât 60 cu selecție slăbită. Reputația festivalului se construiește pe calitatea selecției
    - **Juriul trebuie să vadă totul** – dacă aveți prea multe filme, juriul nu poate evalua serios în 3 zile
    - **Durata medie contează** – dacă primiți multe filme de 15-20 min, reduceți numărul pe bloc

    ## Recomandarea mea pentru prima ediție

    **30-40 de filme în total**, distribuite astfel:

    | Zi | Filme |
    |---|---|
    | Vineri (deschidere) | 5-7 (selecție reprezentativă) |
    | Sâmbătă (competiția) | 16-20 (4 blocuri) |
    | Duminică | 5-8 (redifuzări + nominalizate) |

    Asta înseamnă la înscriere să vizați **100-150 de filme** (o rată de selecție de ~25-30% e sănătoasă pentru un festival la debut și vă dă material suficient pentru o selecție solidă).

    Un truc: stabiliți **durata maximă de admitere la 15 minute** – vă simplifică dramatic calculul programării și al jurizării.

    Vreți să vă ajut să întocmiți și regulamentul de înscriere (durată, anul producției, drepturi, taxa)?
- user: |
    Cum facem apelul de înscriere? Ce le cerem regizorilor?
  assistant: |
    Iată cum structurați apelul de înscriere și ce materiale să cereți:

    ## Unde publicați apelul

    - **FilmFreeway** – platforma standard pentru festivaluri, gratuită pentru organizatori; majoritatea regizorilor o folosesc deja și vă dă acces la o bază internațională de filmmakeri. Creați cont de festival și publicați acolo
    - **Pagina proprie / social media** – Instagram și Facebook sunt esențiale pentru publicul din România
    - **Grupuri și comunități** – grupurile de filmmakeri tineri de pe Facebook, comunitățile de la facultățile de teatru/film (UNATC, Iași, Cluj, Timișoara), rețelele de cinema independent
    - **Parteneri media** – presa culturală locală și națională (Adevărul Cultural, Liternet, Observator cultural)

    ## Ce le cereți regizorilor

    **Despre film:**
    - **Link de vizionare online** (Vimeo/YouTube cu parolă sau link privat) – nu cereți fișiere la înscriere; le cereți doar de la cei selectați
    - **Durata maximă: 15 minute** (recomandarea de mai devreme)
    - **Anul producției: 2023-2025** – filmele să fie recente
    - **Subtitrări în română sau engleză** – dacă vreți și înscrieri internaționale, engleza e obligatorie; dacă e festival doar românesc, româna
    - **Premiera** – precizați dacă acceptați filme care au mai rulat (premiera națională/internațională sau fără restricții); pentru debut, „fără restricții" e mai realist

    **Despre regizor:**
    - Nume, contact (email, telefon)
    - **Biografie scurtă** (max. 100 de cuvinte)
    - **Confirmare de student** (adeverință sau scan după carnet) – doar pentru secțiunea studențească
    - **Foto regizor** – pentru program și social media (de la selectați)

    **Despre film (materiale promoționale – de la selectați):**
    - Sinopsis (max. 100 de cuvinte)
    - Poster / fotogramă din film (min. 1920px, pentru afiș și social media)
    - Fișierul final de proiecție: **DCP sau ProRes, Full HD/4K**, cu subtitrări încorporate
    - Trailer (opțional, 30-60 sec)
    - **Semnarea unui formular de consimțământ**: drepturile de proiecție la festival, acord pentru folosirea fragmentelor în materiale promoționale

    ## Structura apelului (text model)

    > **CADRU 24 – Festival de Scurtmetraje, Iași, 14–16 mai 2025**
    >
    > Prima ediție a festivalului... [2-3 fraze despre festival și misiune]
    >
    > **Secțiuni de concurs:** Ficțiune / Animație / Documentar / Scurt studențesc
    >
    > **Cine poate participa:** [studenți și tineri regizori / toți, cu condiția X]
    >
    > **Condiții:** durată max. 15 min, produs după 1 ianuarie 2023, subtitrări în română/engleză
    >
    > **Taxă de înscriere:** [gratuit / 30 lei / 5$ pe FilmFreeway]
    >
    > **Deadline:** [ex. 15 martie] – **notificarea selecției:** [ex. 15 aprilie]
    >
    > **Premii:** Marele Premiu (1.000 lei), premii pe secțiuni, Premiul Publicului
    >
    > **Înscrieri:** [link FilmFreeway / formular]

    ## Calendar recomandat (pentru festivalul de 14-16 mai)

    | Data | Etapă |
    |---|---|
    | **10 ianuarie – 15 martie** | Perioada de înscriere (2 luni e minimul; ideal 3) |
    | **15-25 martie** | Vizionarea și selecția (comisie de selecție, nu doar juriul) |
    | **1 aprilie** | Notificarea filmmakerilor selectați |
    | **1-10 mai** | Primirea fișierelor finale de proiecție de la selectați |
    | **14-16 mai** | Festival |

    **Câteva sfaturi:**

    - **Taxa de înscriere**: pentru un festival la debut, o taxă mică (sau zero) pe FilmFreeway atrage mai multe filme; dacă vreți venit, taxa simbolică de 5$ e standard și acceptată
    - **Separă comisia de selecție de juriu** – comisia alege filmele care intră în competiție, juriul (3 persoane) premiază. Astfel juriul nu e copleșit de 150 de filme
    - **Răspundeți tuturor** – și celor respinși. Un email politicos de respingere construiește reputație pentru edițiile următoare
    - **Cereți fișierele finale imediat după notificare**, cu deadline ferm – mereu vor fi regizori care trimit în ultima zi sau cu probleme tehnice

    Vreți să vă scriu textul complet al apelului de înscriere, gata de publicat, sau regulamentul detaliat?
- user: |
    Durata maximă a unui film: 15 minute sau 20? Ce recomanzi?
  assistant: |
    **Recomand 15 minute.** Iată de ce:

    ## Argumente pentru 15 minute

    - **Calitatea selecției** – cu limita de 15 min, veți primi mai puține filme lungi și slabe; filmele care depășesc 15 min sunt adesea scurtmetraje care de fapt „nu și-au găsit" forma finală
    - **Programare mai flexibilă** – cu 15 min max, un bloc de 90 de minute încape sigur cu 6-7 filme; cu 20 min, riscă să încapă doar 4, iar un film de 20 min „moarte" trage tot blocul în jos
    - **Jurizare mai ușoară** – juriul și comisia de selecție vizionează mai repede și evaluează mai serios
    - **Standard internațional** – multe festivaluri de renume (ex. cele calificate pentru Oscar) au limita de 40 min, dar festivalurile de scurtmetraje studențești și de debut funcționează frecvent cu 15-20 min; 15 min semnalează un festival cu selecție atentă
    - **Atenția publicului** – blocurile rămân dinamice, iar publicul revine a doua zi

    ## Argumentele pentru 20 minute

    - Riscă să pierdeți câteva filme bune care au nevoie de respirație (mai ales documentare, unde 18-20 min e comun)
    - Regizorii mai experimentați pot fi descurajați de o limită strictă

    ## Soluția de compromis (dacă vă temeți de pierderi)

    Puteți stabili **15 minute pentru ficțiune, animație și studențesc, și 20 de minute pentru documentar** – e o practică des întâlnită, pentru că documentarele au nevoie obiectiv de mai mult timp. Sau introduceți o **secțiune non-competiție „Panoramă"** unde acceptați filme de până la 20-25 min, fără premii – astfel nu respingeți automat filmele lungi bune, dar nu le lăsați să încarce competiția.

    **Pe scurt:** 15 min pentru competiție, eventual 20 pentru documentar. Pentru o primă ediție, mai puține minute = mai mult control asupra programului și o selecție mai strânsă.

    Vreți să trecem la redactarea regulamentului cu aceste condiții?
- user: |
    Am decis 20 de minute. Și taxa de înscriere: punem sau nu?
  assistant: |
    Cu 20 de minute, recalculați blocurile la 4-5 filme pe bloc de 90 de minute – merge perfect.

    ## Taxa de înscriere: recomandarea mea

    **Puneți o taxă mică, dar cu excepții generoase.** Iată raționamentul:

    ## Argumentele pentru taxă

    - **Filtrează înscrierile serios** – fără taxă, primiți un val de filme trimise „în masă" pe FilmFreeway, multe fără nicio legătură cu profilul festivalului; comisia de selecție pierde timp vizionând materiale nepotrivite
    - **Venit mic dar sigur** – la 5$ × 100 de înscrieri = ~2.300 lei, adică aproape jumătate din bugetul de premii
    - **Standard în industrie** – aproape toate festivalurile de pe FilmFreeway au taxă; absența ei nu vă aduce neapărat mai multe filme bune, ci mai multe filme, punct

    ## Argumentele contra

    - Un festival la **prima ediție, fără nume**, cu taxă mare se poate confrunta cu prea puține înscrieri
    - Studenții și creatorii tineri (publicul vostru natural) sunt sensibili la costuri

    ## Soluția practică

    **Taxă de 3-5$ pe FilmFreeway** (sau 20-30 lei direct), cu:

    - **Gratuitate pentru secțiunea studențească** – coerent cu identitatea festivalului; cereți doar adeverința de student
    - **Gratuitate pentru filme din Iași și Moldova** – stimulează secțiunea locală, care vă aduce public și presă
    - **Deadline-uri etajate**: early bird (gratuit sau redus, ex. până la 1 februarie), regular (taxă normală), late (taxă mărită) – mecanism standard pe FilmFreeway care grăbește înscrierile devreme
    - **Coduri de renunțare la taxă (waiver)** pentru parteneri, facultăți partenere și presă

    ## De reținut

