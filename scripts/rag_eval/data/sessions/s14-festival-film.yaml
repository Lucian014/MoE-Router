    **6. Ajustați sala fizic** – dacă s-a confirmat că vin puțini, mutați oamenii compact, închideți zona din spate cu cortină sau cu scaune. Se face discret, înainte de deschidere

    **7. Valorificați ce aveți** – cu 50 de oameni, Q&A-ul poate fi mai intim și mai bun decât cu 300. Un public mic dar implicat creează atmosfera de „festival pentru inițiați", care e chiar dorită de mulți filmmakeri

