    - **Voturile pentru Premiul Publicului** – câți au votat = câți s-au implicat activ, nu doar au asistat
    - **Rămânerea la Q&A și recepții** – dacă oamenii pleacă imediat după filme, e un semn; dacă rămân să discute, festivalul creează comunitate
