    - **Reach și interacțiuni** pe postările din timpul festivalului
    - **Conținut generat de participanți** – câți oameni v-au etichetat, au postat stories din festival? Numărați-le – e publicitate gratuită și indicator de entuziasm
    - **Mențiuni în presă** – câte articole/interviuri/radio, și în ce publicații

