# Requests that need nothing from the conversation's history: asked in EVERY session, they measure
# the noise RAG adds (fragments that are sent although no earlier turn is relevant).
#   far   unrelated to any session (a haiku, a capital, a recipe)
#   near  same broad domain as many sessions (general Python / SQL / stats / writing), but a new
#         question: the hard case for a threshold
prompts:
  - {kind: far, lang: ro, prompt: "scrie-mi un haiku despre luni dimineata"}
  - {kind: far, lang: ro, prompt: "care e capitala Australiei?"}
  - {kind: far, lang: ro, prompt: "scrie o poezie scurta despre toamna"}
