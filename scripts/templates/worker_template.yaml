apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-model-name-placeholder
  namespace: processing
spec:
  replicas: REPLICAS_PLACEHOLDER
  selector:
    matchLabels:
      app: worker
      model: model-name-placeholder
  template:
    metadata:
      labels:
        app: worker
        model: model-name-placeholder
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-compute
      containers:
      - name: worker
        image: 192.168.56.102:30500/moe-worker:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: MODEL_NAME
          value: "MODEL_NAME_PLACEHOLDER"
        - name: ENGINE_TYPE
          value: "ENGINE_TYPE_PLACEHOLDER"
        - name: INFERENCE_HOST
          value: "INFERENCE_HOST_PLACEHOLDER"
        - name: RABBITMQ_HOST
          value: "rabbitmq.platform.svc.cluster.local"
        - name: RABBITMQ_USER
          valueFrom:
            secretKeyRef:
              name: rabbit-secret
              key: RABBITMQ_DEFAULT_USER
        - name: RABBITMQ_PASS
          valueFrom:
            secretKeyRef:
              name: rabbit-secret
              key: RABBITMQ_DEFAULT_PASS