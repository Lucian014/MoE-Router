apiVersion: apps/v1
kind: Deployment
metadata:
  name: moe-router
  namespace: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: moe-router
  template:
    metadata:
      labels:
        app: moe-router
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-route
      containers:
      - name: router
        image: 192.168.56.102:30500/moe-router:latest
        imagePullPolicy: Always
        env:
        - name: MIDDLEWARE_QUEUE
          value: "router.requests"
        - name: RABBITMQ_HOST
          value: "rabbitmq.platform.svc.cluster.local"
        - name: RABBITMQ_USER
          valueFrom:
            secretKeyRef:
              name: rabbit-secret
              key: RABBITMQ_DEFAULT_USER
        - name: RABBITMQ_PASS
          valueFrom:
            secretKeyRef:
              name: rabbit-secret
              key: RABBITMQ_DEFAULT_PASS
        - name: POSTGRES_HOST
          value: "postgres.platform.svc.cluster.local"

        - name: POSTGRES_PORT
          value: "5432"

        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_DB

        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER

        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD