# =============================================================================
# Router Deployment -- the two Laya classifiers run INSIDE each router pod.
#
# Each pod = 1 container: RabbitMQ consumer + domain classifier + complexity classifier.
# The image is public and ships without weights; the classifiers are private on Hugging Face.
# The init container (same image, router/download_checkpoints.py) downloads them with the
# HF_TOKEN from Secret `hf-token` into the `router-checkpoints` PVC (router_checkpoints_pvc.yaml),
# so only the first start downloads; restarts just re-check the files. Create the Secret once:
#
#   kubectl create secret generic hf-token -n gateway --from-literal=HF_TOKEN=hf_...
#
# Scale classification capacity by scaling this Deployment (replicas, or KEDA on the
# router.requests queue). The PVC is ReadWriteOnce: replicas must stay on one node
# (they do: nodeSelector below).
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moe-router
  namespace: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: moe-router
  template:
    metadata:
      labels:
        app: moe-router
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-route
      terminationGracePeriodSeconds: 30
      initContainers:
      - name: download-checkpoints
        image: 192.168.56.102:30500/moe-router:latest
        imagePullPolicy: Always
        command: ["python", "router/download_checkpoints.py"]
        env:
        - name: HF_HUB_OFFLINE          # the image is offline by default
          value: "0"
        - name: CHECKPOINT_DIR
          value: "/checkpoints"
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: HF_TOKEN
        volumeMounts:
        - name: checkpoints
          mountPath: /checkpoints
      containers:
      - name: router
        image: 192.168.56.102:30500/moe-router:latest
        imagePullPolicy: Always
        env:
        - name: MIDDLEWARE_QUEUE
          value: "router.requests"
        - name: CLASSIFIER_DEVICE
          value: "cpu"
        - name: COMPLEXITY_THRESHOLD
          value: "0.5"
        - name: CATALOG_REFRESH_SECONDS
          value: "30"
        - name: OMP_NUM_THREADS
          value: "2"
        - name: DOMAIN_CHECKPOINT
          value: "/checkpoints/laya-domain-v4"
        - name: COMPLEXITY_CHECKPOINT
          value: "/checkpoints/laya-complexity-v2"
        # --- RabbitMQ ------------------------------------------------------------------------
        - name: RABBITMQ_HOST
          value: "rabbitmq.platform.svc.cluster.local"
        - name: RABBITMQ_USER
          valueFrom:
            secretKeyRef:
              name: rabbit-secret
              key: RABBITMQ_DEFAULT_USER
        - name: RABBITMQ_PASS
          valueFrom:
            secretKeyRef:
              name: rabbit-secret
              key: RABBITMQ_DEFAULT_PASS
        # --- Postgres ------------------------------------------------------------------------
        - name: POSTGRES_HOST
          value: "postgres.platform.svc.cluster.local"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        # the router writes /tmp/ready once it has a valid catalog and is consuming
        # (classifier loading + catalog wait can take a while: no liveness probe on purpose)
        readinessProbe:
          exec:
            command: ["test", "-f", "/tmp/ready"]
          initialDelaySeconds: 10
          periodSeconds: 5
        volumeMounts:
        - name: checkpoints
          mountPath: /checkpoints
          readOnly: true
        resources:
          requests:
            cpu: "1"
            memory: "3Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
      volumes:
      - name: checkpoints
        persistentVolumeClaim:
          claimName: router-checkpoints
