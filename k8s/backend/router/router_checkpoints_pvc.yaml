# Cache for the private Laya classifiers, filled by the router pod's init container
# (see router_deployment.yaml). Two mmBERT checkpoints: a few GB is plenty.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: router-checkpoints
  namespace: gateway
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
