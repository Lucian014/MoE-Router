apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-gateway
  namespace: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastapi-gateway
  template:
    metadata:
      labels:
        app: fastapi-gateway
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-compute
      containers:
      - name: fastapi-gateway
        image: 192.168.56.102:30500/fastapi-gateway
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: RABBITMQ_HOST
          value: "rabbitmq.platform.svc.cluster.local"
        - name: RABBITMQ_USER
          valueFrom:
            secretKeyRef:
              name: rabbit-secret
              key: RABBITMQ_DEFAULT_USER
        - name: RABBITMQ_PASS
          valueFrom:
            secretKeyRef:
              name: rabbit-secret
              key: RABBITMQ_DEFAULT_PASS