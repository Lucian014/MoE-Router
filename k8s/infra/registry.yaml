apiVersion: apps/v1
kind: Deployment
metadata:
  name: container-registry
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: container-registry
  template:
    metadata:
      labels:
        app: container-registry
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-infra
      containers:
      - name: database
        image: registry:2
        ports:
        - containerPort: 5000
          name: database-port
        volumeMounts:
        - name: database-storage
          mountPath: /var/lib/registry
      volumes:
      - name: database-storage
        hostPath:
          path: /var/local-database
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: container-registry
  namespace: platform
spec:
  type: NodePort
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500
      name: database-port
  selector:
    app: container-registry