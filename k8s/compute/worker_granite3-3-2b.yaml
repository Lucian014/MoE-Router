apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-granite3-3-2b
  namespace: processing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
      model: granite3-3-2b
  template:
    metadata:
      labels:
        app: worker
        model: granite3-3-2b
    spec:
      # a generation can take minutes: give in-flight requests time to finish on shutdown
      terminationGracePeriodSeconds: 90
      nodeSelector:
        kubernetes.io/hostname: k8s-compute
      containers:
      - name: worker
        image: 192.168.56.102:30500/moe-worker:latest
        imagePullPolicy: IfNotPresent
        # the worker writes /tmp/ready once its engine serves the model and it is consuming
        readinessProbe:
          exec:
            command: ["test", "-f", "/tmp/ready"]
          initialDelaySeconds: 5
          periodSeconds: 10
        env:
        - name: SHUTDOWN_GRACE_SECONDS
          value: "80"
        - name: MODEL_NAME
          value: "granite3.3:2b"
        - name: ENGINE_TYPE
          value: "ollama"
        - name: INFERENCE_HOST
          value: "http://ollama-service.processing.svc.cluster.local:11434"
        - name: RABBITMQ_HOST
          value: "rabbitmq.platform.svc.cluster.local"
        - name: RABBITMQ_USER
          valueFrom:
            secretKeyRef:
              name: rabbit-secret
              key: RABBITMQ_DEFAULT_USER
        - name: RABBITMQ_PASS
          valueFrom:
            secretKeyRef:
              name: rabbit-secret
              key: RABBITMQ_DEFAULT_PASS