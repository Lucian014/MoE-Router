apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-gemma3-4b
  namespace: processing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
      model: gemma3-4b
  template:
    metadata:
      labels:
        app: worker
        model: gemma3-4b
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-compute
      containers:
      - name: worker
        image: 192.168.56.102:30500/moe-worker:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: MODEL_NAME
          value: "gemma3:4b"
        - name: ENGINE_TYPE
          value: "ollama"
        - name: INFERENCE_HOST
          value: "http://ollama-service.processing.svc.cluster.local:11434"
        - name: RABBITMQ_HOST
          value: "rabbitmq.platform.svc.cluster.local"
        - name: RABBITMQ_USER
          valueFrom:
            secretKeyRef:
              name: rabbit-secret
              key: RABBITMQ_DEFAULT_USER
        - name: RABBITMQ_PASS
          valueFrom:
            secretKeyRef:
              name: rabbit-secret
              key: RABBITMQ_DEFAULT_PASS