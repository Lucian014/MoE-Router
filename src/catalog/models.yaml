# =============================================================================
# CENTRAL MODEL CATALOG — Single Source of Truth
# =============================================================================
# Mirrors the existing workers in k8s/compute/:
#   worker_llama3_1.yaml   -> llama3.1
#   worker_qwen.yaml       -> qwen (general)
#   worker_qwen_math.yaml  -> qwen math variant
#
# ASSUMPTIONS — verify these against your actual worker_*.yaml files and
# correct if they differ, since only filenames were visible, not content:
#   - exact Ollama tags (e.g. "8b" vs "8b-instruct" vs a different size)
#   - replica counts (defaulted to 1 for all three)
#
# `engine: ollama` matches your ollama_server.yaml serving all three.
# =============================================================================

models:
  - model_id: "llama3.1:8b"
    engine: "ollama"
    description: >
      General-purpose conversational model optimized for natural dialogue,
      everyday questions, summarization, rewriting, translation, brainstorming,
      and general knowledge tasks. Best suited for broad requests that do not
      require specialized mathematical or programming expertise.
    examples:
      - "Summarize this article into five key points."
      - "Translate this paragraph from English to Romanian."
      - "Help me brainstorm ideas for a birthday party."
    replicas: 1

  - model_id: "qwen2.5:7b"
    engine: "ollama"
    description: >
      General-purpose instruction-following model with strong multilingual
      capabilities and reliable performance across writing, reasoning,
      explanation, and broad question-answering tasks. Best suited for
      structured responses, writing assistance, multilingual requests, and
      general-purpose problem solving that does not require a highly
      specialized model.
    examples:
      - "Rewrite this email to sound more professional and concise."
      - "Explain how Kubernetes deployments work in simple terms."
      - "Compare these two approaches and recommend the better one."
    replicas: 1

  - model_id: "mightykatun/qwen2.5-math:7b"
    engine: "ollama"
    description: >
      Specialized mathematical reasoning model designed for quantitative
      problem solving, arithmetic, algebra, calculus, probability, geometry,
      and multi-step mathematical reasoning. Best suited for problems that
      require explicit calculations, symbolic manipulation, equations, or
      rigorous step-by-step mathematical solutions.
    examples:
      - "Solve the equation 2x² - 5x - 3 = 0 and show the steps."
      - "Calculate the derivative of f(x) = x² sin(x)."
      - "A fair coin is flipped 10 times. What is the probability of getting exactly 6 heads?"
    replicas: 1