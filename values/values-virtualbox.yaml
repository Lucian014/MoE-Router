#

global:
  imageTag: main
  imagePullPolicy: Always

postgresql:
  nodeSelector:
    kubernetes.io/hostname: k8s-infra

rabbitmq:
  nodeSelector:
    kubernetes.io/hostname: k8s-infra

gateway:
  nodeSelector:
    kubernetes.io/hostname: k8s-route
  ingress:
    host: llm-router

router:
  hfToken:
    existingSecret: hf-token
  nodeSelector:
    kubernetes.io/hostname: k8s-route

memory:
  nodeSelector:
    kubernetes.io/hostname: k8s-route

ollama:
  persistence:
    hostPath: /var/models/ollama
  resources:
    requests: { cpu: "1", memory: 2Gi }
    limits: { memory: 20Gi }
  nodeSelector:
    kubernetes.io/hostname: k8s-compute

worker:
  nodeSelector:
    kubernetes.io/hostname: k8s-compute
