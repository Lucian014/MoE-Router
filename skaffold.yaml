apiVersion: skaffold/v4beta7
kind: Config
metadata:
  name: moe-router
build:
  insecureRegistries:
    - 192.168.56.102:30500
  artifacts:
    - image: 192.168.56.102:30500/fastapi-gateway
      context: .
      custom:
        buildCommand: podman build -t $IMAGE . -f src/gateway/Dockerfile && podman push --tls-verify=false $IMAGE
        dependencies:
          paths:
            - src/gateway/**/*
            - src/shared/**/*
    - image: 192.168.56.102:30500/moe-worker
      context: .
      custom:
        buildCommand: podman build -t $IMAGE . -f src/worker/Dockerfile && podman push --tls-verify=false $IMAGE
        dependencies:
          paths:
            - src/worker/**/*
            - src/shared/**/*
    - image: 192.168.56.102:30500/moe-router
      context: .
      custom:
        buildCommand: podman build --secret id=hf_token,env=HF_TOKEN -t $IMAGE . -f src/router/Dockerfile && podman push --tls-verify=false $IMAGE
        dependencies:
          paths:
            - src/router/**/*
            - src/shared/**/*
            - src/database/**/*
          ignore:
            - src/router/checkpoints/**
            - "**/__pycache__/**"

manifests:
  rawYaml:
    - k8s/backend/fastapi/*.yaml
    - k8s/backend/router/*.yaml
    - k8s/compute/ollama_server.yaml
    - k8s/compute/worker_*.yaml

