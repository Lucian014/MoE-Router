{{- /* Broker credentials. The keys are the env var names the services read
       (shared/config.py: RABBITMQ_USER, RABBITMQ_PASS), so pods use envFrom; the rabbitmq
       server maps them to its own RABBITMQ_DEFAULT_USER / _PASS. */ -}}
{{- if not .Values.rabbitmq.auth.existingSecret }}
{{- if and (not .Values.rabbitmq.enabled) (not .Values.rabbitmq.auth.password) }}
{{- fail "an external RabbitMQ needs rabbitmq.auth.password or rabbitmq.auth.existingSecret" }}
{{- end }}
{{- $name := include "moe.rabbitmq.secretName" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "moe.labels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
  annotations:
    # keep it on `helm uninstall`: the data volume was initialised with this password
    helm.sh/resource-policy: keep
type: Opaque
data:
  RABBITMQ_USER: {{ .Values.rabbitmq.auth.username | b64enc }}
  RABBITMQ_PASS: {{ include "moe.password" (dict "root" . "secret" $name "key" "RABBITMQ_PASS" "value" .Values.rabbitmq.auth.password) }}
{{- end }}
