{{- /* Non-secret settings shared by every service (names = shared/config.py env vars).
       Credentials come from the Postgres / RabbitMQ Secrets, also via envFrom. */ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "moe.fullname" . }}-config
  labels:
    {{- include "moe.labels" . | nindent 4 }}
data:
  RABBITMQ_HOST: {{ include "moe.rabbitmq.host" . | quote }}
  RABBITMQ_PORT: {{ include "moe.rabbitmq.port" . | quote }}
  POSTGRES_HOST: {{ include "moe.postgres.host" . | quote }}
  POSTGRES_PORT: {{ include "moe.postgres.port" . | quote }}
  MIDDLEWARE_QUEUE: {{ .Values.messaging.middlewareQueue | quote }}
  # empty without the memory service: the workers then publish nothing for indexing
  MEMORY_QUEUE: {{ if .Values.memory.enabled }}{{ .Values.messaging.memoryQueue | quote }}{{ else }}""{{ end }}
  {{- if .Values.memory.enabled }}
  # the embedding model: the memory service embeds the chunks, the router the query, with the same one
  EMBEDDING_HOST: {{ .Values.memory.embeddingHost | default (include "moe.ollama.url" .) | quote }}
  EMBEDDING_MODEL: {{ .Values.memory.embeddingModel | quote }}
  EMBEDDING_KEEP_ALIVE: {{ .Values.memory.embeddingKeepAlive | quote }}
  {{- end }}
