{{- if .Values.ollama.enabled }}
{{- $p := .Values.ollama.persistence }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "moe.fullname" . }}-ollama
  labels:
    {{- include "moe.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
spec:
  replicas: 1
  # the model volume is ReadWriteOnce (or a node folder): never two pods at once
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "moe.selectorLabels" (dict "root" . "component" "ollama") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "moe.labels" . | nindent 8 }}
        app.kubernetes.io/component: ollama
    spec:
      {{- with .Values.ollama.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ollama.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ollama.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ollama
          image: {{ include "moe.image" (dict "root" . "image" .Values.ollama.image) }}
          imagePullPolicy: {{ .Values.ollama.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 11434
          env:
            - name: OLLAMA_CONTEXT_LENGTH
              value: {{ .Values.ollama.contextLength | quote }}
            - name: OLLAMA_KEEP_ALIVE
              value: {{ .Values.ollama.keepAlive | quote }}
          # GET / answers "Ollama is running"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          {{- $res := deepCopy (.Values.ollama.resources | default dict) }}
          {{- if gt (int .Values.ollama.gpu) 0 }}
          {{- $limits := get $res "limits" | default dict }}
          {{- $_ := set $limits "nvidia.com/gpu" (int .Values.ollama.gpu) }}
          {{- $_ := set $res "limits" $limits }}
          {{- end }}
          {{- with $res }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
      volumes:
        - name: models
          {{- if $p.hostPath }}
          hostPath:
            path: {{ $p.hostPath }}
            type: DirectoryOrCreate
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "moe.fullname" . }}-ollama
          {{- end }}
{{- end }}
