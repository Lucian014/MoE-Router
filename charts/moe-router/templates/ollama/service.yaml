{{- if .Values.ollama.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "moe.fullname" . }}-ollama
  labels:
    {{- include "moe.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 11434
      targetPort: http
  selector:
    {{- include "moe.selectorLabels" (dict "root" . "component" "ollama") | nindent 4 }}
{{- if not .Values.ollama.persistence.hostPath }}
---
# the pulled models (a few GB each)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "moe.fullname" . }}-ollama
  labels:
    {{- include "moe.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
  annotations:
    # keep the downloads on `helm uninstall`
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  {{- include "moe.storageClass" (dict "root" . "persistence" .Values.ollama.persistence) | nindent 2 }}
  resources:
    requests:
      storage: {{ .Values.ollama.persistence.size }}
{{- end }}
{{- end }}
