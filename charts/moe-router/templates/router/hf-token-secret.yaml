{{- /* The Hugging Face token for the classifier download, when given as router.hfToken.value.
       With router.hfToken.existingSecret the chart creates nothing. */ -}}
{{- if and (not .Values.router.hfToken.existingSecret) (not .Values.router.hfToken.value) }}
{{- fail "the router needs a Hugging Face token for the private classifiers: set router.hfToken.existingSecret (a Secret with key HF_TOKEN) or router.hfToken.value" }}
{{- end }}
{{- if not .Values.router.hfToken.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "moe.fullname" . }}-hf-token
  labels:
    {{- include "moe.labels" . | nindent 4 }}
    app.kubernetes.io/component: router
type: Opaque
data:
  {{ .Values.router.hfToken.key }}: {{ .Values.router.hfToken.value | b64enc }}
{{- end }}
