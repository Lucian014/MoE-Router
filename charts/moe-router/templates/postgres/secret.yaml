{{- /* Credentials for the model registry. The keys are the env var names that both the
       postgres image and the services read (shared/config.py), so pods use envFrom. */ -}}
{{- if not .Values.postgresql.auth.existingSecret }}
{{- if and (not .Values.postgresql.enabled) (not .Values.postgresql.auth.password) }}
{{- fail "an external Postgres needs postgresql.auth.password or postgresql.auth.existingSecret" }}
{{- end }}
{{- $name := include "moe.postgres.secretName" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "moe.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  annotations:
    # keep it on `helm uninstall`: the data volume was initialised with this password
    helm.sh/resource-policy: keep
type: Opaque
data:
  POSTGRES_DB: {{ .Values.postgresql.auth.database | b64enc }}
  POSTGRES_USER: {{ .Values.postgresql.auth.username | b64enc }}
  POSTGRES_PASSWORD: {{ include "moe.password" (dict "root" . "secret" $name "key" "POSTGRES_PASSWORD" "value" .Values.postgresql.auth.password) }}
{{- end }}
