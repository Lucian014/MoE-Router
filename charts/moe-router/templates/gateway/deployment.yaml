apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "moe.fullname" . }}-gateway
  labels:
    {{- include "moe.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      {{- include "moe.selectorLabels" (dict "root" . "component" "gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "moe.labels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- include "moe.imagePullSecrets" . | nindent 6 }}
      {{- with .Values.gateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gateway
          image: {{ include "moe.image" (dict "root" . "image" .Values.gateway.image) }}
          imagePullPolicy: {{ include "moe.pullPolicy" (dict "root" . "image" .Values.gateway.image) }}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            {{- include "moe.serviceEnvFrom" (dict "root" .) | nindent 12 }}
          env:
            - name: RPC_TIMEOUT_SECONDS
              value: {{ .Values.gateway.rpcTimeoutSeconds | quote }}
          # /health: the process is up; /ready: connected to RabbitMQ (see src/gateway/main.py)
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          {{- with .Values.gateway.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
