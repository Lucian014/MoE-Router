apiVersion: v1
kind: Service
metadata:
  name: {{ include "moe.fullname" . }}-gateway
  labels:
    {{- include "moe.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: {{ .Values.gateway.service.type }}
  ports:
    - name: http
      port: {{ .Values.gateway.service.port }}
      targetPort: http
  selector:
    {{- include "moe.selectorLabels" (dict "root" . "component" "gateway") | nindent 4 }}
